<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutti Hub - Stable 365</title>
    <style>
        :root { --accent-quote: #00d2ff; --accent-trivia: #ff9f43; --bg: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--bg); color: white; overflow: hidden; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: brightness(0.2) blur(1px); z-index: -1; transition: 2s; }
        .container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 30px; }
        #mode-badge { font-size: 0.7rem; padding: 4px 12px; border-radius: 20px; margin-bottom: 15px; letter-spacing: 2px; font-weight: bold; border: 1px solid; }
        #day-large { font-size: 6rem; font-weight: 900; margin-bottom: 10px; line-height: 0.9; }
        #main-text { font-size: 1.8rem; font-weight: bold; max-width: 850px; margin-bottom: 15px; line-height: 1.5; min-height: 4.5em; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 15px rgba(0,0,0,1); }
        #sub-text { font-size: 1.1rem; font-weight: bold; margin-bottom: 40px; }
        .controls { position: fixed; bottom: 40px; display: flex; gap: 15px; }
        button { padding: 12px 28px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; cursor: pointer; backdrop-filter: blur(10px); border-radius: 50px; transition: 0.3s; font-weight: bold; }
        button:hover { background: white; color: black; transform: scale(1.05); }

        /* カレンダーUI */
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: none; z-index: 100; padding: 20px; overflow-y: auto; }
        .calendar-header { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; }
        .cell { aspect-ratio: 1; border: 1px solid #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #111; font-size: 1.2rem; position: relative; }
        .cell:hover { border-color: var(--accent-quote); background: #222; }
        .cell.today { border: 2px solid var(--accent-quote); box-shadow: 0 0 15px var(--accent-quote); }
        .cell.today::after { content: "TODAY"; position: absolute; bottom: 4px; font-size: 0.5rem; color: var(--accent-quote); font-weight: bold; }
        .cell.future { opacity: 0.2; cursor: not-allowed; pointer-events: none; }
        
        .cal-footer { text-align: center; margin-top: 30px; }
        .btn-today { border-color: var(--accent-quote); color: var(--accent-quote); }
    </style>
</head>
<body>
<div id="bg-layer"></div>
<div class="container">
    <div id="mode-badge">LOADING</div>
    <div id="day-large">--</div>
    <div id="main-text">データを準備中...</div>
    <div id="sub-text"></div>
    <div class="controls">
        <button onclick="switchMode()">モード切替</button>
        <button onclick="openCal()">カレンダー</button>
    </div>
</div>

<div id="modal">
    <div class="calendar-header">
        <button onclick="moveMonth(-1)">◀</button>
        <h2 id="cal-title" style="letter-spacing: 3px; min-width: 150px; text-align: center;"></h2>
        <button onclick="moveMonth(1)">▶</button>
    </div>
    <div id="cal-grid" class="grid"></div>
    <div class="cal-footer">
        <button class="btn-today" onclick="goToToday()">今日に戻る</button>
        <button onclick="closeCal()">閉じる</button>
    </div>
</div>

<script>
    // --- 365個のデータ格納用 (ここにお好きな内容を追加してください) ---
    const quotes_db = [
        {q: "自分を信じれば、道は開ける。", a: "ゲーテ"},
        {q: "壁は、超えられる可能性がある人にしかやってこない。", a: "イチロー"},
        {q: "夢を見るから、人生は輝く。", a: "モンテスキュー"},
        {q: "行動こそが、すべての成功の鍵である。", a: "ピカソ"},
        {q: "失敗は成功のもとである。", a: "エジソン"},
        {q: "下を向いていたら、虹を見つけることはできない。", a: "チャップリン"},
        {q: "明日死ぬかのように生きよ。永遠に生きるかのように学べ。", a: "ガンジー"},
        {q: "Stay Hungry, Stay Foolish.", a: "スティーブ・ジョブズ"}
        // 365個まで自由に追加可能
    ];

    const trivia_db = [
        "パンダの尻尾は実は白。黒いのは目の周りと耳と足だけ。",
        "1円玉を1枚作るのにかかるコストは約3円。",
        "キリンの首の骨は人間と同じ7本しかない。",
        "太陽の光が地球に届くまでには約8分20秒かかる。",
        "金魚の記憶力は数ヶ月以上あり、色や形を識別できる。",
        "宇宙に行くと重力がなくなるため、背が数センチ伸びる。",
        "トランプの52枚は、1年が52週であることを表している。",
        "シロクマの肌は実は黒い。白い毛が光を反射しているだけ。"
        // 365個まで自由に追加可能
    ];

    let mode = localStorage.getItem('gutti_mode') || 'quote';
    let currentDisplayDate = new Date(); // 現在画面に表示している日付を保持
    let currentCalViewDate = new Date(); // カレンダーの表示月を保持
    const weekdays = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

    function getDayIdx(date) {
        const start = new Date(date.getFullYear(), 0, 0);
        const diff = date - start;
        return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function updateView(targetDate) {
        currentDisplayDate = new Date(targetDate); // 表示中の日付を更新
        const d = currentDisplayDate;
        const idx = getDayIdx(d);
        const seed = d.getFullYear().toString() + (d.getMonth() + 1).toString() + d.getDate().toString();

        document.getElementById('day-large').innerHTML = `${d.getDate()} <span style="font-size: 1.5rem; opacity: 0.6;">${weekdays[d.getDay()]}</span>`;
        document.getElementById('bg-layer').style.backgroundImage = `url('https://picsum.photos/seed/${seed}${mode}/1920/1080')`;

        const themeColor = mode === 'quote' ? 'var(--accent-quote)' : 'var(--accent-trivia)';
        const badge = document.getElementById('mode-badge');
        badge.innerText = mode === 'quote' ? 'WISE WORDS (365)' : 'DAILY TRIVIA (365)';
        badge.style.color = themeColor;
        badge.style.borderColor = themeColor;

        if (mode === 'quote') {
            const item = quotes_db[idx % quotes_db.length];
            document.getElementById('main-text').innerText = item.q;
            document.getElementById('sub-text').innerText = `― ${item.a}`;
        } else {
            const item = trivia_db[idx % trivia_db.length];
            document.getElementById('main-text').innerText = item;
            document.getElementById('sub-text').innerText = `雑学 No.${idx}`;
        }
        document.getElementById('sub-text').style.color = themeColor;
    }

    function switchMode() {
        mode = (mode === 'quote') ? 'trivia' : 'quote';
        localStorage.setItem('gutti_mode', mode);
        // 重要：ここでは今日に戻さず、currentDisplayDateをそのまま使う
        updateView(currentDisplayDate);
    }

    function openCal() {
        document.getElementById('modal').style.display = 'block';
        currentCalViewDate = new Date(currentDisplayDate); // 開いた時は表示中の月のカレンダーを出す
        drawCal();
    }

    function closeCal() { document.getElementById('modal').style.display = 'none'; }
    
    function moveMonth(n) {
        currentCalViewDate.setMonth(currentCalViewDate.getMonth() + n);
        drawCal();
    }

    function goToToday() {
        const today = new Date();
        currentCalViewDate = new Date(today);
        updateView(today);
        drawCal(); // カレンダー内の「今日」にフォーカス
    }

    function drawCal() {
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = "";
        const y = currentCalViewDate.getFullYear(), m = currentCalViewDate.getMonth();
        document.getElementById('cal-title').innerText = `${y} / ${String(m + 1).padStart(2,'0')}`;
        
        const first = new Date(y, m, 1).getDay();
        const last = new Date(y, m + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));

        for (let i = 1; i <= last; i++) {
            const cellDate = new Date(y, m, i);
            const isToday = cellDate.toDateString() === today.toDateString();
            const isSelected = cellDate.toDateString() === currentDisplayDate.toDateString();
            const isFuture = cellDate > today;

            const cell = document.createElement('div');
            cell.className = `cell ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}`;
            if(isSelected && !isToday) cell.style.borderColor = "white"; // 選択中の日をハイライト
            cell.innerText = i;
            
            if (!isFuture) {
                cell.onclick = () => { updateView(cellDate); closeCal(); };
            }
            grid.appendChild(cell);
        }
    }

    // 初回起動
    updateView(new Date());
</script>
</body>
</html>
