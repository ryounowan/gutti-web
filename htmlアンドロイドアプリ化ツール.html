<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to APK Converter</title>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .card { background: #1e1e1e; max-width: 500px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { color: #00e676; font-size: 1.4rem; text-align: center; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #bbb; }
        input, textarea { width: 100%; padding: 12px; background: #2c2c2c; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; }
        .build-btn { background: #00e676; color: #000; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        .build-btn:hover { background: #00c853; transform: scale(1.02); }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; text-align: center; border: 1px solid #00e676; color: #00e676; }
        .qr-area { text-align: center; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🤖 APK Generator API</h1>
    <p style="text-align:center; font-size: 0.8rem; color: #888;">HTMLをAndroid専用アプリ(.apk)に直接変換します</p>

    <div class="input-group">
        <label>アプリの名前</label>
        <input type="text" id="appName" placeholder="例: MyBestApp">
    </div>

    <div class="input-group">
        <label>HTMLコードをペースト</label>
        <textarea id="htmlContent" rows="10" placeholder="<!DOCTYPE html>..."></textarea>
    </div>

    <button class="build-btn" onclick="startBuild()">Androidアプリを生成してDL</button>

    <div id="status">⏳ ビルドサーバーに送信中...<br>APKを生成しています。</div>

    <div id="qrArea" class="qr-area">
        <p>✅ 生成完了！</p>
        <button class="build-btn" style="background:#2196f3; color:white;" onclick="downloadApk()">スマホにダウンロード</button>
        <p style="font-size: 0.7rem; margin-top:10px;">※スマホのブラウザでこのURLを開けば直接DLできます</p>
    </div>
</div>

<script>
let mockDownloadUrl = "";

async function startBuild() {
    const name = document.getElementById('appName').value;
    const content = document.getElementById('htmlContent').value;
    const status = document.getElementById('status');
    const qrArea = document.getElementById('qrArea');

    if(!name || !content) {
        alert("名前とコードを入力してください！");
        return;
    }

    status.style.display = "block";
    qrArea.style.display = "none";

    // --- APIシミュレーション ---
    // 本来はここでクラウドサーバー(CloudBuild等)にPOST送信します
    setTimeout(() => {
        status.innerText = "✨ APKのパッケージングに成功しました！";
        qrArea.style.display = "block";
        // 実際には生成されたファイルのURLをセットします
        mockDownloadUrl = URL.createObjectURL(new Blob([content], {type: "application/vnd.android.package-archive"}));
    }, 3000);
}

function downloadApk() {
    const a = document.createElement('a');
    a.href = mockDownloadUrl;
    a.download = document.getElementById('appName').value + ".apk";
    a.click();
}
</script>

</body>
</html>
