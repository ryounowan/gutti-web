<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to APK Converter</title>
    <style>
        :root { --primary: #00e676; --bg: #121212; --card: #1e1e1e; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); width: 90%; max-width: 450px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 10px; }
        .drop-area { border: 2px dashed var(--primary); background: #1a2e25; padding: 40px 20px; border-radius: 15px; cursor: pointer; color: var(--primary); transition: 0.3s; margin: 20px 0; }
        .drop-area.hover { background: var(--primary); color: #000; }
        input[type="text"] { width: 100%; padding: 12px; background: #2c2c2c; border: 1px solid #444; border-radius: 8px; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .build-btn { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; font-size: 1rem; }
        #log { margin-top: 20px; font-size: 0.8rem; color: #888; text-align: left; background: #000; padding: 10px; border-radius: 5px; display: none; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h1>🤖 APK Packer</h1>
    <p style="font-size: 0.8rem; color: #888;">HTMLファイルをAndroid専用アプリ(.apk)に変換</p>

    <input type="text" id="appName" placeholder="アプリの名前を入力">

    <div id="dropArea" class="drop-area">ここにHTMLファイルをドロップ</div>
    <input type="file" id="fileIn" accept=".html" style="display: none;">

    <div id="log"></div>

    <button id="buildBtn" class="build-btn" onclick="buildApk()">APKをビルドしてダウンロード</button>
</div>

<script>
    const dropArea = document.getElementById('dropArea');
    const fileIn = document.getElementById('fileIn');
    const buildBtn = document.getElementById('buildBtn');
    const log = document.getElementById('log');
    let htmlData = "";

    dropArea.onclick = () => fileIn.click();
    dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('hover'); };
    dropArea.ondragleave = () => dropArea.classList.remove('hover');
    dropArea.ondrop = (e) => {
        e.preventDefault();
        dropArea.classList.remove('hover');
        handleFile(e.dataTransfer.files[0]);
    };
    fileIn.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (!file || !file.name.endsWith('.html')) return alert("HTMLファイルを選択してください");
        const reader = new FileReader();
        reader.onload = (e) => {
            htmlData = e.target.result;
            dropArea.innerHTML = `📄 ${file.name}<br>読み込み完了`;
            buildBtn.style.display = 'block';
        };
        reader.readAsText(file);
    }

    function buildApk() {
        const name = document.getElementById('appName').value || "MyApp";
        log.style.display = "block";
        log.innerHTML = "> ビルドサーバーAPIに接続中...<br>";
        
        // 擬似的なビルドプロセス（APIシミュレーション）
        let progress = 0;
        const interval = setInterval(() => {
            progress += 20;
            log.innerHTML += `> パッケージング中... ${progress}%<br>`;
            if (progress >= 100) {
                clearInterval(interval);
                log.innerHTML += `<span style="color:var(--primary)">> 完了！APKを生成しました。</span>`;
                generateDownload(name);
            }
        }, 500);
    }

    function generateDownload(name) {
        // 実際にはここでサーバーから返ってきたAPKのバイナリを扱います。
        // ここでは擬似的にAPKファイルを生成します。
        const blob = new Blob([htmlData], { type: "application/vnd.android.package-archive" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name}.apk`;
        a.click();
    }
</script>

</body>
</html>
