<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>稼働状況ステータス</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --sub: #94a3b8; --ok: #22c55e; --info: #3b82f6; --warn: #f59e0b; --error: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .overall { padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 10px solid; background: var(--card); }
        .card { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8em; }
        .st-ok { background: rgba(34,197,94,0.2); color: var(--ok); }
        .st-info { background: rgba(59,130,246,0.2); color: var(--info); }
        .st-warn { background: rgba(245,158,11,0.2); color: var(--warn); }
        .st-error { background: rgba(239,68,68,0.2); color: var(--error); }
        .last-update { text-align: right; font-size: 0.8rem; color: var(--sub); margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div id="overall-box" class="overall">
        <h2 id="overall-title">読み込み中...</h2>
        <p id="overall-msg"></p>
    </div>
    <div id="server-list"></div>
    <div id="update-time" class="last-update"></div>
</div>
<script>
    function loadStatus() {
        const data = JSON.parse(localStorage.getItem('serverStatus'));
        if (!data) return;
        document.getElementById('overall-title').innerText = data.overall.title;
        document.getElementById('overall-msg').innerText = data.overall.msg;
        document.getElementById('overall-box').style.borderColor = `var(--${data.overall.status})`;
        document.getElementById('update-time').innerText = "最終更新: " + (data.updatedAt || "不明");
        document.getElementById('server-list').innerHTML = data.servers.map(s => `
            <div class="card">
                <div><strong>${s.name}</strong><br><small style="color:var(--sub)">${s.desc}</small></div>
                <span class="badge st-${s.status}">${s.statusText}</span>
            </div>
        `).join('');
    }
    window.onload = loadStatus;
    setInterval(loadStatus, 5000);
</script>
</body>
</html>
