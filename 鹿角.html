
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for a surprise...</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Sans+JP:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin:0; padding:0; height:100%; font-family: 'Noto Sans JP', sans-serif; overflow:hidden; background:#000; color:white; }
        .screen { position:absolute; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; box-sizing:border-box; transition: 2.5s cubic-bezier(0.4, 0, 0.2, 1); }
        #lock-screen { background:#000; z-index:100; opacity:1; }
        #gift-screen { 
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            opacity:0; visibility:hidden; z-index:10; 
        }
        #gift-screen.active { opacity:1; visibility:visible; animation: zoomIn 2.2s ease forwards; }
        @keyframes zoomIn { from { transform: scale(1.1); } to { transform: scale(1); } }
        .timer { font-family:monospace; font-size:clamp(1.5em, 8vw, 2.8em); color:#ffd700; margin:20px 0; letter-spacing: 2px; }
        .icon { width:110px; height:110px; border-radius:50%; border:3px solid white; object-fit:cover; margin-bottom:15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { font-family: 'Dancing Script', cursive; font-size:clamp(2.5em, 10vw, 4.5em); margin:10px 0; }
        .card { background:rgba(255,255,255,0.15); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); border-radius:20px; padding:25px; width:90%; max-width:480px; min-height:160px; display:none; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.2); font-size: clamp(1.1em, 3.5vw, 1.3em); }
        .card.active { display:flex; animation: fadeInUp 1s ease forwards; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .btn { padding:12px 28px; border-radius:30px; border:none; background:white; color:#333; font-weight:bold; cursor:pointer; }
        .nav-controls { display:flex; gap:15px; align-items:center; margin-top:20px; }
    </style>
</head>
<body>
    <div id="lock-screen" class="screen">
        <div id="timer" class="timer">00d 00h 00m 00s</div>
        <p style="opacity:0.3; letter-spacing:4px; font-weight:300">OPENING SOON</p>
    </div>

    <div id="gift-screen" class="screen">
        
        <h1>For Happy Birthday</h1>
        <div id="card-area" style="width:100%; display:flex; justify-content:center; margin:20px 0;"></div>
        <div id="controls" class="nav-controls" style="display:none;">
            <button class="btn" onclick="prev()">＜</button>
            <span id="counter">1 / 1</span>
            <button class="btn" onclick="next()">＞</button>
        </div>
        <button class="btn" onclick="launchCelebrate()" style="margin-top:30px; background:transparent; color:white; border:1px solid white;">Celebrate!</button>
    </div>

    <script>
        const target = 1778885640000;
        const msgs = ["クソぐっち:ｵﾒﾃﾞﾄー"];
        const finalTitle = "Happy Birthday";
        let cur = 0;

        function update() {
            const diff = target - new Date().getTime();
            if(diff <= 0) { open(); return; }
            const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timer').innerText = d+"d "+h+"h "+m+"m "+s+"s";
            setTimeout(update, 1000);
        }

        function open() {
            document.title = finalTitle;
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('gift-screen').classList.add('active');
                launchCelebrate();
            }, 1000);
        }

        function launchCelebrate() {
            // イベントに応じたエフェクトを実行
            confetti({particleCount:180, spread:80, origin:{y:0.6}})
        }

        function render() {
            const area = document.getElementById('card-area');
            if(msgs.length > 1) document.getElementById('controls').style.display = 'flex';
            msgs.forEach((m, i) => {
                const div = document.createElement('div');
                div.className = 'card' + (i===0?' active':'');
                div.innerHTML = m.replace(/：/g, '<br><small style="opacity:0.8; font-size:0.8em;">') + '</small>';
                area.appendChild(div);
            });
            document.getElementById('counter').innerText = `1 / ${msgs.length}`;
        }

        function next() { if(cur < msgs.length-1) { cur++; show(); } }
        function prev() { if(cur > 0) { cur--; show(); } }
        function show() {
            document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i===cur));
            document.getElementById('counter').innerText = `${cur+1} / ${msgs.length}`;
        }

        // ライブラリでハートの形を定義
        if("confetti" === "heart") {
            var scalar = 2;
            var heart = confetti.shapeFromPath({ path: 'M167 471c-40-38-167-166-167-251 0-71 52-127 125-127 41 0 78 20 102 55 24-35 61-55 102-55 73 0 125 56 125 127 0 85-127 213-167 251-12 11-28 11-40 0z' });
            // ハートエフェクト用のデフォルト設定を上書き
            window.confetti = (function(originalConfetti) {
                return function(params) {
                    if (params.shapes && params.shapes[0] === 'heart') {
                        params.shapes = [heart];
                    }
                    return originalConfetti(params);
                };
            })(window.confetti);
        }

        render(); update();
    </script>
</body>
</html>
