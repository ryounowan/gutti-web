<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gutti Lobby - Relay Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #020617; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #status-bar { position: fixed; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95); padding: 8px 15px; font-size: 11px; z-index: 100; border-bottom: 1px solid #1e293b; color: #60a5fa; }
        #login-screen { position: fixed; inset: 0; background: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 24px; display: flex; flex-direction: column; gap: 15px; width: 300px; box-shadow: 0 0 50px rgba(0,0,0,0.8); border: 1px solid #334155; }
        input[type="text"] { padding: 15px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; }
        button { padding: 15px; background: #2563eb; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #ui-layer { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 15px; width: 90%; max-width: 500px; z-index: 2000; }
        #chat-input { width: 100%; padding: 16px 24px; border-radius: 40px; border: 2px solid #2563eb; background: rgba(15, 23, 42, 0.95); color: white; outline: none; font-size: 16px; }
        #portal-btn { background: #7c3aed; padding: 10px 25px; border-radius: 30px; font-size: 14px; color: white; font-weight: bold; }
        #portal-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 4000; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; width: 280px; display: flex; flex-direction: column; gap: 10px; }
        #lobby-canvas { background: radial-gradient(circle at center, #1e293b 0%, #020617 80%); display: block; }
        #warp-notice { position: fixed; top: 15%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; color: #ef4444; display: none; z-index: 3000; pointer-events: none; text-align: center; }
        #warp-bar { width: 200px; height: 5px; background: #444; margin: 10px auto; border-radius: 3px; overflow: hidden; }
        #warp-bar-inner { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s; }
    </style>
</head>
<body>

<div id="status-bar">GUTTI LOBBY - RELAY NETWORK ACTIVE</div>
<div id="warp-notice">WARP INITIATED<div id="warp-bar"><div id="warp-bar-inner"></div></div></div>

<div id="portal-modal">
    <div class="modal-content">
        <h3 style="margin:0;">Create Portal</h3>
        <input type="text" id="p-name" placeholder="Portal Name">
        <input type="text" id="p-url" placeholder="https://...">
        <input type="color" id="p-color" value="#7c3aed" style="width:100%; height:40px;">
        <div style="display:flex; gap:10px;">
            <button onclick="closePortalMaker()" style="flex:1; background:#475569;">Cancel</button>
            <button onclick="submitPortal()" style="flex:1;">Create</button>
        </div>
    </div>
</div>

<div id="login-screen">
    <div class="login-card">
        <h1 style="text-align:center;">GUTTI GLITCH</h1>
        <input type="text" id="user-name" placeholder="Name" maxlength="10">
        <label style="font-size:12px; text-align:center; color:#94a3b8; cursor:pointer;">📷 Custom Icon<input type="file" id="icon-upload" accept="image/*" style="display:none;"></label>
        <button onclick="startLobby()">Connect</button>
    </div>
</div>

<canvas id="lobby-canvas"></canvas>

<div id="ui-layer">
    <button id="portal-btn" onclick="openPortalMaker()">🌀 Create Warp Portal</button>
    <input type="text" id="chat-input" placeholder="Say something..." maxlength="30" onkeypress="if(event.key==='Enter') sendLocalChat()">
</div>

<script>
    const ROOM_ID = "GUTTI-OPEN-GLITCH-2026";
    const PREFIX = "gutti-v9-";
    const SAFE_RADIUS = 130;
    
    let peer, myName, myIconData = null;
    let players = {}, portals = {}, iconCache = {}, receivedMsgIds = new Set();
    let canvas, ctx, warpTarget = null, warpTimer = 0, isTransitioning = false, particles = [];

    window.onload = () => {
        canvas = document.getElementById('lobby-canvas');
        ctx = canvas.getContext('2d');
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        document.getElementById('user-name').value = localStorage.getItem('gutti_name') || "";
    };

    async function startLobby() {
        myName = document.getElementById('user-name').value || "Guest";
        const file = document.getElementById('icon-upload').files[0];
        if(file) myIconData = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
        localStorage.setItem('gutti_name', myName);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        
        players['me'] = { id: 'me', name: myName, icon: myIconData, x: canvas.width/2, y: canvas.height/2, targetX: canvas.width/2, targetY: canvas.height/2, msg: "", msgTime: 0, warping: false, opacity: 1 };
        initPeer();
        requestAnimationFrame(draw);

        canvas.addEventListener('mousedown', e => moveMe(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => { if(document.activeElement.id !== 'chat-input') moveMe(e.touches[0].clientX, e.touches[0].clientY); });
    }

    function moveMe(x, y) { if(isTransitioning) return; players['me'].targetX = x; players['me'].targetY = y; relayBroadcast({ type: 'MOVE', x, y }); }

    function openPortalMaker() {
        const dist = Math.hypot(players['me'].x - canvas.width/2, players['me'].y - canvas.height/2);
        if(dist < SAFE_RADIUS) return alert("❌ Safe Zone内には設置できません！");
        document.getElementById('portal-modal').style.display = 'flex';
    }
    function closePortalMaker() { document.getElementById('portal-modal').style.display = 'none'; }
    function submitPortal() {
        const name = document.getElementById('p-name').value;
        const url = document.getElementById('p-url').value;
        const color = document.getElementById('p-color').value;
        if(name && url) {
            const portal = { name, url, x: players['me'].x, y: players['me'].y, color: color };
            portals[peer.id] = portal;
            relayBroadcast({ type: 'PORTAL_UPDATE', portal });
            closePortalMaker();
        }
    }

    function initPeer() {
        // まず固定IDでの待機を試みる
        peer = new Peer(PREFIX + ROOM_ID);
        peer.on('open', () => { setupPeerHandlers(); });
        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') {
                // 固定IDが埋まっていたらランダムIDで入り、固定IDの人に繋ぎにいく
                peer = new Peer();
                peer.on('open', () => {
                    setupPeerHandlers();
                    const conn = peer.connect(PREFIX + ROOM_ID);
                    setupConnection(conn);
                });
            }
        });
    }

    function setupPeerHandlers() {
        peer.on('connection', conn => setupConnection(conn));
    }

    function setupConnection(conn) {
        conn.on('open', () => {
            // 接続時に自分の情報を送る
            conn.send({ type: 'JOIN', name: myName, icon: myIconData, x: players['me'].x, y: players['me'].y, senderId: peer.id });
            conn.on('data', data => handleData(conn, data));
            conn.on('close', () => { if(players[conn.peer]) delete players[conn.peer]; });
        });
    }

    function handleData(conn, d) {
        // 無限ループ防止用のIDチェック
        if (!d.msgId) d.msgId = Math.random().toString(36).substr(2, 9);
        if (receivedMsgIds.has(d.msgId)) return;
        receivedMsgIds.add(d.msgId);
        if (receivedMsgIds.size > 100) receivedMsgIds.delete(receivedMsgIds.values().next().value);

        const sid = d.senderId;

        if (d.type === 'JOIN') {
            players[sid] = { id: sid, name: d.name, icon: d.icon, x: d.x, y: d.y, targetX: d.x, targetY: d.y, msg: "", msgTime: 0, warping: false, opacity: 1 };
            // JOINした人に対して自分の情報と、自分が知っている全ポータルを教え返す
            conn.send({ type: 'SYNC_BACK', name: myName, icon: myIconData, x: players['me'].x, y: players['me'].y, senderId: peer.id, allPortals: portals });
        }
        if (d.type === 'SYNC_BACK') {
            players[sid] = { id: sid, name: d.name, icon: d.icon, x: d.x, y: d.y, targetX: d.x, targetY: d.y, msg: "", msgTime: 0, warping: false, opacity: 1 };
            if (d.allPortals) Object.assign(portals, d.allPortals);
        }
        if (d.type === 'MOVE' && players[sid]) { players[sid].targetX = d.x; players[sid].targetY = d.y; }
        if (d.type === 'CHAT' && players[sid]) { players[sid].msg = d.msg; players[sid].msgTime = Date.now(); }
        if (d.type === 'PORTAL_UPDATE') { portals[sid] = d.portal; }
        if (d.type === 'WARP_STATUS' && players[sid]) { players[sid].warping = d.warping; }

        // --- バケツリレー：送り主以外に転送 ---
        Object.keys(peer.connections).forEach(targetId => {
            if (targetId !== conn.peer) {
                const targetConn = peer.connections[targetId][0];
                if (targetConn && targetConn.open) targetConn.send(d);
            }
        });
    }

    function relayBroadcast(data) {
        data.senderId = peer.id;
        data.msgId = Math.random().toString(36).substr(2, 9);
        receivedMsgIds.add(data.msgId);
        Object.keys(peer.connections).forEach(id => {
            const conn = peer.connections[id][0];
            if (conn && conn.open) conn.send(data);
        });
    }

    function sendLocalChat() {
        const input = document.getElementById('chat-input');
        if(!input.value) return;
        players['me'].msg = input.value; players['me'].msgTime = Date.now();
        relayBroadcast({ type: 'CHAT', msg: input.value });
        input.value = ""; input.blur();
    }

    // --- 描画ロジック (変更なし) ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();
        
        // Safe Zone
        ctx.setLineDash([5, 10]); ctx.strokeStyle = "rgba(96, 165, 250, 0.4)";
        ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, SAFE_RADIUS, 0, Math.PI*2); ctx.stroke(); ctx.setLineDash([]);

        // ポータル描画
        let onPortal = false;
        Object.keys(portals).forEach(pid => {
            const p = portals[pid];
            const pulse = 35 + Math.sin(now/200)*5;
            const grad = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, pulse);
            grad.addColorStop(0, p.color); grad.addColorStop(1, "transparent");
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, pulse, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 11px sans-serif"; ctx.textAlign="center"; ctx.fillText(p.name.toUpperCase(), p.x, p.y - 55);
            if(Math.hypot(players['me'].x - p.x, players['me'].y - p.y) < 30) { onPortal = true; warpTarget = p; }
        });

        // ワープ処理
        const notice = document.getElementById('warp-notice');
        if (onPortal && !isTransitioning) {
            if (warpTimer <= 0) warpTimer = 5000;
            warpTimer -= 16.6;
            notice.style.display = 'block';
            document.getElementById('warp-bar-inner').style.width = (warpTimer / 5000) * 100 + "%";
            if (warpTimer <= 1000) { isTransitioning = true; window.location.href = warpTarget.url; }
        } else if (!isTransitioning) {
            warpTimer = 0; notice.style.display = 'none';
        }

        // プレイヤー描画
        Object.keys(players).forEach(id => {
            const p = players[id];
            p.x += (p.targetX - p.x) * 0.1; p.y += (p.targetY - p.y) * 0.1;
            ctx.save();
            if(p.icon) {
                if(!iconCache[p.icon]) { const img = new Image(); img.src = p.icon; iconCache[p.icon] = img; }
                ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI*2); ctx.clip();
                if(iconCache[p.icon].complete) ctx.drawImage(iconCache[p.icon], p.x-22, p.y-22, 44, 44);
                ctx.restore();
            } else {
                ctx.fillStyle = (id==='me'?'#3b82f6':'#94a3b8'); ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI*2); ctx.fill();
            }
            if(p.msg && now - p.msgTime < 5000) {
                ctx.font = "14px sans-serif"; const tw = ctx.measureText(p.msg).width;
                ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.beginPath(); ctx.roundRect(p.x - tw/2 - 10, p.y - 75, tw + 20, 30, 8); ctx.fill();
                ctx.fillStyle = "#000"; ctx.textAlign = "center"; ctx.fillText(p.msg, p.x, p.y - 55);
            }
            ctx.fillStyle = "white"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText(p.name, p.x, p.y+42);
            ctx.restore();
        });
        requestAnimationFrame(draw);
    }
</script>
</body>
</html>
