<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gutti Lobby - Custom Color Warp</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #020617; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #status-bar { position: fixed; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95); padding: 8px 15px; font-size: 11px; z-index: 100; border-bottom: 1px solid #1e293b; color: #60a5fa; }
        
        #login-screen { position: fixed; inset: 0; background: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 24px; display: flex; flex-direction: column; gap: 15px; width: 300px; box-shadow: 0 0 50px rgba(0,0,0,0.8); border: 1px solid #334155; }
        input[type="text"] { padding: 15px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; }
        button { padding: 15px; background: #2563eb; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; }

        #ui-layer { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 15px; width: 90%; max-width: 500px; z-index: 2000; }
        #chat-input { width: 100%; padding: 16px 24px; border-radius: 40px; border: 2px solid #2563eb; background: rgba(15, 23, 42, 0.95); color: white; outline: none; font-size: 16px; }
        #portal-btn { background: #7c3aed; padding: 10px 25px; border-radius: 30px; font-size: 14px; color: white; font-weight: bold; }

        /* モーダル（カラー選択用） */
        #portal-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 4000; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; width: 280px; display: flex; flex-direction: column; gap: 10px; }
        .modal-content input { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: white; }

        #lobby-canvas { background: radial-gradient(circle at center, #1e293b 0%, #020617 80%); display: block; }
        #warp-notice { position: fixed; top: 15%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; color: #ef4444; text-shadow: 0 0 10px #f87171; display: none; z-index: 3000; pointer-events: none; text-align: center; }
        #warp-bar { width: 200px; height: 5px; background: #444; margin: 10px auto; border-radius: 3px; overflow: hidden; }
        #warp-bar-inner { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s; }
    </style>
</head>
<body>

<div id="status-bar">GUTTI LOBBY - CUSTOM COLOR ENGINE ACTIVE</div>
<div id="warp-notice">
    WARP INITIATED
    <div id="warp-bar"><div id="warp-bar-inner"></div></div>
</div>

<div id="portal-modal">
    <div class="modal-content">
        <h3 style="margin:0 0 10px 0;">Create Portal</h3>
        <input type="text" id="p-name" placeholder="Portal Name">
        <input type="text" id="p-url" placeholder="URL (https://...)">
        <div style="display:flex; align-items:center; gap:10px;">
            <label>Color:</label>
            <input type="color" id="p-color" value="#7c3aed" style="flex:1; height:40px; padding:2px;">
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="closePortalMaker()" style="flex:1; background:#475569; padding:10px; font-size:14px;">Cancel</button>
            <button onclick="submitPortal()" style="flex:1; padding:10px; font-size:14px;">Create</button>
        </div>
    </div>
</div>

<div id="login-screen">
    <div class="login-card">
        <h1 style="margin:0; font-size:22px; text-align:center; letter-spacing:4px; color:#fff;">GUTTI GLITCH</h1>
        <input type="text" id="user-name" placeholder="Name" maxlength="10">
        <label style="font-size:12px; cursor:pointer; text-align:center; color:#94a3b8;">📷 Custom Icon<input type="file" id="icon-upload" accept="image/*" style="display:none;"></label>
        <button onclick="startLobby()">Connect</button>
    </div>
</div>

<canvas id="lobby-canvas"></canvas>

<div id="ui-layer">
    <button id="portal-btn" onclick="openPortalMaker()">🌀 Create Warp Portal</button>
    <input type="text" id="chat-input" placeholder="Say something..." maxlength="30" onkeypress="if(event.key==='Enter') sendLocalChat()">
</div>

<script>
    const OPEN_ROOM_ID = "GUTTI-OPEN-GLITCH-WARP-2026";
    const PREFIX = "gutti-open-v8-";
    const SAFE_RADIUS = 130;
    
    let peer, myName, myIconData = null, isHost = false;
    let players = {}, portals = {}, iconCache = {};
    let canvas, ctx, warpTarget = null, warpTimer = 0, isTransitioning = false;
    let particles = [];

    window.onload = () => {
        canvas = document.getElementById('lobby-canvas');
        ctx = canvas.getContext('2d');
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        document.getElementById('user-name').value = localStorage.getItem('gutti_name') || "";
    };

    async function startLobby() {
        myName = document.getElementById('user-name').value || "Guest";
        const file = document.getElementById('icon-upload').files[0];
        if(file) myIconData = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
        localStorage.setItem('gutti_name', myName);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        players['me'] = { id: 'me', name: myName, icon: myIconData, x: canvas.width/2, y: canvas.height/2, targetX: canvas.width/2, targetY: canvas.height/2, msg: "", msgTime: 0, warping: false, warpTimeLeft: 0, opacity: 1 };
        initPeer(); requestAnimationFrame(draw);
        canvas.addEventListener('mousedown', e => moveMe(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => { if(document.activeElement.id !== 'chat-input') moveMe(e.touches[0].clientX, e.touches[0].clientY); });
    }

    function moveMe(x, y) { if(isTransitioning) return; players['me'].targetX = x; players['me'].targetY = y; broadcast({ type: 'MOVE', x, y }); }

    // ポータル作成関連
    function openPortalMaker() {
        const dist = Math.hypot(players['me'].x - canvas.width/2, players['me'].y - canvas.height/2);
        if(dist < SAFE_RADIUS) return alert("❌ Safe Zone内には設置できません！");
        document.getElementById('portal-modal').style.display = 'flex';
    }
    function closePortalMaker() { document.getElementById('portal-modal').style.display = 'none'; }
    function submitPortal() {
        const name = document.getElementById('p-name').value;
        const url = document.getElementById('p-url').value;
        const color = document.getElementById('p-color').value;
        if(name && url) {
            const portal = { name, url, x: players['me'].x, y: players['me'].y, color: color };
            portals['me'] = portal;
            broadcast({ type: 'PORTAL_UPDATE', portal, id: peer.id });
            closePortalMaker();
        }
    }

    function initPeer() {
        peer = new Peer(PREFIX + OPEN_ROOM_ID);
        peer.on('open', () => { isHost = true; peer.on('connection', c => { c.on('open', () => { c.on('data', d => handleData(c, d)); c.on('close', () => removePlayer(c.peer)); }); }); });
        peer.on('error', e => { if(e.type === 'unavailable-id') joinGuest(); });
    }

    function joinGuest() {
        peer = new Peer();
        peer.on('open', () => {
            const c = peer.connect(PREFIX + OPEN_ROOM_ID);
            c.on('open', () => {
                c.send({ type: 'JOIN', name: myName, icon: myIconData, x: players['me'].x, y: players['me'].y });
                c.on('data', d => handleData(c, d));
            });
        });
    }

    function handleData(conn, d) {
        const sid = isHost ? conn.peer : d.id;
        if(d.type === 'JOIN' && isHost) { players[conn.peer] = { id: conn.peer, name: d.name, icon: d.icon, x: d.x, y: d.y, targetX: d.x, targetY: d.y, msg: "", msgTime: 0, warping: false, warpTimeLeft: 0, opacity: 1 }; syncAll(); }
        if(d.type === 'SYNC') {
            const newP = { 'me': players['me'] };
            Object.keys(d.allP).forEach(id => { if(id !== peer.id) newP[id] = d.allP[id]; newP[id].opacity = d.allP[id].opacity || 1; });
            players = newP; portals = d.allPortals;
        }
        if(isHost && players[sid]) {
            if(d.type === 'MOVE') { players[sid].targetX = d.x; players[sid].targetY = d.y; }
            if(d.type === 'WARP_STATUS') { players[sid].warping = d.warping; players[sid].warpTimeLeft = d.timeLeft; }
            if(d.type === 'CHAT') { players[sid].msg = d.msg; players[sid].msgTime = Date.now(); }
            syncAll();
        } else if(!isHost && d.type === 'CHAT' && players[sid]) {
            players[sid].msg = d.msg; players[sid].msgTime = Date.now();
        }
        if(d.type === 'PORTAL_UPDATE') { portals[sid] = d.portal; if(isHost) syncAll(); }
    }

    function syncAll() {
        if(!isHost) return;
        const allP = {}; allP[peer.id] = players['me'];
        Object.keys(players).forEach(id => { if(id !== 'me') allP[id] = players[id]; });
        Object.keys(peer.connections).forEach(id => peer.connections[id][0].send({ type: 'SYNC', allP, allPortals: portals }));
    }

    function broadcast(data) {
        if(!peer) return;
        if(isHost) Object.keys(peer.connections).forEach(id => peer.connections[id][0].send(data));
        else { const h = peer.connections[Object.keys(peer.connections)[0]]; if(h) h[0].send(data); }
    }

    function sendLocalChat() {
        const input = document.getElementById('chat-input');
        if(!input.value) return;
        players['me'].msg = input.value; players['me'].msgTime = Date.now();
        broadcast({ type: 'CHAT', msg: input.value, id: peer.id });
        input.value = ""; input.blur();
    }

    function createWarpParticles(x, y, color) {
        for (let i = 0; i < 6; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * 35,
                y: y + (Math.random() - 0.5) * 35,
                vx: (Math.random() - 0.5) * 3,
                vy: -Math.random() * 6 - 3,
                life: 1,
                color: color || '#fff',
                size: Math.random() * 4 + 1,
                angle: Math.random() * Math.PI * 2,
                radius: Math.random() * 20
            });
        }
    }

    function drawParticles() {
        ctx.save();
        particles.forEach((p, i) => {
            p.life -= 0.025;
            if (p.life <= 0) { particles.splice(i, 1); return; }
            p.angle += 0.15;
            p.x += Math.cos(p.angle) * p.radius * 0.1 + p.vx;
            p.y += p.vy;
            p.radius += 0.25;
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 12; ctx.shadowColor = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();
    }

    function applyGlitch(imgX, imgY, size, p) {
        ctx.save();
        ctx.beginPath(); ctx.arc(imgX, imgY, size/2, 0, Math.PI * 2); ctx.clip();
        for (let i = 0; i < 5; i++) {
            const h = Math.random() * size;
            const y = imgY - size/2 + Math.random() * size;
            const xOffset = (Math.random() - 0.5) * 20 * (1 - p.opacity);
            ctx.fillStyle = (Math.random() > 0.5) ? 'rgba(255,0,0,0.5)' : 'rgba(0,255,255,0.5)';
            ctx.fillRect(imgX - size/2 + xOffset, y, size, h);
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();
        
        ctx.setLineDash([5, 10]);
        ctx.strokeStyle = "rgba(96, 165, 250, 0.4)";
        ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, SAFE_RADIUS, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);

        let onPortal = false;
        Object.keys(portals).forEach(pid => {
            const p = (pid === 'me' || pid === peer.id) ? portals['me'] : portals[pid];
            if(!p) return;
            const pulse = 35 + Math.sin(now/200)*5;
            const grad = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, pulse);
            grad.addColorStop(0, p.color); grad.addColorStop(1, "transparent");
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(p.x, p.y, pulse, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "white"; ctx.font = "bold 11px sans-serif"; ctx.textAlign="center"; 
            ctx.fillText(p.name.toUpperCase(), p.x, p.y - 55);
            if(Math.hypot(players['me'].x - p.x, players['me'].y - p.y) < 30) onPortal = true;
        });

        const notice = document.getElementById('warp-notice');
        const barInner = document.getElementById('warp-bar-inner');

        if ((onPortal && warpTarget) || isTransitioning) {
            if (!isTransitioning) {
                warpTimer -= 16.6;
                players['me'].warping = true;
                players['me'].warpTimeLeft = Math.ceil(warpTimer / 1000);
            } else { warpTimer -= 25; }
            notice.style.display = 'block';
            barInner.style.width = (Math.max(0, warpTimer) / 5000) * 100 + "%";
            broadcast({ type: 'WARP_STATUS', warping: true, timeLeft: Math.max(0, players['me'].warpTimeLeft) });
            if (warpTimer <= 1500) {
                isTransitioning = true;
                players['me'].opacity = Math.max(0, (warpTimer - 500) / 1000); 
                createWarpParticles(players['me'].x, players['me'].y, warpTarget.color);
            }
            if (warpTimer <= 0) { window.location.href = warpTarget.url; return; }
        } else if (onPortal && !warpTarget) {
            Object.keys(portals).forEach(pid => {
                const p = (pid === 'me' || pid === peer.id) ? portals['me'] : portals[pid];
                if(Math.hypot(players['me'].x - p.x, players['me'].y - p.y) < 30) {
                    warpTarget = p; warpTimer = 5000;
                }
            });
        } else if (!isTransitioning && players['me'].warping) {
            warpTarget = null; warpTimer = 0;
            notice.style.display = 'none';
            players['me'].warping = false;
            players['me'].opacity = 1;
            broadcast({ type: 'WARP_STATUS', warping: false, timeLeft: 0 });
        }

        drawParticles();

        Object.keys(players).forEach(id => {
            const p = players[id];
            p.x += (p.targetX - p.x) * 0.1; p.y += (p.targetY - p.y) * 0.1;
            const op = (id === 'me') ? p.opacity : (p.opacity || 1);
            ctx.save();
            ctx.globalAlpha = op;
            if(p.icon) {
                if(!iconCache[p.icon]) { const img = new Image(); img.src = p.icon; iconCache[p.icon] = img; }
                ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI*2); ctx.clip();
                if(iconCache[p.icon].complete) ctx.drawImage(iconCache[p.icon], p.x-22, p.y-22, 44, 44);
                ctx.restore();
            } else {
                ctx.fillStyle = (id==='me'?'#3b82f6':'#94a3b8'); ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI*2); ctx.fill();
            }
            if(p.warping && op > 0) applyGlitch(p.x, p.y, 44, p);
            if(p.msg && now - p.msgTime < 5000) {
                ctx.save(); ctx.font = "14px sans-serif"; const tw = ctx.measureText(p.msg).width;
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.beginPath(); ctx.roundRect(p.x - tw/2 - 10, p.y - 75, tw + 20, 30, 8); ctx.fill();
                ctx.fillStyle = "#000"; ctx.textAlign = "center"; ctx.fillText(p.msg, p.x, p.y - 55);
                ctx.restore();
            }
            ctx.fillStyle = "white"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center";
            ctx.fillText(p.name, p.x, p.y+42);
            ctx.restore();
        });
        requestAnimationFrame(draw);
    }
    function removePlayer(id) { delete players[id]; delete portals[id]; if(isHost) syncAll(); }
</script>
</body>
</html>
