<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gutti Lobby - Sync Noise</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #020617; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        #status-bar { position: fixed; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95); padding: 8px 15px; font-size: 11px; z-index: 100; border-bottom: 1px solid #1e293b; color: #60a5fa; }
        #login-screen { position: fixed; inset: 0; background: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 24px; display: flex; flex-direction: column; gap: 15px; width: 300px; border: 1px solid #334155; }
        input[type="text"] { padding: 15px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; }
        button { padding: 15px; background: #2563eb; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        #ui-layer { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 15px; width: 90%; max-width: 500px; z-index: 2000; }
        #chat-input { width: 100%; padding: 16px 24px; border-radius: 40px; border: 2px solid #2563eb; background: rgba(15, 23, 42, 0.95); color: white; outline: none; }
        #lobby-canvas { background: radial-gradient(circle at center, #1e293b 0%, #020617 80%); display: block; }
        #warp-notice { position: fixed; top: 15%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; color: #ef4444; display: none; z-index: 3000; text-align: center; }
        #warp-bar { width: 200px; height: 5px; background: #444; margin: 10px auto; border-radius: 3px; overflow: hidden; }
        #warp-bar-inner { width: 100%; height: 100%; background: #ef4444; }
    </style>
</head>
<body>

<div id="status-bar">GUTTI LOBBY - VIRTUAL SYNC & NOISE RELAY</div>
<div id="warp-notice">WARP INITIATED<div id="warp-bar"><div id="warp-bar-inner"></div></div></div>

<div id="login-screen">
    <div class="login-card">
        <h1 style="text-align:center;">GUTTI GLITCH</h1>
        <input type="text" id="user-name" placeholder="Name" maxlength="10">
        <label style="font-size:12px; text-align:center; color:#94a3b8; cursor:pointer;">📷 Custom Icon<input type="file" id="icon-upload" accept="image/*" style="display:none;"></label>
        <button onclick="startLobby()">Connect</button>
    </div>
</div>

<canvas id="lobby-canvas"></canvas>

<div id="ui-layer">
    <input type="text" id="chat-input" placeholder="Say something..." maxlength="30" onkeypress="if(event.key==='Enter') sendLocalChat()">
</div>

<script>
    const ROOM_ID = "GUTTI-SYNC-RELAY-2026";
    const PREFIX = "gutti-sv10-";
    const BASE_SIZE = 1000; // 仮想的な画面サイズ（1000px基準）
    
    let peer, myName, myIconData = null;
    let players = {}, portals = {}, iconCache = {}, receivedMsgIds = new Set();
    let canvas, ctx, scale = 1, offsetX = 0, offsetY = 0;
    let particles = [], relayPackets = [];

    window.onload = () => {
        canvas = document.getElementById('lobby-canvas');
        ctx = canvas.getContext('2d');
        resize();
        window.onresize = resize;
        document.getElementById('user-name').value = localStorage.getItem('gutti_name') || "";
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // 1000pxの仮想空間を現在の画面にフィットさせる倍率を計算
        scale = Math.min(canvas.width / BASE_SIZE, canvas.height / BASE_SIZE);
        offsetX = (canvas.width - BASE_SIZE * scale) / 2;
        offsetY = (canvas.height - BASE_SIZE * scale) / 2;
    }

    // 実座標(画面)から仮想座標(1000基準)へ変換
    function toVirtual(val, isY = false) { return (val - (isY ? offsetY : offsetX)) / scale; }
    // 仮想座標から実座標へ変換
    function toReal(val, isY = false) { return val * scale + (isY ? offsetY : offsetX); }

    async function startLobby() {
        myName = document.getElementById('user-name').value || "Guest";
        const file = document.getElementById('icon-upload').files[0];
        if(file) myIconData = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
        localStorage.setItem('gutti_name', myName);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        
        players['me'] = { id: 'me', name: myName, icon: myIconData, x: 500, y: 500, targetX: 500, targetY: 500, msg: "", msgTime: 0, noiseTime: 0 };
        initPeer();
        requestAnimationFrame(draw);

        canvas.addEventListener('mousedown', e => moveMe(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => { if(document.activeElement.id !== 'chat-input') moveMe(e.touches[0].clientX, e.touches[0].clientY); });
    }

    function moveMe(x, y) {
        const vx = toVirtual(x);
        const vy = toVirtual(y, true);
        players['me'].targetX = vx; players['me'].targetY = vy;
        relayBroadcast({ type: 'MOVE', x: vx, y: vy });
    }

    function initPeer() {
        peer = new Peer(PREFIX + ROOM_ID);
        peer.on('open', () => { setupPeerHandlers(); });
        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') {
                peer = new Peer();
                peer.on('open', () => {
                    setupPeerHandlers();
                    const conn = peer.connect(PREFIX + ROOM_ID);
                    setupConnection(conn);
                });
            }
        });
    }

    function setupPeerHandlers() { peer.on('connection', conn => setupConnection(conn)); }

    function setupConnection(conn) {
        conn.on('open', () => {
            conn.send({ type: 'JOIN', name: myName, icon: myIconData, x: players['me'].x, y: players['me'].y, senderId: peer.id });
            conn.on('data', data => handleData(conn, data));
        });
    }

    function handleData(conn, d) {
        if (!d.msgId) d.msgId = Math.random().toString(36).substr(2, 9);
        if (receivedMsgIds.has(d.msgId)) return;
        receivedMsgIds.add(d.msgId);
        
        const sid = d.senderId;
        
        // 【ノイズ演出】転送元と自分の「ノイズフラグ」を立てる
        if (players[sid]) players[sid].noiseTime = 20; 
        players['me'].noiseTime = 10;

        if (d.type === 'JOIN') {
            players[sid] = { id: sid, name: d.name, icon: d.icon, x: d.x, y: d.y, targetX: d.x, targetY: d.y, msg: "", msgTime: 0, noiseTime: 0 };
        }
        if (d.type === 'MOVE' && players[sid]) { players[sid].targetX = d.x; players[sid].targetY = d.y; }
        if (d.type === 'CHAT' && players[sid]) { players[sid].msg = d.msg; players[sid].msgTime = Date.now(); }

        // バケツリレー転送
        Object.keys(peer.connections).forEach(targetId => {
            if (targetId !== conn.peer) {
                setTimeout(() => {
                    const targetConn = peer.connections[targetId][0];
                    if (targetConn && targetConn.open) targetConn.send(d);
                }, 400);
            }
        });
    }

    function relayBroadcast(data) {
        data.senderId = peer.id;
        data.msgId = Math.random().toString(36).substr(2, 9);
        receivedMsgIds.add(data.msgId);
        Object.keys(peer.connections).forEach(id => {
            const conn = peer.connections[id][0];
            if (conn && conn.open) conn.send(data);
        });
    }

    function sendLocalChat() {
        const input = document.getElementById('chat-input');
        if(!input.value) return;
        players['me'].msg = input.value; players['me'].msgTime = Date.now();
        relayBroadcast({ type: 'CHAT', msg: input.value });
        input.value = ""; input.blur();
    }

    function applyGlitch(x, y, size) {
        ctx.save();
        const rx = toReal(x), ry = toReal(y, true), rs = size * scale;
        ctx.beginPath(); ctx.arc(rx, ry, rs/2, 0, Math.PI * 2); ctx.clip();
        for (let i = 0; i < 5; i++) {
            const h = Math.random() * rs;
            const yo = ry - rs/2 + Math.random() * rs;
            const xo = (Math.random() - 0.5) * 25 * scale;
            ctx.fillStyle = (Math.random() > 0.5) ? 'rgba(255,0,0,0.5)' : 'rgba(0,255,255,0.5)';
            ctx.fillRect(rx - rs/2 + xo, yo, rs, h);
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();

        // Safe Area描画
        ctx.strokeStyle = "rgba(96, 165, 250, 0.2)";
        ctx.beginPath(); ctx.arc(toReal(500), toReal(500, true), 130 * scale, 0, Math.PI*2); ctx.stroke();

        Object.keys(players).forEach(id => {
            const p = players[id];
            p.x += (p.targetX - p.x) * 0.1; p.y += (p.targetY - p.y) * 0.1;
            
            const rx = toReal(p.x);
            const ry = toReal(p.y, true);
            const rs = 44 * scale;

            ctx.save();
            // アイコン描画
            if(p.icon) {
                if(!iconCache[p.icon]) { const img = new Image(); img.src = p.icon; iconCache[p.icon] = img; }
                ctx.save(); ctx.beginPath(); ctx.arc(rx, ry, rs/2, 0, Math.PI*2); ctx.clip();
                if(iconCache[p.icon].complete) ctx.drawImage(iconCache[p.icon], rx-rs/2, ry-rs/2, rs, rs);
                ctx.restore();
            } else {
                ctx.fillStyle = (id==='me'?'#3b82f6':'#94a3b8'); ctx.beginPath(); ctx.arc(rx, ry, rs/2, 0, Math.PI*2); ctx.fill();
            }

            // 【中継ノイズ】転送が発生した瞬間に激しくグリッチ
            if (p.noiseTime > 0) {
                applyGlitch(p.x, p.y, 50);
                p.noiseTime--;
            }

            // チャット
            if(p.msg && now - p.msgTime < 5000) {
                ctx.font = (14 * scale) + "px sans-serif";
                const tw = ctx.measureText(p.msg).width;
                ctx.fillStyle = "white"; ctx.beginPath(); ctx.roundRect(rx - tw/2 - 10, ry - 75*scale, tw + 20, 30*scale, 8); ctx.fill();
                ctx.fillStyle = "#000"; ctx.textAlign = "center"; ctx.fillText(p.msg, rx, ry - 55*scale);
            }
            
            ctx.fillStyle = "white"; ctx.font = `bold ${12 * scale}px sans-serif`; ctx.textAlign = "center";
            ctx.fillText(p.name, rx, ry + 42 * scale);
            ctx.restore();
        });
        requestAnimationFrame(draw);
    }
</script>
</body>
</html>
