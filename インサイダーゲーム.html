<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Insider</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #673ab7; --accent: #ff9800; --danger: #f44336; --success: #4caf50; --bg: #f5f7fa; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: var(--bg); color: #333; line-height: 1.6; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border-top: 10px solid var(--primary); max-width: 500px; margin: auto; }
        h2 { text-align: center; margin-top: 0; color: var(--primary); font-size: 1.4rem; }
        .hidden { display: none; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #eee; border-radius: 12px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; background: var(--primary); margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: translateY(2px); box-shadow: none; }
        #timer { font-size: 56px; text-align: center; font-weight: 800; color: var(--accent); margin: 15px 0; font-family: 'Courier New', Courier, monospace; }
        .role-box { padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; border: 3px solid #eee; transition: all 0.5s; }
        .role-master { background: #e3f2fd; border-color: #2196f3; color: #0d47a1; }
        .role-insider { background: #fff3e0; border-color: #ff9800; color: #e65100; }
        .role-common { background: #f5f5f5; border-color: #9e9e9e; color: #424242; }
        #word-display { font-size: 32px; font-weight: bold; color: var(--danger); margin: 15px 0; letter-spacing: 2px; }
        .status { font-size: 14px; text-align: center; color: #777; margin-top: 15px; background: #fff; padding: 10px; border-radius: 10px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
        label { font-size: 13px; font-weight: bold; color: #666; margin-left: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>インサイダーゲーム P2P</h2>

    <div id="lobby-screen">
        <label>プレイヤー名</label>
        <input type="text" id="user-name" placeholder="名前を入力">
        <label>ルーム合言葉 (共通の言葉)</label>
        <input type="text" id="room-id" placeholder="例: 1234">
        <button id="join-btn" onclick="initConnection()">部屋に入る / 作る</button>
        <p id="status-msg" class="status">合言葉を入力してボタンを押してください</p>

        <div id="host-setup" class="hidden">
            <hr>
            <h3 style="font-size: 16px;">ホスト設定</h3>
            <label>議論時間</label>
            <select id="time-limit">
                <option value="180">3分</option>
                <option value="300" selected>5分</option>
                <option value="600">10分</option>
            </select>
            <label>今回のお題</label>
            <input type="text" id="custom-word" placeholder="お題を入力 (例: 掃除機)">
            <p style="text-align:center; font-weight:bold;">参加人数: <span id="player-count">1</span>名</p>
            <button onclick="startGame()" style="background:var(--success);">ゲーム開始</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="timer">05:00</div>
        
        <div id="role-area" class="role-box">
            <div id="role-name" style="font-size: 20px; font-weight: bold;">配役確認中...</div>
            <div id="word-display" class="hidden">お題: <br><span>? ? ?</span></div>
            <div id="insider-msg" class="hidden" style="font-size:14px; margin-top:10px; border-top: 1px dashed; padding-top: 10px;">
                正体を知られないように、<br>みんなを正解へ導きましょう。
            </div>
        </div>

        <button onclick="location.reload()" style="background:var(--danger); margin-top: 30px; opacity: 0.8;">トップに戻る</button>
    </div>
</div>

<script>
    let peer, connections = [], myName, isHost = false, timerInterval;
    const PREFIX = "insider-game-v2-";

    window.onload = () => {
        document.getElementById('user-name').value = localStorage.getItem('insider_name') || "";
    };

    function initConnection() {
        myName = document.getElementById('user-name').value || "プレイヤー" + Math.floor(Math.random()*100);
        const room = document.getElementById('room-id').value;
        if (!room) return alert("合言葉を入力してください");
        
        localStorage.setItem('insider_name', myName);
        document.getElementById('join-btn').disabled = true;
        document.getElementById('status-msg').innerText = "接続中...";
        
        const fullId = PREFIX + room;
        peer = new Peer(fullId);

        peer.on('open', () => {
            isHost = true;
            document.getElementById('host-setup').classList.remove('hidden');
            document.getElementById('status-msg').innerText = "ホストとして待機中...";
            refreshCount();
            peer.on('connection', conn => {
                conn.on('open', () => {
                    conn.on('data', data => {
                        if (data.type === 'JOIN') { conn.userName = data.name; connections.push(conn); refreshCount(); }
                    });
                });
            });
        });

        peer.on('error', err => {
            if (err.type === 'unavailable-id') { peer.destroy(); joinAsGuest(fullId); }
            else { alert("通信エラー: " + err.type); location.reload(); }
        });
    }

    function joinAsGuest(hostId) {
        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(hostId);
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: myName });
                document.getElementById('status-msg').innerText = "接続完了！開始を待っています...";
                conn.on('data', data => {
                    if (data.type === 'START') setupGameUI(data);
                    if (data.type === 'TICK') document.getElementById('timer').innerText = data.time;
                });
            });
        });
    }

    function refreshCount() {
        document.getElementById('player-count').innerText = connections.length + 1;
    }

    function startGame() {
        const word = document.getElementById('custom-word').value || "リンゴ";
        const timeLimit = parseInt(document.getElementById('time-limit').value);
        const players = [myName, ...connections.map(c => c.userName)];
        
        let indices = players.map((_, i) => i).sort(() => Math.random() - 0.5);
        const roles = players.map((_, i) => {
            const roleIdx = indices.indexOf(i);
            return roleIdx === 0 ? "MASTER" : (roleIdx === 1 ? "INSIDER" : "COMMON");
        });

        setupGameUI({ role: roles[0], word: word });
        connections.forEach((c, i) => {
            c.send({ type: 'START', role: roles[i+1], word: word });
        });
        startTimer(timeLimit);
    }

    function setupGameUI(data) {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        const roleName = document.getElementById('role-name');
        const wordDisplay = document.getElementById('word-display');
        const roleBox = document.getElementById('role-area');
        const insiderMsg = document.getElementById('insider-msg');

        roleBox.className = "role-box";
        insiderMsg.classList.add('hidden');

        if (data.role === "MASTER") {
            roleName.innerText = "あなたは【マスター】です";
            roleBox.classList.add('role-master');
            wordDisplay.classList.remove('hidden');
            wordDisplay.querySelector('span').innerText = data.word;
        } else if (data.role === "INSIDER") {
            roleName.innerText = "あなたは【インサイダー】です";
            roleBox.classList.add('role-insider');
            wordDisplay.classList.remove('hidden');
            wordDisplay.querySelector('span').innerText = data.word;
            insiderMsg.classList.remove('hidden');
        } else {
            roleName.innerText = "あなたは【庶民】です";
            roleBox.classList.add('role-common');
            wordDisplay.classList.add('hidden');
        }
    }

    function startTimer(sec) {
        let left = sec;
        timerInterval = setInterval(() => {
            left--;
            const m = Math.floor(left / 60).toString().padStart(2, '0');
            const s = (left % 60).toString().padStart(2, '0');
            const timeStr = `${m}:${s}`;
            document.getElementById('timer').innerText = timeStr;
            if (isHost) connections.forEach(c => c.send({ type: 'TICK', time: timeStr }));
            if (left <= 0) clearInterval(timerInterval);
        }, 1000);
    }
</script>
</body>
</html>
