<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Station</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .card { background: white; color: black; padding: 40px; border-radius: 40px; text-align: center; width: 90%; max-width: 500px; box-shadow: 0 0 50px rgba(59, 130, 246, 0.5); }
        #setup { position: fixed; top: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; z-index: 10; font-size: 0.8rem; }
        img { width: 100%; max-width: 350px; margin: 20px 0; }
        h1 { margin: 0; font-size: 2.5rem; }
    </style>
</head>
<body>
    <div id="setup">
        合言葉:<input type="text" id="room" value="rally2026" style="width:80px"> 
        No:<input type="number" id="pos" value="0" style="width:35px"> 
        <button onclick="start()">開始</button>
    </div>
    <div class="card">
        <h1 id="dn">待機中</h1>
        <div id="q"></div>
        <p style="font-weight:bold; color:#64748b;">スマホでスキャンしてください</p>
    </div>
<script>
    function start() {
        const r=document.getElementById('room').value, p=document.getElementById('pos').value;
        const peer = new Peer();
        peer.on('open', () => {
            const cn = peer.connect(`${r}-host`);
            cn.on('open', () => document.getElementById('setup').style.display='none');
            cn.on('data', d => {
                if(d.type==='SYNC') {
                    const s = d.cfg.s[p];
                    if(s) {
                        document.getElementById('dn').innerText = s.n;
                        const code = btoa(encodeURIComponent(s.n+"::"+s.c));
                        document.getElementById('q').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${code}">`;
                    }
                }
            });
            cn.on('close', () => location.reload());
        });
    }
</script>
</body>
</html>
