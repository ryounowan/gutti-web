<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlightRadar Pro | 全国空港タイムテーブル & LIVE追跡</title>

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

        * { touch-action: manipulation; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        #map { height: 100%; width: 100%; background: #090d16; z-index: 1; }

        @keyframes dash-animation {
            to { stroke-dashoffset: -40; }
        }
        .route-path-animated {
            stroke-dasharray: 8, 8;
            animation: dash-animation 1.5s linear infinite;
        }

        .plane-marker-container {
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease-out;
        }
        .plane-icon-body { filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8)); transition: all 0.2s ease; }
        .plane-emergency { animation: pulse-red 1s infinite alternate; }

        @keyframes pulse-red {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ef4444); }
            100% { transform: scale(1.3); filter: drop-shadow(0 0 15px #ef4444); }
        }

        .airport-pin {
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #38bdf8;
            border-radius: 50%;
            color: #38bdf8;
            text-align: center;
            line-height: 20px;
            font-size: 10px;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .airport-pin:hover { transform: scale(1.3); border-color: #f59e0b; color: #f59e0b; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @media (max-width: 768px) {
            .mobile-bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .mobile-sheet-closed { transform: translateY(calc(100% - 50px)); }
            .mobile-sheet-open { transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">

            </div>

                <p class="hidden md:block text-xs text-slate-400">全国空港時刻表 & LIVEフライトトラッカー</p>
            </div>
        </div>

                <span class="hidden sm:inline">⚠️ 緊急機体</span>
                <span id="emergencyBadge" class="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
            </button>

            <!-- ユーザープロフィール設定（リフレッシュしても保持） -->
            <div onclick="openUserModal()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700/80 px-2.5 py-1 rounded-lg border border-slate-700 cursor-pointer transition">

                    <i class="fa-solid fa-user"></i>
                </div>
                <span id="userDisplayName" class="text-xs font-medium text-slate-200 max-w-[80px] truncate hidden sm:inline">ゲスト</span>
            </div>

                    <option value="satellite">衛星写真</option>

        </div>
    </header>

            <!-- タブ切り替え -->

                </div>
            </div>

    </main>

        let map, currentTileLayer, markers = {};

        // ユーザー設定状態（LocalStorageと保持連動）
        let userProfile = { name: "SkyWatcher_77", icon: "fa-user" };

        function initApp() {
            loadUserProfile();
            initMap();
            renderAirportPins();
            fetchData();
            setInterval(fetchData, CONFIG.REFRESH_INTERVAL);
            requestAnimationFrame(animatePlanes);

            document.getElementById('searchInput').addEventListener('input', renderList);
        }

        // ユーザー名・アイコンの永続化管理 (LocalStorage)
        function loadUserProfile() {
            const saved = localStorage.getItem('flightradar_user_profile');
            if (saved) {
                try {
                    userProfile = JSON.parse(saved);
                } catch(e){}
            }
            applyUserProfileUI();
        }

        function applyUserProfileUI() {
            document.getElementById('userDisplayName').innerText = userProfile.name;
            document.getElementById('userAvatarIcon').innerHTML = `<i class="fa-solid ${userProfile.icon}"></i>`;
            document.getElementById('usernameInput').value = userProfile.name;
        }

        function openUserModal() {
            document.getElementById('userModal').classList.remove('hidden');
        }
        function closeUserModal() {
            document.getElementById('userModal').classList.add('hidden');
        }
        function setAvatarIcon(iconClass) {
            userProfile.icon = iconClass;
            document.getElementById('userAvatarIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
        }
        function saveUserProfile() {
            const inputVal = document.getElementById('usernameInput').value.trim();
            if (inputVal) userProfile.name = inputVal;
            localStorage.setItem('flightradar_user_profile', JSON.stringify(userProfile));
            applyUserProfileUI();
            closeUserModal();
        }

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            map.on('click', (e) => {
                if (e.originalEvent.target.id === 'map') closeDetail();
            });
        }

        function changeMapStyle(style) {
            if (currentTileLayer) map.removeLayer(currentTileLayer);
            let url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
            if (style === 'street') url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            else if (style === 'satellite') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            currentTileLayer = L.tileLayer(url, { maxZoom: 18 }).addTo(map);
        }

        function renderAirportPins() {
            AIRPORTS_DB.forEach(ap => {
                const icon = L.divIcon({
                    className: 'airport-pin',
                    html: `<i class="fa-solid fa-plane-arrival"></i>`,
                    iconSize: [20, 20]
                });
                const marker = L.marker([ap.lat, ap.lng], { icon: icon }).addTo(map);
                marker.on('click', () => selectAirport(ap.code));
            });
            document.getElementById('airportCountNum').innerText = AIRPORTS_DB.length;
        }

        async function fetchData() {
            try {
                const res = await fetch(CONFIG.WORKER_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.states) {
                        flightsData = data.states
                            .filter(s => s[5] !== null && s[6] !== null)
                            .map(s => parseAircraft(s));
                        
                        updateUI();
                    }
                }
            } catch (e) {
                console.warn("データ取得中...", e);
            }
        }

        function parseAircraft(s) {
            const icao = s[0] || Math.random().toString(36).substring(7);
            const callsign = (s[1] || '').trim() || `ICAO-${icao.toUpperCase()}`;
            const lng = s[5];
            const lat = s[6];
            const altM = s[7] || 0;
            const altFt = Math.round(altM * 3.28084);
            const velocity = s[9] || 0;
            const heading = s[10] || 0;
            const squawk = s[14] || '1200';
            const isEmergency = ['7700', '7600', '7500'].includes(squawk);

            const meta = getFlightMeta(callsign, heading, lat, lng);

            return {
                icao, callsign, lat, lng,
                altFt, velocity, heading, squawk, isEmergency,
                airline: meta.airline,
                type: meta.type,
                dest: meta.dest,
                origin: meta.origin
            };
        }

        function getFlightMeta(callsign, heading, lat, lng) {
            let airline = 'その他 / 民間機';
            let type = 'Boeing 737-800';
            let origin = AIRPORTS_DB[3]; // ITM
            let dest = AIRPORTS_DB[0];   // HND

            const cs = callsign.toUpperCase();
            if (cs.startsWith('ANA') || cs.startsWith('NH')) { 
                airline = '全日本空輸 (ANA)'; type = 'Boeing 787-9'; dest = AIRPORTS_DB[0]; origin = AIRPORTS_DB[6];
            } else if (cs.startsWith('JAL') || cs.startsWith('JL')) { 
                airline = '日本航空 (JAL)'; type = 'Airbus A350-900'; dest = AIRPORTS_DB[5]; origin = AIRPORTS_DB[0];
            } else if (cs.startsWith('SKY')) { 
                airline = 'スカイマーク'; type = 'Boeing 737-800'; dest = AIRPORTS_DB[6]; origin = AIRPORTS_DB[0];
            } else if (cs.startsWith('APJ')) { 
                airline = 'Peach Aviation'; type = 'Airbus A320neo'; dest = AIRPORTS_DB[2]; origin = AIRPORTS_DB[1];
            }

            // 最寄りの目的地判定
            if (heading >= 315 || heading < 45) dest = AIRPORTS_DB[5]; // CTS
            else if (heading >= 45 && heading < 135) dest = AIRPORTS_DB[0]; // HND
            else if (heading >= 135 && heading < 225) dest = AIRPORTS_DB[7]; // OKA
            else if (heading >= 225 && heading < 315) dest = AIRPORTS_DB[6]; // FUK

            return { airline, type, origin, dest };
        }

        function animatePlanes() {
            flightsData.forEach(f => {
                const speedScale = 0.00000035;
                const rad = (f.heading * Math.PI) / 180;
                f.lat += Math.cos(rad) * f.velocity * speedScale;
                f.lng += Math.sin(rad) * f.velocity * speedScale;

                if (markers[f.icao]) {
                    markers[f.icao].setLatLng([f.lat, f.lng]);
                }
            });

            if (selectedId && activeRouteLine) {
                const selectedPlane = flightsData.find(f => f.icao === selectedId);
                if (selectedPlane) {
                    activeRouteLine.setLatLngs([[selectedPlane.lat, selectedPlane.lng], [selectedPlane.dest.lat, selectedPlane.dest.lng]]);
                }
            }

            requestAnimationFrame(animatePlanes);
        }

        function updateUI() {
            updateMapMarkers();
            renderList();

            const emergencyCount = flightsData.filter(f => f.isEmergency).length;
            const badge = document.getElementById('emergencyBadge');
            if (emergencyCount > 0) {
                badge.innerText = emergencyCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            document.getElementById('flightCountNum').innerText = flightsData.length;

            if (selectedId) updateAircraftTelemetry(selectedId);
            else if (selectedAirportCode) updateAirportSchedule(selectedAirportCode);
        }

        function updateMapMarkers() {
            const activeIds = new Set(flightsData.map(f => f.icao));

            Object.keys(markers).forEach(id => {
                if (!activeIds.has(id)) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });

            flightsData.forEach(f => {
                const isSelected = f.icao === selectedId;
                const icon = createEnhancedIcon(f, isSelected);

                if (markers[f.icao]) {
                    markers[f.icao].setIcon(icon);
                } else {
                    const marker = L.marker([f.lat, f.lng], { icon: icon }).addTo(map);
                    marker.on('click', () => selectFlight(f.icao));
                    markers[f.icao] = marker;
                }
            });
        }

        function createEnhancedIcon(f, isSelected) {
            let color = '#38bdf8';
            if (f.altFt < 10000) color = '#10b981';
            if (f.isEmergency) color = '#ef4444';
            if (isSelected) color = '#f59e0b';

            let size = isSelected ? 32 : 24;
            const emergencyClass = f.isEmergency ? 'plane-emergency' : '';

            const svgIcon = `
                <div class="plane-marker-container ${emergencyClass}">
                    <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" style="transform: rotate(${f.heading}deg);" class="plane-icon-body">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                </div>
            `;

            return L.divIcon({
                className: '',
                html: svgIcon,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            const kw = document.getElementById('searchInput').value.toLowerCase();

            if (currentTab === 'flights') {
                const filtered = flightsData.filter(f => {
                    const matchKw = f.callsign.toLowerCase().includes(kw) || 
                                    f.airline.toLowerCase().includes(kw) || 
                                    f.type.toLowerCase().includes(kw) ||
                                    f.dest.name.toLowerCase().includes(kw);
                    
                    if (!matchKw) return false;
                    if (filterByAirport && f.dest.code !== filterByAirport && f.origin.code !== filterByAirport) return false;
                    if (emergencyOnly && !f.isEmergency) return false;
                    if (currentFilter === 'jal') return f.callsign.startsWith('JAL') || f.callsign.startsWith('JL');
                    if (currentFilter === 'ana') return f.callsign.startsWith('ANA') || f.callsign.startsWith('NH');
                    if (currentFilter === '787') return f.type.includes('787');
                    return true;
                });

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs">該当する機体がありません</div>`;
                    return;
                }

                container.innerHTML = filtered.map(f => `
                    <div onclick="selectFlight('${f.icao}')" class="p-3 hover:bg-slate-800/80 cursor-pointer transition ${f.icao === selectedId ? 'bg-amber-400/10 border-l-4 border-amber-400' : ''}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="mono font-bold text-sm ${f.isEmergency ? 'text-red-400' : 'text-slate-100'}">${f.callsign}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-mono">${f.type}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 flex justify-between">
                            <span>目的地: <strong class="text-amber-300">${f.dest.name}</strong></span>
                            <span>高度: <strong class="text-sky-400">${f.altFt.toLocaleString()} ft</strong></span>
                        </div>
                    </div>
                `).join('');
            } else {
                // 全国空港検索
                const filtered = AIRPORTS_DB.filter(a => 
                    a.name.includes(kw) || 
                    a.code.toLowerCase().includes(kw) || 
                    a.icao.toLowerCase().includes(kw) ||
                    a.region.includes(kw)
                );

                container.innerHTML = filtered.map(a => `
                    <div onclick="selectAirport('${a.code}')" class="p-3 hover:bg-slate-800/80 cursor-pointer transition flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="font-bold text-sm text-slate-200">${a.name}</span>
                                <span class="text-[10px] bg-slate-800 text-amber-400 px-1.5 py-0.2 rounded font-mono border border-slate-700">${a.code}</span>
                            </div>
                            <p class="text-[10px] text-slate-400">ICAO: ${a.icao} • 地域: ${a.region}</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                    </div>
                `).join('');
            }
        }

        function selectFlight(id) {
            selectedId = id;
            selectedAirportCode = null;
            const f = flightsData.find(x => x.icao === id);
            if (!f) return;

            map.flyTo([f.lat, f.lng], 8, { duration: 1.0 });
            drawRouteLine(f);

            document.getElementById('detailTitle').innerHTML = `<i class="fa-solid fa-plane-arrival text-amber-400"></i> LIVE 飛行詳細`;
            document.getElementById('detailPanel').classList.remove('hidden');
            updateAircraftTelemetry(id);
        }

        function selectAirport(code) {
            selectedAirportCode = code;
            selectedId = null;
            const ap = AIRPORTS_DB.find(a => a.code === code);
            if (!ap) return;

            map.flyTo([ap.lat, ap.lng], 10, { duration: 1.2 });
            if (activeRouteLine) map.removeLayer(activeRouteLine);
            if (activeDestMarker) map.removeLayer(activeDestMarker);

            document.getElementById('detailTitle').innerHTML = `<i class="fa-solid fa-building-ngo text-sky-400"></i> 空港時刻表 & 発着管理`;
            document.getElementById('detailPanel').classList.remove('hidden');
            updateAirportSchedule(code);
        }

        // 空港時刻表（タイムテーブル）表示
        function updateAirportSchedule(code) {
            const ap = AIRPORTS_DB.find(a => a.code === code);
            if (!ap) return;

            const now = new Date();
            const arrivals = flightsData.filter(f => f.dest.code === code);
            const departures = flightsData.filter(f => f.origin.code === code);

            document.getElementById('detailContent').innerHTML = `
                <!-- 空港基本カード -->
                <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700">
                    <div class="flex justify-between items-start mb-1">
                        <div>
                            <h3 class="text-base font-bold text-white">${ap.name}空港</h3>
                            <p class="text-xs text-slate-400">IATA: ${ap.code} | ICAO: ${ap.icao}</p>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold rounded">運用中</span>
                    </div>

                    <button onclick="filterByAirportCode('${ap.code}')" class="mt-2.5 w-full py-1.5 bg-amber-400/20 hover:bg-amber-400/30 border border-amber-400/40 text-amber-300 rounded text-xs font-bold transition">
                        <i class="fa-solid fa-filter mr-1"></i> この空港の発着便をマップで絞り込み
                    </button>
                </div>

                <!-- 発着時刻表タブ -->
                <div class="space-y-3">
                    <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-bold">
                        <button onclick="setScheduleTab('arrivals')" class="flex-1 py-1.5 rounded-md ${scheduleTab === 'arrivals' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'} transition">
                            <i class="fa-solid fa-plane-arrival mr-1"></i> 到着時刻表 (${arrivals.length})
                        </button>
                        <button onclick="setScheduleTab('departures')" class="flex-1 py-1.5 rounded-md ${scheduleTab === 'departures' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'} transition">
                            <i class="fa-solid fa-plane-departure mr-1"></i> 出発時刻表 (${departures.length})
                        </button>
                    </div>

                    <!-- タイムテーブル本体 -->
                    <div class="space-y-1.5">
                        ${(scheduleTab === 'arrivals' ? arrivals : departures).length === 0 ? 
                            `<p class="text-xs text-slate-500 p-4 text-center">現在、該当する直近のスケジュール便はありません</p>` :
                            (scheduleTab === 'arrivals' ? arrivals : departures).map((f, i) => {
                                const speedKm = Math.round(f.velocity * 3.6);
                                const distKm = calculateDistance(f.lat, f.lng, ap.lat, ap.lng);
                                const mins = speedKm > 50 ? Math.round((distKm / speedKm) * 60) : 12 + i * 8;
                                const timeStr = new Date(now.getTime() + mins * 60000).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

                                return `
                                    <div onclick="selectFlight('${f.icao}')" class="p-2.5 bg-slate-950/80 hover:bg-slate-800 rounded-lg border border-slate-800 flex justify-between items-center cursor-pointer text-xs">
                                        <div>
                                            <div class="font-bold mono text-amber-400 flex items-center gap-1.5">
                                                ${f.callsign}
                                                <span class="text-[9px] text-slate-400 font-normal border border-slate-700 px-1 rounded">${f.type}</span>
                                            </div>
                                            <div class="text-[10px] text-slate-400">
                                                ${scheduleTab === 'arrivals' ? `出発: ${f.origin.name}` : `行先: ${f.dest.name}`}
                                            </div>
                                        </div>
                                        <div class="text-right font-mono">
                                            <div class="text-emerald-400 font-bold">${timeStr} 予定</div>
                                            <div class="text-[10px] text-slate-500">${scheduleTab === 'arrivals' ? `あと${mins}分` : '搭乗中'}</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')
                        }
                    </div>
                </div>
            `;
        }

        function setScheduleTab(tab) {
            scheduleTab = tab;
            if (selectedAirportCode) updateAirportSchedule(selectedAirportCode);
        }

        function updateAircraftTelemetry(id) {
            const f = flightsData.find(x => x.icao === id);
            if (!f) return;

            const speedKm = Math.round(f.velocity * 3.6);
            const distanceKm = calculateDistance(f.lat, f.lng, f.dest.lat, f.dest.lng);
            const remainingMinutes = speedKm > 50 ? Math.round((distanceKm / speedKm) * 60) : '--';
            
            let etaTimeStr = '--:--';
            if (remainingMinutes !== '--') {
                const now = new Date();
                now.setMinutes(now.getMinutes() + remainingMinutes);
                etaTimeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            }

            document.getElementById('detailContent').innerHTML = `
                <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                    <div>
                        <p class="text-xl font-bold mono text-amber-400">${f.callsign}</p>
                        <p class="text-xs text-slate-300">${f.airline}</p>
                    </div>
                    <span class="text-xs px-2.5 py-1 rounded bg-slate-700 text-slate-200 font-mono">${f.type}</span>
                </div>

                <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-3">
                    <div class="flex justify-between items-center text-xs border-b border-slate-800 pb-2">
                        <span class="text-slate-400">出発地:</span>
                        <span class="font-bold text-slate-200">${f.origin.name}</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400">目的地:</span>
                        <span class="font-bold text-amber-300 text-sm">${f.dest.name}</span>
                    </div>

                    <div class="pt-2">
                        <div class="flex justify-between text-[11px] font-mono text-slate-400 mb-1">
                            <span>残り距離: <strong class="text-slate-200">${Math.round(distanceKm)} km</strong></span>
                            <span>到着予定時刻: <strong class="text-emerald-400">${etaTimeStr}</strong></span>
                        </div>
                        <p class="text-right text-[10px] text-amber-400 font-bold mt-1">
                            あと約 <span class="text-sm font-mono">${remainingMinutes}</span> 分で到着予定
                        </p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-slate-800/40 p-3 rounded-lg border border-slate-800">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">高度</p>
                        <p class="text-lg font-bold mono text-sky-400">${f.altFt.toLocaleString()} <span class="text-xs text-slate-400">ft</span></p>
                    </div>
                    <div class="bg-slate-800/40 p-3 rounded-lg border border-slate-800">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">対地速度</p>
                        <p class="text-lg font-bold mono text-emerald-400">${speedKm} <span class="text-xs text-slate-400">km/h</span></p>
                    </div>
                </div>
            `;
        }

        function drawRouteLine(f) {
            if (activeRouteLine) map.removeLayer(activeRouteLine);
            if (activeDestMarker) map.removeLayer(activeDestMarker);

            activeRouteLine = L.polyline([[f.lat, f.lng], [f.dest.lat, f.dest.lng]], {
                color: f.isEmergency ? '#ef4444' : '#f59e0b',
                weight: 3, opacity: 0.9, className: 'route-path-animated'
            }).addTo(map);

            const destIcon = L.divIcon({
                className: '',
                html: `<div class="bg-amber-400 text-slate-950 px-2 py-1 rounded shadow-lg font-bold text-[10px]"><i class="fa-solid fa-location-dot"></i> ${f.dest.name}</div>`,
                iconAnchor: [30, 10]
            });
            activeDestMarker = L.marker([f.dest.lat, f.dest.lng], { icon: destIcon }).addTo(map);
        }

        function filterByAirportCode(code) {
            filterByAirport = code;
            document.getElementById('resetFilterBtn').classList.remove('hidden');
            document.getElementById('filterStatusText').innerText = `${code} 発着便で絞り込み中`;
            renderList();
        }

        function resetAirportFilter() {
            filterByAirport = null;
            document.getElementById('resetFilterBtn').classList.add('hidden');
            document.getElementById('filterStatusText').innerText = `全機体表示中`;
            renderList();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabFlights').className = `flex-1 py-2.5 font-bold flex justify-center items-center gap-1.5 ${tab === 'flights' ? 'text-amber-400 border-b-2 border-amber-400' : 'text-slate-400 hover:text-slate-200'}`;
            document.getElementById('tabAirports').className = `flex-1 py-2.5 font-bold flex justify-center items-center gap-1.5 ${tab === 'airports' ? 'text-amber-400 border-b-2 border-amber-400' : 'text-slate-400 hover:text-slate-200'}`;
            document.getElementById('quickFilterBtns').style.display = tab === 'flights' ? 'flex' : 'none';
            renderList();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function closeDetail() {
            selectedId = null; selectedAirportCode = null;
            document.getElementById('detailPanel').classList.add('hidden');
            if (activeRouteLine) map.removeLayer(activeRouteLine);
            if (activeDestMarker) map.removeLayer(activeDestMarker);
            renderList();
        }

        function filterEmergency() {
            emergencyOnly = !emergencyOnly;
            document.getElementById('emergencyBtn').classList.toggle('bg-red-500', emergencyOnly);
            renderList();
        }

        function setFilter(type) {
            currentFilter = type;
            renderList();
        }

        function toggleMobileSheet() {
            document.getElementById('sidePanel').classList.toggle('mobile-sheet-open');
            document.getElementById('sidePanel').classList.toggle('mobile-sheet-closed');
        }

        window.onload = initApp;
    </script>
</body>
</html>
