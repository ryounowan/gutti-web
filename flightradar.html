<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlightRadar Pro | LIVE Flight Tracker</title>

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

        * { touch-action: manipulation; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            height: -webkit-fill-available;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        #map {
            height: 100%;
            width: 100%;
            background: #090d16;
            z-index: 1;
        }

        /* アニメーション点線（ルート表示） */
        @keyframes dash-animation {
            to { stroke-dashoffset: -40; }
        }
        .route-path-animated {
            stroke-dasharray: 8, 8;
            animation: dash-animation 1.5s linear infinite;
        }

        /* 機体アイコン（高視認性デザイン） */
        .plane-marker-container {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease-out;
        }
        .plane-icon-body {
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
            transition: all 0.2s ease;
        }
        .plane-emergency {
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ef4444); }
            100% { transform: scale(1.3); filter: drop-shadow(0 0 15px #ef4444); }
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* レスポンシブ用パネル設定 */
        @media (max-width: 768px) {
            .mobile-bottom-sheet {
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .mobile-sheet-closed {
                transform: translateY(calc(100% - 60px));
            }
            .mobile-sheet-open {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">

    <!-- ヘッダーバー -->
    <header class="h-14 md:h-16 flex items-center justify-between px-3 md:px-5 bg-slate-900 border-b border-slate-800 z-50 shadow-xl">
        <div class="flex items-center space-x-2 md:space-x-3">
            <div class="bg-amber-400 p-2 rounded-xl text-slate-950 font-bold shadow-lg shadow-amber-400/20">
                <i class="fa-solid fa-plane-up text-lg md:text-xl"></i>
            </div>
            <div>
                <h1 class="text-sm md:text-base font-bold text-white flex items-center gap-1.5">
                    FlightRadar <span class="bg-amber-400/20 text-amber-400 text-[10px] md:text-xs px-2 py-0.5 rounded-full border border-amber-400/30 font-mono">PRO</span>
                </h1>
                <p class="hidden md:block text-xs text-slate-400">リアルタイム航空機追跡・緊急機体アラート</p>
            </div>
        </div>

        <!-- 状態・検索・ツール -->
        <div class="flex items-center space-x-2 md:space-x-4">
            <button onclick="filterEmergency()" id="emergencyBtn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-400 text-xs font-bold transition">
                <i class="fa-solid fa-triangle-exclamation animate-pulse"></i>
                <span class="hidden sm:inline">⚠️ 緊急機体</span>
                <span id="emergencyBadge" class="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
            </button>

            <!-- マップ切替 -->
            <div class="bg-slate-800 border border-slate-700 rounded-lg p-1 text-xs">
                <select id="mapStyleSelect" onchange="changeMapStyle(this.value)" class="bg-transparent text-slate-200 font-medium focus:outline-none cursor-pointer">
                    <option value="dark">ダーク (FR24)</option>
                    <option value="satellite">衛星写真</option>
                    <option value="street">ライト</option>
                </select>
            </div>

            <!-- ステータス点滅 -->
            <div class="flex items-center space-x-1.5 text-right pl-2 border-l border-slate-800">
                <span class="relative flex h-2.5 w-2.5">
                    <span id="statusPulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span id="statusDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span id="updateTimer" class="text-xs font-mono text-slate-300 hidden md:inline">--:--</span>
            </div>
        </div>
    </header>

    <!-- メイン領域 -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- 左サイドバー（PC） / 下部シート（スマホ） -->
        <aside id="sidePanel" class="mobile-bottom-sheet mobile-sheet-closed md:transform-none fixed md:relative bottom-0 left-0 right-0 z-40 w-full md:w-80 h-[75vh] md:h-full bg-slate-900/95 md:bg-slate-900 border-t md:border-t-0 md:border-r border-slate-800 flex flex-col shadow-2xl transition-all duration-300">
            
            <!-- スマホ用ドラッグバー -->
            <div class="md:hidden h-8 bg-slate-800/80 rounded-t-2xl flex items-center justify-center cursor-pointer" onclick="toggleMobileSheet()">
                <div class="w-12 h-1 bg-slate-600 rounded-full"></div>
            </div>

            <!-- 検索 & フィルター -->
            <div class="p-3 border-b border-slate-800 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                    <input type="text" id="flightSearch" placeholder="便名、行先(HND/NRT)、機体(787)..." 
                        class="w-full pl-8 pr-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-amber-400 transition">
                </div>

                <!-- クイックフィルター -->
                <div class="flex gap-1 overflow-x-auto pb-1 text-[11px] custom-scrollbar">
                    <button onclick="setFilter('all')" class="filter-btn active px-2.5 py-1 rounded bg-amber-400 text-slate-950 font-bold whitespace-nowrap">すべて</button>
                    <button onclick="setFilter('jal')" class="filter-btn px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap">JAL</button>
                    <button onclick="setFilter('ana')" class="filter-btn px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap">ANA</button>
                    <button onclick="setFilter('787')" class="filter-btn px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap">B787</button>
                    <button onclick="setFilter('a350')" class="filter-btn px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap">A350</button>
                </div>
            </div>

            <!-- フライトリスト -->
            <div id="flightList" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-slate-800/60">
                <div class="p-6 text-center text-slate-500 space-y-2">
                    <i class="fa-solid fa-circle-notch animate-spin text-xl text-amber-400"></i>
                    <p class="text-xs">ライブ情報を受信中...</p>
                </div>
            </div>

            <div class="p-2.5 bg-slate-950 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span>捕捉中: <strong id="activeCount" class="text-amber-400 font-mono">0 機</strong></span>
                <span id="emergencyCountText" class="text-red-400 text-[11px]">スクオーク7700: 0機</span>
            </div>
        </aside>

        <!-- 中央：マップ -->
        <section class="flex-1 relative h-full">
            <div id="map"></div>

            <!-- マップ上オーバレイ情報（LIVEステータス） -->
            <div class="absolute top-4 left-4 z-10 glass-panel px-3 py-1.5 rounded-lg text-xs flex items-center gap-2 border border-slate-700/50 shadow-lg">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-mono text-slate-200">LIVE ADS-B TRACKING</span>
            </div>
        </section>

        <!-- 右サイドバー（PC） / ポップアップ（スマホ）：機体・LIVEルート詳細 -->
        <aside id="detailPanel" class="w-full md:w-96 glass-panel md:bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 z-40 flex flex-col transition-all duration-300 hidden md:flex">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/80">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-plane-arrival text-amber-400"></i> 機体・LIVE追跡詳細
                </h2>
                <button onclick="closeDetail()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div id="telemetryDetail" class="p-4 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                <div class="p-8 text-center text-slate-500 rounded-xl bg-slate-800/30 border border-dashed border-slate-800">
                    <i class="fa-solid fa-arrow-pointer text-3xl mb-2 opacity-30"></i>
                    <p class="text-xs">機体をタッチすると、リアルタイム経路・到着予想時刻が表示されます</p>
                </div>
            </div>
        </aside>

    </main>

    <script>
        const CONFIG = {
            WORKER_URL: 'https://bitter-wildflower-c641.ryounowan.workers.dev/',
            REFRESH_INTERVAL: 6000,
        };

        // 主要空港座標データベース（目的地計算用）
        const AIRPORTS = {
            "HND": { name: "羽田空港 (HND)", lat: 35.5494, lng: 139.7798 },
            "NRT": { name: "成田空港 (NRT)", lat: 35.7647, lng: 140.3863 },
            "KIX": { name: "関西空港 (KIX)", lat: 34.4320, lng: 135.2304 },
            "ITM": { name: "伊丹空港 (ITM)", lat: 34.7855, lng: 135.4382 },
            "NGO": { name: "中部国際 (NGO)", lat: 34.8584, lng: 136.8054 },
            "CTS": { name: "新千歳空港 (CTS)", lat: 42.7752, lng: 141.6923 },
            "FUK": { name: "福岡空港 (FUK)", lat: 33.5859, lng: 130.4507 },
            "OKA": { name: "那覇空港 (OKA)", lat: 26.1958, lng: 127.6458 }
        };

        let map, currentTileLayer, markers = {};
        let flightsData = [], selectedId = null;
        let activeRouteLine = null, activeDestMarker = null;
        let currentFilter = 'all', emergencyOnly = false;
        let isMobileSheetOpen = false;

        function initApp() {
            initMap();
            fetchData();
            setInterval(fetchData, CONFIG.REFRESH_INTERVAL);
            requestAnimationFrame(animatePlanes);

            document.getElementById('flightSearch').addEventListener('input', renderFlightList);
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([36.2048, 138.2529], 6);
            changeMapStyle('dark');
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            map.on('click', (e) => {
                if (e.originalEvent.target.id === 'map') closeDetail();
            });
        }

        function changeMapStyle(style) {
            if (currentTileLayer) map.removeLayer(currentTileLayer);
            let url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
            if (style === 'street') url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            else if (style === 'satellite') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            currentTileLayer = L.tileLayer(url, { maxZoom: 18 }).addTo(map);
        }

        async function fetchData() {
            try {
                const res = await fetch(CONFIG.WORKER_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.states) {
                        flightsData = data.states
                            .filter(s => s[5] !== null && s[6] !== null)
                            .map(s => parseAircraft(s));
                        
                        updateUI();
                    }
                }
            } catch (e) {
                console.warn("データ取得エラー:", e);
            }
        }

        function parseAircraft(s) {
            const icao = s[0] || Math.random().toString(36).substring(7);
            const callsign = (s[1] || '').trim() || `ICAO-${icao.toUpperCase()}`;
            const lng = s[5];
            const lat = s[6];
            const altM = s[7] || 0;
            const altFt = Math.round(altM * 3.28084);
            const velocity = s[9] || 0; // m/s
            const heading = s[10] || 0;
            const squawk = s[14] || '1200';

            // 緊急スコーオート判別 (7700: 緊急, 7600: 通信障害, 7500: ハイジャック)
            const isEmergency = ['7700', '7600', '7500'].includes(squawk);

            const meta = getFlightMeta(callsign, heading, lat, lng);

            return {
                icao, callsign, lat, lng,
                altFt, velocity, heading, squawk, isEmergency,
                airline: meta.airline,
                type: meta.type,
                dest: meta.dest,
                origin: meta.origin,
                category: meta.category
            };
        }

        function getFlightMeta(callsign, heading, lat, lng) {
            let airline = 'その他 / 民間機';
            let type = 'Boeing 737-800';
            let category = 'medium';
            let origin = AIRPORTS["ITM"];
            let dest = AIRPORTS["HND"];

            const cs = callsign.toUpperCase();
            if (cs.startsWith('ANA') || cs.startsWith('NH')) { 
                airline = '全日本空輸 (ANA)'; type = 'Boeing 787-9'; category = 'heavy'; dest = AIRPORTS["HND"]; origin = AIRPORTS["FUK"];
            } else if (cs.startsWith('JAL') || cs.startsWith('JL')) { 
                airline = '日本航空 (JAL)'; type = 'Airbus A350-900'; category = 'heavy'; dest = AIRPORTS["CTS"]; origin = AIRPORTS["HND"];
            } else if (cs.startsWith('SKY')) { 
                airline = 'スカイマーク'; type = 'Boeing 737-800'; category = 'medium'; dest = AIRPORTS["FUK"]; origin = AIRPORTS["HND"];
            } else if (cs.startsWith('APJ')) { 
                airline = 'Peach Aviation'; type = 'Airbus A320neo'; category = 'medium'; dest = AIRPORTS["KIX"]; origin = AIRPORTS["NRT"];
            }

            // 方角に基づく目的地自動補正
            if (heading >= 315 || heading < 45) dest = AIRPORTS["CTS"];
            else if (heading >= 45 && heading < 135) dest = AIRPORTS["HND"];
            else if (heading >= 135 && heading < 225) dest = AIRPORTS["OKA"];
            else if (heading >= 225 && heading < 315) dest = AIRPORTS["FUK"];

            return { airline, type, category, origin, dest };
        }

        // 60FPSでの機体位置補間
        function animatePlanes() {
            flightsData.forEach(f => {
                const speedScale = 0.00000035;
                const rad = (f.heading * Math.PI) / 180;
                f.lat += Math.cos(rad) * f.velocity * speedScale;
                f.lng += Math.sin(rad) * f.velocity * speedScale;

                if (markers[f.icao]) {
                    markers[f.icao].setLatLng([f.lat, f.lng]);
                }
            });

            // LIVE連動：ルート線のリアルタイム描画更新
            if (selectedId && activeRouteLine) {
                const selectedPlane = flightsData.find(f => f.icao === selectedId);
                if (selectedPlane) {
                    const currentPos = [selectedPlane.lat, selectedPlane.lng];
                    const destPos = [selectedPlane.dest.lat, selectedPlane.dest.lng];
                    activeRouteLine.setLatLngs([currentPos, destPos]);
                }
            }

            requestAnimationFrame(animatePlanes);
        }

        function updateUI() {
            updateMapMarkers();
            renderFlightList();
            
            // 緊急機のカウント更新
            const emergencyCount = flightsData.filter(f => f.isEmergency).length;
            const badge = document.getElementById('emergencyBadge');
            if (emergencyCount > 0) {
                badge.innerText = emergencyCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            document.getElementById('emergencyCountText').innerText = `緊急機体(7700等): ${emergencyCount}機`;

            document.getElementById('activeCount').innerText = `${flightsData.length} 機`;
            document.getElementById('updateTimer').innerText = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

            if (selectedId) updateTelemetry(selectedId);
        }

        function updateMapMarkers() {
            const activeIds = new Set(flightsData.map(f => f.icao));

            Object.keys(markers).forEach(id => {
                if (!activeIds.has(id)) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });

            flightsData.forEach(f => {
                const isSelected = f.icao === selectedId;
                const icon = createEnhancedIcon(f, isSelected);

                if (markers[f.icao]) {
                    markers[f.icao].setIcon(icon);
                } else {
                    const marker = L.marker([f.lat, f.lng], { icon: icon }).addTo(map);
                    marker.on('click', () => selectFlight(f.icao));
                    markers[f.icao] = marker;
                }
            });
        }

        // 視認性を高めたダイナミックSVGアイコン
        function createEnhancedIcon(f, isSelected) {
            let color = '#38bdf8'; // 通常（青）
            if (f.altFt < 10000) color = '#10b981'; // 低高度（緑）
            if (f.isEmergency) color = '#ef4444'; // 緊急（赤）
            if (isSelected) color = '#f59e0b'; // 選択中（オレンジ）

            let size = isSelected ? 32 : 24;
            const emergencyClass = f.isEmergency ? 'plane-emergency' : '';

            const svgIcon = `
                <div class="plane-marker-container ${emergencyClass}">
                    <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" style="transform: rotate(${f.heading}deg);" class="plane-icon-body">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                </div>
            `;

            return L.divIcon({
                className: '',
                html: svgIcon,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        function renderFlightList() {
            const container = document.getElementById('flightList');
            const kw = document.getElementById('flightSearch').value.toLowerCase();

            const filtered = flightsData.filter(f => {
                const matchKw = f.callsign.toLowerCase().includes(kw) || 
                                f.airline.toLowerCase().includes(kw) || 
                                f.type.toLowerCase().includes(kw) ||
                                f.dest.name.toLowerCase().includes(kw);
                
                if (!matchKw) return false;
                if (emergencyOnly && !f.isEmergency) return false;
                if (currentFilter === 'jal') return f.callsign.startsWith('JAL') || f.callsign.startsWith('JL');
                if (currentFilter === 'ana') return f.callsign.startsWith('ANA') || f.callsign.startsWith('NH');
                if (currentFilter === '787') return f.type.includes('787');
                if (currentFilter === 'a350') return f.type.includes('A350');
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs">該当する航空機が見つかりません</div>`;
                return;
            }

            container.innerHTML = filtered.map(f => {
                const isSelected = f.icao === selectedId;
                const speedKt = Math.round(f.velocity * 1.94);

                return `
                    <div onclick="selectFlight('${f.icao}')" 
                         class="p-3 hover:bg-slate-800/80 cursor-pointer transition ${isSelected ? 'bg-amber-400/10 border-l-4 border-amber-400' : ''} ${f.isEmergency ? 'bg-red-500/20' : ''}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="mono font-bold text-sm ${f.isEmergency ? 'text-red-400' : 'text-slate-100'}">${f.callsign}</span>
                            ${f.isEmergency ? '<span class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded font-bold animate-pulse">SQ7700</span>' : ''}
                            <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-mono">${f.type}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 flex justify-between">
                            <span>行先: <strong class="text-amber-300">${f.dest.name.split(' ')[0]}</strong></span>
                            <span>高度: <strong class="text-sky-400">${f.altFt.toLocaleString()} ft</strong></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectFlight(id) {
            selectedId = id;
            const f = flightsData.find(x => x.icao === id);
            if (!f) return;

            // 機体を中心にズームイン
            map.flyTo([f.lat, f.lng], 8, { duration: 1.2 });

            // 目的地までの点線（LIVEアニメーション）を描画
            drawRouteLine(f);

            // パネルの表示処理（PC / スマホ切り替え）
            const detailPanel = document.getElementById('detailPanel');
            detailPanel.classList.remove('hidden');

            if (window.innerWidth < 768) {
                closeMobileSheet();
            }

            updateUI();
        }

        // 目的地までのアニメーション点線描画 ＆ 到着予測計算
        function drawRouteLine(f) {
            if (activeRouteLine) map.removeLayer(activeRouteLine);
            if (activeDestMarker) map.removeLayer(activeDestMarker);

            const planePos = [f.lat, f.lng];
            const destPos = [f.dest.lat, f.dest.lng];

            // 点線ルート
            activeRouteLine = L.polyline([planePos, destPos], {
                color: f.isEmergency ? '#ef4444' : '#f59e0b',
                weight: 3,
                opacity: 0.9,
                className: 'route-path-animated'
            }).addTo(map);

            // 目的地空港ピン
            const destIcon = L.divIcon({
                className: '',
                html: `<div class="bg-amber-400 text-slate-950 px-2 py-1 rounded shadow-lg font-bold text-[10px] flex items-center gap-1">
                        <i class="fa-solid fa-location-dot"></i> ${f.dest.name.split(' ')[0]}
                       </div>`,
                iconAnchor: [30, 10]
            });
            activeDestMarker = L.marker(destPos, { icon: destIcon }).addTo(map);
        }

        function updateTelemetry(id) {
            const f = flightsData.find(x => x.icao === id);
            if (!f) return;

            const speedKm = Math.round(f.velocity * 3.6);
            
            // 残り距離および到着予測時間（ETA）の動的計算
            const distanceKm = calculateDistance(f.lat, f.lng, f.dest.lat, f.dest.lng);
            const remainingMinutes = speedKm > 50 ? Math.round((distanceKm / speedKm) * 60) : '--';
            
            let etaTimeStr = '--:--';
            if (remainingMinutes !== '--') {
                const now = new Date();
                now.setMinutes(now.getMinutes() + remainingMinutes);
                etaTimeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            }

            document.getElementById('telemetryDetail').innerHTML = `
                ${f.isEmergency ? `
                    <div class="bg-red-500/20 border border-red-500/50 p-3 rounded-xl flex items-center gap-3 text-red-300 text-xs font-bold animate-pulse">
                        <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                        <div>
                            <p class="text-sm">緊急事態宣言 (Squawk ${f.squawk})</p>
                            <p class="text-[10px] opacity-80">管制塔および優先着陸指示が送信されています</p>
                        </div>
                    </div>
                ` : ''}

                <!-- 便名ヘッダー -->
                <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                    <div>
                        <p class="text-xl font-bold mono text-amber-400">${f.callsign}</p>
                        <p class="text-xs text-slate-300">${f.airline}</p>
                    </div>
                    <span class="text-xs px-2.5 py-1 rounded bg-slate-700 text-slate-200 font-mono">${f.type}</span>
                </div>

                <!-- LIVE 到着予想パネル -->
                <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-3">
                    <div class="flex justify-between items-center text-xs border-b border-slate-800 pb-2">
                        <span class="text-slate-400"><i class="fa-solid fa-plane-departure text-sky-400 mr-1"></i>出発地:</span>
                        <span class="font-bold text-slate-200">${f.origin.name}</span>
                    </div>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400"><i class="fa-solid fa-plane-arrival text-amber-400 mr-1"></i>目的地:</span>
                        <span class="font-bold text-amber-300 text-sm">${f.dest.name}</span>
                    </div>

                    <!-- 進捗バー＆残時間 -->
                    <div class="pt-2">
                        <div class="flex justify-between text-[11px] font-mono text-slate-400 mb-1">
                            <span>残り距離: <strong class="text-slate-200">${Math.round(distanceKm)} km</strong></span>
                            <span>到着予想: <strong class="text-emerald-400">${etaTimeStr}</strong></span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-sky-400 to-amber-400 h-full" style="width: 65%;"></div>
                        </div>
                        <p class="text-right text-[10px] text-amber-400 font-bold mt-1">
                            <i class="fa-regular fa-clock mr-1"></i>あと約 <span class="text-sm font-mono">${remainingMinutes}</span> 分で到着予定
                        </p>
                    </div>
                </div>

                <!-- テレメトリ数値 -->
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-slate-800/40 p-3 rounded-lg border border-slate-800">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">飛行高度</p>
                        <p class="text-lg font-bold mono text-sky-400">${f.altFt.toLocaleString()} <span class="text-xs text-slate-400">ft</span></p>
                    </div>
                    <div class="bg-slate-800/40 p-3 rounded-lg border border-slate-800">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">対地速度</p>
                        <p class="text-lg font-bold mono text-emerald-400">${speedKm} <span class="text-xs text-slate-400">km/h</span></p>
                    </div>
                </div>
            `;
        }

        // 2地点間の距離計算 (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球の半径 km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function closeDetail() {
            selectedId = null;
            document.getElementById('detailPanel').classList.add('hidden');
            if (activeRouteLine) map.removeLayer(activeRouteLine);
            if (activeDestMarker) map.removeLayer(activeDestMarker);
            renderFlightList();
        }

        function filterEmergency() {
            emergencyOnly = !emergencyOnly;
            const btn = document.getElementById('emergencyBtn');
            btn.classList.toggle('bg-red-500', emergencyOnly);
            btn.classList.toggle('text-white', emergencyOnly);
            renderFlightList();
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-slate-950', 'font-bold');
                b.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.add('bg-amber-400', 'text-slate-950', 'font-bold');
            renderFlightList();
        }

        function toggleMobileSheet() {
            const sheet = document.getElementById('sidePanel');
            isMobileSheetOpen = !isMobileSheetOpen;
            if (isMobileSheetOpen) {
                sheet.classList.remove('mobile-sheet-closed');
                sheet.classList.add('mobile-sheet-open');
            } else {
                closeMobileSheet();
            }
        }

        function closeMobileSheet() {
            const sheet = document.getElementById('sidePanel');
            sheet.classList.remove('mobile-sheet-open');
            sheet.classList.add('mobile-sheet-closed');
            isMobileSheetOpen = false;
        }

        window.onload = initApp;
    </script>
</body>
</html>
