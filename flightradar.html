<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlightRadar Ultimate | 日本全国全空港 ＆ フライトレーダー完全版</title>

    <!-- Leaflet & Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow: hidden;
            height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        #map { height: 100%; width: 100%; z-index: 1; }

        @keyframes dash {
            to { stroke-dashoffset: -30; }
        }
        .animated-route {
            stroke-dasharray: 8, 8;
            animation: dash 1s linear infinite;
        }

        .plane-marker {
            transition: transform 0.2s ease-out;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.3));
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        @media (max-width: 768px) {
            .mobile-sheet { transition: transform 0.3s ease-in-out; }
            .mobile-sheet-closed { transform: translateY(calc(100% - 60px)); }
            .mobile-sheet-open { transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">

                <i class="fa-solid fa-plane-departure text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    FlightRadar <span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-mono font-bold">ULIMATE (全空港完全版)</span>
                </h1>
                <p class="text-xs text-slate-500 hidden sm:block">日本全国の全空港（100+箇所）＆リアルタイム機体レーダー</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- ユーザー表示 -->
            <div onclick="openUserModal()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg border border-slate-300 cursor-pointer transition">
                <div id="userAvatarIcon" class="w-6 h-6 rounded-full bg-blue-600 text-white text-xs flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span id="userDisplayName" class="text-xs font-bold text-slate-700 hidden sm:inline">ゲスト</span>
            </div>

            <!-- 地図テーマ切り替え -->
            <select id="mapStyleSelect" onchange="changeMapStyle(this.value)" class="bg-slate-100 border border-slate-300 rounded-lg text-xs font-bold px-2 py-1.5 text-slate-700 focus:outline-none">
                <option value="street">標準マップ</option>
                <option value="dark">ダークモード</option>
                <option value="satellite">衛星写真</option>
            </select>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

        <!-- 左パネル：リスト & 検索 -->
        <aside id="sidePanel" class="mobile-sheet mobile-sheet-closed md:transform-none fixed md:relative bottom-0 left-0 right-0 z-40 w-full md:w-80 h-[80vh] md:h-full bg-white border-t md:border-t-0 md:border-r border-slate-200 flex flex-col shadow-xl">
            
            <div class="md:hidden h-8 bg-slate-100 rounded-t-2xl flex items-center justify-center cursor-pointer border-b border-slate-200" onclick="toggleMobileSheet()">

            </div>

            <!-- タブ切り替え -->
            <div class="flex border-b border-slate-200 bg-slate-50 text-xs font-bold">
                <button onclick="switchTab('flights')" id="tabFlights" class="flex-1 py-3 text-blue-600 border-b-2 border-blue-600 flex justify-center items-center gap-1.5">
                    <i class="fa-solid fa-plane"></i> 航空機 (<span id="flightCountNum">0</span>)
                </button>
                <button onclick="switchTab('airports')" id="tabAirports" class="flex-1 py-3 text-slate-500 hover:text-slate-800 flex justify-center items-center gap-1.5">
                    <i class="fa-solid fa-building-ngo"></i> 日本全国空港 (<span id="airportCountNum">0</span>)
                </button>
            </div>

            <!-- 検索窓（超強力検索） -->
            <div class="p-3 border-b border-slate-200 bg-slate-50 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="便名、航空会社、空港名、IATA/ICAO..."

                    <button onclick="clearSearch()" class="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="flex items-center justify-between text-[11px] text-slate-500 px-1">
                    <span id="searchResultCount">全件表示中</span>
                    <button onclick="resetSearch()" class="text-blue-600 hover:underline font-bold">リセット</button>
                </div>
            </div>

            <!-- リストコンテナ -->
            <div id="listContainer" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-slate-100">
                <div class="p-6 text-center text-slate-400 text-xs">データを読み込んでいます...</div>
            </div>
        </aside>

        <!-- 中央：地図 -->
        <section class="flex-1 relative h-full">
            <div id="map"></div>
        </section>

        <!-- 右パネル：詳細（航空機 or 空港データ） -->

        let map, currentTileLayer, markers = {}, airportMarkers = {};

        let userProfile = { name: "SkyWatcher_77", icon: "fa-user" };

        function initApp() {
            loadUserProfile();
            initMap();
            loadAirports();
            fetchData();
            setInterval(fetchData, CONFIG.REFRESH_INTERVAL);
            requestAnimationFrame(animatePlanes);

            document.getElementById('searchInput').addEventListener('input', renderList);
        }

        function loadUserProfile() {
            const saved = localStorage.getItem('flightradar_user_profile');
            if (saved) {
                try { userProfile = JSON.parse(saved); } catch(e){}
            }
            applyUserProfileUI();
        }

        function applyUserProfileUI() {
            document.getElementById('userDisplayName').innerText = userProfile.name;
            document.getElementById('userAvatarIcon').innerHTML = `<i class="fa-solid ${userProfile.icon}"></i>`;
            document.getElementById('usernameInput').value = userProfile.name;
        }

        function openUserModal() { document.getElementById('userModal').classList.remove('hidden'); }
        function closeUserModal() { document.getElementById('userModal').classList.add('hidden'); }
        function setAvatarIcon(cls) { userProfile.icon = cls; document.getElementById('userAvatarIcon').innerHTML = `<i class="fa-solid ${cls}"></i>`; }
        function saveUserProfile() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val) userProfile.name = val;
            localStorage.setItem('flightradar_user_profile', JSON.stringify(userProfile));
            applyUserProfileUI();
            closeUserModal();
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([36.2048, 138.2529], 6);
            changeMapStyle('street');
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            map.on('click', (e) => {
                if (e.originalEvent.target.id === 'map') closeDetail();
            });
        }

        function changeMapStyle(style) {
            if (currentTileLayer) map.removeLayer(currentTileLayer);
            let url = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
            if (style === 'dark') url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
            else if (style === 'satellite') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            currentTileLayer = L.tileLayer(url, { maxZoom: 18 }).addTo(map);
        }

        // 日本全国空港の完全ロード（API + フォールバック合体で確実かつ大量に表示）
        async function loadAirports() {
            airportsData = [...FALLBACK_AIRPORTS];
            try {
                const res = await fetch(CONFIG.OVERPASS_AIRPORTS_URL);
                const data = await res.json();
                if (data && data.elements) {
                    const apiAirports = data.elements
                        .filter(el => el.tags && (el.tags.name || el.tags["name:ja"] || el.tags.iata))
                        .map(el => ({
                            id: 'osm_' + el.id,
                            name: el.tags["name:ja"] || el.tags.name || el.tags["name:en"] || "空港",
                            iata: el.tags.iata || "N/A",
                            icao: el.tags.icao || "N/A",
                            lat: el.lat,
                            lng: el.lon,
                            ele: el.tags.ele ? el.tags.ele + 'm' : "不明"
                        }));
                    
                    // 既存リストにないAPI空港を追加（重複排除）
                    apiAirports.forEach(ap => {
                        if (!airportsData.some(existing => existing.iata === ap.iata && ap.iata !== 'N/A')) {
                            airportsData.push(ap);
                        }
                    });
                }
            } catch (e) {
                console.warn("Overpass APIの動的取得がブロックされました。包括的内蔵データベースを使用します。");
            }
            renderAirportPins();
            renderList();
        }

        function renderAirportPins() {
            // 既存マーカークリア
            Object.values(airportMarkers).forEach(m => map.removeLayer(m));
            airportMarkers = {};

            airportsData.forEach(ap => {
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="bg-slate-800 text-white font-bold text-[10px] px-1.5 py-0.5 rounded shadow border border-slate-600 flex items-center gap-1 hover:scale-110 transition cursor-pointer">
                            <i class="fa-solid fa-building-ngo text-amber-400"></i> ${ap.iata !== 'N/A' ? ap.iata : ap.name.substring(0, 3)}
                           </div>`,
                    iconSize: [45, 20]
                });

                const marker = L.marker([ap.lat, ap.lng], { icon: icon }).addTo(map);
                marker.on('click', () => selectAirport(ap));
                airportMarkers[ap.id] = marker;
            });
            document.getElementById('airportCountNum').innerText = airportsData.length;
        }

        async function fetchData() {
            try {
                const res = await fetch(CONFIG.WORKER_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.states) {
                        flightsData = data.states
                            .filter(s => s[5] !== null && s[6] !== null)
                            .map(s => parseAircraft(s));
                        
                        updateUI();
                    }
                }
            } catch (e) {
                console.warn("データ更新失敗:", e);
            }
        }

        function parseAircraft(s) {
            const icao = (s[0] || '').toUpperCase();
            const callsign = (s[1] || '').trim() || `ICAO-${icao}`;
            const country = s[2] || '不明';
            const lng = s[5];
            const lat = s[6];
            const altM = s[7] || 0;
            const altFt = Math.round(altM * 3.28084);
            const velocityMs = s[9] || 0;
            const velocityKmh = Math.round(velocityMs * 3.6);
            const velocityKt = Math.round(velocityMs * 1.94384);
            const heading = Math.round(s[10] || 0);
            const verticalRate = s[11] ? Math.round(s[11] * 196.85) : 0;
            const squawk = s[14] || '1200';
            const isEmergency = ['7700', '7600', '7500'].includes(squawk);

            const airlineInfo = getAirlineInfo(callsign);
            const flightRoute = estimateFlightRoute(callsign, heading, lat, lng);

            return {
                icao, callsign, country, lat, lng,
                altFt, altM, velocityKmh, velocityKt, heading, verticalRate, squawk, isEmergency,
                airline: airlineInfo.name,
                color: airlineInfo.color,
                type: flightRoute.aircraftType,
                origin: flightRoute.origin,
                dest: flightRoute.dest
            };
        }

        function getAirlineInfo(callsign) {
            const prefix = callsign.substring(0, 3).toUpperCase();
            if (AIRLINE_MAP[prefix]) return AIRLINE_MAP[prefix];
            if (callsign.startsWith('JL')) return AIRLINE_MAP['JAL'];
            if (callsign.startsWith('NH')) return AIRLINE_MAP['ANA'];
            return { name: '一般民間機 / ビジネスジェット', color: '#0284c7' };
        }

        function estimateFlightRoute(callsign, heading, lat, lng) {
            let aircraftType = 'Boeing 737-800';
            let origin = { name: "大阪(伊丹)", lat: 34.7855, lng: 135.4382, code: "ITM" };
            let dest = { name: "東京(羽田)", lat: 35.5494, lng: 139.7798, code: "HND" };

            const cs = callsign.toUpperCase();
            if (cs.includes('ANA') || cs.includes('NH')) aircraftType = 'Boeing 787-9';
            if (cs.includes('JAL') || cs.includes('JL')) aircraftType = 'Airbus A350-900';
            if (cs.includes('APJ') || cs.includes('JJP')) aircraftType = 'Airbus A320neo';

            if (heading >= 315 || heading < 45) {
                origin = { name: "東京(羽田)", lat: 35.5494, lng: 139.7798, code: "HND" };
                dest = { name: "札幌(新千歳)", lat: 42.7752, lng: 141.6923, code: "CTS" };
            } else if (heading >= 135 && heading < 225) {
                origin = { name: "東京(羽田)", lat: 35.5494, lng: 139.7798, code: "HND" };
                dest = { name: "沖縄(那覇)", lat: 26.1958, lng: 127.6458, code: "OKA" };
            } else if (heading >= 225 && heading < 315) {
                origin = { name: "東京(羽田)", lat: 35.5494, lng: 139.7798, code: "HND" };
                dest = { name: "福岡", lat: 33.5859, lng: 130.4507, code: "FUK" };
            }

            return { aircraftType, origin, dest };
        }

        function animatePlanes() {
            flightsData.forEach(f => {
                const speedScale = 0.0000003;
                const rad = (f.heading * Math.PI) / 180;
                f.lat += Math.cos(rad) * (f.velocityKmh / 3.6) * speedScale;
                f.lng += Math.sin(rad) * (f.velocityKmh / 3.6) * speedScale;

                if (markers[f.icao]) {
                    markers[f.icao].setLatLng([f.lat, f.lng]);
                }
            });

            if (selectedId && routePolyline) {
                const f = flightsData.find(x => x.icao === selectedId);
                if (f) {
                    routePolyline.setLatLngs([
                        [f.origin.lat, f.origin.lng],
                        [f.lat, f.lng],
                        [f.dest.lat, f.dest.lng]
                    ]);
                }
            }

            requestAnimationFrame(animatePlanes);
        }

        function updateUI() {
            updateMapMarkers();
            renderList();
            document.getElementById('flightCountNum').innerText = flightsData.length;

            if (selectedId) updateAircraftDetailPanel(selectedId);
        }

        function updateMapMarkers() {
            const activeIds = new Set(flightsData.map(f => f.icao));

            Object.keys(markers).forEach(id => {
                if (!activeIds.has(id)) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });

            flightsData.forEach(f => {
                const isSelected = f.icao === selectedId;
                const icon = createPlaneIcon(f, isSelected);

                if (markers[f.icao]) {
                    markers[f.icao].setIcon(icon);
                } else {
                    const marker = L.marker([f.lat, f.lng], { icon: icon }).addTo(map);
                    marker.on('click', () => selectFlight(f.icao));
                    markers[f.icao] = marker;
                }
            });
        }

        function createPlaneIcon(f, isSelected) {
            const color = isSelected ? '#f59e0b' : (f.isEmergency ? '#ef4444' : f.color);
            const size = isSelected ? 34 : 26;

            const html = `
                <div class="plane-marker" style="transform: rotate(${f.heading}deg); width:${size}px; height:${size}px;">
                    <svg viewBox="0 0 24 24" fill="${color}">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                </div>
            `;

            return L.divIcon({
                className: '',
                html: html,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        // 超強力な検索・フィルタリング処理
        function renderList() {
            const container = document.getElementById('listContainer');
            const kw = document.getElementById('searchInput').value.toLowerCase().trim();

            if (currentTab === 'flights') {
                const filtered = flightsData.filter(f => 
                    f.callsign.toLowerCase().includes(kw) || 
                    f.airline.toLowerCase().includes(kw) || 
                    f.type.toLowerCase().includes(kw) ||
                    f.origin.name.toLowerCase().includes(kw) ||
                    f.dest.name.toLowerCase().includes(kw) ||
                    f.icao.toLowerCase().includes(kw)
                );

                document.getElementById('searchResultCount').innerText = `${filtered.length} 機ヒット`;

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs">該当する航空機は見つかりませんでした</div>`;
                    return;
                }

                container.innerHTML = filtered.map(f => `
                    <div onclick="selectFlight('${f.icao}')" class="p-3.5 hover:bg-blue-50/60 cursor-pointer transition flex items-center justify-between ${f.icao === selectedId ? 'bg-blue-50 border-l-4 border-blue-600' : ''}">
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="mono font-bold text-sm text-slate-900">${f.callsign}</span>
                                <span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 border border-slate-200">${f.type}</span>
                            </div>
                            <p class="text-xs font-bold text-blue-600 mb-1">${f.airline}</p>
                            <p class="text-[11px] text-slate-500">
                                ${f.origin.name} ➔ <strong class="text-slate-800">${f.dest.name}</strong>
                            </p>
                        </div>
                        <div class="text-right font-mono text-xs">
                            <div class="font-bold text-slate-700">${f.altFt.toLocaleString()} ft</div>
                            <div class="text-[10px] text-slate-400">${f.velocityKmh} km/h</div>
                        </div>
                    </div>
                `).join('');
            } else {
                const filtered = airportsData.filter(a => 
                    a.name.toLowerCase().includes(kw) || 
                    a.iata.toLowerCase().includes(kw) || 
                    a.icao.toLowerCase().includes(kw)
                );

                document.getElementById('searchResultCount').innerText = `${filtered.length} 空港ヒット`;

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs">該当する空港は見つかりませんでした</div>`;
                    return;
                }

                container.innerHTML = filtered.map(a => `
                    <div onclick="selectAirport(${JSON.stringify(a).replace(/"/g, '&quot;')})" class="p-3.5 hover:bg-slate-50 cursor-pointer transition flex justify-between items-center ${selectedAirportCode === a.iata ? 'bg-amber-50 border-l-4 border-amber-500' : ''}">
                        <div>
                            <div class="font-bold text-xs text-slate-800">${a.name}</div>
                            <p class="text-[11px] font-mono text-slate-500">IATA: <strong class="text-blue-600">${a.iata}</strong> | ICAO: ${a.icao}</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                    </div>
                `).join('');
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderList();
        }

        function resetSearch() {
            clearSearch();
        }

        function selectFlight(icao) {
            selectedId = icao;
            selectedAirportCode = null;
            const f = flightsData.find(x => x.icao === icao);
            if (!f) return;

            drawFlightRoute(f);

            const bounds = L.latLngBounds([
                [f.origin.lat, f.origin.lng],
                [f.lat, f.lng],
                [f.dest.lat, f.dest.lng]
            ]);
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 9, animate: true });

            document.getElementById('detailPanel').classList.remove('hidden');
            updateAircraftDetailPanel(icao);
            updateUI();
        }

        function drawFlightRoute(f) {
            clearRoute();

            routePolyline = L.polyline([
                [f.origin.lat, f.origin.lng],
                [f.lat, f.lng],
                [f.dest.lat, f.dest.lng]
            ], {
                color: '#2563eb',
                weight: 4,
                opacity: 0.8,
                dashArray: '8, 8',
                className: 'animated-route'
            }).addTo(map);

            routeOriginMarker = L.marker([f.origin.lat, f.origin.lng], {
                icon: L.divIcon({
                    className: '',
                    html: `<div class="bg-slate-800 text-white font-bold text-[10px] px-2 py-1 rounded shadow-lg border border-white">
                            🛫 出発: ${f.origin.name}
                           </div>`,
                    iconAnchor: [40, 10]
                })
            }).addTo(map);

            routeDestMarker = L.marker([f.dest.lat, f.dest.lng], {
                icon: L.divIcon({
                    className: '',
                    html: `<div class="bg-blue-600 text-white font-bold text-[10px] px-2 py-1 rounded shadow-lg border border-white">
                            🛬 到着: ${f.dest.name}
                           </div>`,
                    iconAnchor: [40, 10]
                })
            }).addTo(map);
        }

        function clearRoute() {
            if (routePolyline) map.removeLayer(routePolyline);
            if (routeOriginMarker) map.removeLayer(routeOriginMarker);
            if (routeDestMarker) map.removeLayer(routeDestMarker);
        }

        function updateAircraftDetailPanel(icao) {
            const f = flightsData.find(x => x.icao === icao);
            if (!f) return;

            document.getElementById('detailPanelTitle').innerHTML = `<i class="fa-solid fa-plane text-blue-600"></i> 機体詳細データ`;

            const distKm = Math.round(calculateDistance(f.lat, f.lng, f.dest.lat, f.dest.lng));
            const remainMins = f.velocityKmh > 50 ? Math.round((distKm / f.velocityKmh) * 60) : '--';

            document.getElementById('detailContent').innerHTML = `
                <div class="bg-slate-900 text-white p-4 rounded-xl shadow-lg space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-blue-400">${f.airline}</span>
                        <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded font-mono text-slate-300">ICAO: ${f.icao}</span>
                    </div>
                    <div class="text-2xl font-bold mono tracking-wide">${f.callsign}</div>
                    <div class="text-xs text-slate-300 font-medium">${f.type}</div>
                </div>

                <div class="bg-blue-50 border border-blue-200 p-3.5 rounded-xl space-y-2">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-700">
                        <span>${f.origin.name} (${f.origin.code})</span>
                        <i class="fa-solid fa-arrow-right text-blue-600"></i>
                        <span class="text-blue-700">${f.dest.name} (${f.dest.code})</span>
                    </div>
                    <div class="flex justify-between text-[11px] font-mono text-slate-600 pt-1 border-t border-blue-200/60">
                        <span>残り距離: <strong>${distKm} km</strong></span>
                        <span>残り時間目安: <strong class="text-blue-700">${remainMins}分</strong></span>
                    </div>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-slate-500 uppercase">飛行テレメトリ全データ</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                            <p class="text-[10px] text-slate-400 font-sans font-bold">高度 (Altitude)</p>
                            <p class="text-sm font-bold text-slate-800">${f.altFt.toLocaleString()} ft</p>
                            <p class="text-[10px] text-slate-500">(${f.altM.toLocaleString()} m)</p>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                            <p class="text-[10px] text-slate-400 font-sans font-bold">対地速度 (Speed)</p>
                            <p class="text-sm font-bold text-slate-800">${f.velocityKmh} km/h</p>
                            <p class="text-[10px] text-slate-500">(${f.velocityKt} kt)</p>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                            <p class="text-[10px] text-slate-400 font-sans font-bold">進行方位 (Heading)</p>
                            <p class="text-sm font-bold text-slate-800">${f.heading}°</p>
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                            <p class="text-[10px] text-slate-400 font-sans font-bold">昇降率 (Vertical Rate)</p>
                            <p class="text-sm font-bold ${f.verticalRate > 0 ? 'text-emerald-600' : 'text-slate-800'}">${f.verticalRate} ft/min</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 空港タップ時：詳細データ＋周辺50km以内の機体リスト
        function selectAirport(ap) {
            selectedAirportCode = ap.iata !== 'N/A' ? ap.iata : ap.icao;
            selectedId = null;
            clearRoute();

            map.flyTo([ap.lat, ap.lng], 11, { duration: 1.5 });

            const nearbyPlanes = flightsData.filter(f => calculateDistance(f.lat, f.lng, ap.lat, ap.lng) <= 50);

            document.getElementById('detailPanel').classList.remove('hidden');
            document.getElementById('detailPanelTitle').innerHTML = `<i class="fa-solid fa-building-ngo text-amber-500"></i> 空港詳細データ`;

            document.getElementById('detailContent').innerHTML = `
                <div class="bg-slate-900 text-white p-4 rounded-xl shadow-lg space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-amber-400">AIRPORT DATA</span>
                        <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded font-mono text-slate-300">IATA: ${ap.iata}</span>
                    </div>
                    <div class="text-xl font-bold text-white">${ap.name}</div>
                    <div class="text-xs text-slate-400 font-mono">ICAO Code: ${ap.icao}</div>
                </div>

                <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                        <p class="text-[10px] text-slate-400 font-sans font-bold">緯度 (Latitude)</p>
                        <p class="text-xs font-bold text-slate-800">${ap.lat.toFixed(4)}°</p>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                        <p class="text-[10px] text-slate-400 font-sans font-bold">経度 (Longitude)</p>
                        <p class="text-xs font-bold text-slate-800">${ap.lng.toFixed(4)}°</p>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                        <p class="text-[10px] text-slate-400 font-sans font-bold">標高 (Elevation)</p>
                        <p class="text-xs font-bold text-slate-800">${ap.ele}</p>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-lg">
                        <p class="text-[10px] text-slate-400 font-sans font-bold">周辺（50km）機体数</p>
                        <p class="text-xs font-bold text-blue-600">${nearbyPlanes.length} 機</p>
                    </div>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-slate-500 uppercase">周辺上空を飛行中の航空機</h3>
                    <div class="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar">
                        ${nearbyPlanes.length === 0 ? '<p class="text-xs text-slate-400 p-2">現在周辺に機体はありません</p>' : 
                            nearbyPlanes.map(p => `
                                <div onclick="selectFlight('${p.icao}')" class="p-2 bg-slate-50 border border-slate-200 rounded-lg hover:bg-blue-50 cursor-pointer flex justify-between items-center text-xs">
                                    <div>
                                        <div class="font-bold font-mono text-slate-800">${p.callsign}</div>
                                        <div class="text-[10px] text-blue-600 font-bold">${p.airline}</div>
                                    </div>
                                    <div class="text-right font-mono text-[11px] text-slate-600">
                                        <div>${p.altFt.toLocaleString()} ft</div>
                                        <div>${p.velocityKmh} km/h</div>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabFlights').className = `flex-1 py-3 font-bold flex justify-center items-center gap-1.5 ${tab === 'flights' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-800'}`;
            document.getElementById('tabAirports').className = `flex-1 py-3 font-bold flex justify-center items-center gap-1.5 ${tab === 'airports' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-800'}`;
            renderList();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function closeDetail() {
            selectedId = null;
            selectedAirportCode = null;
            clearRoute();
            document.getElementById('detailPanel').classList.add('hidden');
            renderList();
        }

        function toggleMobileSheet() {
            document.getElementById('sidePanel').classList.toggle('mobile-sheet-open');
            document.getElementById('sidePanel').classList.toggle('mobile-sheet-closed');
        }

        window.onload = initApp;
    </script>
</body>
