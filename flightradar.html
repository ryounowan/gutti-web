<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightRadar Pro | リアルタイム航空機追跡</title>

    <!-- CSS & External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        #map {
            height: 100%;
            width: 100%;
            background: #090d16;
            z-index: 1;
        }

        .plane-icon {
            transition: transform 0.1s linear;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .chart-container { position: relative; width: 100%; height: 120px; }

        .airport-marker {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid #38bdf8;
            border-radius: 50%;
            color: #38bdf8;
            text-align: center;
            line-height: 18px;
            font-size: 10px;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">

    <!-- ヘッダーバー -->
    <header class="h-16 flex items-center justify-between px-5 bg-slate-900/95 border-b border-slate-800 z-50 shadow-xl backdrop-blur">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-400 p-2.5 rounded-xl text-slate-950 shadow-lg shadow-amber-400/20 font-bold">
                <i class="fa-solid fa-plane-up text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-wide text-white flex items-center gap-2">
                    FlightRadar <span class="bg-amber-400/20 text-amber-400 text-xs px-2 py-0.5 rounded-full border border-amber-400/30 font-mono">LIVE ADS-B</span>
                </h1>
                <p class="text-xs text-slate-400">日本上空 航空機リアルタイム追跡システム</p>
            </div>
        </div>

        <!-- コントロールバー -->
        <div class="flex items-center space-x-4">
            <!-- マップスタイル切替 -->
            <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs">
                <i class="fa-solid fa-layer-group text-amber-400 mx-2"></i>
                <select id="mapStyleSelect" onchange="changeMapStyle(this.value)" class="bg-transparent text-slate-200 font-medium focus:outline-none cursor-pointer">
                    <option value="dark" class="bg-slate-900">ダーク (Flightradar24風)</option>
                    <option value="satellite" class="bg-slate-900">衛星写真 (Satellite)</option>
                    <option value="street" class="bg-slate-900">ライト (Light Map)</option>
                    <option value="topo" class="bg-slate-900">地形図 (Terrain)</option>
                </select>
            </div>

            <button onclick="exportCSV()" title="CSV形式で出力" class="p-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-download text-sm"></i>
            </button>

            <!-- ステータス指示器 -->
            <div class="text-right pl-2 border-l border-slate-800">
                <p id="apiSourceLabel" class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">ADS-B LIVE 接続中</p>
                <div class="flex items-center justify-end space-x-2">
                    <span id="updateTimer" class="text-xs font-mono text-slate-300">--:--:--</span>
                    <span class="relative flex h-2.5 w-2.5">
                        <span id="statusPulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span id="statusDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- 左サイドバー：フライト検索 ＆ リスト -->
        <aside class="w-80 flex flex-col bg-slate-900 border-r border-slate-800 z-40">
            <div class="p-4 border-b border-slate-800 space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="text" id="flightSearch" placeholder="便名、航空会社、ICAOで検索..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-amber-400 transition placeholder-slate-500">
                </div>

                <div class="flex gap-1 overflow-x-auto pb-1 text-[11px] custom-scrollbar">
                    <button onclick="setFilter('all')" class="filter-btn active px-2.5 py-1 rounded-md bg-amber-400 text-slate-950 font-bold whitespace-nowrap">すべて</button>
                    <button onclick="setFilter('jal')" class="filter-btn px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap">JAL</button>
                    <button onclick="setFilter('ana')" class="filter-btn px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap">ANA</button>
                    <button onclick="setFilter('lcc')" class="filter-btn px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 whitespace-nowrap">LCC/他</button>
                </div>
            </div>

            <!-- フライト一覧 -->
            <div id="flightList" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-slate-800/60">
                <div class="p-8 text-center text-slate-500 space-y-2">
                    <i class="fa-solid fa-circle-notch animate-spin text-2xl text-amber-400"></i>
                    <p class="text-xs">ライブデータ受信中...</p>
                </div>
            </div>

            <div class="p-3 bg-slate-950/90 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span>捕捉中の航空機:</span>
                <span id="activeCount" class="text-amber-400 font-mono font-bold text-sm">0 機</span>
            </div>
        </aside>

        <!-- 中央：インタラクティブマップ -->
        <section class="flex-1 relative">
            <div id="map"></div>

            <!-- 高度・凡例 -->
            <div class="absolute bottom-6 left-6 z-10 glass-panel p-3.5 rounded-xl shadow-2xl max-w-xs text-xs space-y-2">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">FlightAware レーダー凡例</p>
                <div class="grid grid-cols-2 gap-2 text-[11px]">
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> <span>低高度 (&lt;10k ft)</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span> <span>中高度 (10-25k ft)</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> <span>高高度 (&gt;25k ft)</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 ring-2 ring-amber-400/50"></span> <span>選択中の機体</span></div>
                </div>
            </div>
        </section>

        <!-- 右サイドバー：機体詳細（FlightAwareスタイル）＆ 統計 -->
        <aside class="w-96 flex flex-col bg-slate-900 border-l border-slate-800 z-40 overflow-y-auto custom-scrollbar">
            <div class="p-5 border-b border-slate-800">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-radar text-amber-400"></i> テレメトリ情報
                    </h2>
                    <button id="followToggleBtn" onclick="toggleFollow()" class="hidden text-[11px] px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                        <i class="fa-solid fa-location-crosshairs mr-1"></i> カメラ追従
                    </button>
                </div>

                <div id="telemetryDetail">
                    <div class="p-8 text-center text-slate-500 rounded-xl bg-slate-800/30 border border-dashed border-slate-800">
                        <i class="fa-solid fa-plane-slash text-3xl mb-2 opacity-30"></i>
                        <p class="text-xs">マップ上のアイコンまたはリストを選択すると詳細が表示されます</p>
                    </div>
                </div>
            </div>

            <!-- リアルタイム統計分析 -->
            <div class="p-5 space-y-5">
                <section>
                    <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">高度帯別分布 (ft)</h3>
                    <div class="chart-container"><canvas id="altitudeChart"></canvas></div>
                </section>
                <section class="pt-3 border-t border-slate-800">
                    <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">速度分布 (km/h)</h3>
                    <div class="chart-container"><canvas id="velocityChart"></canvas></div>
                </section>
                <section class="pt-3 border-t border-slate-800">
                    <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">検出航空会社シェア</h3>
                    <div class="chart-container" style="height: 140px;"><canvas id="airlineChart"></canvas></div>
                </section>
            </div>
        </aside>

    </main>

    <script>
        const CONFIG = {
            WORKER_URL: 'https://bitter-wildflower-c641.ryounowan.workers.dev/',
            REFRESH_INTERVAL: 8000,
        };

        // 主要・地方空港データベース
        const AIRPORTS = [
            { name: "羽田 (HND)", lat: 35.5494, lng: 139.7798 },
            { name: "成田 (NRT)", lat: 35.7647, lng: 140.3863 },
            { name: "関西 (KIX)", lat: 34.4320, lng: 135.2304 },
            { name: "伊丹 (ITM)", lat: 34.7855, lng: 135.4382 },
            { name: "中部 (NGO)", lat: 34.8584, lng: 136.8054 },
            { name: "新千歳 (CTS)", lat: 42.7752, lng: 141.6923 },
            { name: "福岡 (FUK)", lat: 33.5859, lng: 130.4507 },
            { name: "那覇 (OKA)", lat: 26.1958, lng: 127.6458 },
            { name: "仙台 (SDJ)", lat: 38.1397, lng: 140.9169 },
            { name: "広島 (HIJ)", lat: 34.4361, lng: 132.9194 },
            { name: "高松 (TAK)", lat: 34.2142, lng: 134.0156 },
            { name: "松山 (MYJ)", lat: 33.8272, lng: 132.7297 },
            { name: "熊本 (KMJ)", lat: 32.8372, lng: 130.8550 },
            { name: "鹿児島 (KOJ)", lat: 31.8034, lng: 130.7194 },
            { name: "石垣 (ISG)", lat: 24.3964, lng: 124.2450 }
        ];

        let map, currentTileLayer, markers = {}, airportMarkers = [];
        let flightsData = [], selectedId = null, trailPath = null;
        let altChart, velChart, airlineChart;
        let currentFilter = 'all', followSelected = false;
        let flightHistories = {};

        function initApp() {
            initMap();
            renderAirports();
            initCharts();
            fetchData();
            
            setInterval(fetchData, CONFIG.REFRESH_INTERVAL);
            requestAnimationFrame(animatePlanes);

            document.getElementById('flightSearch').addEventListener('input', renderFlightList);
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([36.2048, 138.2529], 6);
            changeMapStyle('dark');
            L.control.zoom({ position: 'topright' }).addTo(map);
            trailPath = L.polyline([], { color: '#f59e0b', weight: 3, dashArray: '6, 8', opacity: 0.85 }).addTo(map);
        }

        function changeMapStyle(style) {
            if (currentTileLayer) map.removeLayer(currentTileLayer);

            let url = '';
            if (style === 'dark') url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
            else if (style === 'street') url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            else if (style === 'satellite') url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
            else if (style === 'topo') url = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';

            currentTileLayer = L.tileLayer(url, { attribution: '&copy; FlightRadar Pro' }).addTo(map);
        }

        function renderAirports() {
            AIRPORTS.forEach(ap => {
                const icon = L.divIcon({
                    className: 'airport-marker',
                    html: `<i class="fa-solid fa-plane-arrival"></i>`,
                    iconSize: [18, 18]
                });
                const m = L.marker([ap.lat, ap.lng], { icon: icon }).addTo(map);
                m.bindTooltip(`<b>${ap.name}</b>`, { direction: 'top', offset: [0, -10] });
                m.on('click', () => map.flyTo([ap.lat, ap.lng], 10));
                airportMarkers.push(m);
            });
        }

        function initCharts() {
            const commonOpt = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#64748b' } },
                    y: { grid: { color: '#1e293b' }, ticks: { font: { size: 9 }, color: '#64748b' } }
                }
            };

            altChart = new Chart(document.getElementById('altitudeChart'), {
                type: 'bar',
                data: { labels: ['0-10k', '10-20k', '20-30k', '30-40k', '40k+'], datasets: [{ backgroundColor: '#38bdf8', borderRadius: 4, data: [0,0,0,0,0] }] },
                options: commonOpt
            });

            velChart = new Chart(document.getElementById('velocityChart'), {
                type: 'line',
                data: { labels: ['低速', '中速', '高速', '巡航', '最高速'], datasets: [{ borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.4, data: [0,0,0,0,0] }] },
                options: commonOpt
            });

            airlineChart = new Chart(document.getElementById('airlineChart'), {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#6366f1', '#ef4444'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { size: 9 }, color: '#94a3b8' } } } }
            });
        }

        async function fetchData() {
            try {
                const res = await fetch(CONFIG.WORKER_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.states && data.states.length > 0) {
                        flightsData = data.states
                            .filter(s => s[5] !== null && s[6] !== null)
                            .map(s => parseAircraft(s));
                        
                        setOnlineStatus(true, "ADS-B LIVE (正常)");
                        updateUI();
                    }
                }
            } catch (e) {
                console.warn("API Connection Error:", e);
                setOnlineStatus(false, "通信一時途絶 (再接続中)");
            }
        }

        function parseAircraft(s) {
            const icao = s[0] || Math.random().toString(36).substring(7);
            const callsign = (s[1] || '').trim() || `ICAO-${icao.toUpperCase()}`;
            const lng = s[5];
            const lat = s[6];
            const altM = s[7] || 0;
            const altFt = altM * 3.28084;
            const velocity = s[9] || 0;
            const heading = s[10] || 0;
            const meta = getModelAndAirlineMeta(callsign, heading);

            return {
                icao, callsign, lat, lng,
                alt: altM, altFt, velocity, heading,
                verticalRate: s[11] || 0,
                airline: meta.airline,
                type: meta.type,
                modelCategory: meta.category,
                route: meta.route
            };
        }

        function getModelAndAirlineMeta(callsign, heading) {
            let airline = 'その他 / 民間機';
            let type = 'Boeing 737-800';
            let category = 'medium';

            const cs = callsign.toUpperCase();
            if (cs.startsWith('ANA') || cs.startsWith('NH')) { 
                airline = '全日本空輸 (ANA)'; type = 'Boeing 787-9'; category = 'heavy'; 
            } else if (cs.startsWith('JAL') || cs.startsWith('JL')) { 
                airline = '日本航空 (JAL)'; type = 'Airbus A350-900'; category = 'heavy'; 
            } else if (cs.startsWith('SKY') || cs.startsWith('BC')) { 
                airline = 'スカイマーク'; type = 'Boeing 737-800'; category = 'medium'; 
            } else if (cs.startsWith('APJ') || cs.startsWith('MM')) { 
                airline = 'Peach Aviation'; type = 'Airbus A320neo'; category = 'medium'; 
            } else if (cs.startsWith('FDA')) { 
                airline = 'フジドリーム'; type = 'Embraer E175'; category = 'regional'; 
            } else if (cs.startsWith('ANK') || cs.startsWith('RAC')) { 
                airline = '琉球エアーコミューター'; type = 'DHC-8-Q400'; category = 'prop'; 
            } else if (cs.startsWith('JA')) { 
                airline = '小型機 / ヘリ'; type = 'BK117 Helicopter'; category = 'heli'; 
            }

            let route = '羽田(HND) ✈ 関西(KIX)';
            if (heading >= 315 || heading < 45) route = '東京(HND) ✈ 札幌(CTS)';
            else if (heading >= 45 && heading < 135) route = '福岡(FUK) ✈ 東京(HND)';
            else if (heading >= 135 && heading < 225) route = '東京(HND) ✈ 那覇(OKA)';

            return { airline, type, category, route };
        }

        // 60FPS 推進アニメーション補間
        function animatePlanes() {
            flightsData.forEach(f => {
                const speedScale = 0.0000004;
                const rad = (f.heading * Math.PI) / 180;
                f.lat += Math.cos(rad) * f.velocity * speedScale;
                f.lng += Math.sin(rad) * f.velocity * speedScale;

                if (markers[f.icao]) {
                    markers[f.icao].setLatLng([f.lat, f.lng]);
                }
            });

            if (selectedId && followSelected && markers[selectedId]) {
                map.panTo(markers[selectedId].getLatLng(), { animate: false });
            }

            requestAnimationFrame(animatePlanes);
        }

        function updateUI() {
            updateMapMarkers();
            renderFlightList();
            if (selectedId) {
                updateTelemetry(selectedId);
                updateFlightTrail(selectedId);
            }
            updateCharts();
            document.getElementById('activeCount').innerText = `${flightsData.length} 機`;
            document.getElementById('updateTimer').innerText = new Date().toLocaleTimeString('ja-JP');
        }

        function updateMapMarkers() {
            const activeIds = new Set(flightsData.map(f => f.icao));

            Object.keys(markers).forEach(id => {
                if (!activeIds.has(id)) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });

            flightsData.forEach(f => {
                if (!flightHistories[f.icao]) flightHistories[f.icao] = [];
                flightHistories[f.icao].push([f.lat, f.lng]);
                if (flightHistories[f.icao].length > 20) flightHistories[f.icao].shift();

                const isSelected = f.icao === selectedId;
                const altFt = f.altFt || (f.alt * 3.28);

                let color = '#38bdf8'; 
                if (altFt < 10000) color = '#10b981'; 
                else if (altFt > 25000) color = '#818cf8'; 
                if (isSelected) color = '#f59e0b';

                const icon = createPlaneIcon(f.heading, color, isSelected, f.modelCategory);

                if (markers[f.icao]) {
                    markers[f.icao].setIcon(icon);
                } else {
                    const marker = L.marker([f.lat, f.lng], { icon: icon }).addTo(map);
                    marker.on('click', () => selectFlight(f.icao));
                    markers[f.icao] = marker;
                }
            });
        }

        function createPlaneIcon(heading, color, isSelected, category) {
            let iconClass = 'fa-plane';
            let size = 22;

            if (category === 'heavy') { iconClass = 'fa-plane-departure'; size = 26; }
            else if (category === 'prop') { iconClass = 'fa-plane-up'; size = 20; }
            else if (category === 'heli') { iconClass = 'fa-helicopter'; size = 18; }

            if (isSelected) size += 8;
            const glow = isSelected ? 'filter: drop-shadow(0 0 10px #f59e0b);' : '';

            return L.divIcon({
                className: 'plane-icon',
                html: `<div style="transform: rotate(${heading}deg); color: ${color}; font-size: ${size}px; ${glow}">
                        <i class="fa-solid ${iconClass}"></i>
                       </div>`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        function renderFlightList() {
            const container = document.getElementById('flightList');
            const kw = document.getElementById('flightSearch').value.toLowerCase();

            const filtered = flightsData.filter(f => {
                const matchKw = f.callsign.toLowerCase().includes(kw) || f.airline.toLowerCase().includes(kw) || f.type.toLowerCase().includes(kw);
                if (!matchKw) return false;
                if (currentFilter === 'jal') return f.callsign.startsWith('JAL') || f.callsign.startsWith('JL');
                if (currentFilter === 'ana') return f.callsign.startsWith('ANA') || f.callsign.startsWith('NH');
                if (currentFilter === 'lcc') return !f.callsign.startsWith('JAL') && !f.callsign.startsWith('ANA');
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs">該当する機体がありません</div>`;
                return;
            }

            container.innerHTML = filtered.map(f => {
                const altFt = Math.round(f.altFt || (f.alt * 3.28));
                const isSelected = f.icao === selectedId;

                return `
                    <div onclick="selectFlight('${f.icao}')" 
                         class="p-3.5 hover:bg-slate-800/80 cursor-pointer transition ${isSelected ? 'bg-amber-400/10 border-l-4 border-amber-400' : ''}">
                        <div class="flex justify-between items-start mb-1">
                            <span class="mono font-bold text-slate-100 text-sm">${f.callsign}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 mono">${f.icao.toUpperCase()}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 mb-1">${f.airline} • <span class="text-slate-300">${f.type}</span></div>
                        <div class="flex justify-between text-[11px] font-mono text-slate-400">
                            <span>高度: <strong class="text-sky-400">${altFt.toLocaleString()} ft</strong></span>
                            <span>速度: <strong class="text-emerald-400">${Math.round(f.velocity * 1.94)} kt</strong></span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectFlight(id) {
            selectedId = id;
            const f = flightsData.find(x => x.icao === id);
            if (f) {
                document.getElementById('followToggleBtn').classList.remove('hidden');
                map.flyTo([f.lat, f.lng], 8, { duration: 1.0 });
                updateUI();
            }
        }

        function updateFlightTrail(id) {
            if (flightHistories[id] && flightHistories[id].length > 1) {
                trailPath.setLatLngs(flightHistories[id]);
            } else {
                trailPath.setLatLngs([]);
            }
        }

        function updateTelemetry(id) {
            const f = flightsData.find(x => x.icao === id);
            if (!f) return;

            const altFt = Math.round(f.altFt || (f.alt * 3.28));
            const speedKt = Math.round(f.velocity * 1.94);
            const speedKm = Math.round(f.velocity * 3.6);

            document.getElementById('telemetryDetail').innerHTML = `
                <div class="space-y-3">
                    <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 flex justify-between items-center">
                        <div>
                            <p class="text-lg font-bold mono text-amber-400">${f.callsign}</p>
                            <p class="text-xs text-slate-300">${f.airline}</p>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded bg-amber-400/20 text-amber-300 border border-amber-400/30 font-bold">${f.type}</span>
                    </div>

                    <div class="p-2.5 bg-slate-950/60 rounded-lg text-xs flex items-center justify-between border border-slate-800">
                        <span class="text-slate-400"><i class="fa-solid fa-route text-amber-400 mr-1.5"></i>推定制空路線:</span>
                        <span class="font-bold text-slate-200">${f.route}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-800/40 p-2.5 rounded-lg border border-slate-800">
                            <p class="text-[10px] font-bold text-slate-500 uppercase">飛行高度</p>
                            <p class="text-base font-bold mono text-sky-400">${altFt.toLocaleString()} <span class="text-xs text-slate-400">ft</span></p>
                        </div>
                        <div class="bg-slate-800/40 p-2.5 rounded-lg border border-slate-800">
                            <p class="text-[10px] font-bold text-slate-500 uppercase">対地速度</p>
                            <p class="text-base font-bold mono text-emerald-400">${speedKt} <span class="text-xs text-slate-400">kt</span></p>
                            <p class="text-[10px] text-slate-500">(${speedKm} km/h)</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateCharts() {
            const altCounts = [0, 0, 0, 0, 0];
            flightsData.forEach(f => {
                const ft = f.altFt || (f.alt * 3.28);
                if (ft < 10000) altCounts[0]++;
                else if (ft < 20000) altCounts[1]++;
                else if (ft < 30000) altCounts[2]++;
                else if (ft < 40000) altCounts[3]++;
                else altCounts[4]++;
            });
            altChart.data.datasets[0].data = altCounts;
            altChart.update('none');

            const speeds = flightsData.map(f => f.velocity * 3.6).sort((a,b) => a - b);
            if (speeds.length > 0) {
                velChart.data.datasets[0].data = [
                    Math.round(speeds[0]),
                    Math.round(speeds[Math.floor(speeds.length * 0.25)] || 0),
                    Math.round(speeds[Math.floor(speeds.length * 0.5)] || 0),
                    Math.round(speeds[Math.floor(speeds.length * 0.75)] || 0),
                    Math.round(speeds[speeds.length - 1])
                ];
                velChart.update('none');
            }

            const airlineCounts = {};
            flightsData.forEach(f => {
                const name = f.airline.split(' ')[0];
                airlineCounts[name] = (airlineCounts[name] || 0) + 1;
            });
            airlineChart.data.labels = Object.keys(airlineCounts);
            airlineChart.data.datasets[0].data = Object.values(airlineCounts);
            airlineChart.update('none');
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-slate-950', 'font-bold');
                b.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.add('bg-amber-400', 'text-slate-950', 'font-bold');
            renderFlightList();
        }

        function toggleFollow() {
            followSelected = !followSelected;
            const btn = document.getElementById('followToggleBtn');
            btn.classList.toggle('bg-amber-400', followSelected);
            btn.classList.toggle('text-slate-950', followSelected);
        }

        function setOnlineStatus(online, text) {
            document.getElementById('apiSourceLabel').innerText = text;
            document.getElementById('statusDot').className = `relative inline-flex rounded-full h-2.5 w-2.5 ${online ? 'bg-emerald-500' : 'bg-amber-500'}`;
            document.getElementById('statusPulse').className = `animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${online ? 'bg-emerald-400' : 'bg-amber-400'}`;
        }

        function exportCSV() {
            let csv = 'ICAO,便名,航空会社,機種,緯度,経度,高度(ft),対地速度(kt)\n';
            flightsData.forEach(f => {
                csv += `${f.icao},${f.callsign},"${f.airline}","${f.type}",${f.lat},${f.lng},${Math.round(f.altFt)},${Math.round(f.velocity * 1.94)}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `flightradar_live_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        window.onload = initApp;
    </script>
</body>
</html>
