<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完全無料・APIキー不要AIチャット</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #1e1e2e; color: #cdd6f4; }
        h2 { text-align: center; color: #f5c2e7; }
        #status { font-size: 0.9em; text-align: center; color: #a6e3a1; margin-bottom: 10px; padding: 8px; border-radius: 6px; background: #313244; }
        #chat-box { height: 450px; border: 1px solid #45475a; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #181825; border-radius: 8px; }
        .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { color: #eff1f5; background: #cba6f7; color: #11111b; margin-left: auto; text-align: right; border-bottom-right-radius: 2px; }
        .ai { color: #cdd6f4; background: #313244; margin-right: auto; text-align: left; border-bottom-left-radius: 2px; white-space: pre-wrap; }
        #input-area { display: flex; gap: 10px; }
        #user-input { flex-grow: 1; padding: 12px; border: 1px solid #45475a; border-radius: 6px; background: #313244; color: #cdd6f4; font-size: 1em; }
        button { padding: 12px 24px; border: none; border-radius: 6px; background: #f5c2e7; color: #11111b; font-weight: bold; cursor: pointer; font-size: 1em; }
        button:disabled { background: #585b70; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>APIキー不要 最強AIチャット</h2>
    <div id="status">【接続完了】Hugging Face経由で高性能AI（Qwen）と通信中</div>
    
    <div id="chat-box">
        <div class="msg ai">AI: お待たせしました！キー不要・完全無料で何度でも話せるAIです。パソコン部のことでもプログラミングのことでも、なんでも聞いてくださいね！</div>
    </div>
    
    <div id="input-area">
        <input type="text" id="user-input" placeholder="メッセージを入力...">
        <button id="send-btn" onclick="sendMessage()">送信</button>
    </div>

    <script>
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatBox = document.getElementById("chat-box");

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. ユーザーの発言を表示
            appendMessage(text, "user");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // AIの返答枠を作る
            const aiMsgDiv = appendMessage("思考中...", "ai");

            try {
                // 最も安定しているHugging Faceの完全無料・登録不要サーバーを利用
                // モデルには日本語が超得意な「Qwen2.5-7B-Instruct」を流用しています
                const response = await fetch("https://api-inference.huggingface.co/models/Qwen/Qwen2.5-7B-Instruct", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`,
                        parameters: {
                            max_new_tokens: 512,
                            return_full_text: false
                        }
                    })
                });

                const data = await response.json();
                
                // 返ってきたテキストを綺麗に整形して表示
                if (data && data[0] && data[0].generated_text) {
                    let reply = data[0].generated_text;
                    // 余計なAI用タグがついている場合は消去
                    reply = reply.replace("<|im_end|>", "").replace("<|im_start|>assistant", "").trim();
                    aiMsgDiv.innerText = reply;
                } else if (data.error) {
                    aiMsgDiv.innerText = "AIサーバーが少し混雑しています。10秒ほど待ってからもう一度送信してみてください。";
                    console.log("API Error:", data.error);
                } else {
                    aiMsgDiv.innerText = "お返事のデータがうまく取得できませんでした。もう一度試してみてください。";
                }

            } catch (error) {
                aiMsgDiv.innerText = "通信エラーが発生しました。インターネット接続を確認するか、GitHub Pagesにアップロードして試してみてください。";
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
