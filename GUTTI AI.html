<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUTTI AI</title>
    <style>
        :root {
            --bg-main: #1e1e2e;
            --bg-side: #181825;
            --bg-chat: #11111b;
            --bg-msg-ai: #313244;
            --bg-msg-user: #1e66f5;
            --text-main: #cdd6f4;
            --accent: #89b4fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- サイドバーのスタイル --- */
        #sidebar {
            width: 260px;
            background: var(--bg-side);
            border-right: 1px solid #45475a;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .side-title {
            font-size: 0.9em;
            font-weight: bold;
            color: #a6adc8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #new-chat-btn {
            background: #313244;
            color: var(--text-main);
            border: 1px solid #45475a;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        #new-chat-btn:hover { background: #45475a; }

        #history-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item-container {
            display: flex;
            align-items: center;
            background: #1e1e2e;
            border-radius: 6px;
            border: 1px solid transparent;
            padding-right: 5px;
        }
        .history-item-container:hover { background: #313244; }
        .history-item-container.active { border-color: var(--accent); background: #313244; }

        .history-item {
            flex-grow: 1;
            padding: 10px;
            cursor: pointer;
            font-size: 0.85em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 名前変更用の入力欄スタイル */
        .edit-input {
            flex-grow: 1;
            margin: 5px 10px;
            padding: 4px 8px;
            background: #11111b;
            border: 1px solid var(--accent);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 0.85em;
            outline: none;
        }

        .edit-btn {
            background: transparent;
            border: none;
            color: #a6adc8;
            cursor: pointer;
            font-size: 0.9em;
            padding: 5px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .edit-btn:hover { color: var(--accent); background: #45475a; }

        /* --- メインチャット画面のスタイル --- */
        #main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        h2 { text-align: center; color: var(--accent); margin: 15px 0 5px 0; }

        #status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 700px;
            width: 90%;
            margin: 0 auto 10px auto;
            padding: 8px 15px;
            border-radius: 6px;
            background: #313244;
            font-size: 0.85em;
            box-sizing: border-box;
        }
        #status { color: #a6e3a1; }
        #api-counter { color: #f9e2af; font-weight: bold; }

        #chat-box {
            flex-grow: 1;
            max-width: 700px;
            width: 90%;
            margin: 0 auto 15px auto;
            border: 1px solid #45475a;
            overflow-y: auto;
            padding: 15px;
            background: var(--bg-chat);
            border-radius: 8px;
            box-sizing: border-box;
        }

        .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { color: #eff1f5; background: var(--bg-msg-user); margin-left: auto; text-align: right; border-bottom-right-radius: 2px; }
        .ai { color: var(--text-main); background: var(--bg-msg-ai); margin-right: auto; text-align: left; border-bottom-left-radius: 2px; white-space: pre-wrap; }

        #input-area {
            max-width: 700px;
            width: 90%;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 10px;
            box-sizing: border-box;
        }

        #user-input { flex-grow: 1; padding: 12px; border: 1px solid #45475a; border-radius: 6px; background: #313244; color: var(--text-main); font-size: 1em; }
        #user-input:disabled { opacity: 0.5; cursor: not-allowed; }
        
        button.send-btn { padding: 12px 24px; border: none; border-radius: 6px; background: var(--accent); color: #11111b; font-weight: bold; cursor: pointer; font-size: 1em; }
        button:disabled { background: #585b70; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="sidebar">
        <button id="new-chat-btn" onclick="startNewChat()">＋ 新しいチャット</button>
        <div class="side-title">会話の履歴</div>
        <div id="history-list"></div>
    </div>

    <div id="main-container">
        <h2>Geminiを利用したチャットです</h2>
        
        <div id="status-bar">
            <div id="status">システム正常稼働中</div>
            <div id="api-counter">1分間の残り送信枠: 15 / 15 回</div>
        </div>
        
        <div id="chat-box"></div>
        
        <div id="input-area">
            <input type="text" id="user-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" class="send-btn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyA-wz_tox59CZZs_UPJ0EujZFUct3PIY1A";
        
        const MAX_REQUESTS_PER_MINUTE = 15;
        let requestTimestamps = [];

        let chatHistory = JSON.parse(localStorage.getItem("gutti_ai_history")) || {};
        let currentChatId = null;

        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatBox = document.getElementById("chat-box");
        const historyList = document.getElementById("history-list");
        const apiCounter = document.getElementById("api-counter");

        setInterval(updateCounterDisplay, 1000);

        function initApp() {
            renderHistoryList();
            const keys = Object.keys(chatHistory);
            if (keys.length > 0) {
                loadChat(keys[keys.length - 1]);
            } else {
                startNewChat();
            }
            updateCounterDisplay();
        }

        function updateCounterDisplay() {
            const now = Date.now();
            requestTimestamps = requestTimestamps.filter(timestamp => now - timestamp < 60000);
            const remaining = MAX_REQUESTS_PER_MINUTE - requestTimestamps.length;
            apiCounter.innerText = `1分間の残り送信枠: ${remaining} / ${MAX_REQUESTS_PER_MINUTE} 回`;
            
            if (remaining <= 0) {
                sendBtn.disabled = true;
                userInput.placeholder = "制限中... 1分待つと自動で回復します";
            } else if (userInput.disabled === false) {
                sendBtn.disabled = false;
                userInput.placeholder = "メッセージを入力...";
            }
        }

        function startNewChat() {
            currentChatId = "chat_" + Date.now();
            chatHistory[currentChatId] = {
                title: "新しいチャット",
                messages: [{ role: "ai", text: "AI: こんにちは！新しいチャットセッションが始まりました。何でも聞いてください！" }]
            };
            saveToLocalStorage();
            renderHistoryList();
            loadChat(currentChatId);
        }

        function loadChat(id) {
            currentChatId = id;
            chatBox.innerHTML = "";
            
            document.querySelectorAll('.history-item-container').forEach(item => item.classList.remove('active'));
            const activeContainer = document.getElementById(`container_${id}`);
            if (activeContainer) activeContainer.classList.add('active');

            chatHistory[id].messages.forEach(msg => {
                const sender = msg.role === "user" ? "user" : "ai";
                appendMessageHTML(msg.text, sender);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ★ 名前変更（編集モード）を起動する関数
        window.renameChat = function(id, event) {
            if (event) event.stopPropagation(); // チャット切り替えイベントの発生を防ぐ
            
            const container = document.getElementById(`container_${id}`);
            const itemText = document.getElementById(`text_${id}`);
            const editBtn = document.getElementById(`edit_btn_${id}`);
            
            // 既に入力欄になっていたら何もしない
            if (container.querySelector('.edit-input')) return;

            // テキスト欄を入力用インプットボックスに置き換え
            const input = document.createElement("input");
            input.type = "text";
            input.className = "edit-input";
            input.value = chatHistory[id].title;
            
            // 元のテキストを隠してインプットを挿入
            itemText.style.display = "none";
            if (editBtn) editBtn.style.display = "none";
            container.insertBefore(input, itemText);
            input.focus();
            input.select();

            // 保存を確定するインナー関数
            const saveRename = () => {
                const newTitle = input.value.trim();
                if (newTitle) {
                    chatHistory[id].title = newTitle;
                    saveToLocalStorage();
                }
                renderHistoryList(); // 再描画して元に戻す
                if (currentChatId === id) loadChat(id);
            };

            // Enterキーで保存、Escキーでキャンセル
            input.onkeydown = (e) => {
                if (e.key === "Enter") saveRename();
                if (e.key === "Escape") { renderHistoryList(); loadChat(currentChatId); }
            };
            
            // フォーカスが外れたら保存
            input.onblur = saveRename;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            updateCounterDisplay();
            if (MAX_REQUESTS_PER_MINUTE - requestTimestamps.length <= 0) return;

            requestTimestamps.push(Date.now());
            updateCounterDisplay();

            // 初回送信時にタイトルを自動設定（まだ「新しいチャット」のままであれば）
            if (chatHistory[currentChatId].title === "新しいチャット") {
                chatHistory[currentChatId].title = text;
                renderHistoryList();
            }

            appendMessageHTML(text, "user");
            chatHistory[currentChatId].messages.push({ role: "user", text: text });
            saveToLocalStorage();

            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            const aiMsgDiv = appendMessageHTML("思考中...", "ai");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                
                if (data && data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    aiMsgDiv.innerText = aiReply;
                    chatHistory[currentChatId].messages.push({ role: "ai", text: aiReply });
                    saveToLocalStorage();
                } else {
                    aiMsgDiv.innerText = "データを正常に受け取れませんでした。もう一度送信してみてください。";
                }

            } catch (error) {
                aiMsgDiv.innerText = "通信エラーが発生しました。";
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
                userInput.focus();
                updateCounterDisplay();
            }
        }

        function appendMessageHTML(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function renderHistoryList() {
            historyList.innerHTML = "";
            Object.keys(chatHistory).reverse().forEach(id => {
                // コンテナ要素作成
                const container = document.createElement("div");
                container.className = "history-item-container";
                container.id = `container_${id}`;
                if (id === currentChatId) container.classList.add("active");

                // テキスト要素作成
                const item = document.createElement("div");
                item.className = "history-item";
                item.id = `text_${id}`;
                item.innerText = chatHistory[id].title;
                item.onclick = () => loadChat(id);
                // ダブルクリックでも名前変更できるようにする
                item.ondblclick = (e) => renameChat(id, e);

                // 編集用のペン型ボタン作成 (✏️)
                const editBtn = document.createElement("button");
                editBtn.className = "edit-btn";
                editBtn.id = `edit_btn_${id}`;
                editBtn.innerHTML = "✏️";
                editBtn.title = "名前を変更";
                editBtn.onclick = (e) => renameChat(id, e);

                container.appendChild(item);
                container.appendChild(editBtn);
                historyList.appendChild(container);
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem("gutti_ai_history", JSON.stringify(chatHistory));
        }

        initApp();
    </script>
</body>
</html>
