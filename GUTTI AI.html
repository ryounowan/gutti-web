<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料・超高性能ローカルAI</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #1e1e2e; color: #cdd6f4; }
        h2 { text-align: center; color: #89b4fa; }
        #status { font-size: 0.9em; text-align: center; color: #fab387; margin-bottom: 10px; padding: 8px; border-radius: 6px; background: #313244; }
        #chat-box { height: 450px; border: 1px solid #45475a; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #181825; border-radius: 8px; }
        .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { color: #eff1f5; background: #1e66f5; margin-left: auto; text-align: right; border-bottom-right-radius: 2px; }
        .ai { color: #cdd6f4; background: #313244; margin-right: auto; text-align: left; border-bottom-left-radius: 2px; white-space: pre-wrap; }
        #input-area { display: flex; gap: 10px; }
        #user-input { flex-grow: 1; padding: 12px; border: 1px solid #45475a; border-radius: 6px; background: #313244; color: #cdd6f4; font-size: 1em; }
        #user-input:disabled { opacity: 0.5; cursor: not-allowed; }
        button { padding: 12px 24px; border: none; border-radius: 6px; background: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; font-size: 1em; }
        button:disabled { background: #585b70; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>WebLLM 超高性能ローカルAI</h2>
    <div id="status">AIエンジンの準備中...（初回は数分かかります）</div>
    
    <div id="chat-box">
        <div class="msg ai">AI: こんにちは！私はあなたのブラウザ上で直接動くAIです。準備が完了したら何でも聞いてくださいね。</div>
    </div>
    
    <div id="input-area">
        <input type="text" id="user-input" placeholder="ここに入力..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>送信</button>
    </div>

    <!-- WebLLMの公式スクリプトをインポート -->
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        // 今回使用する無料＆軽量かつ高性能な日本語対応モデル (Qwen2.5 0.5B)
        const selectedModel = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
        
        let engine;
        const statusDiv = document.getElementById("status");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatBox = document.getElementById("chat-box");

        // 1. AIエンジンの初期化とモデルのダウンロード
        async function initAI() {
            try {
                engine = new webllm.CreateGenericEngine();
                
                // 進捗状況を画面に表示するコールバック
                engine.setInitProgressCallback((report) => {
                    statusDiv.innerText = report.text;
                });

                // モデルの読み込み
                await engine.reload(selectedModel);
                statusDiv.innerText = "【準備完了】AIが起動しました！自由に会話できます。";
                statusDiv.style.background = "#a6e3a1";
                statusDiv.style.color = "#11111b";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (error) {
                statusDiv.innerText = "エラーが発生しました。WebGPUに対応したブラウザで試してください。";
                console.error(error);
            }
        }

        // メッセージ送信処理
        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;

            // ユーザーの発言を表示
            appendMessage(text, "user");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // AIの返答用枠を作る
            const aiMsgDiv = appendMessage("思考中...", "ai");

            try {
                // AIに喋らせる（チャット履歴を渡す）
                const messages = [{ role: "user", content: text }];
                
                // ストリーミング出力（文字がドバババと出てくる演出）
                const chunks = await engine.chat.completions.create({
                    messages,
                    stream: true
                });

                let replyText = "";
                for await (const chunk of chunks) {
                    const content = chunk.choices[0]?.delta?.content || "";
                    replyText += content;
                    aiMsgDiv.innerText = replyText; // リアルタイムに文字を更新
                    chatBox.scrollTop = chatBox.scrollHeight;
                }

            } catch (e) {
                aiMsgDiv.innerText = "ごめんなさい、お返事の作成中にエラーが起きました。";
                console.error(e);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        // ページ読み込み時にAIをスタート
        initAI();
    </script>
</body>
</html>
