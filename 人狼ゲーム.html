<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Werewolf - Mobile Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --wolf: #e53935; --villager: #4caf50; --seer: #9c27b0; --knight: #2196f3; 
            --teruteru: #ffeb3b; --vampire: #607d8b; --mad: #ff9800; --twins: #f06292; --hunter: #795548; --dead: #444; 
        }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 10px; background: #121212; color: #eee; overflow-x: hidden; }
        
        /* スマホ向けレイアウト調整 */
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; margin-bottom: 60px; }
        
        /* 生存者リスト（スマホでは上部にコンパクトに） */
        #survivor-list { background: rgba(0,0,0,0.8); padding: 8px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; display: flex; flex-wrap: wrap; gap: 5px; }
        .survivor-tag { padding: 2px 6px; border-radius: 4px; border: 1px solid #444; }
        .survivor-dead { color: #666; text-decoration: line-through; opacity: 0.5; }
        .survivor-alive { color: #4caf50; border-color: #4caf50; }

        /* タイマー表示 */
        #timer-display { font-size: 20px; font-weight: bold; color: #ffeb3b; text-align: center; margin: 5px 0; }

        /* 入力とボタンのスマホ最適化 */
        input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background: #333; color: white; font-size: 16px; }
        button { width: 100%; min-height: 48px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; color: white; background: #1a73e8; margin-top: 8px; font-weight: bold; font-size: 16px; }
        .action-item { background: #2a2a2a; padding: 8px 12px; margin-bottom: 6px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .action-btn { width: 80px; min-height: 36px; margin: 0; font-size: 14px; }

        #game-log { background: #000; padding: 10px; border-radius: 8px; font-size: 13px; height: 150px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #333; border-left: 4px solid #1a73e8; }
        .status-badge { display: block; width: fit-content; margin: 0 auto 10px; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="survivor-list" class="hidden"></div>
<div id="timer-display" class="hidden">残り時間: --:--</div>

<div class="card">
    <h3 style="text-align:center; margin: 0 0 15px; letter-spacing: 2px;">P2P人狼: 極 MOBILE</h3>

    <div id="setup-screen">
        <input type="text" id="user-name" placeholder="プレイヤー名">
        <input type="text" id="room-id" placeholder="部屋の合言葉">
        <button onclick="initConn()">入室 / 部屋作成</button>
    </div>

    <div id="lobby-screen" class="hidden">
        <div id="player-list-container" style="font-size: 14px; margin-bottom: 10px;"></div>
        <div id="host-controls" class="hidden">
            <div style="background:#252525; padding: 10px; border-radius: 8px; font-size: 12px;">
                議論時間(秒): <input type="number" id="cfg-TIME" value="180" style="width: 80px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px;">
                    <div>🐺 人狼 <input type="number" id="cfg-WOLF" value="1"></div>
                    <div>🔮 占い <input type="number" id="cfg-SEER" value="1"></div>
                </div>
            </div>
            <button onclick="startGame()" style="background:#4caf50;">ゲーム開始</button>
        </div>
        <p style="text-align: center; font-size: 12px; color: #888;">全員揃うまで待機してください</p>
    </div>

    <div id="game-screen" class="hidden">
        <div id="phase-display" style="text-align:center; font-weight:bold; font-size:20px; margin-bottom: 5px;"></div>
        <div id="my-role-badge" class="status-badge" onclick="showRoleDetail()"></div>
        
        <div id="game-log"></div>

        <div id="action-area">
            <div id="action-list"></div>
            <button id="skip-action-btn" class="hidden" style="background:#555;" onclick="sendAction('SKIP')">スキップ / 棄権</button>
        </div>
    </div>
</div>

<script>
    let peer, connections = [], myName, isHost = false, myRole = "", isAlive = true;
    let players = [], phase = "LOBBY", actions = {}, timerInt;
    const PREFIX = "wolf-ult-mob-";

    const roleData = {
        VILLAGER: { name: "👨‍🌾 村人", team: "村人陣営" },
        WOLF: { name: "🐺 人狼", team: "人狼陣営" },
        SEER: { name: "🔮 占い師", team: "村人陣営" },
        KNIGHT: { name: "🛡️ 騎士", team: "村人陣営" },
        TERUTERU: { name: "🎈 てるてる", team: "第三陣営" }
    };

    function log(m) {
        const l = document.getElementById('game-log');
        const d = document.createElement('div');
        d.innerHTML = m;
        l.appendChild(d);
        l.scrollTop = l.scrollHeight;
    }

    // --- タイマー処理 ---
    function startTimer(sec) {
        clearInterval(timerInt);
        let timeLeft = sec;
        const disp = document.getElementById('timer-display');
        disp.classList.remove('hidden');

        timerInt = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            disp.innerText = `残り時間: ${m}:${s < 10 ? '0' : ''}${s}`;

            if (timeLeft <= 0) {
                clearInterval(timerInt);
                if (isHost && phase === "DAY") {
                    log("<b style='color:#ff5252;'>時間切れです！投票に移ります。</b>");
                    // 強制的に投票アクションを表示（既存のhandleActionロジックへ）
                }
            }
        }, 1000);
    }

    // --- 通信コア ---
    function initConn() {
        myName = document.getElementById('user-name').value || "ゲスト";
        const room = document.getElementById('room-id').value;
        if(!room) return alert("合言葉を入力してください");
        
        peer = new Peer(PREFIX + room);
        peer.on('open', () => {
            isHost = true;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('host-controls').classList.remove('hidden');
            updateLobby();
            peer.on('connection', c => {
                c.on('open', () => {
                    c.on('data', d => {
                        if(d.type==='JOIN') { c.userName = d.name; connections.push(c); updateLobby(); }
                        if(d.type==='ACTION') handleAction(c.userName, d.target);
                    });
                });
            });
        });
        peer.on('error', e => { if(e.type === 'unavailable-id') joinGuest(PREFIX + room); });
    }

    function joinGuest(id) {
        peer = new Peer();
        peer.on('open', () => {
            const c = peer.connect(id);
            c.on('open', () => {
                c.send({type:'JOIN', name:myName});
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('lobby-screen').classList.remove('hidden');
                c.on('data', d => {
                    if(d.type === 'SYNC') {
                        players = d.players;
                        const me = players.find(p=>p.name===myName);
                        myRole = me.role; isAlive = me.isAlive;
                        updateUI(d.phase, d.msg, d.timer);
                    }
                    if(d.type === 'LOBBY_UPDATE') {
                        document.getElementById('player-list-container').innerText = "参加者: " + d.names.join(", ");
                    }
                });
            });
        });
    }

    function updateLobby() {
        const names = [myName, ...connections.map(c => c.userName)];
        document.getElementById('player-list-container').innerText = "参加者: " + names.join(", ");
        connections.forEach(c => c.send({type: 'LOBBY_UPDATE', names}));
    }

    // --- ゲーム進行 ---
    function startGame() {
        const names = [myName, ...connections.map(c=>c.userName)].sort(()=>Math.random()-0.5);
        let roles = ['WOLF', 'SEER']; // 最低限構成
        while(roles.length < names.length) roles.push("VILLAGER");
        
        players = names.map((n, i) => ({ name: n, role: roles[i], isAlive: true }));
        phase = "NIGHT";
        broadcastSync("ゲーム開始。夜の行動を選択してください。");
    }

    function broadcastSync(msg, timer = 0) {
        updateUI(phase, msg, timer);
        connections.forEach(c => {
            c.send({ type: 'SYNC', players, phase, msg, timer });
        });
    }

    function updateUI(newPhase, msg, timer) {
        phase = newPhase;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('survivor-list').classList.remove('hidden');
        
        // 生存者リスト更新
        const sList = document.getElementById('survivor-list');
        sList.innerHTML = players.map(p => `<span class="survivor-tag ${p.isAlive?'survivor-alive':'survivor-dead'}">${p.isAlive?'●':'×'} ${p.name}</span>`).join("");

        // フェーズ表示
        const pd = document.getElementById('phase-display');
        pd.innerText = (phase === "NIGHT" ? "🌙 夜" : "☀️ 昼(議論)");
        pd.style.color = (phase === "NIGHT" ? "#90caf9" : "#ffb74d");

        // タイマー同期
        if (timer > 0) startTimer(timer);

        // 自情報
        const badge = document.getElementById('my-role-badge');
        badge.innerText = `役職: ${roleData[myRole]?.name || "確認中"}`;
        badge.style.background = `var(--${(myRole||"dead").toLowerCase()})`;
        if(!isAlive) badge.classList.add('is-dead');

        if(msg) log(msg);

        // アクション表示
        const area = document.getElementById('action-list');
        area.innerHTML = "";
        const skipBtn = document.getElementById('skip-action-btn');
        skipBtn.classList.add('hidden');

        if(!isAlive || phase.includes("WIN")) return;

        // 議論中以外の行動可能フェーズ
        players.forEach(p => {
            if(p.isAlive && p.name !== myName) {
                area.innerHTML += `<div class="action-item"><span>${p.name}</span><button class="action-btn" onclick="sendAction('${p.name}')">選択</button></div>`;
            }
        });
        skipBtn.classList.remove('hidden');
    }

    function sendAction(t) {
        if(isHost) handleAction(myName, t);
        else connections[0].send({type:'ACTION', target:t}); // ゲストはホスト(c)へ送信
        document.getElementById('action-list').innerHTML = "<p style='text-align:center;'>送信完了。待機中...</p>";
        document.getElementById('skip-action-btn').classList.add('hidden');
    }

    function handleAction(voter, target) {
        actions[voter] = target;
        const required = players.filter(p => p.isAlive).length;
        if(Object.keys(actions).length >= required) {
            if(phase === "NIGHT") processNight();
            else processDay();
        }
    }

    function processNight() {
        // 簡易ロジック
        phase = "DAY";
        actions = {};
        const time = parseInt(document.getElementById('cfg-TIME').value);
        broadcastSync("朝になりました。議論を開始してください。", time);
    }

    function processDay() {
        // 投票集計
        phase = "NIGHT";
        actions = {};
        broadcastSync("投票が終了しました。再び夜が訪れます。");
    }

</script>
</body>
</html>
