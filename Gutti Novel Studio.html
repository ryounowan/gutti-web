<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutti Novel Studio - Ultimate Perfect Edition</title>
    <style>
        :root {
            --bg-color: #e6e1da;
            --panel-bg: #ffffff;
            --text-color: #2c2520;
            --accent-color: #8c6e51;
            --border-color: #d1c7bd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "YuMincho", "Hiragino Mincho ProN", "MS Mincho", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* モーダル共通 */
        .modal-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #fff; padding: 30px; border-radius: 12px;
            width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
            max-height: 85vh; overflow-y: auto;
        }
        .modal-box h2 { margin-bottom: 15px; font-size: 1.3rem; color: var(--accent-color); text-align: center; }
        .modal-box input[type="text"], .modal-box input[type="password"] {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid var(--border-color); background: #fdfcfb; color: var(--text-color);
            border-radius: 6px; font-size: 1rem;
        }
        .canvas-area { border: 2px dashed var(--border-color); background: #fff; margin: 10px 0; cursor: crosshair; border-radius: 6px; display: block; margin: 10px auto; }

        /* ダッシュボード */
        #dashboard-screen { display: flex; flex-direction: column; height: 100%; padding: 40px; align-items: center; justify-content: center; overflow-y: auto; }
        .dash-container { width: 100%; max-width: 750px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .dash-header { display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid #f0eae4; padding-bottom: 15px; }
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .dash-card { background: #fdfcfb; border: 1px solid var(--border-color); padding: 25px; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
        .dash-card:hover { transform: translateY(-2px); border-color: var(--accent-color); background: rgba(140, 110, 81, 0.05); }
        .dash-card svg { width: 40px; height: 40px; fill: var(--accent-color); }
        .recent-list { margin-top: 30px; padding-top: 10px; width: 100%; }
        .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-bottom: 1px solid #f0eae4; cursor: pointer; }
        .recent-item:hover { background: rgba(140, 110, 81, 0.05); }

        /* 設定用バックアップアイテム */
        .setting-row { margin-bottom: 18px; border-bottom: 1px solid #f0eae4; padding-bottom: 15px; }
        .backup-item { display: flex; justify-content: space-between; align-items: center; background: #fdfcfb; padding: 10px 14px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.95rem; }

        /* メインエディタ画面 */
        #main-app-screen { display: none; flex-direction: column; height: 100%; }
        header { background: #fff; border-bottom: 1px solid var(--border-color); padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .title-area { display: flex; align-items: center; gap: 12px; }
        .doc-title { font-weight: bold; font-size: 1.2rem; cursor: pointer; padding: 4px 10px; border-radius: 4px; border-bottom: 1px dashed var(--accent-color); }
        .lock-badge-text { font-size: 0.75rem; padding: 2px 6px; background: #2e8b57; color: #fff; border-radius: 4px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        
        button, select { background: #fff; color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-family: inherit; transition: all 0.2s; }
        button:hover { border-color: var(--accent-color); background: #fdfcfb; }
        .btn-danger { color: #cc0000; border-color: #fcc; }
        .btn-danger:hover { background: #fff0f0; border-color: #cc0000; }

        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* 小説ステージ（めくり編集） */
        .editor-container-novel {
            flex: 1; overflow: hidden; background: var(--bg-color);
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        /* 縦書き原稿用紙 */
        .novel-paper {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            width: 100%; max-width: 660px; height: 100%; max-height: 580px;
            padding: 50px 60px; background: #fff; color: #2c2520;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            font-size: 1.2rem; line-height: 2.3; letter-spacing: 0.05em;
            outline: none; position: relative; overflow: hidden;
            border-radius: 4px; border: 1px solid #dfd8cf;
        }
        
        /* 挿入される写真 */
        .novel-paper img, .book-content-area img {
            writing-mode: horizontal-tb;
            max-width: 180px; max-height: 240px; 
            object-fit: cover; display: inline-block; 
            margin: 15px; border-radius: 6px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            vertical-align: middle;
        }

        .page-counter-badge {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-size: 0.85rem; opacity: 0.6; writing-mode: horizontal-tb; font-family: sans-serif;
        }

        /* 本モード（読書用ビュー） */
        #book-wrapper { display: none; width: 100%; height: 100%; background: var(--bg-color); position: relative; justify-content: center; align-items: center; padding: 40px; }
        .book-page-container { width: 100%; max-width: 660px; height: 100%; max-height: 580px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.12); border-radius: 4px; padding: 50px 60px; position: relative; display: flex; flex-direction: column; justify-content: center; border: 1px solid #dfd8cf; }
        .book-content-area { width: 100%; height: 100%; writing-mode: vertical-rl; text-orientation: mixed; font-size: 1.2rem; line-height: 2.3; }

        .cover-page { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0; writing-mode: horizontal-tb !important; }
        .cover-title { font-size: 2.4rem; font-weight: bold; text-align: center; margin-top: 20px; }
        .cover-photo { width: 100%; max-width: 340px; height: 240px; object-fit: cover; border-radius: 8px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        .cover-author { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }

        /* 裏表紙・署名落款印エリア */
        .signature-page { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 0; writing-mode: horizontal-tb !important; }
        .sign-stamp-container { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 40px; }
        .stamp-img { width: 90px; height: 90px; object-fit: contain; border: 2px solid #cc0000; border-radius: 50%; padding: 2px; background: #fff; }
        .sign-author-name { font-size: 1.6rem; font-weight: bold; border-bottom: 2px solid var(--text-color); padding-bottom: 5px; }
        .sign-date-area { text-align: center; font-size: 0.9rem; opacity: 0.7; font-family: sans-serif; margin-bottom: 20px; }

        /* めくり大型ボタン (右開き仕様) */
        .flip-btn { position: absolute; top: 0; width: 120px; height: 100%; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: rgba(0,0,0,0.15); transition: all 0.2s; z-index: 50; }
        .flip-btn:hover { color: var(--accent-color); background: rgba(0,0,0,0.02); }
        .btn-prev-side { right: 0; } 
        .btn-next-side { left: 0; }  
        .page-number-text { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 0.85rem; opacity: 0.6; font-family: sans-serif; }

        /* 装丁サイドバー */
        .design-sidebar { width: 260px; background: #fff; border-left: 1px solid var(--border-color); padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .design-sidebar h3 { font-size: 1rem; color: var(--accent-color); border-bottom: 2px solid #f0eae4; padding-bottom: 8px; }

        .hidden { display: none !important; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- 署名プロファイルモーダル -->
    <div id="setup-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="setup-modal-title">著者署名プロファイル作成</h2>
            <label style="font-weight:bold;">著者名（ペンネーム）</label>
            <input type="text" id="setup-name" placeholder="例: Gutti">
            <label style="display:block; margin-top:12px; font-weight:bold;">落款印（電子ハンコ）</label>
            <div style="margin: 8px 0; text-align: center;">
                <button type="button" onclick="clearCanvas()">手書きクリア</button>
                <button type="button" onclick="document.getElementById('stamp-file').click()">画像を選択</button>
                <input type="file" id="stamp-file" accept="image/*" onchange="loadStampFile(event)">
            </div>
            <canvas id="stamp-canvas" width="150" height="150" class="canvas-area"></canvas>
            <button onclick="saveProfile()" style="width:100%; margin-top:15px; background:var(--accent-color); color:#fff; padding:12px; font-weight:bold; border:none; border-radius:6px;">プロファイルを確定</button>
            <button id="btn-close-setup" onclick="closeModal('setup-modal')" class="hidden" style="width:100%; margin-top:8px; border:none; background:none; opacity:0.5; cursor:pointer;">閉じる</button>
        </div>
    </div>

    <!-- ⚙環境設定モーダル -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Gutti Studio 環境設定</h2>
            <div style="margin-top:15px;">
                <div class="setting-row">
                    <label style="font-weight:bold; display:block; margin-bottom:8px;">著者プロファイル設定</label>
                    <button onclick="editProfileFromSettings()" style="background:var(--accent-color); color:#fff; width:100%;">名前・電子ハンコを再編集する</button>
                </div>
                <div class="setting-row">
                    <label style="font-weight:bold; display:block; margin-bottom:5px;">ローカル作品の復元・管理</label>
                    <div id="backup-list-container" style="max-height:180px; overflow-y:auto; padding-right:4px; margin-bottom:10px;"></div>
                </div>
                <!-- 追加：設定内の全データ消去 -->
                <div class="setting-row" style="border:none; padding-bottom:0;">
                    <label style="font-weight:bold; color:#cc0000; display:block; margin-bottom:5px;">危険な操作</label>
                    <button onclick="systemFullReset()" class="btn-danger" style="width:100%; font-weight:bold;">データをすべて消去して初期化</button>
                </div>
                <div style="text-align:center; margin-top:15px;">
                    <button onclick="closeModal('settings-modal')" style="width:100%; padding:10px;">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ライセンスキー暗号解除モーダル -->
    <div id="open-mode-modal" class="modal-overlay hidden">
        <div class="modal-box" style="text-align:center;">
            <h2>小説ファイルを開く</h2>
            <p id="lock-status-text" style="font-size:0.95rem; color:#ef4444; margin-bottom:15px;"></p>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button onclick="chooseGntMode('edit')" style="flex:1; padding:12px; background:var(--accent-color); color:#fff; font-weight:bold;">エディターで開く</button>
                <button onclick="chooseGntMode('read')" style="flex:1; padding:12px; background:#2e8b57; color:#fff; font-weight:bold;">📖 閲覧モードで読む (解除不要)</button>
            </div>
            <div id="license-auth-area" class="hidden" style="border-top:1px solid var(--border-color); padding-top:15px;">
                <input type="password" id="input-license-code" maxlength="5" placeholder="5桁の解除コード" style="text-align:center; font-size:1.3rem; letter-spacing:4px;">
                <button onclick="unlockAndEdit()" style="padding:8px 20px; background:#d2691e; color:#fff; width:100%; border:none; border-radius:6px;">認証してロック解除</button>
            </div>
            <button onclick="closeModal('open-mode-modal')" style="margin-top:15px; opacity:0.6; border:none; background:none;">キャンセル</button>
        </div>
    </div>

    <!-- ダッシュボード -->
    <div id="dashboard-screen">
        <div class="dash-container">
            <div class="dash-header">
                <div>
                    <h1 style="font-size:1.8rem; letter-spacing:0.05em; color:var(--accent-color);">Gutti Novel Studio</h1>
                    <p style="opacity:0.6; font-size:0.85rem; margin-top:2px;">小説専用・完全原稿めくり式ライブエディター</p>
                </div>
                <button onclick="openSettingsModal()" style="background:#fdfcfb; border-color:var(--border-color); padding:8px 14px; font-weight:bold;">⚙ システム設定</button>
            </div>
            
            <div class="dash-grid">
                <div class="dash-card" onclick="createNewDocument()">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <h3>新規小説を執筆</h3>
                </div>
                <div class="dash-card" onclick="document.getElementById('upload-gnt').click()">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    <h3>.gnt ファイル読込</h3>
                </div>
            </div>
            <input type="file" id="upload-gnt" accept=".gnt" onchange="handleGntUpload(event)">
            
            <div class="recent-list">
                <h3 style="margin-bottom:12px; font-size:0.95rem; opacity:0.8; font-weight:bold; border-left:3px solid var(--accent-color); padding-left:8px;">最近の執筆作品</h3>
                <div id="recent-works-container"></div>
            </div>
        </div>
    </div>

    <!-- メインエディタ -->
    <div id="main-app-screen">
        <header>
            <div class="title-area">
                <button onclick="backToDashboard()">← 戻る</button>
                <div class="doc-title" id="current-title" onclick="renameDocument()">無題の小説</div>
                <span id="lock-badge" class="lock-badge-text hidden">閲覧モード</span>
            </div>
            
            <div class="controls" id="editor-controls">
                <button onclick="formatText('bold')"><b>太字</b></button>
                <button onclick="formatText('underline')"><u>傍線</u></button>
                <button onclick="document.getElementById('insert-photo-file').click()" style="background:#fcfaf7; border-color:var(--accent-color);">🖼 写真を挿入</button>
                <input type="file" id="insert-photo-file" accept="image/*" onchange="insertPhotoToEditor(event)">
                <span>|</span>
                <button onclick="switchView('read')" style="background:var(--accent-color); color:#fff; font-weight:bold;">📖 本モードで読む</button>
                <button onclick="exportGnt()" style="background:#2c2520; color:#fff; font-weight:bold;">.gnt 出力</button>
            </div>
            <div class="controls hidden" id="book-controls">
                <button id="btn-return-edit" onclick="switchBookToEditMode()">✏️ 編集に戻る</button>
            </div>
        </header>

        <div class="workspace">
            <!-- 編集ステージ -->
            <div class="editor-container-novel" id="editor-wrapper">
                <button class="flip-btn btn-next-side" onclick="nextEditPage()">◀</button>
                <div class="novel-paper" id="novel-editor-core" contenteditable="true"></div>
                <div class="page-counter-badge" id="edit-page-counter">1 / 1</div>
                <button class="flip-btn btn-prev-side" onclick="prevEditPage()">▶</button>
            </div>

            <!-- 本モードビュー -->
            <div id="book-wrapper">
                <button class="flip-btn btn-next-side" onclick="nextBookPage()">◀</button>
                <div class="book-page-container" id="page-box">
                    <div class="book-content-area" id="book-core-view"></div>
                    <div class="page-number-text" id="page-num-display">1 / 1</div>
                </div>
                <button class="flip-btn btn-prev-side" onclick="prevBookPage()">▶</button>
            </div>

            <!-- 装丁サイドバー -->
            <div class="design-sidebar" id="sidebar-panel">
                <h3>装丁設定</h3>
                <div style="margin-bottom: 5px;">
                    <label style="font-size:0.85rem; font-weight:bold; display:block; margin-bottom:5px;">表紙・裏表紙の背景色</label>
                    <input type="color" id="cover-color-input" value="#eae1da" style="width:100%; height:38px; border:1px solid var(--border-color); cursor:pointer; border-radius:4px;" onchange="updateCoverSettings()">
                </div>
                <div>
                    <label style="font-size:0.85rem; font-weight:bold; display:block; margin-bottom:5px;">カバー装飾写真</label>
                    <button onclick="document.getElementById('cover-photo-file').click()" style="width:100%;">写真を設定</button>
                    <input type="file" id="cover-photo-file" accept="image/*" onchange="loadCoverPhoto(event)">
                    <button onclick="removeCoverPhoto()" class="btn-danger" style="width:100%; margin-top:5px; font-size:0.8rem;">写真を削除</button>
                </div>
                <div style="margin-top:auto; border-top:1px dashed var(--border-color); padding-top:15px;">
                    <button onclick="systemFullReset()" class="btn-danger" style="width:100%; font-size:0.8rem;">スタジオ初期化</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDocId = null;
        let userProfile = { name: '', stamp: '' };
        let isReadOnly = false;
        let coverSettings = { color: '#eae1da', photo: '' };
        let exportedDateStr = ''; 

        let novelPagesData = ["<div></div>"];
        let currentEditPageIndex = 0;

        let bookPages = [];
        let currentBookPageIndex = 0;
        let loadedGntRawData = null;

        const MAX_CHARS_PER_PAGE = 450; 

        const canvas = document.getElementById('stamp-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        window.addEventListener('DOMContentLoaded', () => {
            const savedProfile = localStorage.getItem('gutti_novel_profile');
            if (!savedProfile) {
                document.getElementById('setup-modal').classList.remove('hidden');
                initCanvas();
            } else { userProfile = JSON.parse(savedProfile); }
            loadRecentWorks();
            initCanvasEvents();
        });

        function initCanvas() { ctx.strokeStyle = '#cc0000'; ctx.lineWidth = 3; ctx.lineCap = 'round'; clearCanvas(); }
        function initCanvasEvents() {
            canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); const rect = canvas.getBoundingClientRect(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top); });
            canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const rect = canvas.getBoundingClientRect(); ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke(); });
            canvas.addEventListener('mouseup', () => { isDrawing = false; });
            canvas.addEventListener('mouseleave', () => { isDrawing = false; });
        }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#cc0000'; ctx.beginPath(); ctx.arc(75, 75, 65, 0, Math.PI * 2); ctx.stroke(); }
        
        function loadStampFile(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { const img = new Image(); img.onload = function() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 20, 20, 110, 110); }; img.src = e.target.result; };
            reader.readAsDataURL(file);
        }
        function saveProfile() {
            const name = document.getElementById('setup-name').value.trim(); if(!name) { alert('著者名を入力してください'); return; }
            userProfile.name = name; userProfile.stamp = canvas.toDataURL();
            localStorage.setItem('gutti_novel_profile', JSON.stringify(userProfile));
            document.getElementById('setup-modal').classList.add('hidden');
        }

        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
            const container = document.getElementById('backup-list-container'); container.innerHTML = '';
            const works = JSON.parse(localStorage.getItem('gutti_novel_works') || '{}');
            
            Object.keys(works).forEach(id => {
                const w = works[id]; const item = document.createElement('div'); item.className = 'backup-item';
                item.innerHTML = `<div><b>${w.title}</b> <span style="font-size:0.75rem; opacity:0.6;">(${w.pagesCount || 1}頁)</span></div><button onclick="restoreFromBackup('${id}')" style="padding:3px 10px; font-size:0.8rem;">復元する</button>`;
                container.appendChild(item);
            });
            if(Object.keys(works).length === 0) { container.innerHTML = '<div style="opacity:0.5; font-size:0.85rem; padding:10px 0;">バックアップデータはありません</div>'; }
        }
        function editProfileFromSettings() {
            document.getElementById('setup-modal-title').textContent = "プロファイルの変更"; 
            document.getElementById('btn-close-setup').classList.remove('hidden');
            document.getElementById('setup-name').value = userProfile.name; 
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('setup-modal').classList.remove('hidden'); 
            initCanvas();
        }
        function restoreFromBackup(id) { 
            document.getElementById('settings-modal').classList.add('hidden'); 
            openDocument(id); 
        }

        /* ⚙設定内およびサイドバー共通の全データ消去 */
        function systemFullReset() { if(confirm('警告: スタジオ内のすべての執筆データ、バックアップ、プロファイル設定が完全に消去されます。本当によろしいですか？')) { localStorage.clear(); window.location.reload(); } }
        function formatText(command) { if(isReadOnly) return; document.execCommand(command, false, null); saveCurrentProgress(); }

        function insertPhotoToEditor(e) {
            const file = e.target.files[0]; if(!file || isReadOnly) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const imgHtml = `<img src="${evt.target.result}" alt="novel_photo">`;
                const core = document.getElementById('novel-editor-core');
                core.focus();
                document.execCommand('insertHTML', false, imgHtml);
                saveCurrentProgress();
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // 連続投入用クリア
        }

        function renderCurrentEditPage() {
            const core = document.getElementById('novel-editor-core');
            core.contentEditable = !isReadOnly;
            core.innerHTML = novelPagesData[currentEditPageIndex] || "<div></div>";
            document.getElementById('edit-page-counter').textContent = `${currentEditPageIndex + 1} / ${novelPagesData.length}`;
            
            core.oninput = () => {
                if(isReadOnly) return;
                novelPagesData[currentEditPageIndex] = core.innerHTML;
                
                if(core.innerText.length > MAX_CHARS_PER_PAGE || core.scrollWidth > 660) {
                    if(currentEditPageIndex === novelPagesData.length - 1) {
                        novelPagesData.push("<div></div>");
                    }
                    currentEditPageIndex++;
                    renderCurrentEditPage();
                    core.focus();
                }
                saveCurrentProgress();
            };
        }

        function nextEditPage() {
            novelPagesData[currentEditPageIndex] = document.getElementById('novel-editor-core').innerHTML;
            if(currentEditPageIndex < novelPagesData.length - 1) {
                currentEditPageIndex++;
                renderCurrentEditPage();
            } else if(!isReadOnly) {
                novelPagesData.push("<div></div>");
                currentEditPageIndex++;
                renderCurrentEditPage();
            }
        }

        function prevEditPage() {
            novelPagesData[currentEditPageIndex] = document.getElementById('novel-editor-core').innerHTML;
            if(currentEditPageIndex > 0) {
                currentEditPageIndex--;
                renderCurrentEditPage();
            }
        }

        function loadRecentWorks() {
            const container = document.getElementById('recent-works-container'); container.innerHTML = '';
            const works = JSON.parse(localStorage.getItem('gutti_novel_works') || '{}');
            Object.keys(works).sort((a,b) => works[b].updatedAt - works[a].updatedAt).forEach(id => {
                const w = works[id]; const item = document.createElement('div'); item.className = 'recent-item';
                item.innerHTML = `<div style="font-weight:bold;">${w.title}</div><div style="font-size:0.85rem; opacity:0.6;">著者: ${w.author} (${w.pagesCount || 1}頁)</div>`;
                item.onclick = () => openDocument(id); container.appendChild(item);
            });
            if(Object.keys(works).length === 0) { container.innerHTML = '<div style="text-align:center; padding:30px; opacity:0.5; font-size:0.9rem;">作品データがありません。「新規小説を執筆」からはじめましょう！</div>'; }
        }

        function createNewDocument() {
            const id = 'novel_' + Date.now();
            const works = JSON.parse(localStorage.getItem('gutti_novel_works') || '{}');
            works[id] = {
                id: id,
                title: '無題の小説',
                pages: ["<div>ここに小説の執筆を開始してください。</div>"],
                author: userProfile.name,
                cover: { color: '#eae1da', photo: '' },
                updatedAt: Date.now(),
                pagesCount: 1,
                exportedDate: ''
            };
            localStorage.setItem('gutti_novel_works', JSON.stringify(works));
            openDocument(id);
        }

        function openDocument(id, externalData = null, forceEditable = false) {
            currentDocId = id;
            
            const works = JSON.parse(localStorage.getItem('gutti_novel_works') || '{}');
            const w = externalData || works[id];

            if (forceEditable) {
                isReadOnly = false;
            } else if (w.author && w.author !== userProfile.name) {
                isReadOnly = true; 
            } else {
                isReadOnly = false;
            }

            if (isReadOnly) {
                document.getElementById('lock-badge').classList.remove('hidden');
                document.getElementById('lock-badge').textContent = "閲覧モード";
            } else {
                document.getElementById('lock-badge').classList.add('hidden');
            }

            document.getElementById('current-title').textContent = w.title;
            
            if (Array.isArray(w.pages)) {
                novelPagesData = [...w.pages];
            } else {
                novelPagesData = [w.content || "<div></div>"];
            }
            
            currentEditPageIndex = 0;
            coverSettings = w.cover || { color: '#eae1da', photo: '' };
            exportedDateStr = w.exportedDate || ''; 
            document.getElementById('cover-color-input').value = coverSettings.color;

            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('main-app-screen').style.display = 'flex';
            
            switchView('edit');
        }

        function saveCurrentProgress() {
            if(isReadOnly || !currentDocId) return;
            novelPagesData[currentEditPageIndex] = document.getElementById('novel-editor-core').innerHTML;
            
            const works = JSON.parse(localStorage.getItem('gutti_novel_works') || '{}');
            if(works[currentDocId]) {
                works[currentDocId].pages = novelPagesData;
                works[currentDocId].title = document.getElementById('current-title').textContent;
                works[currentDocId].cover = coverSettings;
                works[currentDocId].pagesCount = novelPagesData.length;
                works[currentDocId].updatedAt = Date.now();
                localStorage.setItem('gutti_novel_works', JSON.stringify(works));
            }
        }

        function renameDocument() {
            if(isReadOnly) return;
            const title = prompt('小説のタイトルを変更しますか？', document.getElementById('current-title').textContent);
            if(title && title.trim()) { document.getElementById('current-title').textContent = title.trim(); saveCurrentProgress(); }
        }

        function compileBookPages() {
            bookPages = [];
            const title = document.getElementById('current-title').textContent;
            
            const author = loadedGntRawData ? loadedGntRawData.author : ((currentDocId && JSON.parse(localStorage.getItem('gutti_novel_works'))[currentDocId]) ? JSON.parse(localStorage.getItem('gutti_novel_works'))[currentDocId].author : userProfile.name);
            const stamp = loadedGntRawData ? loadedGntRawData.authorStamp : userProfile.stamp;
            const displayDate = loadedGntRawData ? loadedGntRawData.exportedDate : exportedDateStr;

            bookPages.push({ type: 'cover', title: title, author: author, cover: coverSettings });
            novelPagesData.forEach(pageHtml => {
                bookPages.push({ type: 'content', html: pageHtml });
            });
            bookPages.push({ type: 'signature', title: title, author: author, stamp: stamp, date: displayDate });
        }

        function renderBookPage() {
            const pageData = bookPages[currentBookPageIndex];
            const core = document.getElementById('book-core-view');
            const pageBox = document.getElementById('page-box');
            pageBox.style.background = '#fff'; core.style.writingMode = 'vertical-rl'; core.innerHTML = '';

            if (pageData.type === 'cover') {
                pageBox.style.background = pageData.cover.color || '#eae1da'; core.style.writingMode = 'horizontal-tb';
                core.innerHTML = `<div class="cover-page"><div class="cover-title">${pageData.title}</div>${pageData.cover.photo ? `<img src="${pageData.cover.photo}" class="cover-photo">` : '<div style="flex:1;"></div>'}<div class="cover-author">${pageData.author} 著</div></div>`;
            } else if (pageData.type === 'content') {
                core.innerHTML = pageData.html;
            } else if (pageData.type === 'signature') {
                pageBox.style.background = coverSettings.color || '#eae1da'; core.style.writingMode = 'horizontal-tb';
                const dateHtml = pageData.date ? `<div class="sign-date-area">執筆完了日 : ${pageData.date}</div>` : `<div class="sign-date-area">Gutti Novel Studio 認証作品</div>`;
                
                core.innerHTML = `
                    <div class="signature-page">
                        <div style="font-size:0.85rem; opacity:0.5; margin-top:10px; text-align:center; font-family:sans-serif; letter-spacing:1px;">✒️ GUTTI NOVEL STUDIO ARCHIVE</div>
                        <div class="sign-stamp-container">
                            ${pageData.stamp ? `<img src="${pageData.stamp}" class="stamp-img">` : ''}
                            <div class="sign-author-name">${pageData.author} <span style="font-size:1rem; font-weight:normal; opacity:0.7;">判</span></div>
                        </div>
                        ${dateHtml}
                    </div>`;
            }
            document.getElementById('page-num-display').textContent = `${currentBookPageIndex + 1} / ${bookPages.length}`;
        }

        function nextBookPage() { if(currentBookPageIndex < bookPages.length - 1) { currentBookPageIndex++; renderBookPage(); } }
        function prevBookPage() { if(currentBookPageIndex > 0) { currentBookPageIndex--; renderBookPage(); } }

        function exportGnt() {
            saveCurrentProgress();
            
            const now = new Date();
            const dateString = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            exportedDateStr = dateString;

            const generatedCode = Math.floor(10000 + Math.random() * 90000).toString();
            const gntPackage = {
                guttiNovelVersion: "7.5.0",
                title: document.getElementById('current-title').textContent,
                pages: novelPagesData, 
                author: userProfile.name,
                authorStamp: userProfile.stamp, 
                licenseCode: generatedCode,
                cover: coverSettings,
                exportedDate: dateString 
            };
            
            const blob = new Blob([JSON.stringify(gntPackage, null, 2)], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${gntPackage.title}.gnt`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            alert(`🎉 小説ファイルの書き出しに成功しました！\n書き出し日: ${dateString}\n\n他者が「編集」する際のロック解除コード: 【 ${generatedCode} 】`);
        }

        /* 【バグ修正】ファイルを解析した後、inputのvalueを即時リセットして連続読み込みを可能に */
        function handleGntUpload(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    loadedGntRawData = JSON.parse(evt.target.result);
                    const isOwner = loadedGntRawData.author === userProfile.name;
                    const statusText = document.getElementById('lock-status-text');
                    const authArea = document.getElementById('license-auth-area');
                    
                    if (isOwner) { 
                        statusText.innerHTML = `あなたの作品です。制限なく編集・閲覧が可能です。`; 
                        statusText.style.color = '#2e8b57'; authArea.classList.add('hidden'); 
                    } else { 
                        statusText.innerHTML = `🔒 著者 [ ${loadedGntRawData.author} ] 氏の外部作品です。<br><span style="font-size:0.85rem; opacity:0.8; color:var(--text-color);">「閲覧モード」なら今すぐ解除コードなしで本として読めます。</span>`; 
                        statusText.style.color = '#d2691e'; authArea.classList.remove('hidden'); 
                    }
                    document.getElementById('open-mode-modal').classList.remove('hidden');
                } catch(err) { alert('ファイルの解析に失敗しました。'); }
            };
            reader.readAsText(file);
            e.target.value = ''; // ★ここが重要！選択した直後に要素のバリューを空にすることで、画面更新なしで連続読み込み可能になります
        }

        function chooseGntMode(targetView) {
            if(!loadedGntRawData) return;
            
            if(targetView === 'edit') {
                if(loadedGntRawData.author !== userProfile.name) { 
                    alert('他者の作品を直接編集することはできません。下部のフォームからロック解除コードを入力してください。'); 
                    return; 
                }
                document.getElementById('open-mode-modal').classList.add('hidden');
                openDocument(null, loadedGntRawData, false); 
            } else {
                document.getElementById('open-mode-modal').classList.add('hidden');
                openDocument(null, loadedGntRawData, false); 
                switchView('read');
            }
        }

        function unlockAndEdit() {
            if(!loadedGntRawData) return;
            const inputCode = document.getElementById('input-license-code').value.trim();
            if(inputCode === loadedGntRawData.licenseCode) {
                alert('🔓 ロックを解除しました！編集モードに移行します。'); 
                document.getElementById('open-mode-modal').classList.add('hidden');
                document.getElementById('input-license-code').value = ''; 
                openDocument(null, loadedGntRawData, true); 
            } else { 
                alert('❌ 解除コードが一致しません。'); 
            }
        }

        function loadCoverPhoto(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = function(evt) { coverSettings.photo = evt.target.result; saveCurrentProgress(); }; reader.readAsDataURL(file); e.target.value = ''; }
        function removeCoverPhoto() { coverSettings.photo = ''; saveCurrentProgress(); }
        function updateCoverSettings() { coverSettings.color = document.getElementById('cover-color-input').value; saveCurrentProgress(); }

        function switchView(view) {
            if(view === 'read') {
                saveCurrentProgress();
                compileBookPages(); currentBookPageIndex = 0; renderBookPage();
                document.getElementById('editor-wrapper').classList.add('hidden');
                document.getElementById('sidebar-panel').classList.add('hidden');
                document.getElementById('editor-controls').classList.add('hidden');
                document.getElementById('book-wrapper').style.display = 'flex';
                document.getElementById('book-controls').classList.remove('hidden');
                
                if(isReadOnly) {
                    document.getElementById('btn-return-edit').textContent = "← 本を閉じて戻る";
                } else {
                    document.getElementById('btn-return-edit').textContent = "✏️ 編集に戻る";
                }
            } else {
                if(isReadOnly && view === 'edit' && loadedGntRawData && loadedGntRawData.author !== userProfile.name) {
                    backToDashboard();
                    return;
                }
                document.getElementById('editor-wrapper').classList.remove('hidden');
                document.getElementById('sidebar-panel').classList.remove('hidden');
                document.getElementById('editor-controls').classList.remove('hidden');
                document.getElementById('book-wrapper').style.display = 'none';
                document.getElementById('book-controls').classList.add('hidden');
                renderCurrentEditPage();
            }
        }

        function switchBookToEditMode() { 
            if(isReadOnly) {
                backToDashboard();
            } else {
                switchView('edit'); 
            }
        }
        
        function backToDashboard() { saveCurrentProgress(); loadRecentWorks(); document.getElementById('main-app-screen').style.display = 'none'; document.getElementById('dashboard-screen').style.display = 'flex'; currentDocId = null; loadedGntRawData = null;}
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
