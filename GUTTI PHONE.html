<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ただいまシステムメンテナンス中です</title>
    <style>
        body { background-color: #222222; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .container { text-align: center; padding: 20px; max-width: 500px; }
        .icon { font-size: 80px; margin-bottom: 20px; animation: twist 2s infinite ease-in-out; }
        @keyframes twist { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(15deg); } }
        h1 { font-size: 28px; margin: 10px 0; font-weight: bold; }
        p { line-height: 1.8; opacity: 0.9; font-size: 16px; }
        .time { font-weight: bold; color: #f39c12; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>ただいまシステムメンテナンス中です</h1>
        <p>いつもご利用いただきありがとうございます。より良いサービス提供のため、現在システムメンテナンスを行っております。</p>
        <p style="margin-top:20px;">⏱️ 終了予定：<span class="time">未定（順次復旧中）</span></p>
    </div>
</body>
</html>
