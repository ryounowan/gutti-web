<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P2P Debug Controller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: #B8D4D9; text-align: center; }
        #log { font-size: 12px; color: #888; background: #000; padding: 5px; height: 60px; overflow-y: scroll; text-align: left; }
        .view { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        #desktop { width: 300px; height: 200px; background: #222; border: 1px solid #B8D4D9; position: relative; }
        #cursor { width: 15px; height: 15px; background: #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; }
        #qrcode { background: white; padding: 10px; margin: 10px; }
        .pad { width: 250px; height: 250px; background: #333; border-radius: 20px; display: flex; align-items: center; justify-content: center; touch-action: none; }
    </style>
</head>
<body>

    <div id="log">ログ: 待機中...</div>

    <div id="pc-view" class="view">
        <div id="desktop"><div id="cursor"></div></div>
        <div id="qrcode"></div>
        <p id="pc-id-display">ID発行中...</p>
    </div>

    <div id="mobile-view" class="view">
        <div class="pad" id="pad">TRACKPAD</div>
        <p>指を動かして操作</p>
    </div>

    <script>
        const logEl = document.getElementById('log');
        function logger(msg) { logEl.innerText = msg + "\n" + logEl.innerText; }

        // IDを短く固定
        const myId = "gutti-" + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(myId);

        const params = new URLSearchParams(window.location.hash.substring(1));
        const targetId = params.get('id');

        peer.on('open', (id) => {
            logger("Peer準備完了: " + id);
            if (targetId) {
                logger("接続開始 -> " + targetId);
                const conn = peer.connect(targetId);
                setupMobile(conn);
            } else {
                setupPC(id);
            }
        });

        peer.on('error', (err) => logger("エラー: " + err.type));

        function setupPC(id) {
            document.getElementById('pc-view').style.display = 'flex';
            document.getElementById('pc-id-display').innerText = "ID: " + id;
            const url = window.location.href.split('#')[0] + "#id=" + id;
            new QRCode(document.getElementById("qrcode"), { text: url, width: 150, height: 150 });

            peer.on('connection', (conn) => {
                logger("スマホが接続しました！");
                conn.on('data', (data) => {
                    if (data.type === 'move') {
                        const cursor = document.getElementById('cursor');
                        cursor.style.left = (parseInt(cursor.style.left || 50) + data.dx) + "px";
                        cursor.style.top = (parseInt(cursor.style.top || 50) + data.dy) + "px";
                    }
                });
            });
        }

        function setupMobile(conn) {
            document.getElementById('mobile-view').style.display = 'flex';
            conn.on('open', () => {
                logger("PCに接続成功！");
                let lx, ly;
                const pad = document.getElementById('pad');
                pad.addEventListener('touchstart', e => {
                    lx = e.touches[0].clientX;
                    ly = e.touches[0].clientY;
                });
                pad.addEventListener('touchmove', e => {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - lx;
                    const dy = e.touches[0].clientY - ly;
                    conn.send({ type: 'move', dx: dx, dy: dy });
                    lx = e.touches[0].clientX;
                    ly = e.touches[0].clientY;
                });
            });
        }
    </script>
</body>
</html>
