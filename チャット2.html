<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P2P Mesh Chat & Call Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #10b981; --bg: #0f172a; --card: #1e293b; --me: #059669; --others: #334155; --danger: #ef4444; --call: #3b82f6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: white; overflow: hidden; font-family: sans-serif; }
        body { display: flex; justify-content: center; align-items: center; }
        .box { background: var(--card); width: 100%; max-width: 900px; height: 100%; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        /* ログイン */
        #setup { padding: 40px 20px; text-align: center; margin: auto; max-width: 400px; width: 100%; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 2px solid #475569; background: #0f172a; color: white; font-size: 16px; }
        button { padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:active { opacity: 0.7; }

        /* メイン画面 */
        #main { display: none; flex-direction: column; height: 100%; width: 100%; }
        header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        
        /* 吹き出し */
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 16px; word-wrap: break-word; position: relative; }
        .msg b { display: block; font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
        .msg.mine { align-self: flex-end; background: var(--me); border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--others); border-bottom-left-radius: 2px; }
        .msg.sys { align-self: center; background: none; color: #64748b; font-size: 12px; font-style: italic; }

        /* 通話中UI */
        .call-ui { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--call); padding: 12px 25px; border-radius: 50px; z-index: 100; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-hangup { background: var(--danger); width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; }

        /* 操作エリア */
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .btn-call { background: var(--call); width: 55px; font-size: 22px; }
        .btn-send { width: 75px; background: var(--accent); }
        
        @media (min-width: 801px) { .box { height: 92vh; border-radius: 24px; } }
    </style>
</head>
<body>

<div class="box">
    <div id="setup">
        <h2 style="color:var(--accent);">🌐 Online P2P Pro</h2>
        <input type="text" id="room" placeholder="ルームコード (例: my-secret)" value="apple7">
        <input type="text" id="user" placeholder="あなたの名前" value="User1">
        <button onclick="join()" style="width:100%">チャットに参加</button>
    </div>

    <div id="main">
        <header>
            <div id="room-id" style="font-weight:bold; color:var(--accent);">Room: ---</div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="member-count" style="font-size:13px; color:#94a3b8; background:#0f172a; padding:4px 10px; border-radius:20px;">1人</span>
                <button onclick="logout()" style="background:var(--danger); padding:6px 12px; font-size:12px; border-radius:8px;">退出</button>
            </div>
        </header>

        <div id="call-active" class="call-ui">
            <span id="call-status-text">📞 通話中...</span>
            <button class="btn-hangup" onclick="endCall()">✖</button>
        </div>

        <div id="chat"></div>

        <div class="input-area">
            <button class="btn-call" onclick="startCall()" title="通話開始">📞</button>
            <input type="text" id="mInput" placeholder="メッセージ..." onkeypress="if(event.keyCode==13) send()">
            <button class="btn-send" onclick="send()">送信</button>
        </div>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
    let peer, myName, roomCode, myFullId, hubPeer;
    let conns = {}; 
    let seenIds = new Set();
    let localStream, currentCall;

    function join() {
        roomCode = document.getElementById('room').value.trim();
        myName = document.getElementById('user').value.trim() || "Guest";
        if (!roomCode) return alert("ルーム名を入力してください");

        const safeName = btoa(unescape(encodeURIComponent(myName))).replace(/=/g, "").substring(0, 5);
        myFullId = `${roomCode}_${safeName}_${Math.random().toString(36).substring(2, 7)}`;
        
        peer = new Peer(myFullId);

        peer.on('open', (id) => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            document.getElementById('room-id').innerText = `Room: ${roomCode}`;
            log("System", "オンライン！マイクボタンで通話できます", "sys");
            initHub();
        });

        peer.on('connection', setupConn);

        // 着信処理
        peer.on('call', async (call) => {
            const callerName = call.peer.split('_')[1] || "誰か";
            if (confirm(`📞 ${atob(callerName)} さんから着信です。応答しますか？`)) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    call.answer(localStream);
                    handleCall(call);
                } catch (e) { alert("マイクが使えません"); }
            } else {
                call.close();
            }
        });
        
        peer.on('error', err => {
            console.error(err);
            if(err.type !== 'peer-unavailable') log("System", "エラー: " + err.type, "sys");
        });
    }

    // --- 通話機能 ---
    async function startCall() {
        const targets = Object.keys(conns).filter(id => id !== myFullId && !id.endsWith("_HUB") && conns[id].open);
        if (targets.length === 0) return alert("接続相手がいません");
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const call = peer.call(targets[0], localStream);
            handleCall(call);
            log("System", "発信中...", "sys");
        } catch (e) { alert("マイクの使用を許可してください"); }
    }

    function handleCall(call) {
        currentCall = call;
        document.getElementById('call-active').style.display = 'flex';
        call.on('stream', (stream) => {
            document.getElementById('remote-audio').srcObject = stream;
        });
        call.on('close', endCall);
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('call-active').style.display = 'none';
        currentCall = null;
    }

    // --- 接続・人数管理 ---
    function initHub() {
        const hubId = `${roomCode}_HUB`;
        hubPeer = new Peer(hubId);
        hubPeer.on('open', () => hubPeer.on('connection', setupConn));
        hubPeer.on('error', (err) => {
            if (err.type === 'unavailable-id') connectTo(hubId);
            hubPeer.destroy();
        });
    }

    function connectTo(targetId) {
        if (conns[targetId] || targetId === myFullId) return;
        setupConn(peer.connect(targetId));
    }

    function setupConn(conn) {
        conn.on('open', () => {
            conns[conn.peer] = conn;
            updateCount();
            broadcast({ type: 'MEMBERS', list: Object.keys(conns).concat(myFullId) });
        });
        conn.on('data', data => {
            if (data.type === 'MEMBERS') data.list.forEach(id => connectTo(id));
            else if (data.type === 'chat') {
                if (seenIds.has(data.id)) return;
                seenIds.add(data.id);
                log(data.u, data.m, "theirs");
                broadcast(data);
            }
        });
        conn.on('close', () => { delete conns[conn.peer]; updateCount(); });
        conn.on('error', () => { delete conns[conn.peer]; updateCount(); });
    }

    // 🔥 人数カウントのバグを修正
    function updateCount() {
        const activePeers = Object.values(conns)
            .filter(c => c.open && c.type === 'data') // データ通信のみカウント
            .map(c => c.peer)
            .filter(id => id !== myFullId && !id.endsWith("_HUB")); // 自分とHUBを除外

        const uniqueCount = new Set(activePeers).size;
        document.getElementById('member-count').innerText = `${uniqueCount + 1}人`;
    }

    function send() {
        const input = document.getElementById('mInput');
        if (!input.value) return;
        const data = { type: 'chat', id: Math.random(), u: myName, m: input.value };
        seenIds.add(data.id);
        log(myName, input.value, "mine");
        broadcast(data);
        input.value = "";
    }

    function broadcast(data) {
        Object.values(conns).forEach(c => { if (c && c.open && c.type === 'data') c.send(data); });
    }

    function log(u, m, type) {
        const c = document.getElementById('chat');
        const msgHtml = `<div class="msg ${type}">${type !== "sys" ? '<b>' + u + '</b>' : ''}${m}</div>`;
        c.insertAdjacentHTML('beforeend', msgHtml);
        c.scrollTop = c.scrollHeight;
    }

    function logout() {
        if (confirm("チャットから退出しますか？")) location.reload();
    }

    // スマホのキーボード対策
    window.visualViewport?.addEventListener('resize', () => {
        const chat = document.getElementById('chat');
        chat.scrollTop = chat.scrollHeight;
    });
</script>
</body>
</html>
