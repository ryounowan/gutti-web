<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P2P Mesh Chat & Call</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #10b981; --bg: #0f172a; --card: #1e293b; --me: #059669; --others: #334155; --danger: #ef4444; --call: #3b82f6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: white; overflow: hidden; font-family: sans-serif; }
        body { display: flex; justify-content: center; align-items: center; }
        .box { background: var(--card); width: 100%; max-width: 900px; height: 100%; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        /* ログイン画面 */
        #setup { padding: 40px 20px; text-align: center; margin: auto; max-width: 400px; width: 100%; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 2px solid #475569; background: #0f172a; color: white; font-size: 16px; }
        button { padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* チャット画面 */
        #main { display: none; flex-direction: column; height: 100%; width: 100%; }
        header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 16px; word-wrap: break-word; }
        .msg.mine { align-self: flex-end; background: var(--me); border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--others); border-bottom-left-radius: 2px; }
        .msg.sys { align-self: center; background: none; color: #64748b; font-size: 12px; }

        /* 通話コントロール */
        .call-ui { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #3b82f6; padding: 15px 25px; border-radius: 50px; z-index: 100; align-items: center; gap: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
        .btn-hangup { background: var(--danger); width: 40px; height: 40px; border-radius: 50%; padding: 0; display: flex; justify-content: center; align-items: center; }
        
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .btn-call { background: var(--call); width: 50px; font-size: 20px; }
        .btn-send { width: 70px; background: var(--accent); }
    </style>
</head>
<body>

<div class="box">
    <div id="setup">
        <h2>🌐 Online P2P</h2>
        <input type="text" id="room" placeholder="ルーム名" value="apple7">
        <input type="text" id="user" placeholder="名前" value="User1">
        <button onclick="join()" style="width:100%">参加する</button>
    </div>

    <div id="main">
        <header>
            <div id="room-id" style="font-weight:bold; color:var(--accent);">Room: ---</div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="member-count" style="font-size:12px; color:#94a3b8;">1人</span>
                <button onclick="logout()" style="background:var(--danger); padding:6px 12px; font-size:12px;">退出</button>
            </div>
        </header>

        <div id="call-active" class="call-ui">
            <span id="call-target-name">📞 通話中...</span>
            <button class="btn-hangup" onclick="endCall()">✖</button>
        </div>

        <div id="chat"></div>
        <div class="input-area">
            <button class="btn-call" onclick="startCall()">📞</button>
            <input type="text" id="mInput" placeholder="メッセージ..." onkeypress="if(event.keyCode==13) send()">
            <button class="btn-send" onclick="send()">送信</button>
        </div>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
    let peer, myName, roomCode, myFullId, hubPeer;
    let conns = {}; 
    let seenIds = new Set();
    let localStream, currentCall;

    function join() {
        roomCode = document.getElementById('room').value.trim();
        myName = document.getElementById('user').value.trim() || "Guest";
        if (!roomCode) return;
        const safeName = btoa(unescape(encodeURIComponent(myName))).replace(/=/g, "").substring(0, 5);
        myFullId = `${roomCode}_${safeName}_${Math.random().toString(36).substring(2, 7)}`;
        
        peer = new Peer(myFullId);

        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            document.getElementById('room-id').innerText = `Room: ${roomCode}`;
            log("System", "オンライン！通話可能です", "sys");
            initHub();
        });

        peer.on('connection', setupConn);

        // 💡 電話がかかってきた時の処理
        peer.on('call', async (call) => {
            if (confirm(`📞 ${call.peer.split('_')[1]} から着信です。応答しますか？`)) {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                call.answer(localStream);
                handleCall(call);
            } else {
                call.close();
            }
        });
    }

    async function startCall() {
        const targets = Object.keys(conns).filter(id => !id.endsWith("_HUB"));
        if (targets.length === 0) return alert("通話相手がいません");
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const call = peer.call(targets[0], localStream); // 最初の1人にかけます
            handleCall(call);
            log("System", "発信中...", "sys");
        } catch (e) {
            alert("マイクの使用を許可してください");
        }
    }

    function handleCall(call) {
        currentCall = call;
        document.getElementById('call-active').style.display = 'flex';
        
        call.on('stream', (stream) => {
            document.getElementById('remote-audio').srcObject = stream;
        });

        call.on('close', () => endCall());
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('call-active').style.display = 'none';
        currentCall = null;
        log("System", "通話終了", "sys");
    }

    // --- チャット・接続ロジック (前回同様) ---
    function initHub() {
        const hubId = `${roomCode}_HUB`;
        hubPeer = new Peer(hubId);
        hubPeer.on('open', () => hubPeer.on('connection', setupConn));
        hubPeer.on('error', (err) => {
            if (err.type === 'unavailable-id') connectTo(hubId);
            hubPeer.destroy();
        });
    }

    function connectTo(targetId) {
        if (conns[targetId] || targetId === myFullId) return;
        setupConn(peer.connect(targetId));
    }

    function setupConn(conn) {
        conn.on('open', () => {
            if (conns[conn.peer] && conns[conn.peer].open) return;
            conns[conn.peer] = conn;
            updateCount();
            broadcast({ type: 'members', list: Object.keys(conns).concat(myFullId) });
        });
        conn.on('data', data => {
            if (data.type === 'members') data.list.forEach(id => connectTo(id));
            else if (data.type === 'chat') {
                if (seenIds.has(data.id)) return;
                seenIds.add(data.id);
                log(data.u, data.m, "theirs");
                broadcast(data);
            }
        });
        conn.on('close', () => { delete conns[conn.peer]; updateCount(); });
    }

    function send() {
        const input = document.getElementById('mInput');
        if (!input.value) return;
        const data = { type: 'chat', id: Math.random(), u: myName, m: input.value };
        seenIds.add(data.id);
        log(myName, input.value, "mine");
        broadcast(data);
        input.value = "";
    }

    function broadcast(data) {
        Object.values(conns).forEach(c => { if (c && c.open) c.send(data); });
    }

    function log(u, m, type) {
        const c = document.getElementById('chat');
        const msgHtml = `<div class="msg ${type}">${type !== "sys" ? '<b>' + u + '</b>' : ''}${m}</div>`;
        c.insertAdjacentHTML('beforeend', msgHtml);
        c.scrollTop = c.scrollHeight;
    }

    function updateCount() {
        const activeIds = Object.values(conns).filter(c => c.open && !c.peer.endsWith("_HUB")).map(c => c.peer);
        document.getElementById('member-count').innerText = `${new Set(activeIds).size + 1}人`;
    }

    function logout() { location.reload(); }
</script>
</body>
</html>
