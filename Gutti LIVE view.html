<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Viewer - Ultra Low Latency</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 15px; position: absolute; top: 0; width: 100%; box-sizing: border-box; z-index: 10; display: flex; justify-content: center; gap: 10px; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; width: 120px; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        #status-tag { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; font-size: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div id="end-screen" class="overlay">
        <h1 style="color: #ef4444;">📴 配信が終了しました</h1>
        <button onclick="location.reload()" style="background:#475569;">トップに戻る</button>
    </div>

    <div class="container">
        <div class="header">
            <input type="text" id="room-id" value="live2026" placeholder="合言葉">
            <button id="joinBtn" onclick="joinLive()">視聴開始</button>
        </div>

        <video id="remoteVideo" autoplay playsinline controls></video>
        <div id="status-tag">待機中</div>
    </div>

    <script>
        let peer = null;

        function joinLive() {
            const room = document.getElementById('room-id').value;
            if (!room) return;

            const myId = `${room}-viewer-${Math.floor(Math.random() * 10000)}`;
            peer = new Peer(myId);

            document.getElementById('joinBtn').innerText = "接続中...";

            peer.on('open', () => {
                const conn = peer.connect(`${room}-host`);
                
                conn.on('open', () => {
                    document.getElementById('status-tag').innerText = "📡 接続済み";
                    document.getElementById('joinBtn').style.display = "none";
                });

                conn.on('close', () => {
                    document.getElementById('end-screen').style.display = 'flex';
                });
            });

            peer.on('call', call => {
                call.answer();
                call.on('stream', stream => {
                    const videoEl = document.getElementById('remoteVideo');
                    videoEl.srcObject = stream;
                    document.getElementById('status-tag').innerText = "🔴 LIVE受信中 (低遅延モード)";
                    
                    // 遅延を極限まで削る設定
                    if ('receiver' in call && call.peerConnection) {
                        call.peerConnection.getReceivers().forEach(r => {
                            if (r.playoutDelayHint !== undefined) r.playoutDelayHint = 0;
                        });
                    }
                });
            });

            peer.on('error', () => {
                alert("配信が見つかりません。合言葉を確認してください。");
                location.reload();
            });
        }
    </script>
</body>
</html>
