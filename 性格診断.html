<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI診断 + 恋愛・相性チェック</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --love: #ff7675;
            --good: #00b894;
            --caution: #fdcb6e;
            --dark: #2d3436;
            --bg: #f9f9fb;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 550px;
            text-align: center;
        }

        .progress-bar {
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        #progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--love));
            width: 0%;
            transition: width 0.4s ease;
        }

        .category-label { font-size: 0.85rem; font-weight: bold; color: #a0a0a0; margin-bottom: 5px; display: block; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); }

        .question-box p {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.6;
            min-height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options { display: flex; flex-direction: column; gap: 12px; }

        button {
            padding: 18px;
            border: 2px solid #f1f3f5;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        button:hover {
            border-color: var(--primary);
            background-color: #f8f7ff;
            transform: translateY(-2px);
        }

        .hidden { display: none; }

        /* 結果表示 */
        .result-card { text-align: left; }
        .type-code { font-size: 3rem; color: var(--primary); font-weight: 900; margin: 0; line-height: 1; }
        .type-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; color: #555; display: block; }
        
        .section {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .section h3 { margin-top: 0; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        
        .compatibility { display: flex; gap: 10px; margin-top: 10px; }
        .comp-box {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }
        .best { background: #e6fffb; border: 1px solid var(--good); }
        .best .label { color: var(--good); font-weight: bold; font-size: 0.8rem; }
        .worst { background: #fffbe6; border: 1px solid var(--caution); }
        .worst .label { color: #d4a017; font-weight: bold; font-size: 0.8rem; }
        .comp-type { font-weight: 900; font-size: 1.2rem; display: block; margin-top: 4px; }

        .disclaimer {
            font-size: 0.75rem;
            color: #bbb;
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .retry-btn {
            background: var(--dark);
            color: white;
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="progress-bar"><div id="progress"></div></div>
        <span class="category-label" id="category-name">診断中...</span>
        <div class="question-box">
            <p id="question-text">読み込み中...</p>
            <div class="options">
                <button onclick="answer('A')" id="btn-a"></button>
                <button onclick="answer('B')" id="btn-b"></button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h1>診断結果</h1>
        <div class="result-card">
            <h2 id="res-type" class="type-code">----</h2>
            <span id="res-name" class="type-name">----</span>
            
            <div class="section">
                <h3>💡 あなたの性格</h3>
                <p id="res-desc" style="font-size: 0.9rem; line-height: 1.6; margin: 0;"></p>
            </div>

            <div class="section" style="background: #fff5f5;">
                <h3>❤️ 恋愛傾向</h3>
                <p id="res-love" style="font-size: 0.9rem; line-height: 1.6; margin: 0;"></p>
            </div>

            <div class="section">
                <h3>🤝 相性チェック</h3>
                <div class="compatibility">
                    <div class="comp-box best">
                        <span class="label">最高！</span>
                        <span id="res-best" class="comp-type">----</span>
                    </div>
                    <div class="comp-box worst">
                        <span class="label">注意...</span>
                        <span id="res-worst" class="comp-type">----</span>
                    </div>
                </div>
                <p style="font-size: 0.75rem; color: #888; margin-top: 10px; text-align: center;">※相互に補い合える関係や、価値観の近いタイプを表示しています。</p>
            </div>
        </div>

        <button class="retry-btn" onclick="location.reload()">もう一度診断する</button>

        <p class="disclaimer">
            この結果は統計的な傾向を示すものであり、実際の人間関係や性格の全てを決定付けるものではありません。本当の結果と異なる可能性があることをご理解の上、お楽しみください。
        </p>
    </div>
</div>

<script>
    const questions = [
        { q: "初めて会う人が多い集まりでは？", a: "自分から進んで話しかけに行く", b: "話しかけられるのを待つか、端にいる", trait: "EI" },
        { q: "物語を読むときに注目するのは？", a: "現実に起こりそうなリアルな展開", b: "想像が膨らむような不思議な展開", trait: "SN" },
        { q: "友達が悩んでいるときにかける言葉は？", a: "「解決するためにこうしたら？」", b: "「その気持ち、すごくよくわかるよ」", trait: "TF" },
        { q: "夏休みの宿題はどう進める？", a: "最初に計画を立ててコツコツ終わらせる", b: "最後にまとめてやるか、気分で進める", trait: "JP" },
        { q: "恋人を選ぶときに重視するのは？", a: "一緒にいて刺激的で楽しいこと", b: "穏やかで心が落ち着くこと", trait: "LoveStyle" },
        { q: "記念日やお祝いごとは？", a: "派手にサプライズや計画をしたい", b: "二人でいつも通りゆっくり過ごしたい", trait: "LoveVibe" }
    ];

    const mbtiData = {
        "ISTJ": { name: "真面目な管理人", desc: "誠実で責任感が強く、ルールを大切にします。堅実な一歩を積み重ねる努力家です。", best: "ENFP", worst: "ENFJ" },
        "ISFJ": { name: "優しい守護者", desc: "思いやりがあり、人のサポートを惜しみません。周囲を穏やかに見守る平和主義者です。", best: "ENTP", worst: "ENTJ" },
        "INFJ": { name: "静かな理想家", desc: "強い信念を持ち、人の心を見抜く力があります。理想の未来を静かに見つめる洞察の人です。", best: "ESTP", worst: "ESTJ" },
        "INTJ": { name: "完璧な戦略家", desc: "論理的で自立心が強く、複雑な仕組みを理解するのが得意。常に一歩先を読む知性派です。", best: "ESFP", worst: "ESFJ" },
        "ISTP": { name: "冷静な実務家", desc: "手先が器用で観察力が高いです。スリルや挑戦を好み、冷静に問題を解決します。", best: "ENFJ", worst: "ENFP" },
        "ISFP": { name: "感性の芸術家", desc: "穏やかで謙虚、自分の価値観を大切にします。美しいものや自由を愛する優しい心の持ち主です。", best: "ENTJ", worst: "ENTP" },
        "INFP": { name: "心の仲介者", desc: "感受性が豊かで理想を追い求めます。自分に正直に、優しく誠実に生きるタイプです。", best: "ESTJ", worst: "ESTP" },
        "INTP": { name: "論理の思考家", desc: "知的好奇心が旺盛で分析が大好き。常識に縛られない独創的なアイデアを生み出します。", best: "ESFJ", worst: "ESFP" },
        "ESTP": { name: "行動の挑戦者", desc: "今この瞬間を楽しみ、エネルギッシュに動きます。スリルを好み、変化に強い行動派です。", best: "INFJ", worst: "INFP" },
        "ESFP": { name: "陽気なスター", desc: "周囲を明るくするムードメーカー。人生を全力で楽しみ、人々を惹きつける魅力があります。", best: "INTJ", worst: "INTP" },
        "ENFP": { name: "自由な広報家", desc: "ポジティブで創造的。可能性を見つけるのが得意で、情熱的に周囲を巻き込みます。", best: "ISTJ", worst: "ISTP" },
        "ENTP": { name: "知的な開拓者", desc: "頭の回転が速く議論が大好き。新しいアイデアで常識を塗り替えていく革新者です。", best: "ISFJ", worst: "ISFP" },
        "ESTJ": { name: "頼れるリーダー", desc: "組織をまとめる力が抜群。現実的かつ効率的で、やるべきことを完璧にこなします。", best: "INFP", worst: "INFJ" },
        "ESFJ": { name: "社交的な支援者", desc: "親切で面倒見が良く、誰からも好かれます。和を大切にし、周囲を幸せにする天才です。", best: "INTP", worst: "INTJ" },
        "ENFJ": { name: "熱い指導者", desc: "共感力が高く、人々を励まし導きます。他者の幸せを自分のことのように喜べる情熱家です。", best: "ISTP", worst: "ISTJ" },
        "ENTJ": { name: "大胆な司令官", desc: "決断力に溢れ、目標達成のために突き進みます。大きなビジョンを描き、実行する力があります。", best: "ISFP", worst: "ISFJ" }
    };

    let currentIndex = 0;
    let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    let loveScore = 0;

    function updateQuiz() {
        const q = questions[currentIndex];
        document.getElementById("progress").style.width = ((currentIndex / questions.length) * 100) + "%";
        document.getElementById("category-name").innerText = currentIndex < 4 ? "【性格診断セクション】" : "【恋愛診断セクション】";
        document.getElementById("question-text").innerText = q.q;
        document.getElementById("btn-a").innerText = q.a;
        document.getElementById("btn-b").innerText = q.b;
    }

    window.answer = function(choice) {
        const q = questions[currentIndex];
        if (currentIndex < 4) {
            if (choice === 'A') scores[q.trait[0]]++;
            else scores[q.trait[1]]++;
        } else {
            if (choice === 'A') loveScore++;
        }

        currentIndex++;
        if (currentIndex < questions.length) {
            updateQuiz();
        } else {
            showResult();
        }
    };

    function showResult() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        let type = "";
        type += scores.E >= scores.I ? "E" : "I";
        type += scores.S >= scores.N ? "S" : "N";
        type += scores.T >= scores.F ? "T" : "F";
        type += scores.J >= scores.P ? "J" : "P";

        const data = mbtiData[type];
        document.getElementById("res-type").innerText = type;
        document.getElementById("res-name").innerText = data.name;
        document.getElementById("res-desc").innerText = data.desc;
        document.getElementById("res-best").innerText = data.best;
        document.getElementById("res-worst").innerText = data.worst;

        let loveText = "";
        if (loveScore >= 2) {
            loveText = "あなたは恋愛に対して情熱的で、お互いを高め合える「刺激的な関係」を好むようです。好きな人には積極的にアプローチし、楽しい時間を共有することを重視します。";
        } else {
            loveText = "あなたは恋愛に対して誠実で、「心の安らぎ」を大切にするタイプです。信頼できるパートナーとゆっくり時間をかけて深い絆を築くことを好みます。";
        }
        document.getElementById("res-love").innerText = loveText;
    }

    updateQuiz();
</script>

</body>
</html>
