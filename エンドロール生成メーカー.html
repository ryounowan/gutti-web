<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>エンドロールメーカー（コードセーブ＆位置同期版）</title>
<script src="p2p-guard.js"></script>
    <style>
        :root { --accent: #e50914; --bg: #1a1a1a; --panel: #2d2d2d; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #setup-screen { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .row { display: flex; gap: 8px; background: var(--panel); padding: 10px; border-radius: 8px; margin-bottom: 8px; align-items: center; border: 1px solid #444; }
        textarea { flex: 1; padding: 10px; border-radius: 4px; border: none; background: #111; color: #fff; min-height: 40px; }
        select, input, .btn-sys { padding: 8px; border-radius: 4px; border: none; background: #444; color: #fff; cursor: pointer; }
        .btn-add { background: #007bff; padding: 10px 15px; font-weight: bold; border-radius: 5px; color: white; border: none; }
        .btn-code { background: #6c757d; padding: 10px 15px; font-weight: bold; border-radius: 5px; color: white; border: none; }
        .btn-play { background: var(--accent); padding: 10px 25px; font-weight: bold; border-radius: 5px; color: white; cursor: pointer; margin-left: auto; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .hidden { display: none !important; }
        #code-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; padding: 50px; }
        #code-area { flex: 1; background: #111; color: #0f0; font-family: monospace; padding: 20px; border: 1px solid #333; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="controls" style="display:flex; gap:12px; margin-bottom:15px; align-items:center; flex-wrap:wrap;">
            <button class="btn-add" onclick="addRow()">➕ テキスト</button>
            <button class="btn-add" style="background:#28a745" onclick="addImageRow()">📷 画像</button>
            <button class="btn-code" onclick="openCodeModal('export')">📤 コードを出す</button>
            <button class="btn-code" style="background:#8540f5" onclick="openCodeModal('import')">📥 コードを読み込む</button>
            
            <div style="background:#333; padding:10px 15px; border-radius:10px; display:flex; gap:15px; align-items:center; border:1px solid #555;">
                <select id="bg-color"><option value="#000000">黒</option><option value="#00ff00">緑</option></select>
                <select id="mode-select">
                    <option value="v-center">縦：中央</option><option value="v-left">縦：左</option><option value="v-right">縦：右</option>
                    <option value="h-low">横：下(1/4)</option><option value="h-high">横：上(1/4)</option>
                </select>
                <input type="number" id="sec" value="15" style="width:50px;"> 秒
            </div>
            <button class="btn-play" onclick="startRecording()">🎬 録画開始</button>
        </div>
        <div id="row-container"></div>
    </div>

    <div id="code-modal" class="hidden">
        <h2 id="modal-title">コード</h2>
        <textarea id="code-area" placeholder="ここにコードを貼り付けてください"></textarea>
        <div style="display:flex; gap:10px;">
            <button id="modal-action-btn" class="btn-add" style="width:200px;">実行</button>
            <button class="btn-code" onclick="document.getElementById('code-modal').classList.add('hidden')">閉じる</button>
        </div>
    </div>

    <div id="cancel-hint" class="hidden">🔴 録画中... [Esc]で破棄</div>
    <canvas id="render-canvas" class="hidden"></canvas>

    <script>
        const container = document.getElementById('row-container');
        const canvas = document.getElementById('render-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let isRecording = false, isCancelled = false, animationId = null, globalRecorder = null, finishTime = null;

        window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isRecording) { isCancelled = true; stopEverything(); } });

        // --- コード型ロードセーブロジック ---
        function openCodeModal(mode) {
            const modal = document.getElementById('code-modal');
            const area = document.getElementById('code-area');
            const btn = document.getElementById('modal-action-btn');
            modal.classList.remove('hidden');

            if (mode === 'export') {
                document.getElementById('modal-title').innerText = "設定コード (コピーして保存してください)";
                const data = {
                    bg: document.getElementById('bg-color').value,
                    mode: document.getElementById('mode-select').value,
                    sec: document.getElementById('sec').value,
                    items: Array.from(document.querySelectorAll('.row')).map(r => {
                        const img = r.querySelector('.line-img');
                        return img ? { type: 'img', val: img.value, sz: r.querySelector('.line-img-size').value, name: r.querySelector('.img-name').innerText }
                                   : { type: 'text', val: r.querySelector('.line-text').value, sz: r.querySelector('.line-size').value, col: r.querySelector('.line-color').value };
                    })
                };
                area.value = btoa(unescape(encodeURIComponent(JSON.stringify(data)))); // Base64化
                btn.innerText = "コピーする";
                btn.onclick = () => { area.select(); document.execCommand('copy'); alert("コピーしました！"); };
            } else {
                document.getElementById('modal-title').innerText = "コードを貼り付けてください";
                area.value = "";
                btn.innerText = "読み込む";
                btn.onclick = () => {
                    try {
                        const data = JSON.parse(decodeURIComponent(escape(atob(area.value))));
                        document.getElementById('bg-color').value = data.bg;
                        document.getElementById('mode-select').value = data.mode;
                        document.getElementById('sec').value = data.sec;
                        container.innerHTML = "";
                        data.items.forEach(i => i.type === 'img' ? addImageRow(i.val, i.name, i.sz) : addRow(i.val, i.sz, i.col));
                        modal.classList.add('hidden');
                    } catch(e) { alert("無効なコードです"); }
                };
            }
        }

        function stopEverything() {
            isRecording = false; if (animationId) cancelAnimationFrame(animationId);
            if (globalRecorder && globalRecorder.state !== 'inactive') globalRecorder.stop();
            canvas.classList.add('hidden'); document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('cancel-hint').classList.add('hidden');
        }

        function addRow(val = "", size = "32", color = "#ffffff") {
            const div = document.createElement('div');
            div.className = 'row';
            div.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:2px;"><button class="btn-sys" onclick="moveRow(this, -1)">↑</button><button class="btn-sys" onclick="moveRow(this, 1)">↓</button></div>
                <textarea class="line-text" placeholder="テキスト">${val}</textarea>
                <select class="line-size"><option value="120">特大</option><option value="60">大</option><option value="32" ${size=="32"?'selected':''}>中</option><option value="20">小</option></select>
                <input type="color" class="line-color" value="${color}">
                <button class="btn-sys" style="background:#600" onclick="this.parentElement.remove()">✕</button>`;
            container.appendChild(div);
        }

        function addImageRow(dataUrl = "", fileName = "", size = "400") {
            const create = (data, name, sz) => {
                const div = document.createElement('div'); div.className = 'row';
                div.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:2px;"><button class="btn-sys" onclick="moveRow(this, -1)">↑</button><button class="btn-sys" onclick="moveRow(this, 1)">↓</button></div>
                    <span class="img-name" style="flex:1; font-size:12px;">📷 ${name}</span>
                    <input type="hidden" class="line-img" value="${data}">
                    <select class="line-img-size"><option value="800">最大</option><option value="400" ${sz=="400"?'selected':''}>標準</option><option value="200">最小</option></select>
                    <button class="btn-sys" style="background:#600" onclick="this.parentElement.remove()">✕</button>`;
                container.appendChild(div);
            };
            if (dataUrl) { create(dataUrl, fileName, size); return; }
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = (e) => {
                const f = e.target.files[0]; if(!f) return;
                const r = new FileReader();
                r.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const tmp = document.createElement('canvas'); const s = Math.min(1, 1000/img.width);
                        tmp.width = img.width*s; tmp.height = img.height*s;
                        tmp.getContext('2d').drawImage(img,0,0,tmp.width,tmp.height);
                        create(tmp.toDataURL('image/jpeg', 0.8), f.name, "400");
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(f);
            };
            input.click();
        }

        function moveRow(btn, dir) {
            const row = btn.closest('.row');
            if (dir === -1 && row.previousElementSibling) container.insertBefore(row, row.previousElementSibling);
            else if (dir === 1 && row.nextElementSibling) container.insertBefore(row.nextElementSibling, row);
        }

        async function startRecording() {
            const rows = document.querySelectorAll('.row');
            const mode = document.getElementById('mode-select').value;
            const bg = document.getElementById('bg-color').value;
            const duration = parseFloat(document.getElementById('sec').value) * 1000;
            const assets = [];
            for (let r of rows) {
                const imgData = r.querySelector('.line-img');
                if (imgData) {
                    const i = new Image(); i.src = imgData.value; await i.decode();
                    assets.push({ type: 'img', content: i, w: parseInt(r.querySelector('.line-img-size').value) });
                } else {
                    assets.push({ type: 'text', content: r.querySelector('.line-text').value, size: parseInt(r.querySelector('.line-size').value), color: r.querySelector('.line-color').value });
                }
            }
            if (!assets.length) return;

            isRecording = true; isCancelled = false; finishTime = null;
            canvas.classList.remove('hidden'); document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('cancel-hint').classList.remove('hidden');
            canvas.width = 1920; canvas.height = 1080;

            const stream = canvas.captureStream(60);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 18000000 });
            globalRecorder = recorder;
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => { if (!isCancelled && chunks.length > 0) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/mp4' })); a.download = `endroll.mp4`; a.click(); } stopEverything(); };
            recorder.start();
            const startTime = performance.now();

            function render(now) {
                if (!isRecording) return;
                const progress = (now - startTime) / duration;
                ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
                let offset = 0, lastPos = 0;

                assets.forEach((a, index) => {
                    ctx.fillStyle = a.color;
                    if (mode.startsWith('v')) {
                        let tx = canvas.width / 2;
                        if (mode === 'v-left') tx = canvas.width * 0.25;
                        if (mode === 'v-right') tx = canvas.width * 0.75;
                        const y = (canvas.height * 1.1) - (progress * canvas.height * 2.8) + offset;
                        if (a.type === 'text') {
                            ctx.font = `bold ${a.size}px sans-serif`; ctx.textAlign = "center";
                            const lines = a.content.split('\n');
                            lines.forEach((l, i) => ctx.fillText(l, tx, y + (i * a.size * 1.5)));
                            const h = lines.length * a.size * 1.5;
                            offset += h + 80; if(index === assets.length - 1) lastPos = y + h;
                        } else {
                            const dw = Math.min(a.w, canvas.width * 0.4), dh = a.content.height * (dw / a.content.width);
                            ctx.drawImage(a.content, tx - dw/2, y, dw, dh);
                            offset += dh + 80; if(index === assets.length - 1) lastPos = y + dh;
                        }
                    } else {
                        // --- 横モード改善: 垂直センター合わせ ---
                        let ty = (mode === 'h-high') ? canvas.height * 0.2 : canvas.height * 0.75;
                        const x = (canvas.width * 1.05) - (progress * canvas.width * 3.5) + offset;
                        const baseFontSize = 32; // 基準の高さ

                        if (a.type === 'text') {
                            ctx.font = `bold ${a.size}px sans-serif`; ctx.textAlign = "left";
                            const lines = a.content.split('\n');
                            lines.forEach((l, i) => ctx.fillText(l, x, ty + (i * a.size * 1.3)));
                            let w = ctx.measureText(a.content.split('\n')[0]).width;
                            offset += w + 200; if(index === assets.length - 1) lastPos = x + w;
                        } else {
                            const dh = Math.min(100, canvas.height * 0.1); // 横モード用画像サイズ制限
                            const dw = a.content.width * (dh / a.content.height);
                            // テキストの1行目(a.sizeが32の場合)の高さの中心に画像を合わせる
                            const textTopOffset = (32 * 0.8) / 2 - (dh / 2); 
                            ctx.drawImage(a.content, x, ty + textTopOffset, dw, dh);
                            offset += dw + 200; if(index === assets.length - 1) lastPos = x + dw;
                        }
                    }
                });

                if (lastPos < 0 && finishTime === null) finishTime = now;
                if (finishTime !== null && (now - finishTime) >= 500) { recorder.stop(); return; }
                if (progress < 2.0) animationId = requestAnimationFrame(render); else recorder.stop();
            }
            animationId = requestAnimationFrame(render);
        }
    </script>
</body>
</html>
