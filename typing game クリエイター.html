<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUTTI INTERACTIVE ENGINE -THE CORE- [v1.7.5]</title>
    <style>
        :root { --bg-dark: #08080c; --panel-bg: #12121c; --accent: #00e5ff; --text: #ffffff; }
        body { margin: 0; font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: #e0e0e8; display: flex; height: 100vh; overflow: hidden; }
        
        header { background: #040407; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100; height: 60px; border-bottom: 2px solid var(--accent); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        header h1 { margin: 0; font-size: 1.1rem; color: #fff; letter-spacing: 2px; font-weight: 800; }
        
        .main-layout { display: flex; flex: 1; margin-top: 60px; height: calc(100vh - 60px); width: 100%; }
        
        /* エディター設定ゾーン */
        .editor-side { flex: 1; padding: 20px; overflow-y: auto; border-right: 1px solid #1f1f2e; box-sizing: border-box; }
        .config-box { background: #0b0b12; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1f1f2e; }
        .color-pickers { display: flex; gap: 15px; margin-top: 10px; }
        .color-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .color-group input[type="color"] { height: 38px; padding: 0; border: 1px solid #28283d; cursor: pointer; background: transparent; border-radius: 4px; }

        /* タイムラインノード */
        .timeline-item { background: var(--panel-bg); border-left: 6px solid #555; padding: 15px; margin-bottom: 15px; border-radius: 6px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .timeline-item.stage_marker { border-left-color: #9b59b6; background: #18121c; }
        .timeline-item.story { border-left-color: #3498db; }
        .timeline-item.action { border-left-color: #e74c3c; background: #1c1214; }
        .timeline-item.inspection { border-left-color: #f1c40f; background: #1c1b12; }
        .timeline-item.effect { border-left-color: #e67e22; background: #1c1612; }
        .timeline-item.credits { border-left-color: #2ecc71; background: #121c15; }
        
        .item-header { margin-bottom: 10px; font-size: 0.8rem; font-weight: bold; color: #888; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { margin-bottom: 12px; }
        .form-inline { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .form-inline .form-group { flex: 1; min-width: 80px; }
        label { display: block; font-size: 0.75rem; color: #a0a0b0; margin-bottom: 5px; font-weight: bold; letter-spacing: 0.5px; }
        textarea, input, select { width: 100%; background: #05050a; border: 1px solid #28283d; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }
        textarea { height: 65px; resize: vertical; font-family: monospace; }
        input[type="range"] { padding: 0; height: 20px; }
        
        .btn { background: #252538; color: #fff; border: none; padding: 10px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s; text-decoration: none; display: inline-block; text-align: center; }
        .btn:hover { filter: brightness(1.2); }
        .btn-story { background: #2980b9; }
        .btn-action { background: #c0392b; }
        .btn-inspect { background: #d35400; }
        .btn-marker { background: #8e44ad; }
        .btn-effect { background: #e67e22; }
        .btn-credits { background: #2ecc71; color: #000; }
        .btn-delete { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 4px 8px; font-size: 0.7rem; border-radius: 3px; cursor: pointer; }
        .btn-delete:hover { background: #e74c3c; color: #fff; }

        /* リアルタイムプレビュー */
        .preview-side { flex: 1; background: #040406; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; box-sizing: border-box; }
        .preview-wrapper { width: 100%; height: 100%; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; }
        .preview-wrapper.pc-mode { width: 100%; max-width: 800px; aspect-ratio: 16 / 9; height: auto; border: 4px solid #222; border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,0.7); overflow: hidden; position: relative; }
        .preview-wrapper.phone-mode { width: 375px; height: 100%; max-height: 720px; border: 6px solid #222; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.7); overflow: hidden; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        .img-preview { max-height: 55px; display: block; margin-top: 8px; border-radius: 4px; border: 1px solid #333; background: #000; object-fit: contain; }

        /* ウェルカムダッシュボード */
        .welcome-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 4, 6, 0.95); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .welcome-modal { background: #11111a; border: 2px solid var(--accent); border-radius: 12px; width: 90%; max-width: 650px; padding: 30px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .welcome-title { text-align: center; font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; color: #fff; margin-top: 0; margin-bottom: 5px; }
        .welcome-subtitle { text-align: center; font-size: 0.85rem; color: var(--accent); margin-bottom: 30px; letter-spacing: 1px; }
        .dashboard-grid { display: flex; flex-direction: column; gap: 20px; }
        .dashboard-section { background: #08080c; border: 1px solid #252538; padding: 15px; border-radius: 8px; }
        .dashboard-section h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: #a0a0b0; border-left: 3px solid var(--accent); padding-left: 8px; }
        .recent-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
        .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #12121c; margin-bottom: 6px; border-radius: 4px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .recent-item:hover { background: #1a1a2e; border-color: var(--accent); }
        .recent-name { font-weight: bold; color: #fff; font-size: 0.9rem; }
        .recent-date { font-size: 0.75rem; color: #666; }
        .no-recent { text-align: center; color: #444; font-size: 0.85rem; padding: 10px 0; }
    </style>
    
    <script>
        let gameSteps = [
            { id: 1, type: "stage_marker", stageNum: 1, stageName: "プロローグ: 認証シークエンス" },
            { id: 2, type: "effect", effectType: "glitch", duration: 1.5 },
            { id: 3, type: "story", text: "「システムコア起動。身元識別コードを登録してください」", charImg: "", imgW: 180, imgH: 180, imgX: 50, imgY: 35 },
            { id: 4, type: "action", actionType: "free", saveTag: "name", paramA: "識別コードを入力してください", paramB: "8", charImg: "", imgW: 150, imgH: 150, imgX: 50, imgY: 50 },
            { id: 5, type: "stage_marker", stageNum: 2, stageName: "第二段階: タイピングテスト" },
            { id: 6, type: "action", actionType: "typing", saveTag: "test", paramA: "テストキーを入力せよ", paramB: "GUTTI", charImg: "", imgW: 150, imgH: 150, imgX: 50, imgY: 50 }
        ];
        let currentProjectId = "project_default";

        function renderRecentProjectsList() {
            const container = document.getElementById('recent-projects-container');
            if(!container) return; container.innerHTML = '';
            let history = [];
            try { history = JSON.parse(localStorage.getItem('gutti_v175_projects_history') || '[]'); } catch(e) { history = []; }
            if(history.length === 0) {
                container.innerHTML = `<li class="no-recent">最近使用したプロジェクトはありません</li>`;
                return;
            }
            history.sort((a,b) => b.updated - a.updated).slice(0, 5).forEach(proj => {
                const li = document.createElement('li'); li.className = 'recent-item';
                const dateStr = new Date(proj.updated).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
                li.innerHTML = `<span class="recent-name">📁 ${proj.title}</span><span class="recent-date">${dateStr}</span>`;
                li.onclick = () => { loadProjectFromHistory(proj.id); };
                container.appendChild(li);
            });
        }

        function loadProjectFromHistory(id) {
            const savedData = localStorage.getItem(`gutti_proj_data_${id}`);
            if(savedData) {
                try {
                    applyProjectDataToEditor(JSON.parse(savedData), id);
                    document.getElementById('welcome-screen').style.display = 'none';
                } catch(e) { alert("履歴データの解析に失敗しました。"); }
            }
        }

        function createNewProject() {
            const titleInput = document.getElementById('new-project-title').value.trim();
            if(!titleInput) { alert("プロジェクト名を入力してください。"); return; }
            currentProjectId = "proj_" + Date.now();
            const newData = {
                title: titleInput, deviceMode: "pc", bgColor: "#030305", textColor: "#e2e2e9", accentColor: "#00e5ff", bgmMode: "cyber",
                steps: gameSteps
            };
            applyProjectDataToEditor(newData, currentProjectId);
            saveData();
            document.getElementById('welcome-screen').style.display = 'none';
        }

        function showDashboard() { renderRecentProjectsList(); document.getElementById('welcome-screen').style.display = 'flex'; }
        function updateProjectTitle(title) { document.getElementById('header-project-name').textContent = `[ ${title} ]`; }

        function applyProjectDataToEditor(data, id) {
            currentProjectId = id; gameSteps = data.steps || [];
            document.getElementById('cfg-title').value = data.title || "GUTTI INTERACTIVE SYSTEM";
            document.getElementById('cfg-device').value = data.deviceMode || "pc";
            document.getElementById('cfg-bg-color').value = data.bgColor || "#030305";
            document.getElementById('cfg-text-color').value = data.textColor || "#e2e2e9";
            document.getElementById('cfg-accent-color').value = data.accentColor || "#00e5ff";
            document.getElementById('cfg-bgm').value = data.bgmMode || "cyber";
            updateProjectTitle(data.title || "GUTTI INTERACTIVE SYSTEM");
            updateDeviceMode(); renderTimeline(); runPreview();
        }

        function updateDeviceMode() {
            const mode = document.getElementById('cfg-device').value;
            const wrap = document.getElementById('wrapper-element');
            if(wrap) wrap.className = (mode === 'pc') ? "preview-wrapper pc-mode" : "preview-wrapper phone-mode";
        }

        function saveData() {
            const title = document.getElementById('cfg-title').value;
            const data = { 
                title: title, deviceMode: document.getElementById('cfg-device').value,
                bgColor: document.getElementById('cfg-bg-color').value, textColor: document.getElementById('cfg-text-color').value,
                accentColor: document.getElementById('cfg-accent-color').value, bgmMode: document.getElementById('cfg-bgm').value, steps: gameSteps 
            };
            localStorage.setItem(`gutti_proj_data_${currentProjectId}`, JSON.stringify(data));
            let history = []; try { history = JSON.parse(localStorage.getItem('gutti_v175_projects_history') || '[]'); } catch(e){}
            history = history.filter(x => x.id !== currentProjectId);
            history.push({ id: currentProjectId, title: title, updated: Date.now() });
            localStorage.setItem('gutti_v175_projects_history', JSON.stringify(history));
        }

        function clearAllData() {
            if(confirm("タイムラインの内容を初期化しますか？")) {
                applyProjectDataToEditor({ title: "GUTTI INTERACTIVE SYSTEM", deviceMode: "pc", bgColor: "#030305", textColor: "#e2e2e9", accentColor: "#00e5ff", bgmMode: "none", steps: [] }, currentProjectId);
                saveData();
            }
        }

        function exportGTF() {
            const title = document.getElementById('cfg-title').value;
            const projectData = { engine_signature: "GUTTI_INTERACTIVE_ENGINE_PROJECT", version: "1.7.5", title: title, deviceMode: document.getElementById('cfg-device').value, bgColor: document.getElementById('cfg-bg-color').value, textColor: document.getElementById('cfg-text-color').value, accentColor: document.getElementById('cfg-accent-color').value, bgmMode: document.getElementById('cfg-bgm').value, steps: gameSteps, timestamp: Date.now() };
            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = title.replace(/[^a-zA-Z0-9-_]/g, "_") + ".gtf"; a.click();
        }

        function importGTF(input, isFromDashboard = false) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.engine_signature !== "GUTTI_INTERACTIVE_ENGINE_PROJECT") { alert("不正な形式です"); return; }
                    applyProjectDataToEditor(parsed, "proj_imported_" + Date.now()); saveData();
                    if(isFromDashboard) document.getElementById('welcome-screen').style.display = 'none';
                } catch(err) { alert("エラー: " + err.message); }
            };
            reader.readAsText(file); input.value = "";
        }
    </script>
</head>
<body>

    <div class="welcome-overlay" id="welcome-screen">
        <div class="welcome-modal">
            <div class="welcome-title">GUTTI INTERACTIVE ENGINE</div>
            <div class="welcome-subtitle">CORE TERMINAL v1.7.5</div>
            
            <div class="dashboard-grid">
                <div class="dashboard-section">
                    <h3>✨ 新規プロジェクトを作成</h3>
                    <div style="display: flex; gap: 10px; align-items: flex-end;">
                        <div style="flex: 1;">
                            <label>プロジェクト名を入力</label>
                            <input type="text" id="new-project-title" value="MY INTERACTIVE SYSTEM">
                        </div>
                        <button class="btn" style="background: var(--accent); color: #000; height: 40px;" onclick="createNewProject()">新規作成</button>
                    </div>
                </div>
                <div class="dashboard-section" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3>📂 外部データからロード</h3>
                        <span style="font-size: 0.8rem; color: #666;">過去にエクスポートした .gtf ファイルを開きます</span>
                    </div>
                    <button class="btn" style="background: #8e44ad;" onclick="document.getElementById('file-import-dashboard').click()">ファイルを選択</button>
                    <input type="file" id="file-import-dashboard" accept=".gtf" style="display:none;" onchange="importGTF(this, true)">
                </div>
                <div class="dashboard-section">
                    <h3>🕒 最近のプロジェクトから開く</h3>
                    <ul class="recent-list" id="recent-projects-container"></ul>
                </div>
            </div>
        </div>
    </div>

    <header>
        <h1>GUTTI INTERACTIVE ENGINE <span style="color:var(--accent);" id="header-project-name">[未定義]</span></h1>
        <div style="display: flex; gap: 8px;">
            <button class="btn" style="background:#252538;" onclick="showDashboard()">🏠 ダッシュボード</button>
            <button class="btn" style="background:#2980b9;" onclick="document.getElementById('file-import-gtf').click()">📂 .gtf読込</button>
            <input type="file" id="file-import-gtf" accept=".gtf" style="display:none;" onchange="importGTF(this, false)">
            <button class="btn" style="background:#8e44ad;" onclick="exportGTF()">↓ .gtf書き出し</button>
            <button class="btn" style="background:#00b894;" onclick="exportHTML()">↓ HTML書き出し</button>
            <button class="btn" style="background:#c0392b;" onclick="clearAllData()">🔄 全消去</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="editor-side">
            <div class="config-box">
                <h3 style="margin:0 0 10px 0; font-size:0.95rem; letter-spacing:1px;">⚙️ グローバルシステム定義</h3>
                <div class="form-inline">
                    <div class="form-group" style="flex: 2;">
                        <label>プロジェクト名 / アプリケーションタイトル</label>
                        <input type="text" id="cfg-title" value="GUTTI INTERACTIVE SYSTEM" onchange="updateProjectTitle(this.value); saveData(); runPreview();">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>📱 ターゲットデバイス版</label>
                        <select id="cfg-device" onchange="updateDeviceMode(); saveData(); runPreview();">
                            <option value="phone">スマホ対応版 (縦型)</option>
                            <option value="pc" selected>パソコン専用版 (16:9)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>🎵 ループBGMタイプ (シンセエンジン自動生成)</label>
                    <select id="cfg-bgm" onchange="saveData(); runPreview();">
                        <option value="none">BGMなし</option>
                        <option value="cyber" selected>サイバー・アンビエント（謎めいた都市風）</option>
                        <option value="horror">ドロップ・ホラー（不気味な低音ループ）</option>
                        <option value="retro">レトロ・ミステリー（ファミコン風哀愁）</option>
                    </select>
                </div>
                <div class="color-pickers">
                    <div class="color-group"><label>背景色</label><input type="color" id="cfg-bg-color" value="#030305" onchange="saveData(); runPreview();"></div>
                    <div class="color-group"><label>文字色</label><input type="color" id="cfg-text-color" value="#e2e2e9" onchange="saveData(); runPreview();"></div>
                    <div class="color-group"><label>アクセント色</label><input type="color" id="cfg-accent-color" value="#00e5ff" onchange="saveData(); runPreview();"></div>
                </div>
            </div>

            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:15px;">
                <button class="btn btn-marker" onclick="addItem('stage_marker')">+ 🗺️ ステージマーカー</button>
                <button class="btn btn-story" onclick="addItem('story')">+ 💬 会話イベント</button>
                <button class="btn btn-action" onclick="addItem('action')">+ ⚡ アクションノード</button>
                <button class="btn btn-effect" onclick="addItem('effect')">+ 🎬 エフェクト実行</button>
                <button class="btn btn-credits" onclick="addItem('credits')">+ 🎬 スタッフロール</button>
            </div>
            <div id="timeline"></div>
        </div>
        <div class="preview-side">
            <div id="wrapper-element" class="preview-wrapper pc-mode"><iframe id="preview-iframe"></iframe></div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() { renderRecentProjectsList(); document.getElementById('welcome-screen').style.display = 'flex'; });

        function renderTimeline() {
            const container = document.getElementById('timeline'); if(!container) return; container.innerHTML = '';
            gameSteps.forEach((step, idx) => {
                const item = document.createElement('div'); item.className = `timeline-item ${step.type}`;
                let html = `<div class="item-header"><span class="badge-${step.type}">#${idx+1} [${step.type.toUpperCase()}]</span><button class="btn-delete" onclick="deleteItem(${step.id})">削除</button></div>`;
                
                if(['story','action'].includes(step.type)) {
                    const imgPreview = step.charImg ? `<img src="${step.charImg}" class="img-preview">` : `<div class="img-preview" style="height:35px; line-height:35px; text-align:center; font-size:0.7rem; color:#555;">写真なし</div>`;
                    html += `<div class="config-box" style="margin-bottom:10px; background:rgba(0,0,0,0.15);">
                                <label>🖼️ グラフィックアセット (URL or 空白でCSSキャラクター)</label>
                                <select onchange="updateStep(${step.id},'charStyle',this.value);saveData();runPreview();" style="margin-bottom:8px;">
                                    <option value="none" ${step.charStyle==='none'?'selected':''}>外部URL指定画像を使用</option>
                                    <option value="detective" ${step.charStyle==='detective'?'selected':''}>CSS: トレンチコートの男</option>
                                    <option value="shadow" ${step.charStyle==='shadow'?'selected':''}>CSS: 不気味な影</option>
                                    <option value="girl" ${step.charStyle==='girl'?'selected':''}>CSS: 少女のシルエット</option>
                                </select>
                                <input type="text" placeholder="画像URL (CSSキャラ選択時は無視されます)" value="${step.charImg||''}" oninput="updateStep(${step.id},'charImg',this.value);saveData();runPreview();renderImgPreview(${step.id},this.value);">
                                <div id="preview-wrap-${step.id}">${imgPreview}</div>
                                <div class="form-inline" style="margin-top:8px;">
                                    <div class="form-group"><label>幅</label><input type="range" min="30" max="600" value="${step.imgW||150}" oninput="updateStep(${step.id},'imgW',parseInt(this.value));saveData();runPreview();"></div>
                                    <div class="form-group"><label>高</label><input type="range" min="30" max="600" value="${step.imgH||150}" oninput="updateStep(${step.id},'imgH',parseInt(this.value));saveData();runPreview();"></div>
                                    <div class="form-group"><label>X</label><input type="range" min="0" max="100" value="${step.imgX||50}" oninput="updateStep(${step.id},'imgX',parseInt(this.value));saveData();runPreview();"></div>
                                    <div class="form-group"><label>Y</label><input type="range" min="0" max="100" value="${step.imgY||50}" oninput="updateStep(${step.id},'imgY',parseInt(this.value));saveData();runPreview();"></div>
                                </div>
                             </div>`;
                }
                if(step.type === 'stage_marker') {
                    html += `<div class="form-inline">
                        <div class="form-group"><label>ステージ番号</label><input type="number" value="${step.stageNum||1}" oninput="updateStep(${step.id},'stageNum',parseInt(this.value));saveData();runPreview();"></div>
                        <div class="form-group"><label>ステージ名</label><input type="text" value="${step.stageName||''}" oninput="updateStep(${step.id},'stageName',this.value);saveData();runPreview();"></div>
                    </div>`;
                } else if(step.type === 'story') {
                    html += `<div class="form-group"><label>本文</label><textarea oninput="updateStep(${step.id},'text',this.value);saveData();runPreview();">${step.text || ''}</textarea></div>`;
                } else if(step.type === 'effect') {
                    html += `<div class="form-inline">
                        <div class="form-group"><label>エフェクト</label><select onchange="updateStep(${step.id},'effectType',this.value);saveData();runPreview();"><option value="glitch" ${step.effectType==='glitch'?'selected':''}>glitch</option><option value="scanline" ${step.effectType==='scanline'?'selected':''}>scanline</option><option value="shake" ${step.effectType==='shake'?'selected':''}>shake</option></select></div>
                        <div class="form-group"><label>時間</label><input type="number" step="0.1" value="${step.duration||1.0}" oninput="updateStep(${step.id},'duration',parseFloat(this.value));saveData();runPreview();"></div>
                    </div>`;
                } else if(step.type === 'credits') {
                    html += `<div class="form-group"><label>スタッフロール</label><textarea oninput="updateStep(${step.id},'text',this.value);saveData();runPreview();">${step.text || ''}</textarea></div>`;
                } else if(step.type === 'action') {
                    html += `<div class="form-inline">
                        <div class="form-group"><label>アクション</label><select onchange="updateStep(${step.id},'actionType',this.value);renderTimeline();saveData();runPreview();"><option value="free" ${step.actionType==='free'?'selected':''}>自由入力</option><option value="typing" ${step.actionType==='typing'?'selected':''}>タイピング</option></select></div>
                        <div class="form-group"><label>タグ</label><input type="text" value="${step.saveTag||''}" oninput="updateStep(${step.id},'saveTag',this.value);saveData();runPreview();"></div>
                    </div>`;
                    if(step.actionType === 'free' || step.actionType === 'typing') {
                        html += `<div class="form-inline"><div class="form-group"><label>お題/指示</label><input type="text" value="${step.paramA||''}" oninput="updateStep(${step.id},'paramA',this.value);saveData();runPreview();"></div><div class="form-group"><label>判定キー/制限</label><input type="text" value="${step.paramB||''}" oninput="updateStep(${step.id},'paramB',this.value);saveData();runPreview();"></div></div>`;
                    }
                }
                item.innerHTML = html; container.appendChild(item);
            });
        }
        function renderImgPreview(id, url) { const wrap = document.getElementById(`preview-wrap-${id}`); if(wrap) wrap.innerHTML = url ? `<img src="${url}" class="img-preview">` : `<div class="img-preview" style="height:35px;"></div>`; }
        function addItem(type) { const nid = Date.now(); gameSteps.push({id:nid, type, stageNum:1, stageName:"新規テリトリー", text:"会話文", charStyle:"none", charImg:"", imgW:150, imgH:150, imgX:50, imgY:50, actionType:"free", paramA:"指示", paramB:"A"}); renderTimeline(); saveData(); runPreview(); }
        function updateStep(id, f, v) { const s = gameSteps.find(x=>x.id===id); if(s) s[f]=v; }
        function deleteItem(id) { gameSteps = gameSteps.filter(x=>x.id!==id); renderTimeline(); saveData(); runPreview(); }
        function runPreview() { const iframe = document.getElementById('preview-iframe'); if(iframe) iframe.srcdoc = buildEngineHTML(); }
        function exportHTML() { const blob = new Blob([buildEngineHTML()], { type: "text/html;charset=utf-8" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = document.getElementById('cfg-title').value + ".html"; a.click(); }

        function buildEngineHTML() {
            const title = document.getElementById('cfg-title').value;

                `body { display: block; background: ${bgColor}; } .game-screen { width: 100%; height: 100vh; position: relative; overflow: hidden; }`;

            return `<!DOCTYPE html>

<body>

    <script>
        // --- 超軽量デジタルオーディオシンセエンジン ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmNode = null;
        function startEngineBGM() {
            const mode = "${bgmMode}";
            if (mode === 'none' || bgmNode) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioCtx.sampleRate;
                if(mode === 'cyber') {
                    data[i] = Math.sin(2 * Math.PI * 70 * t + Math.sin(2 * Math.PI * 4 * t) * 5) * 0.2;
                } else if(mode === 'horror') {
                    data[i] = (Math.sin(2 * Math.PI * 55 * t) + Math.random()*0.08) * Math.sin(2*Math.PI*0.5*t);
                } else if(mode === 'retro') {
                    data[i] = Math.sign(Math.sin(2 * Math.PI * (120 + (Math.floor(t*4)%4)*40) * t)) * 0.05;
                }
            }
            bgmNode = audioCtx.createBufferSource();
            bgmNode.buffer = buffer; bgmNode.loop = true;
            bgmNode.connect(audioCtx.destination); bgmNode.start();
        }

        function playSoundEffect(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            if(type==='type') { 
                o.frequency.setValueAtTime(400+Math.random()*300, audioCtx.currentTime); 
                g.gain.setValueAtTime(0.05, audioCtx.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.04); 
                o.start(); o.stop(audioCtx.currentTime+0.04); 
            } else { 
                o.type='sawtooth'; o.frequency.setValueAtTime(80, audioCtx.currentTime); 
                g.gain.setValueAtTime(0.2, audioCtx.currentTime); 
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.3); 
                o.start(); o.stop(audioCtx.currentTime+0.3); 
            }
        }

        // --- コアゲームマネジメント ---
        const steps = JSON.parse(\`${jsonSteps}\`);
        let currentSlot = 1;
        let slotData = { currentIdx: 0, maxIdx: 0, clearedMarkers: [] };
        
        let idx = 0, rCur = "", tIdx = 0, isT = false, isInputFieldFocused = false;
        let gameMode = "story";

        let stageStartTime = 0;
        let totalKeysTyped = 0;
        let totalMisses = 0;

        const tagStorage = { name: "プレイヤー" };
        const SECRET_SALT = "GUTTI_ENGINE_SECURE_SALT_v175_";

        window.addEventListener('DOMContentLoaded', () => { loadSlotPreviews(); });

        function encryptSaveData(obj) {
            const rawString = JSON.stringify(obj);
            const wrapped = SECRET_SALT + btoa(unescape(encodeURIComponent(rawString)));
            return btoa(unescape(encodeURIComponent(wrapped)));
        }

        function decryptSaveData(str) {
            try {
                const unwrapped = decodeURIComponent(escape(atob(str)));
                if(!unwrapped.startsWith(SECRET_SALT)) return null;
                const base64Part = unwrapped.substring(SECRET_SALT.length);
                const jsonStr = decodeURIComponent(escape(atob(base64Part)));
                return JSON.parse(jsonStr);
            } catch(e) { return null; }
        }

        function loadSlotPreviews() {
            for(let i=1; i<=3; i++) {
                let local = localStorage.getItem(\`gutti_slot_\${i}_\${encodeURIComponent('${title}')}\`);
                const infoEl = document.getElementById(\`slot-info-\${i}\`);
                const actionEl = document.getElementById(\`actions-\${i}\`);
                if(!infoEl || !actionEl) continue;
                actionEl.innerHTML = "";
                
                if(local) {
                    try {
                        let parsed = JSON.parse(local);
                        infoEl.innerHTML = \`STAGE CH.\${parsed.clearedMarkers.length || 1} まで到達\`;
                        
                        const expBtn = document.createElement('button');
                        expBtn.className = "btn btn-mini";
                        expBtn.style.borderColor = "#8e44ad"; expBtn.style.color = "#8e44ad"; expBtn.style.marginRight = "5px";
                        expBtn.innerText = "↓ .gsv書出";
                        expBtn.onclick = (e) => { e.stopPropagation(); exportGsvFromSlot(i); };
                        
                        const clrBtn = document.createElement('button');
                        clrBtn.className = "btn btn-mini";
                        clrBtn.style.borderColor = "#e74c3c"; clrBtn.style.color = "#e74c3c";
                        clrBtn.innerText = "削除";
                        clrBtn.onclick = (e) => { e.stopPropagation(); clearSlotDataDirect(i); };

                        actionEl.appendChild(expBtn);
                        actionEl.appendChild(clrBtn);
                    } catch(e) { infoEl.innerText = "データあり"; }
                } else {
                    infoEl.innerText = "No Data (新規作成)";
                }
            }
        }

        function selectSlot(slotNum) {
            currentSlot = slotNum;
            document.getElementById('slot-badge').innerText = "SELECTED SAVE SLOT: 0" + slotNum;
            let local = localStorage.getItem(\`gutti_slot_\${slotNum}_\${encodeURIComponent('${title}')}\`);
            if(local) {
                try { slotData = JSON.parse(local); } catch(e) { resetSlotData(); }
            } else {
                resetSlotData();
            }
            document.getElementById('scr-slot-select').classList.add('hidden');
            document.getElementById('scr-boot').classList.remove('hidden');
            refreshDashboardUI();
        }

        function resetSlotData() {
            slotData = { currentIdx: 0, maxIdx: 0, clearedMarkers: [] };
        }

        function saveSlotProgress() {
            localStorage.setItem(\`gutti_slot_\${currentSlot}_\${encodeURIComponent('${title}')}\`, JSON.stringify(slotData));
        }

        function triggerManualSave() {
            if(gameMode === "free") {
                alert("フリーモード中はデータの上書き保存は行われません。");
                return;
            }
            slotData.currentIdx = idx;
            saveSlotProgress();
            alert("現在の状態をスロット0" + currentSlot + "へ上書き保存しました！");
            toggleMenu();
        }

        function triggerGsvExport() { exportGsvFromSlot(currentSlot); }

        function exportGsvFromSlot(slotNum) {
            let local = localStorage.getItem(\`gutti_slot_\${slotNum}_\${encodeURIComponent('${title}')}\`);
            if(!local) { alert("エクスポートするデータがありません。"); return; }
            try {
                let parsed = JSON.parse(local);
                let encrypted = encryptSaveData(parsed);
                const blob = new Blob([encrypted], { type: "application/octet-stream" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = \`${title.replace(/[^a-zA-Z0-9-_]/g, "_")}_slot\${slotNum}.gsv\`;
                a.click();
            } catch(e) { alert("暗号化書き出しに失敗しました。"); }
        }

        function importGsvFile(input) {
            const file = input.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const encryptedData = e.target.result.trim();
                const decrypted = decryptSaveData(encryptedData);
                if(!decrypted) {
                    alert("不正または破損した .gsv セーブデータファイルです。");
                    return;
                }
                let targetSlot = prompt("読み込んだデータをどのスロットに上書きしますか？ (1〜3の半角数字を入力)", "1");
                if(targetSlot === "1" || targetSlot === "2" || targetSlot === "3") {
                    localStorage.setItem(\`gutti_slot_\${targetSlot}_\${encodeURIComponent('${title}')}\`, JSON.stringify(decrypted));
                    alert(\`スロット 0\${targetSlot} に .gsv データを取り込み・上書きしました。\`);
                    loadSlotPreviews();
                } else { alert("キャンセル、または不正なスロット番号です。"); }
            };
            reader.readAsText(file); input.value = "";
        }

        function clearSlotDataDirect(slotNum) {
            if(confirm(\`スロット 0\${slotNum} のデータを完全に消去しますか？\`)) {
                localStorage.removeItem(\`gutti_slot_\${slotNum}_\${encodeURIComponent('${title}')}\`);
                loadSlotPreviews();
            }
        }

        function backToSlotSelect() {
            document.getElementById('scr-boot').classList.add('hidden');
            document.getElementById('scr-slot-select').classList.remove('hidden');
            loadSlotPreviews();
        }

        function refreshDashboardUI() {
            const resumeBtn = document.getElementById('btn-resume');
            if(slotData.currentIdx > 0) resumeBtn.classList.remove('hidden');
            else resumeBtn.classList.add('hidden');

            const selectBox = document.getElementById('select-box');
            const lockedText = document.getElementById('free-mode-locked');
            selectBox.innerHTML = "";

            let availableMarkers = steps.filter((s, sIdx) => s.type === 'stage_marker' && sIdx <= slotData.maxIdx);
            
            if(availableMarkers.length > 0) {
                if(lockedText) lockedText.classList.add('hidden');
                selectBox.classList.remove('hidden');
                availableMarkers.forEach(m => {
                    let stepIndex = steps.indexOf(m);
                    const card = document.createElement('div');
                    card.className = 'chapter-card';
                    card.innerHTML = \`CH.\${m.stageNum}<br><span style="font-size:0.7rem;opacity:0.7;">\${m.stageName}</span>\`;
                    card.onclick = () => startFreeMode(stepIndex);
                    selectBox.appendChild(card);
                });
            } else {
                if(lockedText) lockedText.classList.remove('hidden');
                selectBox.classList.add('hidden');
            }
        }

        function startStory(resume) {
            gameMode = "story";
            idx = resume ? slotData.currentIdx : 0;
            if(!resume) resetSlotData();
            document.getElementById('scr-boot').classList.add('hidden');
            document.getElementById('scr-runtime').classList.remove('hidden');
            startEngineBGM();
            initStageMetrics();
            runStep();
        }

        function startFreeMode(stepIndex) {
            gameMode = "free";
            idx = stepIndex;
            document.getElementById('scr-boot').classList.add('hidden');
            document.getElementById('scr-runtime').classList.remove('hidden');
            startEngineBGM();
            initStageMetrics();
            runStep();
        }

        function returnToTitleDashboard() {
            document.getElementById('ui-menu').style.display = 'none';
            document.getElementById('scr-runtime').classList.add('hidden');
            document.getElementById('scr-result').classList.add('hidden');
            document.getElementById('scr-boot').classList.remove('hidden');
            refreshDashboardUI();
        }

        function initStageMetrics() {
            stageStartTime = Date.now();
            totalKeysTyped = 0;
            totalMisses = 0;
        }

        function runStep() {
            if(!steps || idx < 0 || idx >= steps.length) { 
                document.getElementById('text-box').innerHTML = "【全シークエンス完了】"; 
                document.getElementById('btn-next').classList.add('hidden'); 
                return; 
            }

            const s = steps[idx];

            if(gameMode === "story") {
                if(idx > slotData.maxIdx) slotData.maxIdx = idx;
                slotData.currentIdx = idx;
                if(s.type === 'stage_marker' && !slotData.clearedMarkers.includes(s.stageName)) {
                    slotData.clearedMarkers.push(s.stageName);
                }
                saveSlotProgress();
            }

            if (idx > 0 && (s.type === 'stage_marker')) {
                showStageResult();
                return;
            }

            if (s.type === 'stage_marker') { idx++; runStep(); return; }

            if (s.type === 'effect') {
                const fxOverlay = document.getElementById('fx-overlay');
                const mainFrame = document.getElementById('main-frame-node');
                fxOverlay.className = "";
                if (s.effectType === 'shake') { mainFrame.classList.add('fx-shake'); } else { fxOverlay.classList.add('fx-' + (s.effectType || 'glitch')); }
                setTimeout(() => { fxOverlay.className = ""; mainFrame.classList.remove('fx-shake'); idx++; runStep(); }, (s.duration || 1.0) * 1000);
                return;
            }

            if (s.type === 'credits') { 
                document.getElementById('text-box').innerHTML = s.text; 
                document.getElementById('btn-next').classList.remove('hidden'); 
                return; 
            }

            // キャラクター表示スイッチロジック
            const imgEl = document.getElementById('view-img');
            const cssChar = document.getElementById('avatar-element');
            
            imgEl.style.display = "none";
            cssChar.className = "css-char";
            
            if(s.charStyle && s.charStyle !== 'none') {
                cssChar.classList.add('char-' + s.charStyle);
                cssChar.style.left = \`calc(\${s.imgX || 50}% - 35px)\`;
                cssChar.style.bottom = "10px";
            } else if(s.charImg && s.charImg.trim() !== "") {
                imgEl.src = s.charImg;
                imgEl.style.width = (s.imgW || 150) + "px"; imgEl.style.height = (s.imgH || 150) + "px";
                imgEl.style.left = \`calc(\${s.imgX || 50}% - \${(s.imgW || 150) / 2}px)\`; 
                imgEl.style.top = \`calc(\${s.imgY || 50}% - \${(s.imgH || 150) / 2}px)\`;
                imgEl.style.display = "block";
            }

            document.getElementById('btn-next').classList.add('hidden'); 
            document.getElementById('type-box').style.display = 'none'; 
            document.getElementById('free-input-wrap').classList.add('hidden');

            if (s.type === 'action') {
                if(s.actionType === 'free') { 
                    document.getElementById('text-box').textContent = s.paramA; 
                    const wrap = document.getElementById('free-input-wrap'); 
                    const node = document.getElementById('free-input-node'); 
                    wrap.classList.remove('hidden'); node.value = ""; node.focus(); 
                    return; 
                }
                if(s.actionType === 'typing') { 
                    isT = true; 
                    document.getElementById('type-box').style.display = 'flex'; 
                    document.getElementById('jp-box').textContent = s.paramA; 
                    rCur = s.paramB.toLowerCase(); tIdx = 0; 
                    refreshTypeDisplay(); 
                    return;
                }
            }
            if (s.type === 'story') { 
                document.getElementById('btn-next').classList.remove('hidden'); 
                document.getElementById('text-box').textContent = s.text; 
            }
        }

        function showStageResult() {
            const diff = (Date.now() - stageStartTime) / 1000;
            const kpm = totalKeysTyped > 0 ? Math.round((totalKeysTyped / diff) * 60) : 0;
            
            let rank = "S";
            if(totalMisses > 5) rank = "A";
            if(totalMisses > 12) rank = "B";
            if(totalMisses > 20) rank = "C";

            let currentStageLabel = "SEQUENCE SECTOR";
            for(let i = idx; i >= 0; i--) {
                if(steps[i] && steps[i].type === 'stage_marker') {
                    currentStageLabel = "CH." + steps[i].stageNum + " " + steps[i].stageName;
                    break;
                }
            }

            document.getElementById('res-stage-name').textContent = currentStageLabel;
            document.getElementById('res-time').textContent = diff.toFixed(1);
            document.getElementById('res-keys').textContent = totalKeysTyped;
            document.getElementById('res-miss').textContent = totalMisses;
            document.getElementById('res-kpm').textContent = kpm;
            document.getElementById('res-rank').textContent = rank;

            document.getElementById('scr-runtime').classList.add('hidden');
            document.getElementById('scr-result').classList.remove('hidden');
        }

        function closeResult() {
            document.getElementById('scr-result').classList.add('hidden');
            if(gameMode === "free") {
                document.getElementById('scr-boot').classList.remove('hidden');
                refreshDashboardUI();
            } else {
                document.getElementById('scr-runtime').classList.remove('hidden');
                initStageMetrics();
                idx++;
                runStep();
            }
        }

        function stepForward() { idx++; runStep(); }
        function submitFreeInput() { const node = document.getElementById('free-input-node'); tagStorage[steps[idx].saveTag] = node.value.trim()||""; totalKeysTyped += node.value.length; idx++; runStep(); }
        function refreshTypeDisplay() { document.getElementById('lbl-done').textContent = rCur.substring(0, tIdx); document.getElementById('lbl-todo').textContent = rCur.substring(tIdx); }

        function inputCharacter(c) {
            if(isInputFieldFocused) return;
            if(!isT) { if(c === ' ' && !document.getElementById('btn-next').classList.contains('hidden')) stepForward(); return; }
            
            totalKeysTyped++;
            if(c.toLowerCase() === rCur[tIdx].toLowerCase()) { 
                tIdx++; 
                playSoundEffect('type');
                refreshTypeDisplay(); 
                if(tIdx >= rCur.length) { 
                    isT = false; 
                    tagStorage[steps[idx].saveTag] = rCur; 
                    setTimeout(() => { idx++; runStep(); }, 200);
                } 
            } else { 
                if(c !== 'Shift' && c !== 'Control') {
                    totalMisses++; 
                    playSoundEffect('miss');
                    const mainFrame = document.getElementById('main-frame-node');
                    mainFrame.classList.add('fx-shake');
                    setTimeout(() => mainFrame.classList.remove('fx-shake'), 150);
                }
            }
        }

        function pressVirtualKey(c) { inputCharacter(c); }
        function toggleMenu() { const m = document.getElementById('ui-menu'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
        
        const inputNode = document.getElementById('free-input-node');
        if(inputNode) {
            inputNode.addEventListener('focus', () => { isInputFieldFocused = true; });
            inputNode.addEventListener('blur', () => { isInputFieldFocused = false; });
        }
        window.addEventListener('keydown', (e) => { if(isInputFieldFocused) return; if(e.key === ' ') { e.preventDefault(); inputCharacter(' '); } else if(e.key.length === 1) inputCharacter(e.key); });
    <\/script>
</body>
</html>`;
        }
    </script>
</body>
</html>
