<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GUTTI INTERACTIVE ENGINE -THE CORE- [v1.4.0]</title>
    <style>
        :root { --bg-dark: #08080c; --panel-bg: #12121c; --accent: #00e5ff; --text: #ffffff; }
        body { margin: 0; font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: #e0e0e8; display: flex; height: 100vh; overflow: hidden; }
        
        header { background: #040407; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100; height: 60px; border-bottom: 2px solid var(--accent); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        header h1 { margin: 0; font-size: 1.1rem; color: #fff; letter-spacing: 2px; font-weight: 800; }
        
        .main-layout { display: flex; flex: 1; margin-top: 60px; height: calc(100vh - 60px); width: 100%; }
        
        /* エディター設定ゾーン */
        .editor-side { flex: 1; padding: 20px; overflow-y: auto; border-right: 1px solid #1f1f2e; box-sizing: border-box; }
        .config-box { background: #0b0b12; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1f1f2e; }
        .color-pickers { display: flex; gap: 15px; margin-top: 10px; }
        .color-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .color-group input[type="color"] { height: 38px; padding: 0; border: 1px solid #28283d; cursor: pointer; background: transparent; border-radius: 4px; }

        /* タイムラインノード */
        .timeline-item { background: var(--panel-bg); border-left: 6px solid #555; padding: 15px; margin-bottom: 15px; border-radius: 6px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .timeline-item.stage_marker { border-left-color: #9b59b6; background: #18121c; }
        .timeline-item.story { border-left-color: #3498db; }
        .timeline-item.action { border-left-color: #e74c3c; background: #1c1214; }
        .timeline-item.inspection { border-left-color: #f1c40f; background: #1c1b12; }
        .timeline-item.credits { border-left-color: #2ecc71; background: #121c15; }
        
        .item-header { margin-bottom: 10px; font-size: 0.8rem; font-weight: bold; color: #888; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { margin-bottom: 12px; }
        .form-inline { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-inline .form-group { flex: 1; }
        label { display: block; font-size: 0.75rem; color: #a0a0b0; margin-bottom: 5px; font-weight: bold; letter-spacing: 0.5px; }
        textarea, input, select { width: 100%; background: #05050a; border: 1px solid #28283d; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }
        textarea { height: 65px; resize: vertical; font-family: monospace; }
        
        .btn { background: #252538; color: #fff; border: none; padding: 10px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s; text-decoration: none; display: inline-block; text-align: center; }
        .btn:hover { filter: brightness(1.2); }
        .btn-story { background: #2980b9; }
        .btn-action { background: #c0392b; }
        .btn-inspect { background: #d35400; }
        .btn-marker { background: #8e44ad; }
        .btn-credits { background: #2ecc71; color: #000; }
        .btn-delete { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 4px 8px; font-size: 0.7rem; border-radius: 3px; cursor: pointer; }
        .btn-delete:hover { background: #e74c3c; color: #fff; }

        /* リアルタイムプレビュービューア */
        .preview-side { flex: 1; background: #040406; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; box-sizing: border-box; }
        .preview-wrapper { width: 100%; height: 100%; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; }
        .preview-wrapper.pc-mode { width: 100%; max-width: 800px; aspect-ratio: 16 / 9; height: auto; border: 4px solid #222; border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,0.7); overflow: hidden; }
        .preview-wrapper.phone-mode { width: 375px; height: 100%; max-height: 720px; border: 6px solid #222; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.7); overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        .img-preview { max-height: 55px; display: block; margin-top: 8px; border-radius: 4px; border: 1px solid #333; background: #000; object-fit: contain; }

        /* ウェルカムダッシュボード（新設オーバーレイ） */
        .welcome-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 4, 6, 0.95); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .welcome-modal { background: #11111a; border: 2px solid var(--accent); border-radius: 12px; width: 90%; max-width: 650px; padding: 30px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); box-sizing: border-box; }
        .welcome-title { text-align: center; font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; color: #fff; margin-top: 0; margin-bottom: 5px; }
        .welcome-subtitle { text-align: center; font-size: 0.85rem; color: var(--accent); margin-bottom: 30px; letter-spacing: 1px; }
        .dashboard-grid { display: flex; flex-direction: column; gap: 20px; }
        .dashboard-section { background: #08080c; border: 1px solid #252538; padding: 15px; border-radius: 8px; }
        .dashboard-section h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: #a0a0b0; border-left: 3px solid var(--accent); padding-left: 8px; }
        .recent-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
        .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #12121c; margin-bottom: 6px; border-radius: 4px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .recent-item:hover { background: #1a1a2e; border-color: var(--accent); }
        .recent-name { font-weight: bold; color: #fff; font-size: 0.9rem; }
        .recent-date { font-size: 0.75rem; color: #666; }
        .no-recent { text-align: center; color: #444; font-size: 0.85rem; padding: 10px 0; }
    </style>
</head>
<body>

    <div class="welcome-overlay" id="welcome-screen">
        <div class="welcome-modal">
            <div class="welcome-title">GUTTI INTERACTIVE ENGINE</div>
            <div class="welcome-subtitle">CORE TERMINAL v1.4.0</div>
            
            <div class="dashboard-grid">
                <div class="dashboard-section">
                    <h3>✨ 新規プロジェクトを作成</h3>
                    <div style="display: flex; gap: 10px; align-items: flex-end;">
                        <div style="flex: 1;">
                            <label>プロジェクト名を入力</label>
                            <input type="text" id="new-project-title" value="MY INTERACTIVE SYSTEM">
                        </div>
                        <button class="btn" style="background: var(--accent); color: #000; height: 40px;" onclick="createNewProject()">新規作成</button>
                    </div>
                </div>

                <div class="dashboard-section" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3>📂 外部データからロード</h3>
                        <span style="font-size: 0.8rem; color: #666;">過去にエクスポートした .gtf ファイルを開きます</span>
                    </div>
                    <button class="btn" style="background: #8e44ad;" onclick="document.getElementById('file-import-dashboard').click()">ファイルを選択</button>
                    <input type="file" id="file-import-dashboard" accept=".gtf" style="display:none;" onchange="importGTF(this, true)">
                </div>

                <div class="dashboard-section">
                    <h3>🕒 最近のプロジェクトから開く</h3>
                    <ul class="recent-list" id="recent-projects-container">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <header>
        <h1>GUTTI INTERACTIVE ENGINE <span style="color:var(--accent);" id="header-project-name">[未定義]</span></h1>
        <div style="display: flex; gap: 8px;">
            <button class="btn" style="background:#252538;" onclick="showDashboard()">🏠 ダッシュボード</button>
            <button class="btn" style="background:#2980b9;" onclick="document.getElementById('file-import-gtf').click()">📂 .gtf読込</button>
            <input type="file" id="file-import-gtf" accept=".gtf" style="display:none;" onchange="importGTF(this, false)">
            <button class="btn" style="background:#8e44ad;" onclick="exportGTF()">↓ .gtf書き出し</button>
            <button class="btn" style="background:#00b894;" onclick="exportHTML()">↓ HTML書き出し</button>
            <button class="btn" style="background:#c0392b;" onclick="clearAllData()">🔄 全消去</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="editor-side">
            <div class="config-box">
                <h3 style="margin:0 0 10px 0; font-size:0.95rem; letter-spacing:1px;">⚙️ グローバルシステム定義</h3>
                <div class="form-inline">
                    <div class="form-group" style="flex: 2;">
                        <label>プロジェクト名 / アプリケーションタイトル</label>
                        <input type="text" id="cfg-title" value="GUTTI INTERACTIVE SYSTEM" onchange="updateProjectTitle(this.value); saveData(); runPreview();">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>📱 ターゲットデバイス版</label>
                        <select id="cfg-device" onchange="updateDeviceMode(); saveData(); runPreview();">
                            <option value="phone">スマホ対応版 (縦型)</option>
                            <option value="pc" selected>パソコン専用版 (16:9)</option>
                        </select>
                    </div>
                </div>

                <div class="color-pickers">
                    <div class="color-group">
                        <label>背景色</label>
                        <input type="color" id="cfg-bg-color" value="#030305" onchange="saveData(); runPreview();">
                    </div>
                    <div class="color-group">
                        <label>文字色</label>
                        <input type="color" id="cfg-text-color" value="#e2e2e9" onchange="saveData(); runPreview();">
                    </div>
                    <div class="color-group">
                        <label>アクセント色</label>
                        <input type="color" id="cfg-accent-color" value="#00e5ff" onchange="saveData(); runPreview();">
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:15px;">
                <button class="btn btn-marker" onclick="addItem('stage_marker')">+ 🗺️ ステージマーカー</button>
                <button class="btn btn-story" onclick="addItem('story')">+ 💬 会話イベント</button>
                <button class="btn btn-action" onclick="addItem('action')">+ ⚡ アクションノード</button>
                <button class="btn btn-inspect" onclick="addItem('inspection')">+ 🔍 条件分岐</button>
                <button class="btn btn-credits" onclick="addItem('credits')">+ 🎬 スタッフロール</button>
            </div>

            <div id="timeline"></div>
        </div>

        <div class="preview-side">
            <div id="wrapper-element" class="preview-wrapper pc-mode">
                <iframe id="preview-iframe"></iframe>
            </div>
        </div>
    </div>

    <script>
        // デフォルト初期データテンプレート
        let gameSteps = [
            { id: 1, type: "stage_marker", stageNum: 1, stageName: "プロローグ: 認証シークエンス" },
            { id: 2, type: "story", text: "「システムコア起動。身元識別コードを登録してください（英小文字と数字のみ有効）」\n[en]「System core activated. Please register your identification code (lowercase and numbers only)」", charImg: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=60" },
            { id: 3, type: "action", actionType: "free", saveTag: "name", paramA: "識別コードを入力してください (最大8文字)\n[en]Enter unique code (Max 8 chars)", paramB: "8", charImg: "" },
            { id: 4, type: "story", text: "「IDの同期が完了しました。ユーザーを [tag:name] と認識。システムテストを開始します」\n[en]「Identification synchronized. User registered as [tag:name]. Beginning dynamic testing sequence...」", charImg: "" },
            { id: 5, type: "action", actionType: "typing", saveTag: "test_result", paramA: "ようこそ [tag:name]、コアシステムへ\n[en]Welcome [tag:name] to the core system", paramB: "welcome[tag:name]tothesystem", charImg: "" },
            { id: 6, type: "story", text: "「タイピングテスト完了。次に、右上メニューからハードウェア輝度を最大値 '2.0' に設定してください」\n[en]「Typing test clear. Next, open the top-right menu and shift hardware brightness to maximum '2.0'」", charImg: "" },
            { id: 7, type: "action", actionType: "brightness_check", saveTag: "lum_status", paramA: "", paramB: "", charImg: "" },
            { id: 8, type: "inspection", targetType: "tag", targetTag: "lum_status", checkCondition: "equal", checkValue: "max", matchStep: 11, unmatchStep: 9 },
            { id: 9, type: "story", text: "「輝度不足。キャリブレーションエラーが発生しました。設定を再確認してください」\n[en]「Hardware calibration error. Insufficient luminance detected. Please check your config again.」", charImg: "" },
            { id: 10, type: "inspection", targetType: "always", targetTag: "", checkCondition: "always", checkValue: "", matchStep: 7, unmatchStep: 7 },
            { id: 11, type: "story", text: "「すべてのテストマトリクスが正常にクリアされました。安全モードで終了します、エージェント [tag:name]」\n[en]「All test matrices cleared successfully. Executing final safe-mode shutdown routine, Agent [tag:name]」", charImg: "" },
            { id: 12, type: "credits", text: "GUTTI INTERACTIVE SYSTEM\n\n- DESIGNATED AGENT -\n[tag:name]\n\n- EXECUTIVE PRODUCER -\nGUTTI PRESENTS\n\n- ARCHITECTURE CORE -\nGEMINI SYSTEM ENGINE v1.4.0\n\nTHANK YOU FOR ACCESSING!" }
        ];

        let currentProjectId = "project_default";

        window.onload = function() {
            renderRecentProjectsList();
            // 初期状態ではエディタを裏側に隠し、ダッシュボードを表示
            document.getElementById('welcome-screen').style.display = 'flex';
        };

        // 最近のプロジェクト一覧を localStorage から取得して描画
        function renderRecentProjectsList() {
            const container = document.getElementById('recent-projects-container');
            if(!container) return;
            container.innerHTML = '';

            let history = [];
            try {
                history = JSON.parse(localStorage.getItem('gutti_v140_projects_history') || '[]');
            } catch(e) { history = []; }

            if(history.length === 0) {
                container.innerHTML = `<li class="no-recent">最近使用したプロジェクトはありません</li>`;
                return;
            }

            // タイムスタンプの降順でソートして最大5件表示
            history.sort((a,b) => b.updated - a.updated).slice(0, 5).forEach(proj => {
                const li = document.createElement('li');
                li.className = 'recent-item';
                const dateStr = new Date(proj.updated).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
                li.innerHTML = `
                    <span class="recent-name">📁 ${proj.title}</span>
                    <span class="recent-date">${dateStr}</span>
                `;
                li.onclick = () => { loadProjectFromHistory(proj.id); };
                container.appendChild(li);
            });
        }

        // 履歴リストのアイテムをクリックした際の読み込み処理
        function loadProjectFromHistory(id) {
            const savedData = localStorage.getItem(`gutti_proj_data_${id}`);
            if(savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    applyProjectDataToEditor(parsed, id);
                    document.getElementById('welcome-screen').style.display = 'none';
                } catch(e) {
                    alert("履歴データの解析に失敗しました。");
                }
            } else {
                alert("該当のプロジェクトデータが見つかりません。");
            }
        }

        // ダッシュボードから「新規作成」
        function createNewProject() {
            const titleInput = document.getElementById('new-project-title').value.trim();
            if(!titleInput) { alert("プロジェクト名を入力してください。"); return; }

            currentProjectId = "proj_" + Date.now();
            
            // 入力された名前で仮の空データを新規作成して適用
            const newData = {
                title: titleInput,
                deviceMode: "pc",
                bgColor: "#030305",
                textColor: "#e2e2e9",
                accentColor: "#00e5ff",
                steps: [
                    { id: Date.now(), type: "stage_marker", stageNum: 1, stageName: "新しいチャプター" },
                    { id: Date.now()+1, type: "story", text: "ここに会話テキストを入力してください。\n[en]Enter conversation text here.", charImg: "" }
                ]
            };

            applyProjectDataToEditor(newData, currentProjectId);
            saveData(); // 即座に履歴とストレージへセーブ
            document.getElementById('welcome-screen').style.display = 'none';
        }

        // ダッシュボードを手動で開くボタン
        function showDashboard() {
            renderRecentProjectsList();
            document.getElementById('welcome-screen').style.display = 'flex';
        }

        // プロジェクト名表示をアップデート
        function updateProjectTitle(title) {
            document.getElementById('header-project-name').textContent = `[ ${title} ]`;
        }

        // エディタへ設定データを流し込む共通処理
        function applyProjectDataToEditor(data, id) {
            currentProjectId = id;
            gameSteps = data.steps || [];
            document.getElementById('cfg-title').value = data.title || "GUTTI INTERACTIVE SYSTEM";
            document.getElementById('cfg-device').value = data.deviceMode || "pc";
            document.getElementById('cfg-bg-color').value = data.bgColor || "#030305";
            document.getElementById('cfg-text-color').value = data.textColor || "#e2e2e9";
            document.getElementById('cfg-accent-color').value = data.accentColor || "#00e5ff";

            updateProjectTitle(data.title || "GUTTI INTERACTIVE SYSTEM");
            updateDeviceMode();
            renderTimeline();
            runPreview();
        }

        function updateDeviceMode() {
            const mode = document.getElementById('cfg-device').value;
            const wrap = document.getElementById('wrapper-element');
            if(mode === 'pc') { wrap.className = "preview-wrapper pc-mode"; } 
            else { wrap.className = "preview-wrapper phone-mode"; }
        }

        // 現在のデータをブラウザに自動保存 ＆ 最近の履歴インデックスを更新
        function saveData() {
            const title = document.getElementById('cfg-title').value;
            const data = { 
                title: title, 
                deviceMode: document.getElementById('cfg-device').value,
                bgColor: document.getElementById('cfg-bg-color').value,
                textColor: document.getElementById('cfg-text-color').value,
                accentColor: document.getElementById('cfg-accent-color').value,
                steps: gameSteps 
            };
            
            // 1. 個別の実データ保存
            localStorage.setItem(`gutti_proj_data_${currentProjectId}`, JSON.stringify(data));

            // 2. 最近のプロジェクト履歴のメタリスト更新
            let history = [];
            try { history = JSON.parse(localStorage.getItem('gutti_v140_projects_history') || '[]'); } catch(e){}
            
            // 重複排除して最新情報に更新
            history = history.filter(x => x.id !== currentProjectId);
            history.push({
                id: currentProjectId,
                title: title,
                updated: Date.now()
            });
            localStorage.setItem('gutti_v140_projects_history', JSON.stringify(history));
        }

        function clearAllData() {
            if(confirm("現在編集中のプロジェクトデータを初期化しますか？ (履歴からは消えません)")) {
                applyProjectDataToEditor({
                    title: "GUTTI INTERACTIVE SYSTEM", deviceMode: "pc", bgColor: "#030305", textColor: "#e2e2e9", accentColor: "#00e5ff", steps: []
                }, currentProjectId);
                saveData();
            }
        }

        /* 💾 .gtf プロジェクトデータ書き出し */
        function exportGTF() {
            const title = document.getElementById('cfg-title').value;
            const projectData = {
                engine_signature: "GUTTI_INTERACTIVE_ENGINE_PROJECT",
                version: "1.4.0",
                title: title,
                deviceMode: document.getElementById('cfg-device').value,
                bgColor: document.getElementById('cfg-bg-color').value,
                textColor: document.getElementById('cfg-text-color').value,
                accentColor: document.getElementById('cfg-accent-color').value,
                steps: gameSteps,
                timestamp: Date.now()
            };
            const jsonString = JSON.stringify(projectData, null, 2);
            const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = title.replace(/[^a-zA-Z0-9-_]/g, "_") + ".gtf";
            a.click();
        }

        /* 📂 .gtf プロジェクトデータ読み込み */
        function importGTF(input, isFromDashboard = false) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.engine_signature !== "GUTTI_INTERACTIVE_ENGINE_PROJECT") {
                        alert("互換性のないファイル形式です。(.gtf を読み込んでください)");
                        return;
                    }
                    
                    // ファイルインポート時は、既存履歴に被らないように新しいIDを割り当てるか、タイトルからIDを生成
                    const newId = "proj_imported_" + Date.now();
                    applyProjectDataToEditor(parsed, newId);
                    saveData(); // 読み込みと同時に履歴へ保存

                    if(isFromDashboard) {
                        document.getElementById('welcome-screen').style.display = 'none';
                    }
                    alert(`プロジェクト「${parsed.title}」を正常に読み込みました。`);
                } catch(err) {
                    alert("ファイルの解析エラー: " + err.message);
                }
            };
            reader.readAsText(file);
            input.value = "";
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            if(!container) return; container.innerHTML = '';
            
            gameSteps.forEach((step, idx) => {
                const item = document.createElement('div');
                item.className = `timeline-item ${step.type}`;
                
                let html = `<div class="item-header">
                                <span class="badge-${step.type}">#${idx+1} [${step.type.toUpperCase()}]</span>
                                <button class="btn-delete" onclick="deleteItem(${step.id})">削除</button>
                            </div>`;
                
                if(['story','action'].includes(step.type)) {
                    const imgPreview = step.charImg ? `<img src="${step.charImg}" class="img-preview">` : `<div class="img-preview" style="height:35px; line-height:35px; text-align:center; font-size:0.7rem; color:#555;">画像URL未指定 (非表示)</div>`;
                    html += `<div class="form-group" style="background:rgba(0,0,0,0.2); padding:8px; border-radius:4px; margin-bottom:10px;">
                                <label>🖼️ アセット画像指定 (画像URLを入力)</label>
                                <input type="text" placeholder="https://example.com/image.png" value="${step.charImg||''}" oninput="updateStep(${step.id},'charImg',this.value);saveData();runPreview();renderImgPreview(${step.id},this.value);">
                                <div id="preview-wrap-${step.id}">${imgPreview}</div>
                             </div>`;
                }

                if(step.type === 'stage_marker') {
                    html += `<div class="form-inline">
                        <div class="form-group"><label>ステージ番号</label><input type="number" value="${step.stageNum||1}" oninput="updateStep(${step.id},'stageNum',parseInt(this.value));saveData();runPreview();"></div>
                        <div class="form-group"><label>ステージ章名ラベル</label><input type="text" value="${step.stageName||''}" oninput="updateStep(${step.id},'stageName',this.value);saveData();runPreview();"></div>
                    </div>`;
                } else if(step.type === 'story') {
                    html += `<div class="form-group"><label>テキスト本文（改行・[tag:変数名]対応 / 改行後に「[en]本文」で英語切替）</label><textarea oninput="updateStep(${step.id},'text',this.value);saveData();runPreview();">${step.text || ''}</textarea></div>`;
                } else if(step.type === 'credits') {
                    html += `<div class="form-group"><label>🎬 スタッフロールテキスト</label><textarea style="height:120px;" oninput="updateStep(${step.id},'text',this.value);saveData();runPreview();">${step.text || ''}</textarea></div>`;
                } else if(step.type === 'action') {
                    html += `<div style="background:rgba(0,0,0,0.15); padding:10px; border-radius:4px;">
                        <div class="form-inline">
                            <div class="form-group"><label>⚡ アクションタイプ</label>
                                <select onchange="updateStep(${step.id},'actionType',this.value);renderTimeline();saveData();runPreview();">
                                    <option value="free" ${step.actionType==='free'?'selected':''}>0. 自由入力 (英数字限定・最大数指定)</option>
                                    <option value="typing" ${step.actionType==='typing'?'selected':''}>1. タイピングマトリクス</option>
                                    <option value="overload" ${step.actionType==='overload'?'selected':''}>2. 連打オーバーロード</option>
                                    <option value="click_core" ${step.actionType==='click_core'?'selected':''}>3. コア探索サーチノード</option>
                                    <option value="brightness_check" ${step.actionType==='brightness_check'?'selected':''}>4. 輝度同期タスク</option>
                                    <option value="time_check" ${step.actionType==='time_check'?'selected':''}>5. システム時間判定</option>
                                </select>
                            </div>
                            <div class="form-group"><label>🏷️ 結果格納先変数タグ名</label>
                                <input type="text" placeholder="name" value="${step.saveTag||''}" oninput="updateStep(${step.id},'saveTag',this.value);saveData();runPreview();">
                            </div>
                        </div>`;
                    
                    if(step.actionType === 'free') {
                        html += `<div class="form-inline">
                                    <div class="form-group"><label>プレースホルダー文面 (改行+[en]対応)</label><input type="text" value="${step.paramA||''}" oninput="updateStep(${step.id},'paramA',this.value);saveData();runPreview();"></div>
                                    <div class="form-group"><label>最大文字数制限</label><input type="number" value="${step.paramB||''}" oninput="updateStep(${step.id},'paramB',this.value);saveData();runPreview();"></div>
                                 </div>`;
                    } else if(step.actionType === 'typing') {
                        html += `<div class="form-inline">
                                    <div class="form-group"><label>お題日本語（改行+[en]対応）</label><input type="text" value="${step.paramA||''}" oninput="updateStep(${step.id},'paramA',this.value);saveData();runPreview();"></div>
                                    <div class="form-group"><label>タイピング文字 (半角英数)</label><input type="text" value="${step.paramB||''}" oninput="updateStep(${step.id},'paramB',this.value);saveData();runPreview();"></div>
                                 </div>`;
                    } else if(step.actionType === 'overload') {
                        html += `<div class="form-group"><label>必要連打バースト閾値</label><input type="number" value="${step.paramA||30}" oninput="updateStep(${step.id},'paramA',this.value);saveData();runPreview();"></div>`;
                    } else if(step.actionType === 'click_core') {
                        html += `<div class="form-group"><label>探索画面指示テキスト (改行+[en]対応)</label><input type="text" value="${step.paramA||''}" oninput="updateStep(${step.id},'paramA',this.value);saveData();runPreview();"></div>`;
                    } else if(step.actionType === 'time_check') {
                        html += `<div class="form-inline">
                                    <div class="form-group"><label>有効時間 開始 (時 0-23)</label><input type="number" value="${step.paramA||0}" oninput="updateStep(${step.id},'paramA',this.value);saveData();runPreview();"></div>
                                    <div class="form-group"><label>有効時間 終了 (時 0-23)</label><input type="number" value="${step.paramB||23}" oninput="updateStep(${step.id},'paramB',this.value);saveData();runPreview();"></div>
                                 </div>`;
                    }
                    html += `</div>`;
                } else if(step.type === 'inspection') {
                    html += `<div style="background:rgba(0,0,0,0.15); padding:10px; border-radius:4px;">
                        <div class="form-inline">
                            <div class="form-group"><label>🎯 条件評価対象</label>
                                <select onchange="updateStep(${step.id},'targetType',this.value);renderTimeline();saveData();runPreview();">
                                    <option value="tag" ${step.targetType==='tag'?'selected':''}>1. 変数タグ内の値を評価</option>
                                    <option value="last_key" ${step.targetType==='last_key'?'selected':''}>2. 直前の打鍵キーを評価</option>
                                    <option value="always" ${step.targetType==='always'?'selected':''}>3. 無条件強制ジャンプ</option>
                                </select>
                            </div>`;
                    if(step.targetType === 'tag') {
                        html += `<div class="form-group"><label>🔍 スキャン対象変数タグ名</label><input type="text" placeholder="name" value="${step.targetTag||''}" oninput="updateStep(${step.id},'targetTag',this.value);saveData();runPreview();"></div>`;
                    }
                    html += `</div>
                        <div class="form-inline">
                            <div class="form-group"><label>⚖️ ロジック比較演算子</label>
                                <select onchange="updateStep(${step.id},'checkCondition',this.value);saveData();runPreview();">
                                    <option value="equal" ${step.checkCondition==='equal'?'selected':''}>条件値と一致する (TRUE)</option>
                                    <option value="not_equal" ${step.checkCondition==='not_equal'?'selected':''}>条件値と一致しない (FALSE)</option>
                                </select>
                            </div>
                            <div class="form-group"><label>💎 期待されるターゲット値</label><input type="text" value="${step.checkValue||''}" oninput="updateStep(${step.id},'checkValue',this.value);saveData();runPreview();"></div>
                        </div>
                        <div class="form-inline" style="margin-top:10px;">
                            <div class="form-group"><label>✅ 一致時(TRUE)移行先ステップ #</label><input type="number" value="${step.matchStep||''}" oninput="updateStep(${step.id},'matchStep',parseInt(this.value));saveData();runPreview();"></div>
                            <div class="form-group"><label>❌ 不一致時(FALSE)移行先ステップ #</label><input type="number" value="${step.unmatchStep||''}" oninput="updateStep(${step.id},'unmatchStep',parseInt(this.value));saveData();runPreview();"></div>
                        </div>
                    </div>`;
                }
                item.innerHTML = html; container.appendChild(item);
            });
        }

        function renderImgPreview(id, url) {
            const wrap = document.getElementById(`preview-wrap-${id}`);
            if(!wrap) return;
            wrap.innerHTML = url ? `<img src="${url}" class="img-preview">` : `<div class="img-preview" style="height:35px; line-height:35px; text-align:center; font-size:0.7rem; color:#555;">画像URL未指定 (非表示)</div>`;
        }

        function addItem(type) {
            const nid = Date.now();
            if(type==='stage_marker') gameSteps.push({id:nid, type, stageNum: 1, stageName: "新規チャプター"});
            else if(type==='story') gameSteps.push({id:nid, type, text: "新規会話テキスト。\n[en]New story conversation text.", charImg: ""});
            else if(type==='credits') gameSteps.push({id:nid, type, text: "STAFF ROLL\n\nPRESENTED BY GUTTI"});
            else if(type==='action') gameSteps.push({id:nid, type, actionType: "free", saveTag: "flag", paramA: "テキスト入力欄\n[en]Input text", paramB: "8", charImg: ""});
            else if(type==='inspection') gameSteps.push({id:nid, type, targetType: "tag", targetTag: "flag", checkCondition: "equal", checkValue: "ok", matchStep: 1, unmatchStep: 1});
            renderTimeline(); saveData(); runPreview();
        }
        function updateStep(id, f, v) { const s = gameSteps.find(x=>x.id===id); if(s) s[f]=v; }
        function deleteItem(id) { gameSteps = gameSteps.filter(x=>x.id!==id); renderTimeline(); saveData(); runPreview(); }
        
        function runPreview() { 
            const iframe = document.getElementById('preview-iframe');
            if(iframe) { iframe.srcdoc = buildEngineHTML(); }
        }

        function exportHTML() {
            const htmlContent = buildEngineHTML();
            const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = document.getElementById('cfg-title').value + ".html";
            a.click();
        }

        function buildEngineHTML() {
            const title = document.getElementById('cfg-title').value;
            const deviceMode = document.getElementById('cfg-device').value;
            const bgColor = document.getElementById('cfg-bg-color').value;
            const textColor = document.getElementById('cfg-text-color').value;
            const accentColor = document.getElementById('cfg-accent-color').value;
            const jsonSteps = JSON.stringify(gameSteps).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
            
            let layoutStyles = "";
            if (deviceMode === 'pc') {
                layoutStyles = `
                    body { display: flex; justify-content: center; align-items: center; background: #000; }
                    .game-screen { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; height: auto; border: 3px solid #222; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; position: relative; }
                `;
            } else {
                layoutStyles = `
                    body { display: block; background: ${bgColor}; }
                    .game-screen { width: 100%; height: 100vh; position: relative; overflow: hidden; }
                `;
            }

            return `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${title}</title>
    <style>
        body { margin:0; padding:0; font-family: monospace; color: ${textColor}; background: ${bgColor}; overflow:hidden; height:100vh; user-select:none; transition: filter 0.1s; }
        ${layoutStyles}
        
        .container { width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; box-sizing:border-box; text-align:center; background: ${bgColor}; }
        
        .viewport-canvas { width: 100%; max-width: 460px; height: 260px; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); position: relative; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; border-radius: 8px; overflow: hidden; }
        .viewport-bg { width: 100%; height: 100%; object-fit: contain; position: absolute; top:0; left:0; z-index: 1; }
        .viewport-interactive { position: absolute; width:100%; height:100%; top:0; left:0; z-index: 2; display:flex; justify-content:center; align-items:center; }

        .click-target-node { width: 44px; height: 44px; background: rgba(0, 0, 0, 0.2); border: 3px solid ${accentColor}; border-radius: 50%; cursor: pointer; animation: pulseNode 1.3s infinite; box-shadow: 0 0 15px ${accentColor}; }
        @keyframes pulseNode { 0% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }

        .charge-container { width: 80%; background: rgba(0,0,0,0.6); height: 20px; border-radius: 10px; border: 2px solid ${accentColor}; overflow: hidden; position: relative; }
        .charge-bar { width: 0%; height: 100%; background: ${accentColor}; transition: width 0.08s; box-shadow: 0 0 10px ${accentColor}; }

        .dialog-box { font-size:1.2rem; line-height:1.6; max-width:580px; white-space:pre-line; min-height:65px; margin-top:10px; color: ${textColor}; }
        
        .free-input-container { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 320px; margin-top: 15px; }
        .free-input-box { width: 100%; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 4px; color: #fff; font-size: 1.1rem; text-align: center; font-family: monospace; }
        .free-input-box:focus { border-color: ${accentColor}; outline: none; box-shadow: 0 0 10px ${accentColor}; }

        .typing-container { display:none; flex-direction:column; align-items:center; margin-top:10px; }
        .roman-line { font-size:2.1rem; font-weight:bold; letter-spacing:1.5px; margin-top:8px; color:${accentColor}; text-shadow:0 0 8px ${accentColor}; }
        .text-done { opacity: 1; color: ${textColor}; }
        .text-todo { opacity: 0.25; }
        
        .select-layout { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; width:85%; max-width:600px; margin-top:25px; }
        .chapter-card { background:rgba(0,0,0,0.4); color:${textColor}; border:1px solid rgba(255,255,255,0.1); padding:14px; text-align:left; cursor:pointer; border-radius:6px; transition:all 0.2s; }
        .chapter-card:hover { background:${accentColor}; color:#000; border-color:${accentColor}; }

        .result-panel { background: rgba(0,0,0,0.8); border: 2px solid ${accentColor}; padding: 25px; border-radius: 8px; width: 85%; max-width: 420px; box-shadow: 0 0 20px ${accentColor}; }
        .rank-badge { font-size: 4.5rem; font-weight: 900; color: ${accentColor}; text-shadow: 0 0 15px ${accentColor}; margin: 8px 0; }

        #scr-credits { display: none; width: 100%; height: 100%; background: #000; position: absolute; top: 0; left: 0; z-index: 500; overflow: hidden; }
        .credits-wrap { position: absolute; width: 100%; bottom: -100%; animation: scrollCredits 22s linear forwards; text-align: center; font-size: 1.25rem; line-height: 2.3; color: #fff; }
        @keyframes scrollCredits { 0% { bottom: -120%; } 100% { bottom: 120%; } }

        .gear-toggle { position:absolute; top:15px; right:15px; font-size:1.4rem; cursor:pointer; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:50%; z-index:1000; border:1px solid rgba(255,255,255,0.1); color:${textColor}; }
        .gear-panel { position:absolute; top:0; left:0; width:100%; height:100%; background:${bgColor}; z-index:999; display:none; flex-direction:column; justify-content:center; align-items:center; }
        .menu-row { margin:15px 0; width:320px; display:flex; justify-content:space-between; align-items:center; font-size:1rem; }
        .menu-row select { width: 130px; background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 5px; border-radius: 4px; }

        .btn { background:transparent; color:${textColor}; border:2px solid ${textColor}; padding:8px 24px; font-size:1rem; cursor:pointer; margin-top:20px; font-weight:bold; border-radius:4px; }
        .btn:hover { background:${textColor}; color:${bgColor}; }
        .hidden { display:none !important; }
    </style>
</head>
<body>

    <div class="game-screen">
        <div class="gear-toggle" onclick="toggleMenu()">⚙</div>
        <div class="gear-panel" id="ui-menu">
            <h2 id="lbl-menu-title" style="letter-spacing:2px; color: ${accentColor};">システム設定 / SETTINGS</h2>
            <div class="menu-row">
                <span id="lbl-menu-gamma">⚙️ システム輝度</span>
                <input type="range" id="sys-gamma" min="0.1" max="2.0" step="0.1" value="1.0" oninput="syncHardware()">
            </div>
            <div class="menu-row">
                <span id="lbl-menu-lang">🌐 言語 (Language)</span>
                <select id="sys-lang" onchange="changeLanguage()">
                    <option value="ja" selected>日本語</option>
                    <option value="en">English</option>
                </select>
            </div>
            <button class="btn" id="btn-menu-close" style="border-color:${accentColor}; color:${accentColor};" onclick="toggleMenu()">閉じる / DISMISS</button>
        </div>

        <div id="scr-credits">
            <div class="credits-wrap" id="credits-roll"></div>
        </div>

        <div class="container">
            <div id="scr-boot">
                <h1 style="font-size:2.2rem; margin-bottom:25px; letter-spacing:2px; font-weight:900; color:${accentColor};">${title}</h1>
                <button class="btn" id="btn-boot" style="border-color:${accentColor}; color:${accentColor};" onclick="executeBoot()">ランタイムシステム起動</button>
            </div>

            <div id="scr-select" class="hidden">
                <h2 id="lbl-archive-title" style="color:${accentColor}; letter-spacing:2px;">解読済みアーカイブ（CHAPTER SELECT）</h2>
                <div class="select-layout" id="select-box"></div>
            </div>

            <div id="scr-result" class="hidden result-panel">
                <h3 id="lbl-res-title" style="margin:0; color:${accentColor}; letter-spacing:1px;">タイピング解析結果</h3>
                <div class="rank-badge" id="res-rank">S</div>
                <div style="font-size:1rem; text-align:left; margin:0 auto; width:260px; line-height:1.8;">
                    <div><span id="lbl-res-keys">・入力文字数:</span> <span id="res-keys" style="color:#fff">0</span></div>
                    <div><span id="lbl-res-miss">・システムミス:</span> <span id="res-miss" style="color:red">0</span></div>
                    <div><span id="lbl-res-kpm">・打鍵速度 (KPM):</span> <span id="res-kpm" style="color:${accentColor}">0</span></div>
                </div>
                <button class="btn" id="btn-res-close" style="border-color:${accentColor}; color:${accentColor};" onclick="closeResult()">次へ進む</button>
            </div>

            <div id="scr-runtime" class="hidden">
                <div class="viewport-canvas">
                    <img id="view-img" class="viewport-bg hidden">

                    <input type="text" id="free-input-node" class="free-input-box" placeholder="入力..." autocomplete="off">

                </div>

                    <div style="font-size:1.3rem; font-weight:bold; color:#fff;" id="jp-box"></div>

                </div>

            </div>

    <script>
        const steps = JSON.parse(\`${jsonSteps}\`);
        let idx = 0, rCur = "", tIdx = 0, isT = false, isInputFieldFocused = false;
        let pressCount = 0, pressTarget = 30;
        let stageStartTime = 0, stageKeys = 0, stageMiss = 0;
        let lastInterceptedKey = ""; 
        const tagStorage = { name: "agent" }; 
        let currentLang = "ja"; 

        const langData = {
            ja: {
                boot: "ランタイムシステム起動", archive: "解読済みアーカイブ（CHAPTER SELECT）", resTitle: "タイピング解析結果",
                resKeys: "・入力文字数:", resMiss: "・システムミス:", resKpm: "・打鍵速度 (KPM):", resClose: "次へ進む",
                menuTitle: "システム設定 / SETTINGS", menuGamma: "⚙️ システム輝度", menuLang: "🌐 言語 (Language)", menuClose: "閉じる / DISMISS", btnNext: "進む",
                overloadTxt: "<span style='color:${accentColor}; font-weight:bold;'>[ACTION: 連打バースト]</span><br>スペースキーかクリック連打でメーターをMAXにしろ！",
                brightTxt: "<span style='color:${accentColor}; font-weight:bold;'>[ACTION: 輝度同期タスク]</span><br>右上メニューからシステム輝度を最大値<span style='color:${accentColor}; font-weight:bold;'>【2.0】</span>に同期させて「進む」を押せ。",
                completeTxt: "<span style='color:${accentColor}; font-weight:bold;'>【全シークエンス完了】</span><br>すべてのタイムライン実行が終了しました。"
            },
            en: {
                boot: "LAUNCH RUNTIME SYSTEM", archive: "UNLOCKED ARCHIVES (CHAPTER SELECT)", resTitle: "TYPING ANALYSIS RESULT",
                resKeys: "· Total Keystrokes:", resMiss: "· System Errors:", resKpm: "· Typing Speed (KPM):", resClose: "PROCEED NEXT",
                menuTitle: "HARDWARE INTERNAL SETTINGS", menuGamma: "⚙️ Hardware Brightness", menuLang: "🌐 System Language", menuClose: "DISMISS", btnNext: "PROCEED",
                overloadTxt: "<span style='color:${accentColor}; font-weight:bold;'>[ACTION: OVERLOAD GAUGE]</span><br>Press SPACE or Click to burst the gauge to maximum!",
                brightTxt: "<span style='color:${accentColor}; font-weight:bold;'>[ACTION: HARDWARE INTERFERENCE]</span><br>Open top-right settings, synchronize system brightness to <span style='color:${accentColor}; font-weight:bold;'>[2.0]</span>, then press PROCEED.",
                completeTxt: "<span style='color:${accentColor}; font-weight:bold;'>【SEQUENCE COMPLETE】</span><br>All timeline sequences have executed successfully."
            }
        };

        function resolveTextTranslation(rawText) {
            if (!rawText) return ""; let text = rawText;
            if (rawText.includes("[en]")) {
                const lines = rawText.split('\\n'); let jaPart = []; let enPart = [];
                lines.forEach(line => { if (line.trim().startsWith("[en]")) { enPart.push(line.replace("[en]", "").trim()); } else { jaPart.push(line); } });
                text = (currentLang === "en" && enPart.length > 0) ? enPart.join('\\n') : jaPart.join('\\n');
            }
            return text.replace(/\\[tag:(.*?)\\]/g, function(match, key) { return tagStorage[key] !== undefined ? tagStorage[key] : ("[" + key + "]"); });
        }

        function changeLanguage() {
            currentLang = document.getElementById('sys-lang').value; const d = langData[currentLang];
            document.getElementById('btn-boot').textContent = d.boot; document.getElementById('lbl-archive-title').textContent = d.archive;
            document.getElementById('lbl-res-title').textContent = d.resTitle; document.getElementById('lbl-res-keys').textContent = d.resKeys;
            document.getElementById('lbl-res-miss').textContent = d.resMiss; document.getElementById('lbl-res-kpm').textContent = d.resKpm;
            document.getElementById('btn-res-close').textContent = d.resClose; document.getElementById('lbl-menu-title').textContent = d.menuTitle;
            document.getElementById('lbl-menu-gamma').textContent = d.menuGamma; document.getElementById('lbl-menu-lang').textContent = d.menuLang;
            document.getElementById('btn-menu-close').textContent = d.menuClose; document.getElementById('btn-next').textContent = d.btnNext;

            if (steps && steps[idx]) {
                const s = steps[idx];
                if (s.type === 'story') { document.getElementById('text-box').textContent = resolveTextTranslation(s.text); } 
                else if (s.type === 'action') {
                    if (s.actionType === 'free') { document.getElementById('text-box').textContent = resolveTextTranslation(s.paramA) || "Enter value:"; } 
                    else if (s.actionType === 'typing') { document.getElementById('jp-box').textContent = resolveTextTranslation(s.paramA); } 
                    else if (s.actionType === 'overload') { document.getElementById('text-box').innerHTML = d.overloadTxt; } 
                    else if (s.actionType === 'click_core') { document.getElementById('text-box').innerHTML = resolveTextTranslation(s.paramA); } 
                    else if (s.actionType === 'brightness_check') { document.getElementById('text-box').innerHTML = d.brightTxt; }
                }
            }
        }

        function executeBoot() {
            changeLanguage(); const unlocked = JSON.parse(localStorage.getItem("gutti_premium_unlocked") || "[]");
            if(unlocked.length <= 1) { document.getElementById('scr-boot').classList.add('hidden'); document.getElementById('scr-runtime').classList.remove('hidden'); idx = 0; runStep(); } 
            else { buildArchiveSelect(); }
        }

        function buildArchiveSelect() {
            document.getElementById('scr-boot').classList.add('hidden'); document.getElementById('scr-select').classList.remove('hidden');
            const box = document.getElementById('select-box'); box.innerHTML = '';
            steps.forEach((s, stepIdx) => {
                if(s.type === 'stage_marker') {
                    const card = document.createElement('div'); card.className = 'chapter-card';
                    card.innerHTML = '<b>📍 CHAPTER 0' + s.stageNum + '</b><br><span style="font-size:0.85rem; opacity:0.7;">' + s.stageName + '</span>';
                    card.onclick = () => { document.getElementById('scr-select').classList.add('hidden'); document.getElementById('scr-runtime').classList.remove('hidden'); idx = stepIdx; runStep(); };
                    box.appendChild(card);
                }
            });
        }

        function runStep() {
            if(!steps || idx < 0 || idx >= steps.length) { document.getElementById('text-box').innerHTML = langData[currentLang].completeTxt; document.getElementById('btn-next').classList.add('hidden'); return; }
            const s = steps[idx];
            if (s.type === 'credits') { document.getElementById('scr-runtime').classList.add('hidden'); const rollContainer = document.getElementById('scr-credits'); const textContainer = document.getElementById('credits-roll'); rollContainer.style.display = 'block'; textContainer.innerText = resolveTextTranslation(s.text); return; }
            if (s.type === 'stage_marker') { let unl = JSON.parse(localStorage.getItem("gutti_premium_unlocked") || "[]"); if(!unl.includes(s.stageNum)) { unl.push(s.stageNum); localStorage.setItem("gutti_premium_unlocked", JSON.stringify(unl)); } idx++; runStep(); return; }
            if (s.type === 'inspection') {
                let isMatch = false;
                if(s.targetType === 'always' || s.checkCondition === 'always') { isMatch = true; } 
                else {
                    let evaluationSourceValue = s.targetType === 'last_key' ? lastInterceptedKey.trim().toLowerCase() : (tagStorage[s.targetTag] || "").toString().trim().toLowerCase();
                    const conditionTarget = (s.checkValue || "").toString().trim().toLowerCase();
                    if(s.checkCondition === 'equal') isMatch = (evaluationSourceValue === conditionTarget);
                    if(s.checkCondition === 'not_equal') isMatch = (evaluationSourceValue !== conditionTarget);
                }
                idx = isMatch ? (s.matchStep - 1) : (s.unmatchStep - 1); runStep(); return;
            }

            const imgEl = document.getElementById('view-img'); if(s.charImg) { imgEl.src = s.charImg; imgEl.classList.remove('hidden'); } else { imgEl.classList.add('hidden'); }
            const layer = document.getElementById('interact-layer'); layer.innerHTML = '';
            document.getElementById('btn-next').classList.add('hidden'); document.getElementById('type-box').style.display = 'none'; document.getElementById('free-input-wrap').classList.add('hidden');

            if (s.type === 'action') {
                if(s.actionType === 'time_check') { const h = new Date().getHours(); const start = parseInt(s.paramA) || 0; const end = parseInt(s.paramB) || 23; tagStorage[s.saveTag] = (h >= start && h <= end) ? 'in_time' : 'out_time'; idx++; runStep(); return; }
                if(s.actionType === 'free') { isT = false; document.getElementById('text-box').textContent = resolveTextTranslation(s.paramA) || "Enter text:"; const inputWrap = document.getElementById('free-input-wrap'); const inputNode = document.getElementById('free-input-node'); inputWrap.classList.remove('hidden'); inputNode.value = ""; if(s.paramB && parseInt(s.paramB) > 0) inputNode.maxLength = parseInt(s.paramB); else inputNode.removeAttribute('maxLength'); inputNode.focus(); return; }
                if(s.actionType === 'typing') { isT = true; document.getElementById('type-box').style.display = 'flex'; document.getElementById('text-box').textContent = ""; document.getElementById('jp-box').textContent = resolveTextTranslation(s.paramA || ""); rCur = resolveTextTranslation(s.paramB || "code").toLowerCase(); tIdx = 0; refreshTypeDisplay(); stageStartTime = Date.now(); stageKeys = rCur.length; stageMiss = 0; } 
                else if(s.actionType === 'overload') { isT = false; pressCount = 0; pressTarget = parseInt(s.paramA) || 30; document.getElementById('text-box').innerHTML = langData[currentLang].overloadTxt; const wrap = document.createElement('div'); wrap.className = 'charge-container'; const fill = document.createElement('div'); fill.id = 'charge-bar-node'; fill.className = 'charge-bar'; wrap.appendChild(fill); layer.appendChild(wrap); layer.onclick = () => { handleOverloadClick(); }; } 
                else if(s.actionType === 'click_core') { isT = false; document.getElementById('text-box').innerHTML = resolveTextTranslation(s.paramA || ""); const target = document.createElement('div'); target.className = 'click-target-node'; target.style.position = 'absolute'; target.style.top = '45%'; target.style.left = '45%'; target.onclick = () => { tagStorage[s.saveTag] = 'found'; idx++; runStep(); }; layer.appendChild(target); } 
                else if(s.actionType === 'brightness_check') { isT = false; document.getElementById('text-box').innerHTML = langData[currentLang].brightTxt; document.getElementById('btn-next').classList.remove('hidden'); }
                return;
            }
            if (s.type === 'story') { isT = false; document.getElementById('btn-next').classList.remove('hidden'); document.getElementById('text-box').textContent = resolveTextTranslation(s.text); }
        }

        function submitFreeInput() { const inputNode = document.getElementById('free-input-node'); const inputVal = inputNode.value.trim(); const s = steps[idx]; if(s && s.type === 'action' && s.actionType === 'free') { tagStorage[s.saveTag] = inputVal || "agent"; idx++; runStep(); } }
        function handleOverloadClick() { if(!steps[idx] || steps[idx].type !== 'action' || steps[idx].actionType !== 'overload') return; pressCount++; const bar = document.getElementById('charge-bar-node'); if(bar) bar.style.width = Math.min((pressCount / pressTarget) * 100, 100) + '%'; if(pressCount >= pressTarget) { tagStorage[steps[idx].saveTag] = 'max'; idx++; runStep(); } }
        function stepForward() { if(!steps[idx]) return; const s = steps[idx]; if(s && s.type === 'action' && s.actionType === 'brightness_check') { const g = parseFloat(document.getElementById('sys-gamma').value); tagStorage[s.saveTag] = (g >= 2.0) ? 'max' : 'low'; } idx++; runStep(); }
        function refreshTypeDisplay() { document.getElementById('lbl-done').textContent = rCur.substring(0, tIdx); document.getElementById('lbl-todo').textContent = rCur.substring(tIdx); }

        function inputCharacter(c) {
            if(isInputFieldFocused) return; if(c !== ' ' && c.length === 1) lastInterceptedKey = c;
            if(steps[idx] && steps[idx].type === 'action' && steps[idx].actionType === 'overload' && c === ' ') { handleOverloadClick(); return; }
            if(!isT) { if(c === ' ' && !document.getElementById('btn-next').classList.contains('hidden')) stepForward(); return; }
            if(c.toLowerCase() === rCur[tIdx].toLowerCase()) { tIdx++; refreshTypeDisplay(); if(tIdx >= rCur.length) { isT = false; tagStorage[steps[idx].saveTag] = rCur; showTypingResult(); } } 
            else { if(c !== 'Shift' && c !== 'Control' && c !== 'Alt') stageMiss++; }
        }

        function showTypingResult() {
            const duration = (Date.now() - stageStartTime) / 1000; const kpm = Math.round((stageKeys / (duration || 1)) * 60);
            document.getElementById('res-keys').textContent = stageKeys; document.getElementById('res-miss').textContent = stageMiss; document.getElementById('res-kpm').textContent = kpm;
            let rank = "C"; if(stageMiss === 0 && kpm > 250) rank = "SS"; else if(stageMiss <= 1 && kpm > 180) rank = "S"; else if(stageMiss <= 3 && kpm > 120) rank = "A"; else if(stageMiss <= 6 && kpm > 70) rank = "B";
            document.getElementById('res-rank').textContent = rank; document.getElementById('scr-runtime').classList.add('hidden'); document.getElementById('scr-result').classList.remove('hidden');
        }

        function closeResult() { document.getElementById('scr-result').classList.add('hidden'); document.getElementById('scr-runtime').classList.remove('hidden'); idx++; runStep(); }
        function toggleMenu() { const m = document.getElementById('ui-menu'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
        function syncHardware() { const g = document.getElementById('sys-gamma').value; document.body.style.filter = "brightness(" + g + ")"; }
        
        document.getElementById('free-input-node').addEventListener('input', function(e) { let filteredValue = this.value.toLowerCase().replace(/[^a-z0-9]/g, ''); if (this.value !== filteredValue) this.value = filteredValue; });
        document.getElementById('free-input-node').addEventListener('focus', () => { isInputFieldFocused = true; });
        document.getElementById('free-input-node').addEventListener('blur', () => { isInputFieldFocused = false; });
        document.getElementById('free-input-node').addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); submitFreeInput(); } });

        window.addEventListener('keydown', (e) => { if(isInputFieldFocused) return; if(e.key === ' ') { e.preventDefault(); inputCharacter(' '); } else if(e.key.length === 1) inputCharacter(e.key); });
    <\/script>
