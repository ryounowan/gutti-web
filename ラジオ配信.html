<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Host Pro - Rack Mount</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #121417; --panel: #2a2f3a; --accent: #ff9f00; --led-on: #ff3e3e; }
        body { font-family: 'Courier New', Courier, monospace; background: var(--bg); color: #e2e8f0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .rack-case { background: #1a1d23; border: 4px solid #333; border-radius: 8px; width: 100%; max-width: 480px; padding: 25px; box-shadow: inset 0 0 15px #000, 0 20px 40px rgba(0,0,0,0.7); border-top: 10px solid #222; }
        .label { font-size: 10px; color: #64748b; letter-spacing: 2px; margin-bottom: 5px; font-weight: bold; }
        
        /* 周波数ディスプレイ */
        .lcd { background: #000; border: 2px solid #444; border-radius: 4px; padding: 15px; margin-bottom: 25px; text-align: center; }
        .freq-text { font-size: 38px; color: var(--accent); text-shadow: 0 0 12px rgba(255,159,0,0.6); }
        .freq-unit { font-size: 14px; margin-left: 5px; }

        /* コントロール */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .control-block { background: rgba(255,255,255,0.03); padding: 12px; border: 1px solid #334155; border-radius: 4px; }
        
        .btn-master { width: 100%; padding: 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; font-size: 16px; border: 2px solid #444; }
        .btn-start { background: #334155; color: white; }
        .btn-onair { background: #222; color: #555; }
        .btn-onair.active { background: var(--led-on); color: white; border-color: #ff8b8b; box-shadow: 0 0 20px var(--led-on); }
        
        .v-meter { height: 8px; background: #000; border-radius: 4px; overflow: hidden; margin: 15px 0; border: 1px solid #333; }
        #level-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #facc15, #ef4444); transition: width 0.1s; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .stat-val { font-size: 20px; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="rack-case">
    <div class="label">BROADCAST TRANSMITTER SYSTEM V2</div>
    
    <div class="lcd">
        <div class="label">TRANSMIT FREQUENCY</div>
        <div class="freq-text"><span id="freq-num">80.0</span><span class="freq-unit">MHz</span></div>
        <input type="range" min="76.0" max="95.0" step="0.1" value="80.0" oninput="document.getElementById('freq-num').innerText = parseFloat(this.value).toFixed(1)">
    </div>

    <div id="setup-layer">
        <button class="btn-master btn-start" onclick="openStation()">送信機を起動 (LINK START)</button>
    </div>

    <div id="main-layer" style="display:none">
        <button id="airBtn" class="btn-master btn-onair" onclick="toggleAir()">OFF AIR</button>
        <div class="v-meter"><div id="level-bar"></div></div>

        <div class="grid">
            <div class="control-block">
                <div class="label">MIC GAIN</div>
                <input type="range" min="0" max="1.5" step="0.01" value="1" oninput="micGain.gain.value = this.value">
            </div>
            <div class="control-block">
                <div class="label">LISTENERS</div>
                <div class="stat-val" id="count">00</div>
            </div>
        </div>
        <div class="label" style="margin-top:20px; text-align:center;">SYSTEM STABLE / AES-256 ENCRYPTED</div>
    </div>
</div>

<script>
    let peer, audioCtx, destination, micGain, analyser, connections = {};
    let isAirOn = false;

    function openStation() {
        const freq = document.getElementById('freq-num').innerText.replace('.', '-');
        const stationId = `radio-station-${freq}`;
        
        peer = new Peer(stationId, {
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
        });

        peer.on('open', () => {
            document.getElementById('setup-layer').style.display = 'none';
            document.getElementById('main-layer').style.display = 'block';
            initAudio();
        });

        peer.on('connection', conn => {
            connections[conn.peer] = conn;
            updateCount();
            conn.on('close', () => { delete connections[conn.peer]; updateCount(); });
            if(isAirOn) peer.call(conn.peer, destination.stream);
        });
    }

    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        destination = audioCtx.createMediaStreamDestination();
        analyser = audioCtx.createAnalyser();
        micGain = audioCtx.createGain();
        micGain.connect(destination);
        micGain.connect(analyser);

        const draw = () => {
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            const volume = data.reduce((a, b) => a + b) / data.length;
            document.getElementById('level-bar').style.width = Math.min(volume * 2.5, 100) + "%";
            requestAnimationFrame(draw);
        };
        draw();
    }

    async function toggleAir() {
        const btn = document.getElementById('airBtn');
        if(!isAirOn) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(stream).connect(micGain);
                isAirOn = true;
                btn.innerText = "ON AIR";
                btn.classList.add('active');
                Object.keys(connections).forEach(id => peer.call(id, destination.stream));
            } catch(e) { alert("マイクのアクセスを許可してください"); }
        } else {
            location.reload();
        }
    }

    function updateCount() {
        document.getElementById('count').innerText = Object.keys(connections).length.toString().padStart(2, '0');
    }
</script>
</body>
</html>
