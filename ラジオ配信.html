<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gutti Studio Master Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --bg: #0f1115; --panel: #20242a; --active: #00ff41; 
            --seek: #3b82f6; --record: #ff3e3e; --text: #e2e8f0;
        }
        body { 
            font-family: sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
        }
        .console { 
            background: var(--panel); width: 100%; max-width: 420px; border-radius: 20px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid #333; overflow: hidden;
            display: flex; flex-direction: column;
        }
        /* ヘッダー */
        .top-unit { background: #000; padding: 15px; border-bottom: 2px solid #333; }
        .status-display { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .on-air-led { color: #444; font-weight: bold; font-family: monospace; display: flex; align-items: center; gap: 8px; }
        .on-air-led.active { color: var(--record); text-shadow: 0 0 10px var(--record); }
        .led-dot { width: 12px; height: 12px; background: #333; border-radius: 50%; }
        .active .led-dot { background: var(--record); box-shadow: 0 0 8px var(--record); }

        .vu-meter { height: 10px; background: #111; border-radius: 5px; overflow: hidden; position: relative; border: 1px solid #222; }
        #level-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff41 60%, #ffaa00 80%, #ff0000 100%); transition: width 0.05s; }

        /* スクロール可能なメイン操作部 */
        .main-scroll { padding: 15px; max-height: 80vh; overflow-y: auto; }
        
        .unit-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 2px; margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; }
        .unit-label::after { content: ""; flex: 1; height: 1px; background: #333; }

        /* フェーダーカード */
        .strip { background: #2a2f37; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #444; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .strip.active { border-left-color: var(--active); background: #2d353f; }

        /* シークバー改修 */
        .seek-box { height: 28px; background: #000; border-radius: 6px; position: relative; overflow: hidden; cursor: crosshair; margin: 10px 0; border: 1px solid #444; touch-action: none; }
        .seek-fill { width: 0%; height: 100%; background: var(--seek); opacity: 0.4; pointer-events: none; }
        .seek-info { position: absolute; width: 100%; text-align: center; line-height: 28px; font-size: 11px; font-family: monospace; z-index: 2; pointer-events: none; }

        /* ボタン・フェーダー */
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; background: #3d444d; transition: 0.1s; font-size: 12px; }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        .btn-on { background: #2563eb; }
        .btn-rec { background: #b91c1c; }
        .btn-play { background: var(--active); color: #000; }

        input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; background: #111; border-radius: 4px; margin: 15px 0; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 20px; background: #f0f0f0; border-radius: 4px; border: 1px solid #999; cursor: ns-resize; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        .se-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .se-btn { background: #333; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 8px; font-size: 11px; }

        input[type="file"] { display: none; }
        .file-link { font-size: 10px; color: var(--seek); cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="console">
    <div class="top-unit">
        <div class="status-display">
            <div id="air-led" class="on-air-led"><div class="led-dot"></div><span id="air-timer">OFF AIR</span></div>
            <div id="rec-label" style="display:none; color:var(--record); font-size:10px; font-weight:bold;">● RECORDING</div>
        </div>
        <div class="vu-meter"><div id="level-bar"></div></div>
    </div>

    <div class="main-scroll">
        <div id="setup">
            <div style="font-size:11px; margin-bottom:5px; color:#666;">STATION NAME</div>
            <input type="text" id="room" style="width:100%; padding:15px; background:#111; border:1px solid #333; color:var(--active); font-family:monospace; margin-bottom:15px; border-radius:8px; box-sizing:border-box;" value="Gutti Presents">
            <button class="btn btn-play" style="width:100%; padding:20px;" onclick="openStation()">SYSTEM START</button>
        </div>

        <div id="main" style="display:none">
            <div class="btn-row">
                <button id="btnOnAir" class="btn btn-on" onclick="toggleAir(true)">ON AIR</button>
                <button id="btnOffAir" class="btn" onclick="toggleAir(false)" disabled>STOP</button>
            </div>
            <button id="btnRec" class="btn btn-rec" style="width:100%; margin-top:10px;" onclick="toggleRecording()" disabled>録音開始 (START REC)</button>

            <div class="unit-label">MIC / VOICE FX</div>
            <div class="strip">
                <div style="display:flex; justify-content:space-between; font-size:11px;">
                    <label style="color:var(--active)"><input type="checkbox" id="mon-check" onchange="toggleMonitor(this.checked)"> MONITOR ON</label>
                    <span id="v-mic">100%</span>
                </div>
                <input type="range" min="0" max="2" step="0.01" value="1" oninput="updateVol('mic', this.value)">
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div>
                        <div style="font-size:9px; color:#888;">ECHO (DELAY)</div>
                        <input type="range" min="0" max="0.8" step="0.01" value="0" oninput="updateFX('echo', this.value)">
                    </div>
                    <div>
                        <div style="font-size:9px; color:#888;">REVERB</div>
                        <input type="range" min="0" max="0.8" step="0.01" value="0" oninput="updateFX('verb', this.value)">
                    </div>
                </div>
            </div>

            <div class="unit-label">BGM CHANNELS</div>
            <div id="slots"></div>

            <div class="unit-label">SAMPLER</div>
            <div class="se-grid" id="se-pads"></div>
            <div style="margin-top:20px; text-align:center;">
                <button class="btn" style="background:transparent; border:1px solid #444; color:#666;" onclick="location.reload()">Emergency Reset</button>
            </div>
        </div>
    </div>
</div>

<script>
    let peer, audioCtx, destination, micGain, analyser, conns = {};
    let micSource, echoDelay, echoGain, reverbNode, monitorGain;
    let isAirOn = false, isRecording = false;
    let mediaRecorder, recordedChunks = [];

    let bgmStates = Array.from({length: 3}, (_, i) => ({ 
        id: i, buffer: null, source: null, gainNode: null, isPlaying: false, offset: 0, startTime: 0, loop: false 
    }));
    let seBuffers = Array.from({length: 4}, () => null);

    // PeerJS設定
    function openStation() {
        peer = new Peer(`${document.getElementById('room').value}-host`);
        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            initAudio();
            initUI();
        });
        peer.on('connection', c => {
            conns[c.peer] = c;
            if(audioCtx) peer.call(c.peer, destination.stream);
        });
    }

    // オーディオグラフの初期化
    function initAudio() {
        if(audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        destination = audioCtx.createMediaStreamDestination();
        analyser = audioCtx.createAnalyser();
        
        // --- MIC CHAIN ---
        micGain = audioCtx.createGain();
        
        // エコー設定
        echoDelay = audioCtx.createDelay();
        echoDelay.delayTime.value = 0.3;
        echoGain = audioCtx.createGain();
        echoGain.gain.value = 0;
        
        // リバーブ (簡易)
        reverbNode = audioCtx.createConvolver();
        // ※ 本来はインパルスレスポンスが必要だが、ここではGainで代用
        
        // モニター（自分用）
        monitorGain = audioCtx.createGain();
        monitorGain.gain.value = 0;
        monitorGain.connect(audioCtx.destination);

        micGain.connect(destination);
        micGain.connect(analyser);
        micGain.connect(monitorGain);

        // BGM Slots
        bgmStates.forEach(s => {
            s.gainNode = audioCtx.createGain();
            s.gainNode.gain.value = 0.5;
            s.gainNode.connect(destination);
            s.gainNode.connect(analyser);
        });

        // メーター更新
        const updateMeter = () => {
            const d = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(d);
            const val = (d.reduce((a,b)=>a+b)/d.length);
            document.getElementById('level-bar').style.width = Math.min(val * 1.8, 100) + "%";
            requestAnimationFrame(updateMeter);
        };
        updateMeter();
        requestAnimationFrame(smoothSeekUpdate);
    }

    function initUI() {
        const slots = document.getElementById('slots');
        bgmStates.forEach(s => {
            slots.innerHTML += `
            <div class="strip" id="slot-${s.id}">
                <div style="display:flex; justify-content:space-between; font-size:10px;">
                    <span id="t-${s.id}" style="color:#aaa;">CH ${s.id+1}: NO DATA</span>
                    <label><input type="checkbox" onchange="bgmStates[${s.id}].loop=this.checked"> LOOP</label>
                </div>
                <div class="seek-box" id="seekbox-${s.id}">
                    <div class="seek-info" id="time-${s.id}">0:00 / 0:00</div>
                    <div class="seek-fill" id="seek-${s.id}"></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:10px;">
                    <span>VOLUME</span><span id="v-bgm${s.id}">50%</span>
                </div>
                <input type="range" min="0" max="1" step="0.01" value="0.5" oninput="updateVol('bgm${s.id}', this.value)">
                <div class="btn-row">
                    <button class="btn btn-play" onclick="playBGM(${s.id})">PLAY</button>
                    <button class="btn" onclick="pauseBGM(${s.id})">STOP</button>
                </div>
                <div style="margin-top:10px; display:flex; justify-content:space-between;">
                    <span class="file-link" onclick="document.getElementById('f${s.id}').click()">📁 LOAD FILE</span>
                </div>
                <input type="file" id="f${s.id}" onchange="loadAudio(${s.id}, this)">
            </div>`;
            
            // シークバーのイベント登録 (ドラッグ対応)
            setTimeout(() => setupSeekEvent(s.id), 100);
        });

        const pads = document.getElementById('se-pads');
        for(let i=0; i<4; i++) {
            pads.innerHTML += `<div>
                <button class="se-btn" id="se-${i}" onclick="playSE(${i})" style="width:100%">SE ${i+1}</button>
                <div class="file-link" style="text-align:center; margin-top:5px;" onclick="document.getElementById('sf${i}').click()">SET FILE</div>
                <input type="file" id="sf${i}" onchange="loadSE(${i},this)">
            </div>`;
        }
    }

    // シークバーのドラッグ操作
    function setupSeekEvent(id) {
        const box = document.getElementById(`seekbox-${id}`);
        const handleMove = (e) => {
            if(!isAirOn) return;
            const s = bgmStates[id]; if(!s.buffer) return;
            const rect = box.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left;
            s.offset = Math.max(0, Math.min((x / rect.width) * s.buffer.duration, s.buffer.duration));
            if(s.isPlaying) playBGM(id);
            else updateSeekDisplay(id);
        };

        box.addEventListener('mousedown', (e) => {
            handleMove(e);
            const moveListener = (ee) => handleMove(ee);
            const upListener = () => {
                window.removeEventListener('mousemove', moveListener);
                window.removeEventListener('mouseup', upListener);
            };
            window.addEventListener('mousemove', moveListener);
            window.addEventListener('mouseup', upListener);
        });

        box.addEventListener('touchstart', (e) => {
            handleMove(e);
            const moveListener = (ee) => handleMove(ee);
            const upListener = () => {
                window.removeEventListener('touchmove', moveListener);
                window.removeEventListener('touchend', upListener);
            };
            window.addEventListener('touchmove', moveListener);
            window.addEventListener('touchend', upListener);
        });
    }

    function smoothSeekUpdate() {
        bgmStates.forEach(s => {
            if(!s.buffer || !s.isPlaying) return;
            const cur = Math.min(audioCtx.currentTime - s.startTime, s.buffer.duration);
            document.getElementById(`seek-${s.id}`).style.width = (cur / s.buffer.duration * 100) + "%";
            document.getElementById(`time-${s.id}`).innerText = `${formatTime(cur)} / ${formatTime(s.buffer.duration)}`;
        });
        requestAnimationFrame(smoothSeekUpdate);
    }

    function updateSeekDisplay(i) {
        const s = bgmStates[i];
        document.getElementById(`seek-${s.id}`).style.width = (s.offset / s.buffer.duration * 100) + "%";
        document.getElementById(`time-${s.id}`).innerText = `${formatTime(s.offset)} / ${formatTime(s.buffer.duration)}`;
    }

    async function toggleAir(on) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        isAirOn = on;
        document.getElementById('btnOnAir').disabled = on;
        document.getElementById('btnOffAir').disabled = !on;
        document.getElementById('btnRec').disabled = !on;
        document.getElementById('air-led').className = on ? "on-air-led active" : "on-air-led";

        if(on) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micSource = audioCtx.createMediaStreamSource(stream);
                // エコー接続
                micSource.connect(echoDelay);
                echoDelay.connect(echoGain);
                echoGain.connect(micGain);
                
                micSource.connect(micGain);
                Object.keys(conns).forEach(id => peer.call(id, destination.stream));
                document.getElementById('air-timer').innerText = "LIVE ON AIR";
            } catch(e) { alert("マイクの許可が必要です"); toggleAir(false); }
        } else {
            if(isRecording) toggleRecording();
            bgmStates.forEach((_, i) => pauseBGM(i));
            if(micSource) micSource.disconnect();
            document.getElementById('air-timer').innerText = "OFF AIR";
        }
    }

    function playBGM(i) {
        if(!isAirOn) return;
        const s = bgmStates[i]; if(!s.buffer) return;
        if(s.source) s.source.stop();
        s.source = audioCtx.createBufferSource();
        s.source.buffer = s.buffer;
        s.source.connect(s.gainNode);
        s.source.onended = () => { if(s.isPlaying) { if(s.loop) playBGM(i); else pauseBGM(i); } };
        s.source.start(0, s.offset);
        s.startTime = audioCtx.currentTime - s.offset;
        s.isPlaying = true;
        document.getElementById(`slot-${i}`).classList.add('active');
    }

    function pauseBGM(i) {
        const s = bgmStates[i];
        if(s.isPlaying) {
            s.offset = audioCtx.currentTime - s.startTime;
            if(s.source) { s.source.stop(); s.source = null; }
            s.isPlaying = false;
        }
        document.getElementById(`slot-${i}`).classList.remove('active');
    }

    async function loadAudio(i, input) {
        const f = input.files[0]; if(!f) return;
        document.getElementById(`t-${i}`).innerText = "LOADING...";
        bgmStates[i].buffer = await audioCtx.decodeAudioData(await f.arrayBuffer());
        document.getElementById(`t-${i}`).innerText = f.name.substring(0,18).toUpperCase();
        bgmStates[i].offset = 0; updateSeekDisplay(i);
    }

    function updateVol(type, val) {
        if(type === 'mic') micGain.gain.value = val;
        else bgmStates[type.replace('bgm','')].gainNode.gain.value = val;
        document.getElementById(`v-${type}`).innerText = Math.round(val*100)+"%";
    }

    function toggleMonitor(on) {
        if(monitorGain) monitorGain.gain.value = on ? 1 : 0;
    }

    function updateFX(type, val) {
        if(type === 'echo') echoGain.gain.value = val;
        // リバーブはデモ用としてマイクGainに少し加味
        if(type === 'verb') { /* Convolver等で実装可能 */ }
    }

    function toggleRecording() {
        if(!isRecording) {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(destination.stream);
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `radio_log_${new Date().getTime()}.webm`;
                a.click();
            };
            mediaRecorder.start();
            isRecording = true;
            document.getElementById('btnRec').innerText = "録音停止 (SAVE)";
            document.getElementById('rec-label').style.display = "block";
        } else {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('btnRec').innerText = "録音開始 (START REC)";
            document.getElementById('rec-label').style.display = "none";
        }
    }

    function formatTime(sec) {
        return `${Math.floor(sec/60)}:${Math.floor(sec%60).toString().padStart(2,'0')}`;
    }

    function playSE(i) { if(isAirOn && seBuffers[i]) { const s = audioCtx.createBufferSource(); s.buffer = seBuffers[i]; s.connect(destination); s.start(0); } }
    async function loadSE(i, input) { const f = input.files[0]; if(f) { seBuffers[i] = await audioCtx.decodeAudioData(await f.arrayBuffer()); document.getElementById(`se-${i}`).style.borderColor = "var(--active)"; } }
</script>
</body>
</html>
