<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Radio Host - Pro Mixer Mobile Ready</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #ef4444; --bg: #020617; --panel: #1e293b; --active: #10b981; --seek: #3b82f6; --echo: #a855f7; --record: #f87171; --se: #facc15; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; padding: 10px; margin: 0; }
        .box { background: var(--panel); padding: 20px; border-radius: 24px; width: 100%; max-width: 480px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 13px; color: #94a3b8; }
        .listener-badge { background: #334155; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: var(--active); border-radius: 50%; display: inline-block; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .main-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .ctrl-btn { padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; opacity: 0.9; text-align: center; font-size: 14px; }
        .ctrl-btn:active { transform: scale(0.98); }
        .btn-start { background: #3b82f6; } .btn-stop { background: #ef4444; } .btn-restart { background: #8b5cf6; } .btn-rec { background: var(--record); }
        .mixer { background: #0f172a; padding: 15px; border-radius: 20px; border: 1px solid #334155; }
        .fader-header { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin: 10px 0 5px; font-weight: bold; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 10px; background: #334155; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #fff; border-radius: 50%; cursor: pointer; border: 2px solid var(--seek); }
        .meter-container { background: #000; height: 12px; border-radius: 6px; margin-bottom: 15px; overflow: hidden; border: 1px solid #475569; }
        #level-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981 70%, #facc15 85%, #ef4444 100%); transition: width 0.05s; }
        
        /* シークバーのデザイン */
        .seek-container { 
            width: 100%; 
            height: 25px; /* スマホで触りやすく太く */
            background: #000; 
            border-radius: 12px; 
            margin: 10px 0; 
            cursor: pointer; 
            position: relative;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .seek-bar { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, #3b82f6, #60a5fa); 
            pointer-events: none; 
            transition: width 0.1s linear;
        }
        .seek-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 25px;
            font-size: 10px;
            font-weight: bold;
            pointer-events: none;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .bgm-slot { background: #1e293b; padding: 15px; border-radius: 12px; margin-top: 15px; border-left: 4px solid #475569; }
        .bgm-slot.playing { border-left-color: var(--active); background: #232f42; }
        .se-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .se-btn { background: #334155; color: white; border: 1px solid #475569; padding: 12px; border-radius: 12px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>
<div class="box">
    <div class="header-row">
        <div>
            <h2 style="margin:0;">🎙 Radio Host</h2>
            <div id="air-timer" class="timer-display">STREAM 00:00:00</div>
        </div>
        <div class="listener-badge" id="listener-count-container" style="display:none">
            <span class="dot"></span>
            <span id="listener-count">0</span>
        </div>
    </div>

    <div id="setup">
        <input type="text" id="room" style="width:100%; padding:15px; margin-bottom:10px; border-radius:12px; border:none; background:#334155; color:white; box-sizing:border-box;" value="apple7">
        <button class="ctrl-btn btn-start" style="width:100%" onclick="openStation()">放送局を開設</button>
    </div>

    <div id="main" style="display:none">
        <div class="meter-container"><div id="level-bar"></div></div>
        <div class="main-controls">
            <button id="btnOnAir" class="ctrl-btn btn-start" onclick="toggleAir(true)">ON AIR</button>
            <button id="btnOffAir" class="ctrl-btn btn-stop" onclick="toggleAir(false)" disabled>OFF</button>
            <button class="ctrl-btn btn-restart" onclick="location.reload()">REBOOT</button>
        </div>

        <div class="mixer">
            <div class="fader-header"><span>🎙 マイク音量</span><span id="v-mic">100%</span></div>
            <input type="range" id="micVol" min="0" max="1.5" step="0.01" value="1" oninput="updateVol('mic', this.value)">
            
            <div id="slots"></div>
            
            <div class="fader-header"><span>📣 効果音 (SE)</span></div>
            <div class="se-grid" id="se-pads"></div>
        </div>
    </div>
</div>

<script>
    let peer, audioCtx, destination, micGain, analyser, conns = {};
    let micSource, duckingNode;
    let airStartTime, timerInterval;
    let bgmStates = Array.from({length: 3}, (_, i) => ({ id: i, buffer: null, source: null, gainNode: null, isPlaying: false, startTime: 0, offset: 0, loop: false }));
    let seBuffers = Array.from({length: 4}, () => null);

    const PEER_CONFIG = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { 
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            'iceTransportPolicy': 'all'
        }
    };

    function openStation() {
        const room = document.getElementById('room').value;
        peer = new Peer(`${room}-host`, PEER_CONFIG);
        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            document.getElementById('listener-count-container').style.display = 'inline-flex';
            initUI();
            startGlobalTimer();
        });
        peer.on('connection', c => {
            conns[c.peer] = c;
            updateListenerCount();
            c.on('close', () => { delete conns[c.peer]; updateListenerCount(); });
            if(audioCtx && destination) peer.call(c.peer, destination.stream);
        });
    }

    function initAudio() {
        if(audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        destination = audioCtx.createMediaStreamDestination();
        analyser = audioCtx.createAnalyser();
        duckingNode = audioCtx.createGain();
        duckingNode.connect(destination);
        duckingNode.connect(analyser);

        micGain = audioCtx.createGain();
        micGain.connect(duckingNode);

        bgmStates.forEach(s => {
            s.gainNode = audioCtx.createGain();
            s.gainNode.gain.value = 0.5;
            s.gainNode.connect(duckingNode);
        });
        startLevelMeter();
    }

    function initUI() {
        // SEパッドの生成
        const pads = document.getElementById('se-pads');
        pads.innerHTML = "";
        for(let i=0; i<4; i++) {
            pads.innerHTML += `
                <div>
                    <button class="se-btn" id="se-btn-${i}" onclick="playSE(${i})">未設定</button>
                    <input type="file" id="se-f-${i}" hidden onchange="loadSE(${i}, this)">
                    <div style="text-align:center; font-size:9px; margin-top:4px; cursor:pointer; color:#94a3b8;" onclick="document.getElementById('se-f-${i}').click()">📁 SE読込</div>
                </div>`;
        }

        // BGMスロットの生成
        const slots = document.getElementById('slots');
        slots.innerHTML = "";
        bgmStates.forEach(s => {
            slots.innerHTML += `
                <div class="bgm-slot" id="slot-${s.id}">
                    <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px;">
                        <span id="title-${s.id}" style="overflow:hidden; white-space:nowrap; max-width:150px;">BGM ${s.id+1}</span>
                        <div>
                            <span style="font-size:9px;">LOOP</span>
                            <input type="checkbox" onchange="bgmStates[${s.id}].loop = this.checked">
                        </div>
                    </div>
                    
                    <div class="seek-container" 
                         onmousedown="handleSeek(${s.id}, event)" 
                         ontouchstart="handleSeek(${s.id}, event)">
                        <div class="seek-text" id="time-${s.id}">0:00 / 0:00</div>
                        <div class="seek-bar" id="seek-${s.id}"></div>
                    </div>

                    <div class="fader-header"><span>BGM音量</span><span id="v-bgm${s.id}">50%</span></div>
                    <input type="range" min="0" max="1" step="0.01" value="0.5" oninput="updateVol('bgm${s.id}', this.value)">
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="ctrl-btn btn-start" style="flex:2;" onclick="playBGM(${s.id})">再生</button>
                        <button class="ctrl-btn btn-stop" style="flex:1;" onclick="stopBGM(${s.id})">停止</button>
                        <button class="ctrl-btn btn-restart" style="flex:1; font-size:10px;" onclick="document.getElementById('f${s.id}').click()">選択</button>
                    </div>
                    <input type="file" id="f${s.id}" hidden onchange="loadAudio(${s.id}, this)">
                </div>`;
        });
        setInterval(updateSeekDisplay, 100);
    }

    // シーク操作（スマホのタッチ位置にも対応）
    function handleSeek(i, event) {
        const s = bgmStates[i]; if(!s.buffer) return;
        
        const rect = event.currentTarget.getBoundingClientRect();
        let clientX = event.clientX;
        
        // スマホ（タッチイベント）の場合の位置取得
        if (event.touches && event.touches[0]) {
            clientX = event.touches[0].clientX;
        }

        const x = clientX - rect.left;
        const width = rect.width;
        s.offset = Math.max(0, Math.min((x / width) * s.buffer.duration, s.buffer.duration));

        if(s.isPlaying) {
            playBGM(i); // 位置を更新して再開
        } else {
            updateSeekDisplay(); // 停止中ならバーの表示だけ更新
        }
        event.preventDefault();
    }

    function playBGM(i) {
        const s = bgmStates[i]; if(!s.buffer) return;
        if(s.source) { s.source.onended = null; s.source.stop(); }
        
        s.source = audioCtx.createBufferSource();
        s.source.buffer = s.buffer;
        s.source.connect(s.gainNode);
        
        s.source.onended = () => {
            if(s.isPlaying) {
                if(s.loop) { s.offset = 0; playBGM(i); } 
                else { stopBGM(i); }
            }
        };

        s.source.start(0, s.offset);
        s.startTime = audioCtx.currentTime - s.offset;
        s.isPlaying = true;
        document.getElementById(`slot-${i}`).classList.add('playing');
    }

    function stopBGM(i) {
        const s = bgmStates[i];
        if(s.source) { s.source.onended = null; s.source.stop(); s.source = null; }
        s.isPlaying = false;
        s.offset = 0;
        document.getElementById(`slot-${i}`).classList.remove('playing');
    }

    function updateSeekDisplay() {
        bgmStates.forEach(s => {
            if(!s.buffer) return;
            const current = s.isPlaying ? (audioCtx.currentTime - s.startTime) : s.offset;
            const prog = (current / s.buffer.duration) * 100;
            document.getElementById(`seek-${s.id}`).style.width = Math.min(prog, 100) + "%";
            document.getElementById(`time-${s.id}`).innerText = `${formatSec(current)} / ${formatSec(s.buffer.duration)}`;
        });
    }

    function formatSec(sec) {
        let m = Math.floor(sec / 60), s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    async function loadAudio(i, input) {
        initAudio(); const file = input.files[0]; if(!file) return;
        document.getElementById(`title-${i}`).innerText = "読込中...";
        const buf = await file.arrayBuffer();
        bgmStates[i].buffer = await audioCtx.decodeAudioData(buf);
        document.getElementById(`title-${i}`).innerText = file.name;
    }

    async function toggleAir(on) {
        initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('btnOnAir').disabled = on;
        document.getElementById('btnOffAir').disabled = !on;
        if(on) {
            airStartTime = Date.now();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micSource = audioCtx.createMediaStreamSource(stream);
                micSource.connect(micGain);
                Object.keys(conns).forEach(id => peer.call(id, destination.stream));
            } catch(e) { alert("マイクの使用を許可してください"); }
        } else {
            airStartTime = null; 
            if(micSource) micSource.disconnect();
        }
    }

    function updateVol(type, val) {
        document.getElementById(`v-${type}`).innerText = Math.round(val * 100) + "%";
        if(type === 'mic') micGain.gain.value = val;
        else bgmStates[type.replace('bgm','')].gainNode.gain.value = val;
    }

    function startLevelMeter() {
        const data = new Uint8Array(analyser.frequencyBinCount);
        const update = () => {
            analyser.getByteFrequencyData(data);
            let avg = data.reduce((a, b) => a + b) / data.length;
            document.getElementById('level-bar').style.width = Math.min(avg * 2.8, 100) + "%";
            requestAnimationFrame(update);
        };
        update();
    }

    function startGlobalTimer() {
        setInterval(() => {
            if (airStartTime) document.getElementById('air-timer').innerText = "STREAM " + new Date(Date.now() - airStartTime).toISOString().substr(11, 8);
        }, 1000);
    }
    
    function updateListenerCount() { document.getElementById('listener-count').innerText = Object.keys(conns).length; }

    function playSE(i) {
        if (!seBuffers[i] || !audioCtx) return;
        const source = audioCtx.createBufferSource();
        source.buffer = seBuffers[i];
        source.connect(duckingNode);
        source.start(0);
    }

    async function loadSE(i, input) {
        initAudio(); const file = input.files[0]; if(!file) return;
        const btn = document.getElementById(`se-btn-${i}`);
        btn.innerText = "⏳";
        const buf = await file.arrayBuffer();
        seBuffers[i] = await audioCtx.decodeAudioData(buf);
        btn.innerText = file.name.substring(0, 6) + "..";
    }
</script>
</body>
</html>
