<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Host Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #020617; --panel: #1e293b; --active: #10b981; --seek: #3b82f6; --record: #f87171; --se: #facc15; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .box { background: var(--panel); padding: 20px; border-radius: 20px; width: 100%; max-width: 450px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .timer { font-family: monospace; color: #94a3b8; font-size: 14px; }
        .main-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn { padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; font-size: 14px; }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        .btn-start { background: #3b82f6; } .btn-stop { background: #ef4444; } .btn-re { background: #8b5cf6; }
        .mixer { background: #0f172a; padding: 15px; border-radius: 15px; border: 1px solid #334155; }
        input[type="range"] { width: 100%; height: 12px; accent-color: var(--seek); cursor: pointer; }
        .seek-container { width: 100%; height: 30px; background: #000; border-radius: 8px; margin: 10px 0; position: relative; overflow: hidden; border: 1px solid #334155; cursor: pointer; }
        .seek-bar { width: 0%; height: 100%; background: var(--seek); pointer-events: none; }
        .seek-text { position: absolute; width: 100%; text-align: center; line-height: 30px; font-size: 11px; pointer-events: none; color: white; text-shadow: 1px 1px 2px #000; }
        .bgm-slot { background: #1e293b; padding: 12px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #475569; }
        .bgm-slot.playing { border-left-color: var(--active); background: #232f42; }
        .se-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .se-btn { background: #334155; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .meter { background: #000; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        #level-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #facc15, #ef4444); transition: width 0.1s; }
    </style>
</head>
<body>
<div class="box">
    <div class="header">
        <h2 style="margin:0; font-size:20px;">🎙 Radio Host</h2>
        <div id="air-timer" class="timer">OFF AIR</div>
    </div>
    <div id="setup">
        <input type="text" id="room" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; background:#334155; color:white; box-sizing:border-box;" value="apple7">
        <button class="btn btn-start" style="width:100%" onclick="openStation()">配信局を開設</button>
    </div>
    <div id="main" style="display:none">
        <div class="meter"><div id="level-bar"></div></div>
        <div class="main-controls">
            <button id="btnOnAir" class="btn btn-start" onclick="toggleAir(true)">ON AIR</button>
            <button id="btnOffAir" class="btn btn-stop" onclick="toggleAir(false)" disabled>OFF</button>
            <button class="btn btn-re" onclick="location.reload()">REBOOT</button>
        </div>
        <div class="mixer">
            <div style="display:flex; justify-content:space-between; font-size:12px;"><span>🎙 マイク音量</span><span id="v-mic">100%</span></div>
            <input type="range" min="0" max="1.5" step="0.01" value="1" oninput="updateVol('mic', this.value)">
            <div id="slots"></div>
            <div class="se-grid" id="se-pads"></div>
        </div>
    </div>
</div>

<script>
    let peer, audioCtx, destination, micGain, analyser, conns = {};
    let micSource, airStartTime;
    let bgmStates = Array.from({length: 3}, (_, i) => ({ id: i, buffer: null, source: null, gainNode: null, isPlaying: false, startTime: 0, offset: 0, loop: false }));
    let seBuffers = Array.from({length: 4}, () => null);

    const CONFIG = { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }], 'iceTransportPolicy': 'all' } };

    function openStation() {
        peer = new Peer(`${document.getElementById('room').value}-host`, CONFIG);
        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            initUI();
        });
        peer.on('connection', c => {
            conns[c.peer] = c;
            if(audioCtx && destination) peer.call(c.peer, destination.stream);
        });
    }

    function initAudio() {
        if(audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        destination = audioCtx.createMediaStreamDestination();
        analyser = audioCtx.createAnalyser();
        micGain = audioCtx.createGain();
        micGain.connect(destination);
        micGain.connect(analyser);
        bgmStates.forEach(s => {
            s.gainNode = audioCtx.createGain();
            s.gainNode.gain.value = 0.5;
            s.gainNode.connect(destination);
        });
        const updateMeter = () => {
            const d = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(d);
            document.getElementById('level-bar').style.width = Math.min((d.reduce((a,b)=>a+b)/d.length)*2.5, 100) + "%";
            requestAnimationFrame(updateMeter);
        };
        updateMeter();
    }

    function initUI() {
        const slots = document.getElementById('slots');
        bgmStates.forEach(s => {
            slots.innerHTML += `
            <div class="bgm-slot" id="slot-${s.id}">
                <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:5px;">
                    <span id="t-${s.id}">BGM ${s.id+1} (未選択)</span>
                    <label><input type="checkbox" onchange="bgmStates[${s.id}].loop=this.checked"> LOOP</label>
                </div>
                <div class="seek-container" onmousedown="handleSeek(${s.id}, event)" ontouchstart="handleSeek(${s.id}, event)">
                    <div class="seek-text" id="time-${s.id}">0:00 / 0:00</div>
                    <div class="seek-bar" id="seek-${s.id}"></div>
                </div>
                <input type="range" min="0" max="1" step="0.01" value="0.5" oninput="updateVol('bgm${s.id}', this.value)">
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <button class="btn btn-start" style="flex:2; padding:8px;" onclick="playBGM(${s.id})">再生</button>
                    <button class="btn btn-stop" style="flex:1; padding:8px;" onclick="stopBGM(${s.id})">停止</button>
                    <button class="btn btn-re" style="flex:1; padding:8px; font-size:10px;" onclick="document.getElementById('f${s.id}').click()">選択</button>
                </div>
                <input type="file" id="f${s.id}" hidden onchange="loadAudio(${s.id}, this)">
            </div>`;
        });
        const pads = document.getElementById('se-pads');
        for(let i=0; i<4; i++) {
            pads.innerHTML += `<div><button class="se-btn" id="se-${i}" onclick="playSE(${i})" style="width:100%">SE ${i+1}</button>
            <input type="file" hidden id="sf${i}" onchange="loadSE(${i},this)"><div style="font-size:8px;text-align:center;cursor:pointer" onclick="document.getElementById('sf${i}').click()">読込</div></div>`;
        }
        setInterval(updateSeekDisplay, 100);
    }

    function handleSeek(i, e) {
        const s = bgmStates[i]; if(!s.buffer) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        s.offset = Math.max(0, Math.min((x / rect.width) * s.buffer.duration, s.buffer.duration));
        if(s.isPlaying) playBGM(i);
        e.preventDefault();
    }

    function playBGM(i) {
        const s = bgmStates[i]; if(!s.buffer) return;
        if(s.source) { s.source.onended = null; s.source.stop(); }
        s.source = audioCtx.createBufferSource();
        s.source.buffer = s.buffer;
        s.source.connect(s.gainNode);
        s.source.onended = () => { if(s.isPlaying) { if(s.loop) playBGM(i); else stopBGM(i); } };
        s.source.start(0, s.offset);
        s.startTime = audioCtx.currentTime - s.offset;
        s.isPlaying = true;
        document.getElementById(`slot-${i}`).classList.add('playing');
    }

    function stopBGM(i) {
        const s = bgmStates[i]; if(s.source) { s.source.onended = null; s.source.stop(); s.source = null; }
        s.isPlaying = false; s.offset = 0;
        document.getElementById(`slot-${i}`).classList.remove('playing');
    }

    function updateSeekDisplay() {
        bgmStates.forEach(s => {
            if(!s.buffer) return;
            const cur = s.isPlaying ? (audioCtx.currentTime - s.startTime) : s.offset;
            document.getElementById(`seek-${s.id}`).style.width = (cur / s.buffer.duration * 100) + "%";
            document.getElementById(`time-${s.id}`).innerText = `${Math.floor(cur/60)}:${Math.floor(cur%60).toString().padStart(2,'0')} / ${Math.floor(s.buffer.duration/60)}:${Math.floor(s.buffer.duration%60).toString().padStart(2,'0')}`;
        });
    }

    async function loadAudio(i, input) {
        initAudio(); const f = input.files[0]; if(!f) return;
        document.getElementById(`t-${i}`).innerText = "読込中...";
        bgmStates[i].buffer = await audioCtx.decodeAudioData(await f.arrayBuffer());
        document.getElementById(`t-${i}`).innerText = f.name.substring(0,15);
    }

    async function toggleAir(on) {
        initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('btnOnAir').disabled = on;
        document.getElementById('btnOffAir').disabled = !on;
        if(on) {
            airStartTime = Date.now();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            micSource = audioCtx.createMediaStreamSource(stream);
            micSource.connect(micGain);
            Object.keys(conns).forEach(id => peer.call(id, destination.stream));
            setInterval(() => { if(airStartTime) document.getElementById('air-timer').innerText = "LIVE " + new Date(Date.now()-airStartTime).toISOString().substr(11,8); }, 1000);
        } else {
            airStartTime = null; if(micSource) micSource.disconnect();
            document.getElementById('air-timer').innerText = "OFF AIR";
        }
    }

    function updateVol(type, val) {
        if(type === 'mic') micGain.gain.value = val;
        else bgmStates[type.replace('bgm','')].gainNode.gain.value = val;
        document.getElementById(`v-${type}`) && (document.getElementById(`v-${type}`).innerText = Math.round(val*100)+"%");
    }

    function playSE(i) { if(seBuffers[i]) { const s = audioCtx.createBufferSource(); s.buffer = seBuffers[i]; s.connect(destination); s.start(0); } }
    async function loadSE(i, input) { initAudio(); const f = input.files[0]; if(f) { seBuffers[i] = await audioCtx.decodeAudioData(await f.arrayBuffer()); document.getElementById(`se-${i}`).innerText = "OK"; } }
</script>
</body>
</html>
