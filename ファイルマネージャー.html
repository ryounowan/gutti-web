<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gutti FileManager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #00e5ff; --grad: linear-gradient(135deg, #00e5ff, #0072ff); --glass: rgba(255, 255, 255, 0.1); }
        body, html { margin: 0; padding: 0; height: 100dvh; font-family: -apple-system, sans-serif; background: #000 no-repeat center/cover; color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none; transition: background 0.5s ease; }

        /* --- Desktop Widgets --- */
        #desktop { height: 100%; display: flex; flex-direction: column; position: relative; z-index: 10; }
        #clock-widget { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: -1; }
        #clock-time { font-size: 5rem; font-weight: 300; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #clock-date { font-size: 1.2rem; opacity: 0.8; }

        /* --- Header & MiniPlayer --- */
        .top-bar { padding: calc(65px + env(safe-area-inset-top)) 15px 10px; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px); display: flex; gap: 8px; }
        #search-box { flex: 1; padding: 10px; border-radius: 8px; border: none; background: var(--glass); color: #fff; outline: none; font-size: 14px; }
        
        #mini-player { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%); width: 85%; height: 40px; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-radius: 20px; z-index: 5500; display: none; align-items: center; padding: 0 15px; border: 1px solid rgba(255,255,255,0.1); }
        #mini-player span { flex: 1; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 10px; }

        /* --- Explorer Grid --- */
        #explorer { flex: 1; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 12px; align-content: start; overflow-y: auto; }
        .node { text-align: center; padding: 8px; border-radius: 10px; position: relative; }
        .node.selected { background: rgba(0, 229, 255, 0.2); border: 1px solid var(--accent); }
        .node i { font-size: 2.5rem; display: block; margin-bottom: 5px; }
        .node-name { font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- Action Sheet (Long Tap) --- */
        #action-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; color: #111; border-radius: 20px 20px 0 0; display: none; flex-direction: column; z-index: 7000; padding: 20px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        #action-sheet.open { transform: translateY(0); }
        .act-item { padding: 14px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 14px; }
        .act-item.disabled { opacity: 0.3; }

        /* --- Window System --- */
        .win { position: fixed; inset: 0; background: #000; z-index: 8000; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
        .win-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass); }
        #media-player { background: linear-gradient(180deg, #05050a 0%, #1a1a2e 100%); align-items: center; justify-content: center; }
        .player-disk { width: 200px; height: 200px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; animation: rotate 12s linear infinite; animation-play-state: paused; }
        .player-disk.playing { animation-play-state: running; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- Taskbar --- */
        .taskbar { height: 70px; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .task-icon { font-size: 1.4rem; color: #fff; opacity: 0.8; }
        #bulk-bar { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; display: none; gap: 15px; font-weight: bold; z-index: 5000; }
    </style>
</head>
<body>

<div id="desktop">
    <div id="clock-widget">
        <div id="clock-time">00:00</div>
        <div id="clock-date">2026.01.01</div>
    </div>

    <div id="mini-player" onclick="openPlayerUI()"><i class="fas fa-music"></i><span id="mini-t">Select Track</span><i class="fas fa-wave-square"></i></div>

    <div class="top-bar">
        <input type="text" id="search-box" placeholder="Search..." oninput="render()">
        <button onclick="toggleSelect()" id="sel-btn" style="background:var(--glass); border:none; color:#fff; border-radius:8px; padding:0 12px; font-size:12px;">選択</button>
        <button onclick="openSettings()" style="background:var(--glass); border:none; color:#fff; border-radius:8px; padding:0 12px;"><i class="fas fa-cog"></i></button>
    </div>

    <div id="explorer" onclick="closePopups()"></div>

    <div id="bulk-bar"><span onclick="bulkDl()"><i class="fas fa-download"></i></span><span onclick="bulkDel()" style="color:#d00;"><i class="fas fa-trash"></i></span></div>

    <div id="action-sheet">
        <div id="act-name" style="text-align:center; font-weight:bold; color:#888; font-size:12px; margin-bottom:10px;"></div>
        <div class="act-item" onclick="handleAct('open')"><i class="fas fa-play"></i> 開く / 実行</div>
        <div class="act-item" id="act-edit-btn" onclick="handleAct('edit')"><i class="fas fa-edit"></i> 編集</div>
        <div class="act-item" onclick="handleAct('dl')"><i class="fas fa-download"></i> ダウンロード</div>
        <div class="act-item" onclick="handleAct('del')" style="color:#ff3b30; border:none;"><i class="fas fa-trash"></i> 削除</div>
    </div>

    <div id="media-player" class="win">
        <div onclick="closePlayerUI()" style="position:absolute; top:50px; left:25px; font-size:1.8rem;"><i class="fas fa-chevron-down"></i></div>
        <div class="player-disk" id="disk"><i class="fas fa-music" style="font-size:4rem;"></i></div>
        <h2 id="m-title" style="margin:20px 0 0 0; font-size:1.2rem;">Title</h2>
        <div class="seek-container">
            <input type="range" id="seek" class="seek-bar" value="0" oninput="manualSeek()">
            <div style="display:flex; justify-content:space-between; font-size:0.7rem; margin-top:5px; font-family:monospace;">
                <span id="t-curr">0:00</span><span id="t-total">0:00</span>
            </div>
        </div>
        <div style="width:100%; max-width:280px; display:flex; justify-content:space-around; align-items:center;">
            <i class="fas fa-redo-alt" id="loop" onclick="toggleLoop()" style="color:#666;"></i>
            <i class="fas fa-step-backward" onclick="prev()"></i>
            <i class="fas fa-play-circle" id="p-main" onclick="togglePlay()" style="font-size:3.5rem; color:var(--accent);"></i>
            <i class="fas fa-step-forward" onclick="next()"></i>
            <i class="fas fa-cog" style="color:#666;"></i>
        </div>
        <audio id="audio"></audio>
    </div>

    <div id="win-settings" class="win">
        <div class="win-header"><button onclick="closeWin('win-settings')">閉じる</button><span>システム設定</span><div></div></div>
        <div style="padding:20px; overflow-y:auto;">
            <h4>背景画像URL</h4>
            <input type="text" id="cfg-bg" style="width:100%; padding:10px; border-radius:8px; border:none; background:var(--glass); color:#fff;" placeholder="https://...">
            <h4>時計の文字色</h4>
            <input type="color" id="cfg-clock-color" style="width:100%; height:40px; border:none; background:none;">
            <hr style="margin:30px 0; border:0; border-top:1px solid #333;">
            <button onclick="exportData()" style="width:100%; padding:15px; margin-bottom:10px; background:var(--accent); color:#000; border:none; border-radius:10px; font-weight:bold;">一括バックアップ (JSON)</button>
            <button onclick="resetSystem()" style="width:100%; padding:15px; background:#d00; color:#fff; border:none; border-radius:10px; font-weight:bold;">データを全消去 (初期化)</button>
        </div>
    </div>

    <div id="win-editor" class="win">
        <div class="win-header"><button onclick="closeWin('win-editor')">戻る</button><span id="ed-file"></span><button onclick="saveFile()" style="color:var(--accent)">保存</button></div>
        <textarea id="ed-text" spellcheck="false" style="flex:1; background:#000; color:var(--accent); border:none; padding:20px; font-size:16px; outline:none; font-family:monospace;"></textarea>
    </div>

    <div class="taskbar">
        <i class="fas fa-folder-plus task-icon" onclick="newNode('folder')"></i>
        <i class="fas fa-plus-circle task-icon" onclick="newNode('file')"></i>
        <i class="fas fa-file-import task-icon" onclick="document.getElementById('f-up').click()"></i>
    </div>
</div>

<input type="file" id="f-up" multiple onchange="handleImport(this.files)" style="display:none;">

<script>
    const DB_NAME = 'GUTTI_OS_V9', STORE = 'FS';
    let db, currentPath = 'root', selected = new Set(), isSelMode = false, active = null, timer, playlist = [], idx = 0, isLoop = false;
    const audio = document.getElementById('audio');

    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'id' });
    req.onsuccess = e => { db = e.target.result; loadConfig(); render(); updateClock(); };

    // --- System Core ---
    function updateClock() {
        const now = new Date();
        document.getElementById('clock-time').innerText = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        document.getElementById('clock-date').innerText = now.getFullYear() + "." + (now.getMonth()+1) + "." + now.getDate();
        setTimeout(updateClock, 1000);
    }

    function loadConfig() {
        const bg = localStorage.getItem('GUTTI_BG') || 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072';
        document.body.style.backgroundImage = `url(${bg})`;
        document.getElementById('cfg-bg').value = bg;
        const c = localStorage.getItem('GUTTI_CLOCK_COLOR') || '#ffffff';
        document.getElementById('clock-widget').style.color = c;
        document.getElementById('cfg-clock-color').value = c;
    }

    async function render() {
        if(!db) return;
        const q = document.getElementById('search-box').value.toLowerCase();
        const tx = db.transaction(STORE, 'readonly');
        const all = await new Promise(r => { const req = tx.objectStore(STORE).getAll(); req.onsuccess = () => r(req.result); });
        const view = document.getElementById('explorer');
        view.innerHTML = '';

        playlist = all.filter(f => f.parent === currentPath && f.name.match(/\.(mp3|wav|m4a|ogg)$/i));

        if(currentPath !== 'root' && !q) {
            const b = document.createElement('div'); b.className='node'; b.innerHTML=`<i class="fas fa-chevron-left" style="color:#aaa"></i><div class="node-name">戻る</div>`;
            b.onclick = () => { const p = all.find(f=>f.id===currentPath); currentPath = p ? p.parent : 'root'; render(); };
            view.appendChild(b);
        }

        all.filter(i => q ? i.name.toLowerCase().includes(q) : i.parent === currentPath).forEach(item => {
            const ext = item.name.split('.').pop().toLowerCase();
            const isMusic = ['mp3','wav','m4a','ogg'].includes(ext);
            const isVideo = ['mp4','webm'].includes(ext);
            const div = document.createElement('div');
            div.className = `node ${selected.has(item.id) ? 'selected' : ''}`;
            div.innerHTML = `<i class="fas fa-${item.type==='folder'?'folder':(isMusic?'music':(isVideo?'play-circle':'file-alt'))}" style="color:${item.color || (item.type==='folder'?'#fcc419':(isMusic?'#ff00e5':(isVideo?'#00e5ff':'#fff')))}"></i><div class="node-name">${item.name}</div>`;

            div.onmousedown = div.ontouchstart = (e) => { if(!isSelMode) timer = setTimeout(() => openSheet(item), 600); };
            div.onmouseup = div.ontouchend = () => clearTimeout(timer);
            div.onclick = (e) => { e.stopPropagation(); if(isSelMode){ if(selected.has(item.id)) selected.delete(item.id); else selected.add(item.id); render(); document.getElementById('bulk-bar').style.display=selected.size>0?'flex':'none'; } else { launch(item); } };
            view.appendChild(div);
        });
    }

    function launch(item) {
        if(item.type === 'folder') { currentPath = item.id; render(); return; }
        const ext = item.name.split('.').pop().toLowerCase();
        if(['mp3','wav','m4a','ogg'].includes(ext)) { idx=playlist.findIndex(f=>f.id===item.id); load(item); openPlayerUI(); togglePlay(true); }
        else if(ext === 'html') { const w=window.open(); w.document.write(atob(item.content.split(',')[1])); }
        else if(ext === 'mp4') { const w=document.getElementById('media-player'); w.style.display='flex'; w.innerHTML=`<div onclick="location.reload()" style="position:fixed;top:20px;left:20px;z-index:9999;">✕</div><video src="${item.content}" controls autoplay style="width:100%;height:100%;"></video>`; }
        else { openEditor(item); }
    }

    function openSheet(item) {
        active = item;
        const ext = item.name.split('.').pop().toLowerCase();
        const editable = ['html','txt','js','css','json'].includes(ext) || !item.name.includes('.');
        document.getElementById('act-name').innerText = item.name;
        document.getElementById('act-edit-btn').className = editable ? 'act-item' : 'act-item disabled';
        const s = document.getElementById('action-sheet'); s.style.display='flex'; setTimeout(()=>s.classList.add('open'),10);
    }

    function handleAct(type) {
        if(type==='edit' && document.getElementById('act-edit-btn').classList.contains('disabled')) return;
        closePopups();
        if(type==='open') launch(active);
        if(type==='edit') openEditor(active);
        if(type==='dl') { const a=document.createElement('a'); a.href=active.content; a.download=active.name; a.click(); }
        if(type==='del') { const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(active.id); tx.oncomplete=render; }
    }

    // --- Media Logic ---
    function load(item) { audio.src=item.content; audio.preservesPitch=false; document.getElementById('m-title').innerText=item.name; document.getElementById('mini-t').innerText=item.name; audio.onloadedmetadata=()=>{ document.getElementById('seek').max=Math.floor(audio.duration); document.getElementById('t-total').innerText=formatTime(audio.duration); }; }
    function togglePlay(f) { const b=document.getElementById('p-main'), d=document.getElementById('disk'); if(audio.paused||f){ audio.play(); b.className='fas fa-pause-circle'; d.classList.add('playing'); document.getElementById('mini-player').style.display='flex'; } else { audio.pause(); b.className='fas fa-play-circle'; d.classList.remove('playing'); } }
    audio.ontimeupdate=()=>{ document.getElementById('seek').value=Math.floor(audio.currentTime); document.getElementById('t-curr').innerText=formatTime(audio.currentTime); };
    audio.onended=()=>{ if(isLoop){audio.currentTime=0; audio.play();} else next(); };
    function next(){ if(playlist.length>0){ idx=(idx+1)%playlist.length; load(playlist[idx]); togglePlay(true); } }
    function prev(){ if(playlist.length>0){ idx=(idx-1+playlist.length)%playlist.length; load(playlist[idx]); togglePlay(true); } }
    function manualSeek(){ audio.currentTime=document.getElementById('seek').value; }
    function toggleLoop(){ isLoop=!isLoop; document.getElementById('loop').style.color=isLoop?'var(--accent)':'#666'; }
    function formatTime(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return `${m}:${r<10?'0':''}${r}`; }

    // --- Settings & Utils ---
    function openSettings() { document.getElementById('win-settings').style.display='flex'; }
    function closeWin(id) { 
        if(id === 'win-settings') {
            localStorage.setItem('GUTTI_BG', document.getElementById('cfg-bg').value);
            localStorage.setItem('GUTTI_CLOCK_COLOR', document.getElementById('cfg-clock-color').value);
            loadConfig();
        }
        document.getElementById(id).style.display='none'; 
    }
    async function resetSystem() { if(confirm("全データを削除して初期化しますか？")){ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete=()=>location.reload(); } }
    async function exportData() {
        const tx=db.transaction(STORE,'readonly');
        const all=await new Promise(r=>{const req=tx.objectStore(STORE).getAll(); req.onsuccess=()=>r(req.result);});
        const blob=new Blob([JSON.stringify(all)], {type:'application/json'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='GUTTI_OS_BACKUP.json'; a.click();
    }
    function openEditor(item) { active=item; document.getElementById('ed-file').innerText=item.name; document.getElementById('ed-text').value=item.content.includes(',')?atob(item.content.split(',')[1]):item.content; document.getElementById('win-editor').style.display='flex'; }
    function saveFile() { const text=document.getElementById('ed-text').value; active.content="data:text/plain;base64,"+btoa(unescape(encodeURIComponent(text))); const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(active); tx.oncomplete=()=>{alert("Saved"); closeWin('win-editor'); render();}; }
    function toggleSelect() { isSelMode=!isSelMode; selected.clear(); document.getElementById('bulk-bar').style.display='none'; document.getElementById('sel-btn').style.background=isSelMode?'var(--accent)':'var(--glass)'; render(); }
    function bulkDel() { if(confirm("Delete?")){ const tx=db.transaction(STORE,'readwrite'); selected.forEach(id=>tx.objectStore(STORE).delete(id)); tx.oncomplete=()=>{toggleSelect(); render();}; } }
    function bulkDl() { const tx=db.transaction(STORE,'readonly'); tx.objectStore(STORE).getAll().onsuccess=e=>{e.target.result.filter(f=>selected.has(f.id)).forEach(f=>{const a=document.createElement('a');a.href=f.content;a.download=f.name;a.click();}); toggleSelect();}; }
    function openPlayerUI(){ document.getElementById('media-player').style.display='flex'; }
    function closePlayerUI(){ document.getElementById('media-player').style.display='none'; }
    function closePopups(){ const s=document.getElementById('action-sheet'); s.classList.remove('open'); setTimeout(()=>s.style.display='none',300); }
    function handleImport(files) { Array.from(files).forEach(f=>{ const r=new FileReader(); r.onload=e=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).add({id:Date.now()+Math.random().toString(),name:f.name,parent:currentPath,content:e.target.result}); tx.oncomplete=render; }; r.readAsDataURL(f); }); }
    function newNode(t) { const n=prompt("名前:"); if(n){ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).add({id:Date.now().toString(),name:n+(t==='file'&&!n.includes('.')?'.html':''),type:t,parent:currentPath,content:''}); tx.oncomplete=render; } }
</script>
</body>
</html>
