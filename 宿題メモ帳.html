<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿題メモ帳</title>
    <style>
        :root {
            /* ライトモード（デフォルト） */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --header-bg: #ffffff;
            --input-bg: #fafafa;
            
            /* 教科別カラー */
            --color-kokugo: #e74c3c; /* 国語: 赤 */
            --color-suugaku: #3498db; /* 数学: 青 */
            --color-eigo: #9b59b6; /* 英語: 紫 */
            --color-rika: #2ecc71; /* 理科: 緑 */
            --color-shakai: #f1c40f; /* 社会: 黄 */
            --color-all: #7f8c8d;
        }

        /* ダークモード設定 */
        [data-theme="dark"] {
            --bg-color: #1e272e;
            --card-bg: #2d3436;
            --text-color: #f5f6fa;
            --text-muted: #a4b0be;
            --border-color: #485460;
            --header-bg: #2d3436;
            --input-bg: #3d4446;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            position: relative;
            text-align: center;
            margin-bottom: 25px;
            background: var(--header-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 24px;
            color: var(--text-color);
        }

        /* 設定ボタンとモーダル */
        .btn-settings {
            position: absolute;
            right: 15px;
            top: 15px;
            background: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
            line-height: 1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-title {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .btn-action {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover { background: #c0392b; }

        select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        /* 入力エリア */
        .input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .subject-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .subject-radio {
            display: none;
        }

        .subject-label {
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid transparent;
            transition: all 0.2s;
            background: #eee;
            color: #555;
        }

        #radio-kokugo:checked + .subject-label { background: var(--color-kokugo); color: #fff; }
        #radio-suugaku:checked + .subject-label { background: var(--color-suugaku); color: #fff; }
        #radio-eigo:checked + .subject-label { background: var(--color-eigo); color: #fff; }
        #radio-rika:checked + .subject-label { background: var(--color-rika); color: #fff; }
        #radio-shakai:checked + .subject-label { background: var(--color-shakai); color: #fff; }

        input[type="text"], textarea, input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background: var(--input-bg);
            color: var(--text-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-submit {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        /* 検索・絞り込みエリア */
        .filter-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: 1fr;
            }
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
        }

        .filter-tab.active[data-subject="all"] { background: var(--color-all); color: white; }
        .filter-tab.active[data-subject="国語"] { background: var(--color-kokugo); color: white; }
        .filter-tab.active[data-subject="数学"] { background: var(--color-suugaku); color: white; }
        .filter-tab.active[data-subject="英語"] { background: var(--color-eigo); color: white; }
        .filter-tab.active[data-subject="理科"] { background: var(--color-rika); color: white; }
        .filter-tab.active[data-subject="社会"] { background: var(--color-shakai); color: white; }

        /* 宿題リスト表示 */
        .list-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .homework-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .homework-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-left: 6px solid var(--color-all);
            position: relative;
            transition: transform 0.2s;
        }

        .homework-card.latest-badge::after {
            content: "最新";
            position: absolute;
            top: 12px;
            right: 50px;
            background: #ff7675;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .homework-card[data-subject="国語"] { border-left-color: var(--color-kokugo); }
        .homework-card[data-subject="数学"] { border-left-color: var(--color-suugaku); }
        .homework-card[data-subject="英語"] { border-left-color: var(--color-eigo); }
        .homework-card[data-subject="理科"] { border-left-color: var(--color-rika); }
        .homework-card[data-subject="社会"] { border-left-color: var(--color-shakai); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            padding-right: 25px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .subject-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            font-size: 11px;
            margin-right: 5px;
        }

        .homework-card[data-subject="国語"] .subject-badge { background: var(--color-kokugo); }
        .homework-card[data-subject="数学"] .subject-badge { background: var(--color-suugaku); }
        .homework-card[data-subject="英語"] .subject-badge { background: var(--color-eigo); }
        .homework-card[data-subject="理科"] .subject-badge { background: var(--color-rika); }
        .homework-card[data-subject="社会"] .subject-badge { background: var(--color-shakai); }

        .card-title {
            font-weight: bold;
            font-size: 16px;
            margin-top: 4px;
        }

        .card-body {
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 4px;
            margin-top: 5px;
        }

        .btn-delete {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            border: none;
            color: #b2bec3;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .btn-delete:hover { color: #e74c3c; }
        .no-data { text-align: center; padding: 30px; background: var(--card-bg); border-radius: 8px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📝 宿題メモ帳</h1>
        <button class="btn-settings" id="open-settings" title="設定">⚙</button>
    </header>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box">
            <button class="modal-close" id="close-settings">×</button>
            <div class="modal-title">⚙ 設定</div>
            
            <div class="setting-item">
                <label for="theme-select">テーマ変更</label>
                <select id="theme-select">
                    <option value="light">ライトモード</option>
                    <option value="dark">ダークモード</option>
                </select>
            </div>

            <div class="setting-item">
                <label>バックアップ</label>
                <button class="btn-action" id="btn-export">ファイルに保存 (.backup)</button>
                <button class="btn-action" id="btn-import-trigger">ファイルを読み込む</button>
                <input type="file" id="file-import" accept=".backup" style="display: none;">
            </div>

            <div class="setting-item" style="margin-top: 30px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
                <label style="color: #e74c3c;">データの管理</label>
                <button class="btn-action btn-danger" id="btn-clear-all">すべてのデータを全消去</button>
            </div>
        </div>
    </div>

    <section class="input-section">
        <form id="homework-form">
            <div class="form-group">
                <label>教科を選択</label>
                <div class="subject-selector">
                    <input type="radio" name="subject" id="radio-kokugo" value="国語" checked class="subject-radio">
                    <label for="radio-kokugo" class="subject-label">国語</label>

                    <input type="radio" name="subject" id="radio-suugaku" value="数学" class="subject-radio">
                    <label for="radio-suugaku" class="subject-label">数学</label>

                    <input type="radio" name="subject" id="radio-eigo" value="英語" class="subject-radio">
                    <label for="radio-eigo" class="subject-label">英語</label>

                    <input type="radio" name="subject" id="radio-rika" value="理科" class="subject-radio">
                    <label for="radio-rika" class="subject-label">理科</label>

                    <input type="radio" name="subject" id="radio-shakai" value="社会" class="subject-radio">
                    <label for="radio-shakai" class="subject-label">社会</label>
                </div>
            </div>

            <div class="form-group">
                <label for="input-title">タイトル（単元やページなど）</label>
                <input type="text" id="input-title" placeholder="例: 漢字ドリル P.12〜13" required>
            </div>

            <div class="form-group">
                <label for="input-content">宿題の内容（文章）</label>
                <textarea id="input-content" placeholder="例: 次の火曜日までにノートにやって丸付けもしておくこと。"></textarea>
            </div>

            <button type="submit" class="btn-submit">宿題を保存する</button>
        </form>
    </section>

    <section class="filter-section">
        <div class="search-grid">
            <div>
                <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:5px;">言葉で探す（タイトル・本文）</label>
                <input type="text" id="search-text" placeholder="キーワードを入力...">
            </div>
            <div>
                <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:5px;">カレンダーから日付で探す</label>
                <input type="date" id="search-date">
            </div>
        </div>

        <div>
            <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:5px;">教科で絞り込み</label>
            <div class="filter-tabs">
                <div class="filter-tab active" data-subject="all">すべて</div>
                <div class="filter-tab" data-subject="国語">国語</div>
                <div class="filter-tab" data-subject="数学">数学</div>
                <div class="filter-tab" data-subject="英語">英語</div>
                <div class="filter-tab" data-subject="理科">理科</div>
                <div class="filter-tab" data-subject="社会">社会</div>
            </div>
        </div>
    </section>

    <section class="list-section">
        <h2>
            <span>宿題一覧</span>
            <span id="hw-count" style="font-size:14px; font-weight:normal; color:var(--text-muted);">0件</span>
        </h2>
        <div id="homework-list" class="homework-list"></div>
    </section>
</div>

<script>
    let homeworks = JSON.parse(localStorage.getItem('homeworks')) || [];
    let currentSubjectFilter = 'all';

    const form = document.getElementById('homework-form');
    const inputTitle = document.getElementById('input-title');
    const inputContent = document.getElementById('input-content');
    const searchText = document.getElementById('search-text');
    const searchDate = document.getElementById('search-date');
    const homeworkListContainer = document.getElementById('homework-list');
    const hwCountLabel = document.getElementById('hw-count');
    const filterTabs = document.querySelectorAll('.filter-tab');

    // モーダル・設定関連
    const settingsModal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings');
    const closeSettingsBtn = document.getElementById('close-settings');
    const themeSelect = document.getElementById('theme-select');
    const btnExport = document.getElementById('btn-export');
    const btnImportTrigger = document.getElementById('btn-import-trigger');
    const fileImport = document.getElementById('file-import');
    const btnClearAll = document.getElementById('btn-clear-all');

    // テーマの初期化
    const savedTheme = localStorage.getItem('homework_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;

    themeSelect.addEventListener('change', (e) => {
        const theme = e.target.value;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('homework_theme', theme);
    });

    // モーダル開閉
    openSettingsBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
    closeSettingsBtn.addEventListener('click', () => settingsModal.style.display = 'none');
    window.addEventListener('click', (e) => { if(e.target === settingsModal) settingsModal.style.display = 'none'; });

    // バックアップ書き出し (.backup)
    btnExport.addEventListener('click', () => {
        if(homeworks.length === 0) {
            alert('保存するデータがありません。');
            return;
        }
        const dataStr = JSON.stringify(homeworks, null, 2);
        const blob = new Blob([dataStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        
        const now = new Date();
        const dateStr = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');

        const a = document.createElement('a');
        a.href = url;
        a.download = `homework_backup_${dateStr}.backup`;
        a.click();
        URL.revokeObjectURL(url);
    });

    // バックアップ読み込み
    btnImportTrigger.addEventListener('click', () => fileImport.click());
    fileImport.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const importedData = JSON.parse(evt.target.result);
                if(Array.isArray(importedData)) {
                    if(confirm(`バックアップから ${importedData.length} 件のデータを読み込みますか？\\n※重複しないデータが追加・マージされます。`)) {
                        homeworks = [...homeworks, ...importedData];
                        const uniqueMap = {};
                        homeworks.forEach(item => { if(item.id) uniqueMap[item.id] = item; });
                        homeworks = Object.values(uniqueMap);

                        saveToLocalStorage();
                        renderHomeworks();
                        alert('インポートが完了しました。');
                        settingsModal.style.display = 'none';
                    }
                } else {
                    alert('正しいファイル形式ではありません。');
                }
            } catch(err) {
                alert('ファイルの読み込みに失敗しました。');
            }
            fileImport.value = '';
        };
        reader.readAsText(file);
    });

    // 全消去
    btnClearAll.addEventListener('click', () => {
        if(confirm('本当にすべての宿題データを消去しますか？\\nこの操作は元に戻せません。')) {
            if(confirm('本当に消去してよろしいですか？（最終確認）')) {
                homeworks = [];
                saveToLocalStorage();
                renderHomeworks();
                alert('すべてのデータを削除しました。');
                settingsModal.style.display = 'none';
            }
        }
    });

    // フォーム送信
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const selectedSubject = document.querySelector('input[name="subject"]:checked').value;
        const title = inputTitle.value.trim();
        const content = inputContent.value.trim();
        
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        const dateString = `${year}-${month}-${date}`;
        const timeString = `${year}/${month}/${date} ${hours}:${minutes}`;

        const newHomework = {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            subject: selectedSubject,
            title: title,
            content: content,
            date: dateString,
            time: timeString,
            timestamp: now.getTime()
        };

        homeworks.push(newHomework);
        saveToLocalStorage();
        renderHomeworks();

        inputTitle.value = '';
        inputContent.value = '';
        document.getElementById('radio-kokugo').checked = true;
    });

    function saveToLocalStorage() {
        localStorage.setItem('homeworks', JSON.stringify(homeworks));
    }

    window.deleteHomework = function(id) {
        if(confirm('この宿題メモを削除してもよろしいですか？')) {
            homeworks = homeworks.filter(hw => hw.id !== id);
            saveToLocalStorage();
            renderHomeworks();
        }
    }

    function getLatestIdsPerSubject(list) {
        const latestMap = {};
        list.forEach(hw => {
            if (!latestMap[hw.subject] || hw.timestamp > latestMap[hw.subject].timestamp) {
                latestMap[hw.subject] = hw;
            }
        });
        return Object.values(latestMap).map(hw => hw.id);
    }

    function renderHomeworks() {
        homeworkListContainer.innerHTML = '';
        const textQuery = searchText.value.toLowerCase().trim();
        const dateQuery = searchDate.value;

        let filtered = homeworks.filter(hw => {
            if (currentSubjectFilter !== 'all' && hw.subject !== currentSubjectFilter) return false;
            if (dateQuery && hw.date !== dateQuery) return false;
            if (textQuery) {
                const inTitle = hw.title.toLowerCase().includes(textQuery);
                const inContent = hw.content.toLowerCase().includes(textQuery);
                if (!inTitle && !inContent) return false;
            }
            return true;
        });

        const latestIds = getLatestIdsPerSubject(homeworks);

        filtered.sort((a, b) => {
            const aIsLatest = latestIds.includes(a.id);
            const bIsLatest = latestIds.includes(b.id);
            if (aIsLatest === bIsLatest) return b.timestamp - a.timestamp;
            return aIsLatest ? -1 : 1;
        });

        hwCountLabel.textContent = `${filtered.length}件`;

        if (filtered.length === 0) {
            homeworkListContainer.innerHTML = '<div class="no-data">該当する宿題は見つかりませんでした。</div>';
            return;
        }

        filtered.forEach(hw => {
            const isLatest = latestIds.includes(hw.id);
            const card = document.createElement('div');
            card.className = `homework-card ${isLatest ? 'latest-badge' : ''}`;
            card.setAttribute('data-subject', hw.subject);

            card.innerHTML = `
                <button class="btn-delete" onclick="deleteHomework('${hw.id}')" title="削除">×</button>
                <div class="card-header">
                    <div>
                        <span class="subject-badge">${hw.subject}</span>
                        <span class="card-meta">${hw.time} 追加</span>
                    </div>
                </div>
                <div class="card-title">${escapeHtml(hw.title)}</div>
                ${hw.content ? `<div class="card-body">${escapeHtml(hw.content)}</div>` : ''}
            `;
            homeworkListContainer.appendChild(card);
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    searchText.addEventListener('input', renderHomeworks);
    searchDate.addEventListener('change', renderHomeworks);

    filterTabs.forEach(tab => {
        tab.addEventListener('click', () => {
            filterTabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentSubjectFilter = tab.getAttribute('data-subject');
            renderHomeworks();
        });
    });

    renderHomeworks();
</script>

</body>
</html>
