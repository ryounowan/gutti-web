<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAT BUSTERS - FIXED</title>
    <style>
        :root { --main: #ff69b4; --accent: #ffd700; }
        body { font-family: sans-serif; background: #fff; margin: 0; height: 100vh; overflow: hidden; }
        .page { display: none; width: 100%; height: 100%; position: absolute; flex-direction: column; align-items: center; box-sizing: border-box; }
        .active { display: flex; }

        /* 設定画面 */
        #setup-page { padding: 20px; overflow-y: auto; background: white; z-index: 10; }
        .word-list { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 10px; }
        .tag { background: #eee; padding: 4px 10px; border-radius: 15px; font-size: 12px; }
        .tag b { color: red; margin-left: 5px; cursor: pointer; }

        /* 実行画面 */
        #play-page { background: #000; color: white; }
        #live-text { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,255,255,0.1); color: #fff; padding: 15px; text-align: center; font-size: 1.5rem; font-weight: bold; z-index: 2000; min-height: 1.5em; border-bottom: 1px solid var(--main); }
        .onscreen-cat { position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 3px solid #fff; z-index: 100; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2); }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

        /* 結果画面 */
        #result-page { background: #111; color: white; overflow-y: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; width: 100%; }
        .card { border: 2px solid #444; border-radius: 10px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; aspect-ratio: 1; object-fit: cover; }

        /* ボタン */
        .btn { padding: 12px 25px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; margin: 5px; }
        .primary { background: var(--main); color: white; }
        .footer-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 220px; background: var(--accent); color: #000; z-index: 3000; font-size: 1.2rem; }
        
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #modal img { max-width: 90%; max-height: 80%; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="setup-page" class="page active">
        <h2>🎙️ 設定とワード管理</h2>
        <div>
            <input type="text" id="in" placeholder="ワード追加" style="padding:8px;">
            <button onclick="add()" class="btn primary">追加</button>
            <button onclick="clearAll()" class="btn">全消去</button>
        </div>
        <div style="margin-top:10px;">
            <button onclick="saveJ()">JSON保存</button>
            <button onclick="document.getElementById('file').click()">JSON読込</button>
            <input type="file" id="file" style="display:none" onchange="loadJ(event)">
        </div>
        <div class="word-list" id="w-list"></div>
        <button onclick="start()" class="btn primary" style="font-size:1.5rem; margin-top:20px;">浄化開始！ 🚀</button>
    </div>

    <div id="play-page" class="page">
        <div id="live-text">マイク起動中...</div>
        <button onclick="finish()" class="btn footer-btn">結果発表！ 🐾</button>
    </div>

    <div id="result-page" class="page">
        <h1 id="res-title" style="color:var(--accent);"></h1>
        <p id="res-sub"></p>
        <div class="grid" id="res-grid"></div>
        <button class="btn primary" onclick="location.reload()" style="margin-top:20px;">戻る</button>
    </div>

    <div id="modal" onclick="this.style.display='none'"><img id="m-img"><p style="color:white;">録音再生中...</p></div>

    <script>
        let words = ["バカ","アホ","死ね","ゴミ","カス","うざい","クソ","消えろ","デブ","ブス","無能","役立たず","最低","キモい","最悪","ボケ","ろくでなし","くたばれ","ふざけるな","地獄","汚い","くさい","邪魔","死ねばいい","脳無し","気持ち悪い","ヘタクソ","ダサい","うぜぇ","むかつく","イライラ","不細工","カスニート","底辺","消え失せろ","ドブネズミ","間抜け","馬鹿","あほ","ゴミクズ","くそくらえ","能無し","キチガイ","人でなし","お荷物","社会のゴミ","ウスノロ","グズ","どけ"];
        let logs = []; let rec; let recorder; let chunks = []; let isSpawning = false;

        function updateUI() { document.getElementById('w-list').innerHTML = words.map((w,i)=>`<span class="tag">${w}<b onclick="words.splice(${i},1);updateUI()">×</b></span>`).join(''); }
        function add() { const i=document.getElementById('in'); if(i.value){words.push(i.value); i.value=""; updateUI();} }
        function clearAll() { words=[]; updateUI(); }
        function saveJ() { const b=new Blob([JSON.stringify(words)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='words.json'; a.click(); }
        function loadJ(e) { const r=new FileReader(); r.onload=(ev)=>{words=JSON.parse(ev.target.result);updateUI();}; r.readAsText(e.target.files[0]); }

        async function start() {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(s);
                recorder.ondataavailable = (e) => chunks.push(e.data);
                recorder.start(1000);

                document.getElementById('setup-page').classList.remove('active');
                document.getElementById('play-page').classList.add('active');

                initRecog();
            } catch(e) { alert("マイクを許可してください"); }
        }

        function initRecog() {
            const S = window.webkitSpeechRecognition || window.SpeechRecognition;
            rec = new S(); rec.lang='ja-JP'; rec.continuous=true; rec.interimResults=true;

            rec.onresult = (e) => {
                let t = ''; for(let i=e.resultIndex;i<e.results.length;i++) t = e.results[i][0].transcript;
                document.getElementById('live-text').innerText = t;
                words.forEach(w => { if(t.includes(w) && !isSpawning) spawn(); });
            };
            rec.onend = () => { if(rec) rec.start(); };
            rec.start();
            // 強制起動ループ（5秒おきにチェック）
            setInterval(() => { try { rec.start(); } catch(e) {} }, 5000);
        }

        function spawn() {
            isSpawning = true;
            const u = `https://cataas.com/cat?t=${Date.now()}`;
            const b = new Blob(chunks, { type: 'audio/webm' });
            logs.push({ u:u, a:b }); chunks = [];

            const img = document.createElement('img');
            img.src = u; img.className = 'onscreen-cat';
            img.style.left = Math.random()*(window.innerWidth-130)+'px';
            img.style.top = Math.random()*(window.innerHeight-250)+80+'px';
            document.getElementById('play-page').appendChild(img);
            setTimeout(()=> isSpawning=false, 500);
        }

        function finish() {
            if(rec) rec.stop(); rec=null;
            document.getElementById('play-page').classList.remove('active');
            document.getElementById('result-page').classList.add('active');

            const title = document.getElementById('res-title');
            const sub = document.getElementById('res-sub');
            const grid = document.getElementById('res-grid');
            grid.innerHTML = "";

            if(logs.length === 0) {
                title.innerText = "平和だね";
                sub.innerText = "君には手を貸さなくてもよかったな";
            } else {
                title.innerText = "デデーン！！";
                sub.innerText = `${logs.length}匹の猫を召喚しました`;
                logs.forEach(item => {
                    const d = document.createElement('div'); d.className='card';
                    d.innerHTML = `<img src="${item.u}">`;
                    d.onclick = () => {
                        document.getElementById('m-img').src=item.u;
                        document.getElementById('modal').style.display='flex';
                        new Audio(URL.createObjectURL(item.a)).play();
                    };
                    grid.appendChild(d);
                });
            }
        }
        updateUI();
    </script>
</body>
</html>
