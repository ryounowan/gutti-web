<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #020617; color: white; text-align: center; margin: 0; padding: 20px; }
        .row { display: flex; justify-content: space-between; background: #1e293b; margin: 10px auto; padding: 20px; border-radius: 15px; max-width: 800px; font-size: 1.5rem; }
        #setup { padding: 20px; background: #1e293b; border-radius: 10px; margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 1rem; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <div id="setup">合言葉: <input type="text" id="room" value="rally2026"> <button onclick="go()">表示開始</button></div>
    <h1 style="font-size: 3rem; color: #facc15; margin: 20px 0;">🏆 RANKING</h1>
    <div id="list"></div>
<script>
    let scores = {};
    function go() {
        const r=document.getElementById('room').value;
        const peer = new Peer(undefined, {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    });
        peer.on('open', () => {
            const cn = peer.connect(`${r}-host`);
            cn.on('open', () => document.getElementById('setup').style.display='none');
            cn.on('data', d => {
                if(d.type==='REPORT') { scores[d.user]={s:d.score, t:d.time}; update(); }
                if(d.type==='FORCE_RESET') { scores={}; update(); }
            });
        });
    }
    function update() {
        const sorted = Object.entries(scores).sort((a,b)=>b[1].s-a[1].s || a[1].t-b[1].t).slice(0,10);
        document.getElementById('list').innerHTML = sorted.map(([n,v],i)=>`<div class="row"><span>${i+1}. ${n}</span><span>${v.s}個</span></div>`).join('');
    }
</script>
</body>
</html>
