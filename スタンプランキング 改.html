<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Time Trial</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #020617; color: white; text-align: center; margin: 0; padding: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; margin: 10px auto; padding: 15px 25px; border-radius: 15px; max-width: 800px; border-left: 5px solid #3b82f6; }
        .rank { font-size: 2rem; font-weight: bold; color: #facc15; width: 50px; text-align: left; }
        .name { flex: 1; text-align: left; font-size: 1.5rem; padding-left: 15px; }
        .time { font-family: monospace; font-size: 1.8rem; color: #10b981; font-weight: bold; }
        #setup { padding: 20px; background: #1e293b; border-radius: 10px; margin-bottom: 20px; }
        input, button { padding: 10px; font-size: 1rem; border-radius: 5px; border: none; }
        button { background: #3b82f6; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div id="setup">合言葉: <input type="text" id="room" value="rally2026"> <button onclick="go()">ランキング表示開始</button></div>
    <h1 style="font-size: 3rem; color: #facc15; margin: 20px 0;">⏱ TIME ATTACK</h1>
    <div id="list"></div>

<script>
    let scores = {};

    function go() {
        const r = document.getElementById('room').value;
        const peer = new Peer();
        peer.on('open', () => {
            const cn = peer.connect(`${r}-host`);
            cn.on('open', () => {
                document.getElementById('setup').style.display='none';
            });
            cn.on('data', d => {
                // ホストからデータ（REPORT）が届いたら記録
                if(d.type==='REPORT') {
                    scores[d.user] = { s: d.score, t: d.time };
                    update();
                }
            });
        });
    }

    function formatTime(ms) {
        if (!ms || ms === 0) return "--:--";
        const totalSec = Math.floor(ms / 1000);
        const min = Math.floor(totalSec / 60);
        const sec = totalSec % 60;
        return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function update() {
        // ソート条件: 1.スタンプ個数が多い順 -> 2.タイムが短い順
        const sorted = Object.entries(scores).sort((a, b) => {
            if (b[1].s !== a[1].s) return b[1].s - a[1].s; // まず個数で比較
            return a[1].t - b[1].t; // 同じ個数ならタイムが短い（数値が小さい）方が上
        });

        const listDiv = document.getElementById('list');
        listDiv.innerHTML = sorted.map(([name, data], index) => `
            <div class="row">
                <div class="rank">${index + 1}</div>
                <div class="name">${name} <span style="font-size:0.9rem; color:#94a3b8;">(${data.s}個)</span></div>
                <div class="time">${formatTime(data.t)}</div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
