<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイトビューアー生成ツール</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #ccc;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --card-bg: #1e1e1e;
                --border-color: #444;
                --primary-color: #3b82f6;
                --primary-hover: #2563eb;
            }
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 { margin-top: 0; }
        .site-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="text"], select {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
        }
        input[type="text"] { flex: 1; }
        button {
            padding: 10px 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: var(--primary-hover); }
        .mb-4 { margin-bottom: 20px; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
    </style>
</head>
<body>

<div class="card">
    <h2>サイトビューアー生成ツール</h2>
    <p>閲覧したいサイトの情報を入力し、自分だけのビューアーHTMLを作成してください。</p>

    <div class="mb-4">
        <label><strong>登録サイト一覧</strong></label>
        <div id="siteListContainer">
            <div class="site-row">
                <input type="text" class="site-name" placeholder="サイト名 (例: Google)" required>
                <input type="text" class="site-url" placeholder="URL (例: https://google.com)" required>
                <button type="button" class="btn-secondary" onclick="removeRow(this)">削除</button>
            </div>
        </div>
        <button type="button" class="btn-secondary" onclick="addSiteRow()" style="margin-top: 5px;">＋ サイトを追加</button>
    </div>

    <div class="mb-4">
        <label for="openMode"><strong>開き方の設定</strong></label><br>
        <select id="openMode" style="width: 100%; margin-top: 5px;">
            <option value="iframe-single">ページ内で開く（単一の場合は常時表示、複数の場合は選択式）</option>
            <option value="new-tab">新しいタブ/ページで開く</option>
        </select>
    </div>

    <button type="button" onclick="generateViewer()" style="width: 100%;">ビューアーHTMLをダウンロード</button>
</div>

<script>
function addSiteRow() {
    const container = document.getElementById('siteListContainer');
    const row = document.createElement('div');
    row.className = 'site-row';
    row.innerHTML = `
        <input type="text" class="site-name" placeholder="サイト名" required>
        <input type="text" class="site-url" placeholder="URL (https://...)" required>
        <button type="button" class="btn-secondary" onclick="removeRow(this)">削除</button>
    `;
    container.appendChild(row);
}

function removeRow(btn) {
    const rows = document.querySelectorAll('.site-row');
    if (rows.length > 1) {
        btn.parentElement.remove();
    } else {
        alert('最低1つのサイトが必要です。');
    }
}

function generateViewer() {
    const nameInputs = document.querySelectorAll('.site-name');
    const urlInputs = document.querySelectorAll('.site-url');
    const openMode = document.getElementById('openMode').value;

    const sites = [];
    for (let i = 0; i < nameInputs.length; i++) {
        let name = nameInputs[i].value.trim();
        let url = urlInputs[i].value.trim();
        if (name && url) {
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            sites.push({ name, url });
        }
    }

    if (sites.length === 0) {
        alert('有効なサイト名とURLを入力してください。');
        return;
    }

    // 生成するビューアーのHTMLテンプレート
    const viewerHtml = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カスタムサイトビューアー</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --header-bg: #ffffff;
            --border-color: #dee2e6;
            --primary-color: #0d6efd;
            --hover-color: #e9ecef;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #f8f9fa;
                --header-bg: #1e1e1e;
                --border-color: #333333;
                --primary-color: #0d6efd;
                --hover-color: #2a2a2a;
            }
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        h1 { font-size: 1.1rem; margin: 0; }
        select, button {
            padding: 6px 12px;
            background: var(--header-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: var(--hover-color); }
        .main-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 53px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>サイトビューアー</h1>
        <div id="controls" style="display: flex; gap: 10px; align-items: center;"></div>
    </header>
    <div class="main-container" id="mainContainer">
        <div class="welcome-screen">
            <h2>サイトを選択してください</h2>
            <p>上部のメニューから閲覧したいサイトを選んでください。</p>
        </div>
    </div>

    <script>
        const sites = ${JSON.stringify(sites)};
        const openMode = "${openMode}";
        const controls = document.getElementById('controls');
        const container = document.getElementById('mainContainer');

        function init() {
            if (openMode === 'new-tab') {
                controls.innerHTML = '<span>リンクを新しいタブで開くモードです</span>';
                let html = '<div class="welcome-screen"><h2>登録サイト一覧</h2><ul style="list-style: none; padding:0; display:flex; gap:15px; flex-direction:column;">';
                sites.forEach(s => {
                    html += \`<li><a href="\${s.url}" target="_blank" rel="noopener noreferrer" style="padding: 10px 20px; background: var(--primary-color); color: white; text-decoration: none; border-radius: 4px; display:inline-block;">\${s.name} を開く</a></li>\`;
                });
                html += '</ul></div>';
                container.innerHTML = html;
                return;
            }

            // ページ内で開くモード (iframe)
            if (sites.length === 1) {
                // 1つの場合は常時表示
                controls.innerHTML = \`<span>表示中: <strong>\${sites[0].name}</strong></span><button onclick="reloadFrame()">再読み込み</button><a href="\${sites[0].url}" target="_blank" rel="noopener noreferrer" style="font-size:0.9rem; color:inherit;">外部タブで開く</a>\`;
                container.innerHTML = \`<iframe id="viewFrame" src="\${sites[0].url}"></iframe>\`;
            } else {
                // 複数の場合はセレクトボックスで切り替え
                let selectHtml = '<select id="siteSelector" onchange="changeSite(this.value)"><option value="">-- サイトを選択 --</option>';
                sites.forEach((s, index) => {
                    selectHtml += \`<option value="\${index}">\${s.name}</option>\`;
                });
                selectHtml += '</select>';
                selectHtml += '<button onclick="reloadFrame()">再読み込み</button>';
                controls.innerHTML = selectHtml;
            }
        }

        function changeSite(index) {
            if (index === "") {
                container.innerHTML = '<div class="welcome-screen"><h2>サイトを選択してください</h2></div>';
                return;
            }
            const site = sites[index];
            container.innerHTML = \`<iframe id="viewFrame" src="\${site.url}"></iframe>\`;
        }

        function reloadFrame() {
            const frame = document.getElementById('viewFrame');
            if (frame) {
                frame.src = frame.src;
            }
        }

        window.onload = init;
    <\/script>
</body>
</html>`;

    // ファイルとしてダウンロードさせる処理
    const blob = new Blob([viewerHtml], { type: 'text/html;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'site_viewer.html';
    link.click();
    URL.revokeObjectURL(link.href);
}
</script>

</body>
</html>
