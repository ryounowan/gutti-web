<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Mesh Chat Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #10b981; --bg: #0f172a; --card: #1e293b; --me: #059669; --others: #334155; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .box { background: var(--card); width: 100%; max-width: 500px; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* ログイン画面 */
        #setup { padding: 40px 20px; text-align: center; margin: auto; }
        #setup h2 { color: var(--accent); margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; }
        .btn-join { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* チャット画面 */
        #main { display: none; flex-direction: column; height: 100%; }
        header { padding: 15px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        #member-count { font-size: 12px; color: #94a3b8; background: #0f172a; padding: 4px 10px; border-radius: 20px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        /* メッセージの吹き出し */
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.5; position: relative; }
        .msg.mine { align-self: flex-end; background: var(--me); border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--others); border-bottom-left-radius: 2px; }
        .msg .user { font-size: 11px; opacity: 0.8; margin-bottom: 4px; display: block; font-weight: bold; }
        .msg.sys { align-self: center; background: none; color: #64748b; font-size: 12px; font-style: italic; }

        .input-area { padding: 20px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        .input-area input { margin: 0; }
        .btn-send { width: 70px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <div id="setup">
        <h2>🚀 P2P Online Chat</h2>
        <p style="color:#94a3b8; font-size:13px;">ルームコードが同じ人同士で繋がります</p>
        <input type="text" id="room" placeholder="ルームコード (例: myroom123)" value="apple7">
        <input type="text" id="user" placeholder="あなたの名前 (英数字)" value="User">
        <button class="btn-join" onclick="join()">オンラインチャットを開始</button>
    </div>

    <div id="main">
        <header>
            <div id="room-id" style="font-weight:bold; color:var(--accent);">Room: ---</div>
            <div id="member-count">1 人</div>
        </header>
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="mInput" placeholder="メッセージ..." onkeypress="if(event.keyCode==13) send()">
            <button class="btn-send" onclick="send()">送信</button>
        </div>
    </div>
</div>

<script>
    let peer, myName, roomCode, myFullId;
    let conns = {}; 
    let seenIds = new Set();

    function join() {
        roomCode = document.getElementById('room').value.trim();
        myName = document.getElementById('user').value.trim() || "Guest";
        if (!roomCode) return alert("ルームコードを入力してください");

        // IDには英数字・ハイフン・アンダースコアのみ使用可能
        const safeName = encodeURIComponent(myName).replace(/%/g, '');
        myFullId = `${roomCode}_${safeName}_${Math.random().toString(36).substring(2, 7)}`;
        
        peer = new Peer(myFullId);

        peer.on('open', (id) => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            document.getElementById('room-id').innerText = `Room: ${roomCode}`;
            log("System", "接続中...", "sys");
            
            checkHub();
        });

        peer.on('connection', setupConn);
        peer.on('error', err => console.log("PeerError:", err.type));
    }

    // 「待ち合わせ場所(HUB)」が存在するか確認し、なければ自分がHUBになる
    function checkHub() {
        const hubId = `${roomCode}_HUB`;
        const hubTest = new Peer(hubId);

        hubTest.on('open', () => {
            // 自分が最初の入室者（ハブ）になった
            log("System", "あなたが最初の参加者です（ハブ待機中）", "sys");
            hubTest.on('connection', setupConn);
        });

        hubTest.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                // すでにハブがいるので、そこに接続
                connectTo(hubId);
            }
            hubTest.destroy();
        });
    }

    function connectTo(targetId) {
        if (conns[targetId] || targetId === myFullId) return;
        setupConn(peer.connect(targetId));
    }

    function setupConn(conn) {
        conn.on('open', () => {
            if (conns[conn.peer]) return;
            conns[conn.peer] = conn;
            updateCount();
            
            // 全員に名簿を共有してメッシュを形成
            broadcast({ type: 'members', list: Object.keys(conns).concat(myFullId) });
        });

        conn.on('data', data => {
            if (data.type === 'members') {
                data.list.forEach(id => connectTo(id));
            } else if (data.type === 'chat') {
                if (seenIds.has(data.id)) return;
                seenIds.add(data.id);
                log(data.u, data.m, "theirs");
                broadcast(data); // 他のメンバーへ転送
            }
        });

        conn.on('close', () => {
            delete conns[conn.peer];
            updateCount();
        });
    }

    function send() {
        const input = document.getElementById('mInput');
        if (!input.value) return;
        
        const data = { type: 'chat', id: Math.random(), u: myName, m: input.value };
        seenIds.add(data.id);
        log(myName, input.value, "mine");
        broadcast(data);
        input.value = "";
    }

    function broadcast(data) {
        Object.values(conns).forEach(c => {
            if (c.open) c.send(data);
        });
    }

    function log(u, m, type) {
        const c = document.getElementById('chat');
        let msgHtml = "";
        
        if (type === "sys") {
            msgHtml = `<div class="msg sys">${m}</div>`;
        } else {
            msgHtml = `<div class="msg ${type}"><span class="user">${u}</span>${m}</div>`;
        }
        
        c.insertAdjacentHTML('beforeend', msgHtml);
        c.scrollTop = c.scrollHeight;
    }

    function updateCount() {
        // 重複を除外して、開いている接続のみカウント
        const uniqueIds = new Set(Object.values(conns).filter(c => c.open).map(c => c.peer));
        // ハブ接続（_HUB）は重複カウントされやすいため、末尾で調整
        let count = uniqueIds.size + 1;
        // 自分自身やハブを二重に数えないロジック
        document.getElementById('member-count').innerText = `${count} 人`;
    }
</script>
</body>
</html>
