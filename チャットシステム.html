<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Mesh Chat Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #10b981; --bg: #0f172a; --card: #1e293b; --me: #059669; --others: #334155; --danger: #ef4444; }
        
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: white; margin: 0; 
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .box { 
            background: var(--card); width: 100%; max-width: 600px; 
            display: flex; flex-direction: column; position: relative;
        }

        /* ログイン画面 */
        #setup { padding: 40px 20px; text-align: center; margin: auto; width: 100%; }
        #setup h2 { color: var(--accent); font-size: 24px; margin-bottom: 20px; }
        
        input { 
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; 
            border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; 
        }

        button { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; 
            background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; 
        }

        /* チャット画面 */
        #main { display: none; flex-direction: column; height: 100%; }
        
        header { 
            padding: 12px 15px; background: #1e293b; border-bottom: 1px solid #334155; 
            display: flex; justify-content: space-between; align-items: center;
        }

        #member-count { font-size: 12px; color: #94a3b8; background: #0f172a; padding: 4px 10px; border-radius: 20px; }
        
        .btn-logout { 
            background: var(--danger); font-size: 12px; padding: 6px 12px; width: auto; 
            border-radius: 8px; opacity: 0.8; 
        }
        .btn-logout:hover { opacity: 1; }

        #chat { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; 
            flex-direction: column; gap: 10px; background: #0f172a;
        }
        
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .msg.mine { align-self: flex-end; background: var(--me); border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--others); border-bottom-left-radius: 2px; }
        .msg b { display: block; font-size: 11px; opacity: 0.7; margin-bottom: 3px; }
        .msg.sys { align-self: center; background: none; color: #64748b; font-size: 12px; font-style: italic; }

        .input-area { 
            padding: 15px; background: #1e293b; display: flex; gap: 8px; 
            border-top: 1px solid #334155; padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .input-area input { margin: 0; flex: 1; }
        .btn-send { width: 70px; background: var(--accent); margin: 0; }

        /* スマホ向けの微調整 */
        @media (max-width: 480px) {
            .msg { max-width: 90%; font-size: 14px; }
            header h3 { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="box">
    <div id="setup">
        <h2>🌐 Online P2P Chat</h2>
        <input type="text" id="room" placeholder="ルーム名" value="apple7">
        <input type="text" id="user" placeholder="あなたの名前" value="User1">
        <button onclick="join()">チャットに参加する</button>
    </div>

    <div id="main">
        <header>
            <h3 id="room-id" style="margin:0; font-size:16px;">Room: ---</h3>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="member-count">1 人</span>
                <button class="btn-logout" onclick="logout()">退出</button>
            </div>
        </header>
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="mInput" placeholder="メッセージを入力..." onkeypress="if(event.keyCode==13) send()">
            <button class="btn-send" onclick="send()">送信</button>
        </div>
    </div>
</div>

<script>
    let peer, myName, roomCode, myFullId, hubPeer;
    let conns = {}; 
    let seenIds = new Set();

    function join() {
        roomCode = document.getElementById('room').value.trim();
        myName = document.getElementById('user').value.trim() || "Guest";
        if (!roomCode) return alert("ルーム名を入力してください");

        // 安全なID生成
        const safeName = btoa(unescape(encodeURIComponent(myName))).replace(/=/g, "").substring(0, 5);
        myFullId = `${roomCode}_${safeName}_${Math.random().toString(36).substring(2, 7)}`;
        
        peer = new Peer(myFullId);

        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            document.getElementById('room-id').innerText = `Room: ${roomCode}`;
            document.getElementById('chat').innerHTML = ""; // 前のチャットをクリア
            log("System", "オンラインになりました", "sys");
            initHub();
        });

        peer.on('connection', setupConn);
        peer.on('error', err => {
            console.error("Peer Error:", err.type);
            if(err.type === 'peer-unavailable') return;
            alert("通信エラーが発生しました: " + err.type);
        });
    }

    function initHub() {
        const hubId = `${roomCode}_HUB`;
        hubPeer = new Peer(hubId);

        hubPeer.on('open', () => {
            log("System", "あなたがホストです（待機中）", "sys");
            hubPeer.on('connection', setupConn);
        });

        hubPeer.on('error', (err) => {
            if (err.type === 'unavailable-id') connectTo(hubId);
            hubPeer.destroy();
        });
    }

    function connectTo(targetId) {
        if (conns[targetId] || targetId === myFullId) return;
        setupConn(peer.connect(targetId));
    }

    function setupConn(conn) {
        conn.on('open', () => {
            if (conns[conn.peer] && conns[conn.peer].open) return;
            conns[conn.peer] = conn;
            updateCount();
            broadcast({ type: 'members', list: Object.keys(conns).concat(myFullId) });
        });

        conn.on('data', data => {
            if (data.type === 'members') {
                data.list.forEach(id => connectTo(id));
            } else if (data.type === 'chat') {
                if (seenIds.has(data.id)) return;
                seenIds.add(data.id);
                log(data.u, data.m, "theirs");
                broadcast(data);
            }
        });

        conn.on('close', () => {
            delete conns[conn.peer];
            updateCount();
        });
    }

    function send() {
        const input = document.getElementById('mInput');
        if (!input.value) return;
        const data = { type: 'chat', id: Math.random(), u: myName, m: input.value };
        seenIds.add(data.id);
        log(myName, input.value, "mine");
        broadcast(data);
        input.value = "";
    }

    function broadcast(data) {
        Object.values(conns).forEach(c => { if (c && c.open) c.send(data); });
    }

    function log(u, m, type) {
        const c = document.getElementById('chat');
        const isMine = type === "mine";
        const msgHtml = `<div class="msg ${type}">${type !== "sys" ? '<b>' + u + '</b>' : ''}${m}</div>`;
        c.insertAdjacentHTML('beforeend', msgHtml);
        c.scrollTop = c.scrollHeight;
    }

    function updateCount() {
        const activePeers = Object.values(conns)
            .filter(c => c.open && c.peer !== myFullId && !c.peer.endsWith("_HUB"))
            .map(c => c.peer);
        const uniqueCount = new Set(activePeers).size;
        document.getElementById('member-count').innerText = `${uniqueCount + 1} 人`;
    }

    // 💡 ログアウト処理
    function logout() {
        if (!confirm("チャットから退出しますか？")) return;
        
        // Peer接続をすべて終了
        if (peer) peer.destroy();
        if (hubPeer) hubPeer.destroy();
        
        // 変数リセット
        conns = {};
        seenIds = new Set();
        
        // 画面切り替え
        document.getElementById('main').style.display = 'none';
        document.getElementById('setup').style.display = 'block';
    }
</script>
</body>
</html>
