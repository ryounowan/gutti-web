<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P2P Mesh Chat Final</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #10b981; --bg: #0f172a; --card: #1e293b; --me: #059669; --others: #334155; --danger: #ef4444; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100%; margin: 0; padding: 0; 
            background: var(--bg); color: white; overflow: hidden;
            font-family: sans-serif;
        }

        body { display: flex; justify-content: center; align-items: center; }

        /* 大画面(Fire TV)では広く、スマホでは全画面 */
        .box { 
            background: var(--card); width: 100%; max-width: 900px; 
            height: 100%; display: flex; flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* ログイン画面 */
        #setup { padding: 40px 20px; text-align: center; margin: auto; max-width: 400px; width: 100%; }
        #setup h2 { color: var(--accent); margin-bottom: 25px; font-size: 28px; }
        
        /* 文字サイズ16px以上でスマホの勝手なズームを防止 */
        input { 
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; 
            border: 2px solid #475569; background: #0f172a; color: white; font-size: 16px; 
        }
        input:focus { border-color: var(--accent); outline: none; }

        button { 
            padding: 14px; border-radius: 12px; border: none; 
            background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; 
        }

        /* チャットメイン画面 */
        #main { display: none; flex-direction: column; height: 100%; width: 100%; }
        
        header { 
            padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; 
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        #member-count { font-size: 14px; color: #94a3b8; background: #0f172a; padding: 4px 12px; border-radius: 20px; }

        #chat { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; 
            flex-direction: column; gap: 12px; background: #0f172a;
            -webkit-overflow-scrolling: touch;
        }
        
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .msg.mine { align-self: flex-end; background: var(--me); border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--others); border-bottom-left-radius: 2px; }
        .msg b { display: block; font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
        .msg.sys { align-self: center; background: none; color: #64748b; font-size: 12px; text-align: center; }

        /* 入力エリア：キーボード被り・セーフエリア対策 */
        .input-area { 
            padding: 15px; background: #1e293b; display: flex; gap: 10px; 
            border-top: 1px solid #334155;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .input-area input { margin: 0; flex: 1; font-size: 16px; }
        .btn-send { width: 80px; background: var(--accent); }
        .btn-logout { background: var(--danger); padding: 8px 16px; font-size: 14px; width: auto; }

        /* PC・大画面向け微調整 */
        @media (min-width: 801px) {
            .box { height: 92vh; border-radius: 24px; }
            .msg { max-width: 65%; }
        }
    </style>
</head>
<body>

<div class="box">
    <div id="setup">
        <h2>🌐 Online Chat</h2>
        <input type="text" id="room" placeholder="ルーム名" value="apple7">
        <input type="text" id="user" placeholder="名前" value="User1">
        <button onclick="join()" style="width:100%">チャットを開始</button>
    </div>

    <div id="main">
        <header>
            <div id="room-id" style="font-weight:bold; font-size:18px; color:var(--accent);">Room: ---</div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span id="member-count">1人</span>
                <button class="btn-logout" onclick="logout()">退出</button>
            </div>
        </header>
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="mInput" placeholder="メッセージ..." onkeypress="if(event.keyCode==13) send()">
            <button class="btn-send" onclick="send()">送信</button>
        </div>
    </div>
</div>

<script>
    let peer, myName, roomCode, myFullId, hubPeer;
    let conns = {}; 
    let seenIds = new Set();

    function join() {
        roomCode = document.getElementById('room').value.trim();
        myName = document.getElementById('user').value.trim() || "Guest";
        if (!roomCode) return;

        // ID生成（日本語対策）
        const safeName = btoa(unescape(encodeURIComponent(myName))).replace(/=/g, "").substring(0, 5);
        myFullId = `${roomCode}_${safeName}_${Math.random().toString(36).substring(2, 7)}`;
        
        peer = new Peer(myFullId);

        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            document.getElementById('room-id').innerText = `Room: ${roomCode}`;
            log("System", "オンライン！仲間を探しています...", "sys");
            initHub();
        });

        peer.on('connection', setupConn);

        // キーボード表示時のスクロール調整
        window.visualViewport?.addEventListener('resize', () => {
            const chat = document.getElementById('chat');
            chat.scrollTop = chat.scrollHeight;
        });
    }

    function initHub() {
        const hubId = `${roomCode}_HUB`;
        hubPeer = new Peer(hubId);
        hubPeer.on('open', () => {
            log("System", "あなたがホストです（待機中）", "sys");
            hubPeer.on('connection', setupConn);
        });
        hubPeer.on('error', (err) => {
            if (err.type === 'unavailable-id') connectTo(hubId);
            hubPeer.destroy();
        });
    }

    function connectTo(targetId) {
        if (conns[targetId] || targetId === myFullId) return;
        setupConn(peer.connect(targetId));
    }

    function setupConn(conn) {
        conn.on('open', () => {
            if (conns[conn.peer] && conns[conn.peer].open) return;
            conns[conn.peer] = conn;
            updateCount();
            broadcast({ type: 'members', list: Object.keys(conns).concat(myFullId) });
        });

        conn.on('data', data => {
            if (data.type === 'members') {
                data.list.forEach(id => connectTo(id));
            } else if (data.type === 'chat') {
                if (seenIds.has(data.id)) return;
                seenIds.add(data.id);
                log(data.u, data.m, "theirs");
                broadcast(data);
            }
        });

        conn.on('close', () => { delete conns[conn.peer]; updateCount(); });
        conn.on('error', () => { delete conns[conn.peer]; updateCount(); });
    }

    function send() {
        const input = document.getElementById('mInput');
        if (!input.value) return;
        const data = { type: 'chat', id: Math.random(), u: myName, m: input.value };
        seenIds.add(data.id);
        log(myName, input.value, "mine");
        broadcast(data);
        input.value = "";
    }

    function broadcast(data) {
        Object.values(conns).forEach(c => { if (c && c.open) c.send(data); });
    }

    function log(u, m, type) {
        const c = document.getElementById('chat');
        const msgHtml = `<div class="msg ${type}">${type !== "sys" ? '<b>' + u + '</b>' : ''}${m}</div>`;
        c.insertAdjacentHTML('beforeend', msgHtml);
        c.scrollTop = c.scrollHeight;
    }

    // 💡 人数バグ修正：自分とHUBを除外して厳密に数える
    function updateCount() {
        const activeIds = Object.values(conns)
            .filter(c => c.open)
            .map(c => c.peer)
            .filter(id => id !== myFullId && !id.endsWith("_HUB"));

        const uniqueCount = new Set(activeIds).size;
        document.getElementById('member-count').innerText = `${uniqueCount + 1}人`;
    }

    // 💡 退出機能：リロードで完全にリセット
    function logout() {
        if (!confirm("チャットから退出しますか？")) return;
        if (peer) peer.destroy();
        if (hubPeer) hubPeer.destroy();
        location.reload();
    }
</script>
</body>
</html>
