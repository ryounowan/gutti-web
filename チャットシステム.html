<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate P2P Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #10b981; --bg: #0f172a; --card: #1e293b; --me: #059669; --others: #334155; --danger: #ef4444; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: sans-serif; background: var(--bg); color: white; margin: 0; 
            display: flex; justify-content: center; height: 100vh; width: 100vw; overflow: hidden;
        }

        /* 💡 修正：Fire TVなどの大画面では広く、スマホでは全画面に */
        .box { 
            background: var(--card); width: 100%; max-width: 1000px; /* テレビで見やすいよう幅を広げた */
            display: flex; flex-direction: column; height: 100%;
        }

        /* ログイン画面 */
        #setup { padding: 40px 20px; text-align: center; margin: auto; max-width: 400px; width: 100%; }
        #setup h2 { color: var(--accent); margin-bottom: 20px; }
        
        /* 💡 重要：フォントサイズを16px以上に。これでスマホのズームを防ぐ */
        input { 
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; 
            border: 2px solid #475569; background: #0f172a; color: white; font-size: 16px; 
        }
        input:focus { border-color: var(--accent); outline: none; }

        button { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; 
            background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; 
        }

        /* チャット画面 */
        #main { display: none; flex-direction: column; height: 100%; width: 100%; }
        
        header { 
            padding: 10px 15px; background: #1e293b; border-bottom: 1px solid #334155; 
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; 
            flex-direction: column; gap: 10px; background: #0f172a;
        }
        
        /* 吹き出しの文字も少し大きく */
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.4; }
        .msg.mine { align-self: flex-end; background: var(--me); border-bottom-right-radius: 2px; }
        .msg.theirs { align-self: flex-start; background: var(--others); border-bottom-left-radius: 2px; }
        .msg b { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 4px; }

        /* 入力エリア：スマホのキーボード対応 */
        .input-area { 
            padding: 15px; background: #1e293b; display: flex; gap: 10px; 
            border-top: 1px solid #334155; padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }
        .input-area input { margin: 0; flex: 1; font-size: 16px; } /* 💡 ここも16px */
        .btn-send { width: 80px; background: var(--accent); }

        .btn-logout { background: var(--danger); width: auto; padding: 8px 15px; font-size: 14px; }

        /* Fire TV / PC用の横幅調整 */
        @media (min-width: 768px) {
            .msg { max-width: 60%; } /* 横に広がりすぎないよう調整 */
        }
    </style>
</head>
<body>

<div class="box">
    <div id="setup">
        <h2>🌐 Online P2P Chat</h2>
        <input type="text" id="room" placeholder="ルーム名" value="apple7">
        <input type="text" id="user" placeholder="名前" value="User1">
        <button onclick="join()">チャットに参加する</button>
    </div>

    <div id="main">
        <header>
            <h3 id="room-id" style="margin:0; font-size:18px;">Room: ---</h3>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="member-count" style="font-size:14px; color:#94a3b8;">1 人</span>
                <button class="btn-logout" onclick="logout()">退出</button>
            </div>
        </header>
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="mInput" placeholder="メッセージを入力..." onkeypress="if(event.keyCode==13) send()">
            <button class="btn-send" onclick="send()">送信</button>
        </div>
    </div>
</div>

<script>
    // ※ JavaScriptロジックは前回と同じ（安定版）
    let peer, myName, roomCode, myFullId, hubPeer;
    let conns = {}; 
    let seenIds = new Set();

    function join() {
        roomCode = document.getElementById('room').value.trim();
        myName = document.getElementById('user').value.trim() || "Guest";
        if (!roomCode) return alert("ルーム名を入力してください");
        const safeName = btoa(unescape(encodeURIComponent(myName))).replace(/=/g, "").substring(0, 5);
        myFullId = `${roomCode}_${safeName}_${Math.random().toString(36).substring(2, 7)}`;
        peer = new Peer(myFullId);
        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
            document.getElementById('room-id').innerText = `Room: ${roomCode}`;
            document.getElementById('chat').innerHTML = "";
            log("System", "オンラインになりました", "sys");
            initHub();
        });
        peer.on('connection', setupConn);
        peer.on('error', err => console.error(err));
    }

    function initHub() {
        const hubId = `${roomCode}_HUB`;
        hubPeer = new Peer(hubId);
        hubPeer.on('open', () => {
            log("System", "ホストとして待機中...", "sys");
            hubPeer.on('connection', setupConn);
        });
        hubPeer.on('error', (err) => {
            if (err.type === 'unavailable-id') connectTo(hubId);
            hubPeer.destroy();
        });
    }

    function connectTo(targetId) {
        if (conns[targetId] || targetId === myFullId) return;
        setupConn(peer.connect(targetId));
    }

    function setupConn(conn) {
        conn.on('open', () => {
            if (conns[conn.peer] && conns[conn.peer].open) return;
            conns[conn.peer] = conn;
            updateCount();
            broadcast({ type: 'members', list: Object.keys(conns).concat(myFullId) });
        });
        conn.on('data', data => {
            if (data.type === 'members') {
                data.list.forEach(id => connectTo(id));
            } else if (data.type === 'chat') {
                if (seenIds.has(data.id)) return;
                seenIds.add(data.id);
                log(data.u, data.m, "theirs");
                broadcast(data);
            }
        });
        conn.on('close', () => { delete conns[conn.peer]; updateCount(); });
    }

    function send() {
        const input = document.getElementById('mInput');
        if (!input.value) return;
        const data = { type: 'chat', id: Math.random(), u: myName, m: input.value };
        seenIds.add(data.id);
        log(myName, input.value, "mine");
        broadcast(data);
        input.value = "";
    }

    function broadcast(data) {
        Object.values(conns).forEach(c => { if (c && c.open) c.send(data); });
    }

    function log(u, m, type) {
        const c = document.getElementById('chat');
        const msgHtml = `<div class="msg ${type}">${type !== "sys" ? '<b>' + u + '</b>' : ''}${m}</div>`;
        c.insertAdjacentHTML('beforeend', msgHtml);
        c.scrollTop = c.scrollHeight;
    }

    function updateCount() {
        const activePeers = Object.values(conns).filter(c => c.open && !c.peer.endsWith("_HUB")).map(c => c.peer);
        const uniqueCount = new Set(activePeers).size;
        document.getElementById('member-count').innerText = `${uniqueCount + 1} 人`;
    }

    function logout() {
        if (!confirm("退出しますか？")) return;
        if (peer) peer.destroy();
        if (hubPeer) hubPeer.destroy();
        location.reload(); // 確実にリセットするためにリロード
    }
</script>
</body>
</html>
