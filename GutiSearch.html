<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GutiSearch</title>
  <style>
    /* CSS変数（テーマカラー）の定義 */
    :root {
      --bg-color: #ffffff;
      --text-color: #202124;
      --muted-color: #5f6368;
      --hint-color: #70757a;
      --border-color: #dfe1e5;
      --box-bg: #ffffff;
      --accent-color: #4285f4;
      --toggle-bg: #f1f3f4;
    }

    /* 💡 ダークモード適用時のカラー定義 */
    [data-theme="dark"] {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --muted-color: #9aa0a6;
      --hint-color: #9aa0a6;
      --border-color: #5f6368;
      --box-bg: #303134;
      --accent-color: #8ab4f8;
      --toggle-bg: #3c4043;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    /* ダークモード切り替えボタンの配置 */
    .header-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }
    .theme-toggle-btn {
      background-color: var(--toggle-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: normal;
      transition: background-color 0.3s;
    }
    .theme-toggle-btn:hover {
      text-decoration: none;
      opacity: 0.8;
    }
    
    /* ロゴ画像エリア */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      min-height: 92px;
    }
    .logo-container img {
      max-width: 270px;
      max-height: 92px;
      object-fit: contain;
    }

    /* モード選択（ラジオボタン） */
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    .mode-selector label {
      font-size: 14px;
      color: var(--muted-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 検索ボックス */
    .search-container {
      background: var(--box-bg);
      display: flex;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 6px rgba(32,33,36,.15);
      border-radius: 24px;
      padding: 6px 16px;
      transition: box-shadow 0.2s, background-color 0.3s, border-color 0.3s;
    }
    .search-container:focus-within {
      box-shadow: 0 1px 6px rgba(32,33,36,.30);
      border-color: rgba(223,225,229,0);
    }
    input[type="search"] {
      flex: 1;
      background-color: transparent;
      border: none;
      margin: 0;
      padding: 8px 0;
      font-size: 16px;
      color: inherit;
      outline: none;
    }
    /* ダークモード時の入力文字色調整 */
    input[type="search"]::placeholder {
      color: var(--hint-color);
    }
    .search-btn {
      background: none;
      border: none;
      padding: 0 10px;
      cursor: pointer;
      color: var(--accent-color);
      font-weight: bold;
      font-size: 16px;
    }
    .search-btn:hover {
      text-decoration: underline;
    }
    .footer-text {
      margin-top: 20px;
      font-size: 13px;
      color: var(--hint-color);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 右上のテーマ切り替えボタン -->
  <div class="header-actions">
    <button type="button" class="theme-toggle-btn" id="themeToggle">🌙 ダークモードにする</button>
  </div>

  <!-- ロゴ画像を表示する場所 -->
  <div class="logo-container">
    <img id="logoImage" src="" alt="Search Logo">
  </div>
  
  <search>
    <form id="unifiedSearchForm">
      
      <!-- 検索モード選択 -->
      <div class="mode-selector">
        <label>
          <input type="radio" name="searchMode" value="web" checked onclick="toggleSiteInput(false)">
          ウェブ全体を検索
        </label>
        <label>
          <input type="radio" name="searchMode" value="site" onclick="toggleSiteInput(true)">
          特定のサイト内だけを検索
        </label>
      </div>

      <!-- 特定サイトのURL入力欄 -->
      <div id="siteUrlContainer" style="display: none; margin-bottom: 15px; text-align: center;">
        <input type="text" id="targetSite" placeholder="例: wikipedia.org" style="padding: 6px 12px; width: 80%; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; background-color: var(--box-bg); color: var(--text-color);">
      </div>

      <!-- 検索入力バー -->
      <div class="search-container">
        <input type="search" id="searchKeyword" placeholder="キーワードをスペースで区切って入力..." required autofocus>
        <button type="submit" class="search-btn">検索</button>
      </div>

    </form>
  </search>

  <p class="footer-text">※検索結果は新しいタブを開かず、この画面のままGoogleに移動します。</p>

    // 画像設定の反映
    const logoImgElement = document.getElementById('logoImage');
    if (imageUrl.trim() !== "") {
      logoImgElement.src = imageUrl;
    } else {
      logoImgElement.src = "https://google.com";
    }

    // 💡 ダークモード切り替えのロジック
    const themeToggleBtn = document.getElementById('themeToggle');
    
    // 保存されているテーマを読み込む（なければライトモード）
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateToggleDom(currentTheme);

    themeToggleBtn.addEventListener('click', function() {
      const activeTheme = document.documentElement.getAttribute('data-theme');
      let newTheme = 'light';
      
      if (activeTheme === 'light') {
        newTheme = 'dark';
      }
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme); // ブラウザに状態を保存
      updateToggleDom(newTheme);
    });

    // ボタンのテキストを更新する関数
    function updateToggleDom(theme) {
      if (theme === 'dark') {
        themeToggleBtn.textContent = '☀️';
      } else {
        themeToggleBtn.textContent = '🌙';
      }
    }

    // サイト指定欄の表示切り替え
    function toggleSiteInput(show) {
      const container = document.getElementById('siteUrlContainer');
      container.style.display = show ? 'block' : 'none';
      if (show) {
        document.getElementById('targetSite').focus();
      }
    }

    // 検索処理
    document.getElementById('unifiedSearchForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const rawKeywords = document.getElementById('searchKeyword').value.trim();
      if (!rawKeywords) return;

      const cleanKeywords = rawKeywords.replace(/　/g, ' ');
      const keywordList = cleanKeywords.split(/\s+/).filter(word => word !== '');
      const encodedList = keywordList.map(word => encodeURIComponent(word));

      let finalQuery = encodedList.join('+');

      const selectedMode = document.querySelector('input[name="searchMode"]:checked').value;
      if (selectedMode === 'site') {
        const siteDomain = document.getElementById('targetSite').value.trim();
        if (siteDomain) {
          const cleanDomain = siteDomain.replace(/^(https?:\/\/)?(www\.)?/, '');
          finalQuery = encodeURIComponent('site:' + cleanDomain) + '+' + finalQuery;
        }
      }

      const targetUrl = 'https://google.com' + finalQuery;
      window.location.href = targetUrl;
    });
  </script>
