<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Listener - Universal Fit v2</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: white; 
            display: -webkit-box;
            display: -webkit-flex;
            display: flex; 
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center; 
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            box-sizing: border-box;
            padding: 10px;
        }
        .box { 
            background: #1e293b; 
            padding: 25px 20px; 
            border-radius: 24px; 
            width: 90%; 
            max-width: 280px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
        }
        h2 { margin: 0 0 15px 0; font-size: 22px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            text-align: center; 
            font-size: 16px; 
            box-sizing: border-box; 
            -webkit-appearance: none;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            border-radius: 15px; 
            border: none; 
            background: #10b981; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            -webkit-transition: 0.2s; 
            transition: 0.2s; 
        }
        button:active { background: #059669; }
        button:disabled { background: #334155; cursor: not-allowed; }
        .btn-reset { background: #64748b; margin-top: 15px; display: none; font-size: 13px; padding: 10px; }
        #status { margin-top: 20px; color: #94a3b8; font-weight: bold; font-size: 14px; line-height: 1.5; }
        .status-on { color: #10b981; -webkit-animation: blink 2s infinite; animation: blink 2s infinite; }
        .status-off { color: #f87171; }
        
        @-webkit-keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; background: #334155; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="box">
    <div class="badge">LISTEN MODE</div>
    <h2>リスナー</h2>
    
    <div id="setup-ui">
        <input type="text" id="room" value="Gutti Presents" placeholder="ルームIDを入力">
        <button id="listenBtn" onclick="listen()">受信開始</button>
    </div>

    <div id="status">待機中</div>
    
    <button id="resetBtn" class="btn-reset" onclick="location.reload()">再接続 / リセット</button>
    
    <audio id="audio" playsinline></audio>
</div>

<script>
    var peer = null;

    // 古いiOSの接続トラブルを回避するため、極力シンプルなSTUNサーバー構成に変更
    var PEER_CONFIG = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    };

    function listen() {
        var room = document.getElementById('room').value;
        var status = document.getElementById('status');
        var resetBtn = document.getElementById('resetBtn');
        var audio = document.getElementById('audio');

        if(!room) { alert("IDを入力してください"); return; }

        document.getElementById('listenBtn').disabled = true;
        status.innerText = "🔍 放送を探しています...";

        // iOS古参ブラウザ用の自動再生ブロック解除処理
        try {
            if (audio && typeof audio.play === 'function') {
                var pPromise = audio.play();
                if (pPromise && typeof pPromise["catch"] === 'function') {
                    pPromise["catch"](function() {});
                }
            }
        } catch(e) {}

        // 完全に安全な文字列結合でリスナーIDを作成
        var randId = Math.floor(1000 + Math.random() * 9000).toString();
        var myId = "room-" + randId + "-listener";

        try {
            // Peerオブジェクトの生成をレガシー互換仕様で実行
            if (typeof Peer === 'undefined') {
                status.innerText = "❌ 通信ライブラリが読み込めません";
                resetBtn.style.display = "block";
                return;
            }
            
            peer = new Peer(myId, PEER_CONFIG);

            peer.on('open', function() {
                status.innerText = "📡 接続を確立中...";
                
                // ホスト側へのシグナリング接続
                var targetHost = room + "-host";
                var conn = peer.connect(targetHost);
                
                if (conn) {
                    conn.on('open', function() {
                        status.innerText = "✅ 接続完了！配信を待機しています...";
                    });
                    conn.on('close', function() { showEnd(); });
                    conn.on('error', function() { showEnd(); });
                }
            });

            peer.on('call', function(call) {
                status.innerText = "🔴 受信中...";
                status.className = 'status-on';
                resetBtn.style.display = "block";
                
                call.answer();
                
                call.on('stream', function(s) {
                    if (audio) {
                        if ('srcObject' in audio) {
                            audio.srcObject = s;
                        } else {
                            audio.src = (window.URL || window.webkitURL).createObjectURL(s);
                        }
                        
                        // 再生強制＆ブロック時タップリカバリ
                        try {
                            var p = audio.play();
                            if (p && typeof p["catch"] === 'function') {
                                p["catch"](function() { triggerTapToPlay(); });
                            }
                        } catch(err) {
                            triggerTapToPlay();
                        }
                    }
                });

                call.on('close', function() { showEnd(); });
            });

            peer.on('error', function(err) {
                console.log("Peer error:", err);
                status.innerText = "❌ 配信が見つからないか、接続が切れました";
                status.className = 'status-off';
                resetBtn.style.display = "block";
            });

        } catch(fatalErr) {
            status.innerText = "❌ システムエラーが発生しました";
            resetBtn.style.display = "block";
        }
    }

    function triggerTapToPlay() {
        var status = document.getElementById('status');
        var audio = document.getElementById('audio');
        status.innerHTML = "⚠️ 音声がブロックされました<br>[ここをタップして再生]";
        status.style.cursor = "pointer";
        status.onclick = function() {
            if (audio) audio.play();
            status.innerHTML = "🔴 受信中...";
            status.onclick = null;
        };
    }

    function showEnd() {
        var status = document.getElementById('status');
        status.innerText = "📴 放送は終了しました";
        status.className = 'status-off';
        document.getElementById('resetBtn').style.display = "block";
        var a = document.getElementById('audio');
        if (a) a.srcObject = null;
    }
</script>
</body>
</html>
