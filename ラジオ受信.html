<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Radio Tuner</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #241e1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Georgia', serif; }
        .radio-body { background: #5d4037; width: 320px; height: 460px; border-radius: 40px; border: 10px solid #3e2723; position: relative; box-shadow: 0 20px 0 #2a1b18, 0 30px 50px rgba(0,0,0,0.5); padding: 25px; box-sizing: border-box; }
        
        /* スピーカー部分 */
        .grill { background: repeating-linear-gradient(90deg, #3e2723, #3e2723 4px, #5d4037 4px, #5d4037 8px); height: 100px; border-radius: 20px; margin-bottom: 25px; border: 3px solid #2a1b18; }
        
        /* チューニング窓 */
        .tuner-display { background: #fdf5e6; height: 90px; border-radius: 8px; border: 5px solid #3e2723; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        .freq-num { font-size: 32px; font-weight: bold; color: #222; letter-spacing: -1px; }
        .needle { width: 3px; height: 100%; background: #d32f2f; position: absolute; left: 50%; transition: 0.2s; box-shadow: 0 0 5px rgba(0,0,0,0.3); }
        
        /* 操作系 */
        .dial-label { text-align: center; font-size: 12px; color: #fdf5e6; margin-top: 20px; font-weight: bold; text-transform: uppercase; }
        input[type="range"] { width: 100%; margin-top: 10px; accent-color: #3e2723; cursor: pointer; }
        
        .power-btn { background: #8e0000; color: #fff; border: 5px solid #3e2723; border-radius: 50%; width: 90px; height: 90px; margin: 25px auto; display: block; font-weight: bold; cursor: pointer; font-size: 14px; box-shadow: 0 6px 0 #4a0000; transition: 0.1s; }
        .power-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a0000; }
        .power-btn.on { background: #d32f2f; box-shadow: 0 0 15px #ff5252; }
        
        #status-msg { text-align: center; color: #fdf5e6; font-size: 11px; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="radio-body">
    <div class="grill"></div>
    
    <div class="tuner-display">
        <div class="freq-num" id="freq-out">80.0</div>
        <div style="font-size:10px; color:#888;">FM MHz BAND</div>
        <div class="needle" id="needle"></div>
    </div>

    <div class="dial-label">Tuning Dial</div>
    <input type="range" min="76.0" max="95.0" step="0.1" value="80.0" oninput="updateTuner(this.value)">

    <button class="power-btn" id="powerBtn" onclick="togglePower()">START<br>RECEIVE</button>
    <div id="status-msg">READY TO TUNE</div>
    
    <audio id="audio" playsinline></audio>
</div>

<script>
    let peer = null;
    let isConnected = false;

    function updateTuner(v) {
        const f = parseFloat(v).toFixed(1);
        document.getElementById('freq-out').innerText = f;
        const percent = ((v - 76) / (95 - 76)) * 100;
        document.getElementById('needle').style.left = percent + "%";
    }

    function togglePower() {
        const audio = document.getElementById('audio');
        const status = document.getElementById('status-msg');
        const btn = document.getElementById('powerBtn');
        
        // ブラウザの音量制限解除
        audio.play().catch(() => {});

        if(isConnected) { location.reload(); return; }

        const freq = document.getElementById('freq-out').innerText.replace('.', '-');
        const stationId = `radio-station-${freq}`;
        const myId = `listener-${Math.floor(Math.random()*100000)}`;

        status.innerText = "TUNING IN PROGRESS...";
        btn.classList.add('on');

        peer = new Peer(myId, {
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', () => {
            const conn = peer.connect(stationId);
            conn.on('open', () => {
                status.innerText = "SIGNAL RECEPTION STABLE";
                isConnected = true;
            });
        });

        peer.on('call', call => {
            call.answer();
            call.on('stream', stream => {
                status.innerText = "ON AIR - NOW PLAYING";
                audio.srcObject = stream;
                audio.play();
            });
        });

        peer.on('error', () => {
            status.innerText = "NO SIGNAL / STATION NOT FOUND";
            btn.classList.remove('on');
        });
    }
</script>
</body>
</html>
