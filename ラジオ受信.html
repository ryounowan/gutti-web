<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Listener</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { background: #1e293b; padding: 40px 20px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: none; background: #0f172a; color: white; text-align: center; font-size: 18px; box-sizing: border-box; }
        button { width: 100%; padding: 18px; border-radius: 15px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        #status { margin-top: 20px; color: #94a3b8; font-size: 14px; min-height: 1.5em; }
        .btn-reset { background: #64748b; margin-top: 20px; display: none; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="margin-top:0">📻 Radio</h2>
    <input type="text" id="room" value="apple7">
    <button id="listenBtn" onclick="listen()">受信開始</button>
    <div id="status">待機中</div>
    <button id="resetBtn" class="btn-reset" onclick="location.reload()">再接続する</button>
    <audio id="audio" playsinline></audio>
</div>

<script>
    let peer = null;
    const CONFIG = { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }], 'iceTransportPolicy': 'all' } };

    function listen() {
        const room = document.getElementById('room').value;
        const status = document.getElementById('status');
        const audio = document.getElementById('audio');
        document.getElementById('listenBtn').disabled = true;

        // スマホ対策：空の音を再生させてロック解除
        audio.play().catch(()=>{});

        peer = new Peer(`${room}-list-${Math.floor(Math.random()*9999)}`, CONFIG);
        peer.on('open', () => {
            status.innerText = "📡 接続中...";
            peer.connect(`${room}-host`).on('close', () => { status.innerText = "📴 放送終了"; });
        });

        peer.on('call', call => {
            status.innerText = "🔴 受信中...";
            document.getElementById('resetBtn').style.display = "block";
            call.answer();
            call.on('stream', s => {
                audio.srcObject = s;
                audio.play().catch(() => {
                    status.innerHTML = "⚠️ ここをタップして再生許可";
                    status.onclick = () => { audio.play(); status.innerHTML = "🔴 受信中..."; };
                });
            });
        });

        peer.on('error', () => { status.innerText = "❌ 配信が見つかりません"; document.getElementById('resetBtn').style.display = "block"; });
    }
</script>
</body>
</html>
