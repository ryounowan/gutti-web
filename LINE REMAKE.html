<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Talk Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-line-blue { background-color: #7494C0; }
        .key-btn { @apply bg-white text-gray-800 text-3xl font-light py-4 rounded-xl shadow-sm active:bg-gray-200 transition flex flex-col items-center justify-center; }
        video { transform: scaleX(-1); background: #000; }
        .incoming-anim { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden text-gray-900">

    <div id="view-home" class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-[#273246] p-6 text-white rounded-b-3xl shadow-lg">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div id="home-icon" class="w-14 h-14 bg-white rounded-full flex items-center justify-center text-3xl border-2 border-green-500 shadow-inner">👤</div>
                        <select id="icon-select" onchange="saveProfile()" class="absolute inset-0 opacity-0 cursor-pointer">
                            <option value="👤">👤</option><option value="🐱">🐱</option><option value="🐶">🐶</option><option value="🤖">🤖</option><option value="🦊">🦊</option><option value="😎">😎</option>
                        </select>
                    </div>
                    <div>
                        <input id="user-name" type="text" class="bg-transparent border-none font-bold focus:ring-0 text-xl w-32" placeholder="名前を設定" oninput="saveProfile()">
                        <div class="text-xs text-blue-300 font-mono" id="my-number-display">050-XXXX-XXXX</div>
                    </div>
                </div>
                <button onclick="switchView('view-keypad')" class="bg-blue-500 w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-2xl font-bold">＋</button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 space-y-6">
            <section>
                <h3 class="text-xs font-bold text-gray-400 mb-3 px-2 uppercase tracking-tighter">ショートカット</h3>
                <div id="contact-list" class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide">
                    </div>
            </section>

            <section class="flex-1">
                <h3 class="text-xs font-bold text-gray-400 mb-3 px-2 uppercase tracking-tighter">履歴</h3>
                <div id="history-list" class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-50 overflow-hidden">
                    </div>
            </section>
        </main>
    </div>

    <div id="view-keypad" class="hidden flex-1 flex flex-col bg-gray-50">
        <div class="p-8 flex flex-col items-center justify-center flex-1">
            <div class="w-full max-w-xs text-center mb-10">
                <div id="dial-display" class="text-4xl font-light mb-2 tracking-widest text-gray-800 h-10"></div>
                <div id="dial-match-name" class="text-green-600 font-bold h-6 text-sm"></div>
            </div>
            
            <div class="grid grid-cols-3 gap-5 w-full max-w-xs">
                <button onclick="pressKey('1')" class="key-btn">1<span class="text-[8px] text-gray-400"> </span></button>
                <button onclick="pressKey('2')" class="key-btn">2<span class="text-[8px] text-gray-400">ABC</span></button>
                <button onclick="pressKey('3')" class="key-btn">3<span class="text-[8px] text-gray-400">DEF</span></button>
                <button onclick="pressKey('4')" class="key-btn">4<span class="text-[8px] text-gray-400">GHI</span></button>
                <button onclick="pressKey('5')" class="key-btn">5<span class="text-[8px] text-gray-400">JKL</span></button>
                <button onclick="pressKey('6')" class="key-btn">6<span class="text-[8px] text-gray-400">MNO</span></button>
                <button onclick="pressKey('7')" class="key-btn">7<span class="text-[8px] text-gray-400">PQRS</span></button>
                <button onclick="pressKey('8')" class="key-btn">8<span class="text-[8px] text-gray-400">TUV</span></button>
                <button onclick="pressKey('9')" class="key-btn">9<span class="text-[8px] text-gray-400">WXYZ</span></button>
                <button onclick="pressKey('*')" class="key-btn text-gray-400">*</button>
                <button onclick="pressKey('0')" class="key-btn">0<span class="text-[8px] text-gray-400">+</span></button>
                <button onclick="pressKey('#')" class="key-btn text-gray-400">#</button>
            </div>

            <div class="flex items-center justify-between mt-12 w-full max-w-xs px-4">
                <button onclick="switchView('view-home')" class="text-gray-400 font-bold">戻る</button>
                <button onclick="openCallSelector()" class="bg-green-500 text-white w-20 h-20 rounded-full shadow-xl flex items-center justify-center text-4xl active:scale-90 transition">📞</button>
                <button onclick="backspace()" class="text-gray-400 font-bold">消去</button>
            </div>
            <button onclick="addToContactsFromDial()" id="btn-add-contact" class="hidden mt-6 text-blue-500 font-bold text-sm">+ 新規連絡先として保存</button>
        </div>
    </div>

    <div id="view-talk" class="hidden absolute inset-0 z-40 flex flex-col bg-gray-900">
        <div class="relative flex-1">
            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
            <div id="remote-profile-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900">
                <div id="talk-remote-icon" class="w-32 h-32 bg-white rounded-full flex items-center justify-center text-6xl shadow-2xl mb-4">👤</div>
                <div id="talk-remote-name" class="text-white text-2xl font-bold">通信中...</div>
                <div class="text-green-400 text-sm mt-2 animate-pulse" id="call-status-label">通話中</div>
            </div>
            <video id="local-video" autoplay playsinline muted class="absolute bottom-24 right-4 w-28 h-40 border-2 border-white/20 rounded-xl shadow-lg"></video>
            
            <div class="absolute bottom-8 left-0 right-0 flex justify-center gap-6 px-4">
                <button onclick="toggleMic()" id="btn-mic" class="w-14 h-14 bg-white/10 text-white rounded-full flex items-center justify-center text-xl backdrop-blur-md">🎤</button>
                <button onclick="endCall()" class="w-16 h-16 bg-red-500 text-white rounded-full flex items-center justify-center text-3xl shadow-xl">📞</button>
                <button onclick="toggleVideo()" id="btn-video" class="w-14 h-14 bg-white/10 text-white rounded-full flex items-center justify-center text-xl backdrop-blur-md">📹</button>
            </div>
        </div>
    </div>

    <div id="incoming-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-8">
        <div class="w-full max-w-xs text-center incoming-anim">
            <div id="incoming-icon" class="w-32 h-32 bg-white rounded-full mx-auto flex items-center justify-center text-6xl mb-6 border-4 border-green-500 shadow-2xl">👤</div>
            <h2 id="incoming-name" class="text-white text-3xl font-bold mb-2">着信中</h2>
            <p id="incoming-num" class="text-gray-400 font-mono mb-16 tracking-widest"></p>
            <div class="flex justify-between gap-10">
                <button onclick="declineCall()" class="bg-red-500 text-white w-20 h-20 rounded-full text-3xl shadow-lg active:scale-90">✖</button>
                <button onclick="acceptCall()" class="bg-green-500 text-white w-20 h-20 rounded-full text-3xl shadow-lg active:scale-90">✔</button>
            </div>
        </div>
    </div>

    <div id="call-selector" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-xs rounded-3xl p-8 text-center shadow-2xl">
            <h3 class="font-bold text-xl mb-8">通話モードを選択</h3>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="startCall('voice')" class="bg-gray-50 p-6 rounded-2xl hover:bg-blue-50 transition border border-gray-100">
                    <div class="text-4xl mb-2">📞</div><div class="text-sm font-bold">音声通話</div>
                </button>
                <button onclick="startCall('video')" class="bg-gray-50 p-6 rounded-2xl hover:bg-green-50 transition border border-gray-100">
                    <div class="text-4xl mb-2">📹</div><div class="text-sm font-bold">ビデオ通話</div>
                </button>
            </div>
            <button onclick="document.getElementById('call-selector').classList.add('hidden')" class="mt-8 text-gray-400 text-sm font-bold">キャンセル</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        // --- 基本設定 & データ保存 ---
        const myNum = localStorage.getItem('my-fixed-num') || `050-${Math.floor(Math.random()*9000+1000)}-${Math.floor(Math.random()*9000+1000)}`;
        localStorage.setItem('my-fixed-num', myNum);
        
        let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        let callHistory = JSON.parse(localStorage.getItem('call-history') || '[]');
        
        const peer = new Peer(myNum, {
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        let localStream, currentCall, dialString = "";
        let isMicOn = true, isVideoOn = false;

        window.onload = () => {
            document.getElementById('my-number-display').innerText = myNum;
            document.getElementById('user-name').value = localStorage.getItem('chat-user-name') || "ユーザー";
            document.getElementById('home-icon').innerText = localStorage.getItem('chat-user-icon') || "👤";
            renderContacts();
            renderHistory();
        };

        // --- プロフィール管理 ---
        function saveProfile() {
            localStorage.setItem('chat-user-name', document.getElementById('user-name').value);
            localStorage.setItem('chat-user-icon', document.getElementById('icon-select').value);
            document.getElementById('home-icon').innerText = document.getElementById('icon-select').value;
        }

        function getMyProfile() {
            return {
                name: localStorage.getItem('chat-user-name') || "ゲスト",
                icon: localStorage.getItem('chat-user-icon') || "👤"
            };
        }

        // --- 番号入力 & テンキー ---
        function formatPhone(str) {
            const n = str.replace(/\D/g, '');
            if (n.length <= 3) return n;
            if (n.length <= 7) return `${n.slice(0,3)}-${n.slice(3)}`;
            return `${n.slice(0,3)}-${n.slice(3,7)}-${n.slice(7,11)}`;
        }

        function pressKey(n) {
            if (dialString.length >= 11) return;
            dialString += n;
            updateDialUI();
        }

        function backspace() {
            dialString = dialString.slice(0, -1);
            updateDialUI();
        }

        function updateDialUI() {
            const disp = document.getElementById('dial-display');
            const match = document.getElementById('dial-match-name');
            const addBtn = document.getElementById('btn-add-contact');
            
            disp.innerText = formatPhone(dialString);
            const found = contacts.find(c => c.number.replace(/\D/g,'') === dialString);
            
            if (dialString === "") { match.innerText = ""; addBtn.classList.add('hidden'); }
            else if (found) { match.innerText = found.name; addBtn.classList.add('hidden'); }
            else { match.innerText = "登録されていません"; addBtn.classList.remove('hidden'); }
        }

        window.addEventListener('keydown', (e) => {
            if (!document.getElementById('view-keypad').classList.contains('hidden')) {
                if (e.key >= '0' && e.key <= '9') pressKey(e.key);
                if (e.key === 'Backspace') backspace();
                if (e.key === 'Enter') openCallSelector();
            }
        });

        // --- 通話ロジック (コア) ---
        function switchView(id) {
            ['view-home', 'view-keypad', 'view-talk'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function openCallSelector() {
            if (!dialString) return;
            document.getElementById('call-selector').classList.remove('hidden');
        }

        async function startCall(mode) {
            document.getElementById('call-selector').classList.add('hidden');
            isVideoOn = (mode === 'video');
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoOn, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                switchView('view-talk');
                
                // 通話開始時に自分のプロフィール情報をメタデータとして送る
                const call = peer.call(dialString, localStream, {
                    metadata: getMyProfile()
                });
                
                // 履歴に保存
                saveHistory(dialString, 'outgoing', mode);
                setupCallHandlers(call);
            } catch (e) { alert("カメラ/マイクを許可してください"); }
        }

        peer.on('call', call => {
            // 着信時、相手が送ってきたプロフィール（metadata）を取得
            const remoteProfile = call.metadata || { name: "不明な相手", icon: "👤" };
            
            document.getElementById('incoming-modal').classList.remove('hidden');
            document.getElementById('incoming-name').innerText = remoteProfile.name;
            document.getElementById('incoming-icon').innerText = remoteProfile.icon;
            document.getElementById('incoming-num').innerText = formatPhone(call.peer);
            
            currentCall = call;
        });

        async function acceptCall() {
            document.getElementById('incoming-modal').classList.add('hidden');
            try {
                // 受信側もカメラ起動を試みる（相手がビデオなら）
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                currentCall.answer(localStream);
                switchView('view-talk');
                setupCallHandlers(currentCall);
                saveHistory(currentCall.peer, 'incoming', 'video');
            } catch(e) { /* 音声のみで回答 */ }
        }

        function declineCall() {
            currentCall.close();
            document.getElementById('incoming-modal').classList.add('hidden');
            saveHistory(currentCall.peer, 'missed', 'voice');
        }

        function setupCallHandlers(call) {
            currentCall = call;
            const profile = call.metadata || { name: "Unknown", icon: "👤" };
            document.getElementById('talk-remote-name').innerText = profile.name;
            document.getElementById('talk-remote-icon').innerText = profile.icon;

            call.on('stream', stream => {
                const remoteVideo = document.getElementById('remote-video');
                remoteVideo.srcObject = stream;
                
                // 相手が映像を送っているかチェック
                setTimeout(() => {
                    const hasVideo = stream.getVideoTracks().some(t => t.enabled);
                    document.getElementById('remote-profile-overlay').classList.toggle('hidden', hasVideo);
                }, 1000);
            });

            call.on('close', () => endCall());
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            switchView('view-home');
            location.reload(); // 状態リセットのため
        }

        // --- 通話中コントロール ---
        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            document.getElementById('btn-mic').classList.toggle('bg-red-500', !isMicOn);
        }

        function toggleVideo() {
            isVideoOn = !isVideoOn;
            localStream.getVideoTracks()[0].enabled = isVideoOn;
            document.getElementById('btn-video').classList.toggle('bg-red-500', !isVideoOn);
            document.getElementById('local-video').classList.toggle('hidden', !isVideoOn);
        }

        // --- 電話帳 & 履歴のUI描画 ---
        function renderContacts() {
            const list = document.getElementById('contact-list');
            list.innerHTML = contacts.length ? '' : '<p class="text-[10px] text-gray-400 p-2">連絡先なし</p>';
            contacts.forEach(c => {
                const div = document.createElement('div');
                div.className = "flex-shrink-0 flex flex-col items-center gap-1 w-16";
                div.onclick = () => { dialString = c.number.replace(/\D/g,''); openCallSelector(); };
                div.innerHTML = `<div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-xl shadow-sm border border-gray-100">${c.icon}</div><span class="text-[9px] font-bold text-gray-500 truncate w-full text-center">${c.name}</span>`;
                list.appendChild(div);
            });
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = callHistory.length ? '' : '<p class="p-8 text-center text-xs text-gray-400">履歴はありません</p>';
            callHistory.slice().reverse().forEach(h => {
                const contact = contacts.find(c => c.number.replace(/\D/g,'') === h.number.replace(/\D/g,''));
                const div = document.createElement('div');
                div.className = "p-4 flex items-center justify-between active:bg-gray-50";
                div.onclick = () => { dialString = h.number.replace(/\D/g,''); openCallSelector(); };
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="text-2xl">${contact ? contact.icon : '👤'}</div>
                        <div>
                            <div class="text-sm font-bold ${h.type==='missed'?'text-red-500':''}">${contact ? contact.name : formatPhone(h.number)}</div>
                            <div class="text-[10px] text-gray-400">${h.time}</div>
                        </div>
                    </div>
                    <div class="text-xs text-gray-400">${h.mode==='video'?'📹':'📞'}</div>
                `;
                list.appendChild(div);
            });
        }

        function saveHistory(num, type, mode) {
            callHistory.push({ number: num, type, mode, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            if (callHistory.length > 20) callHistory.shift();
            localStorage.setItem('call-history', JSON.stringify(callHistory));
            renderHistory();
        }

        function addToContactsFromDial() {
            const name = prompt("保存する名前を入力してください");
            if (name) {
                contacts.push({ name, number: dialString, icon: "👤" });
                localStorage.setItem('contacts', JSON.stringify(contacts));
                renderContacts();
                updateDialUI();
            }
        }
    </script>
</body>
</html>
