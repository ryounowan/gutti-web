<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Talk Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-dark-navy { background-color: #273246; }
        .key-btn { @apply bg-white text-gray-800 text-3xl font-light py-4 rounded-xl shadow-sm active:bg-gray-200 transition flex flex-col items-center justify-center; }
        video { transform: scaleX(-1); background: #000; border-radius: 12px; }
        .incoming-anim { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden text-gray-900">

    <div id="view-home" class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-dark-navy p-6 text-white rounded-b-3xl shadow-lg">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="home-icon" class="w-14 h-14 bg-white rounded-full flex items-center justify-center text-3xl border-2 border-green-500 shadow-inner">👤</div>
                    <div>
                        <input id="user-name" type="text" class="bg-transparent border-none font-bold focus:ring-0 text-xl w-32" oninput="saveProfile()" placeholder="名前を設定">
                        <div class="text-xs text-blue-300 font-mono" id="my-number-display">読み込み中...</div>
                    </div>
                </div>
                <button onclick="switchView('view-keypad')" class="bg-blue-500 w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-2xl font-bold active:scale-95">＋</button>
            </div>
        </header>
        <main class="p-8 flex-1 flex flex-col items-center justify-center text-gray-400 text-sm">
            <div class="bg-white p-6 rounded-2xl shadow-sm w-full text-center">
                <p>あなたの番号を相手に伝えてください</p>
                <p class="text-2xl font-bold text-gray-800 mt-2 select-all" id="display-num-big">----</p>
            </div>
        </main>
    </div>

    <div id="view-keypad" class="hidden flex-1 flex flex-col bg-gray-50 p-8">
        <div id="dial-display" class="text-4xl font-light text-center mb-10 tracking-widest h-10"></div>
        <div class="grid grid-cols-3 gap-5 max-w-xs mx-auto mb-10">
            <button onclick="pressKey('1')" class="key-btn">1</button>
            <button onclick="pressKey('2')" class="key-btn">2</button>
            <button onclick="pressKey('3')" class="key-btn">3</button>
            <button onclick="pressKey('4')" class="key-btn">4</button>
            <button onclick="pressKey('5')" class="key-btn">5</button>
            <button onclick="pressKey('6')" class="key-btn">6</button>
            <button onclick="pressKey('7')" class="key-btn">7</button>
            <button onclick="pressKey('8')" class="key-btn">8</button>
            <button onclick="pressKey('9')" class="key-btn">9</button>
            <button onclick="pressKey('*')" class="key-btn text-gray-400">*</button>
            <button onclick="pressKey('0')" class="key-btn">0</button>
            <button onclick="pressKey('#')" class="key-btn text-gray-400">#</button>
        </div>
        <div class="flex justify-between items-center max-w-xs mx-auto w-full px-4">
            <button onclick="switchView('view-home')" class="text-gray-400 font-bold">戻る</button>
            <button onclick="startCall()" class="bg-green-500 w-20 h-20 rounded-full text-4xl shadow-xl flex items-center justify-center active:scale-90">📞</button>
            <button onclick="backspace()" class="text-gray-400 font-bold">消去</button>
        </div>
    </div>

    <div id="incoming-modal" class="hidden fixed inset-0 bg-dark-navy z-50 flex flex-col items-center justify-center p-8 text-white">
        <div class="incoming-anim text-center">
            <div id="incoming-icon" class="w-32 h-32 bg-white rounded-full mx-auto flex items-center justify-center text-6xl mb-6 text-black border-4 border-green-500">👤</div>
            <h2 id="incoming-name" class="text-3xl font-bold mb-2">着信中...</h2>
            <p id="incoming-num" class="text-blue-300 font-mono mb-20"></p>
        </div>
        <div class="flex justify-between w-full max-w-xs px-4">
            <button onclick="declineCall()" class="bg-red-500 w-20 h-20 rounded-full text-3xl shadow-lg flex items-center justify-center">✖</button>
            <button onclick="acceptCall()" class="bg-green-500 w-20 h-20 rounded-full text-3xl shadow-lg flex items-center justify-center">✔</button>
        </div>
    </div>

    <div id="view-talk" class="hidden fixed inset-0 bg-gray-900 z-40 flex flex-col text-white p-6">
        <div class="flex-1 flex flex-col items-center justify-center">
            <div id="talk-icon" class="w-24 h-24 bg-white rounded-full flex items-center justify-center text-5xl mb-4 text-black">👤</div>
            <div id="talk-name" class="text-2xl font-bold mb-1">相手の名前</div>
            <div id="call-timer" class="text-green-400 font-mono text-xl">00:00</div>
            <div id="calling-status" class="text-gray-400 text-sm mt-2">呼び出し中...</div>
            <video id="remote-video" autoplay playsinline class="mt-8 w-full max-w-sm"></video>
        </div>
        <div class="p-12 flex justify-center">
            <button onclick="endCall()" class="bg-red-500 w-16 h-16 rounded-full text-3xl shadow-2xl flex items-center justify-center active:scale-95">📞</button>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        const myNum = localStorage.getItem('my-p2p-num') || `050-${Math.floor(Math.random()*9000+1000)}-${Math.floor(Math.random()*9000+1000)}`;
        localStorage.setItem('my-p2p-num', myNum);
        
        const peer = new Peer(myNum, { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });

        let dialString = "";
        let localStream, currentCall, callTimerInterval, cancelTimer;
        let callSeconds = 0;

        window.onload = () => {
            document.getElementById('my-number-display').innerText = myNum;
            document.getElementById('display-num-big').innerText = myNum;
            document.getElementById('user-name').value = localStorage.getItem('user-name') || "ユーザー";
        };

        function saveProfile() {
            localStorage.setItem('user-name', document.getElementById('user-name').value);
        }

        function switchView(id) {
            ['view-home', 'view-keypad', 'view-talk'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function pressKey(k) { if(dialString.length < 11) dialString += k; updateDialUI(); }
        function backspace() { dialString = dialString.slice(0, -1); updateDialUI(); }
        function updateDialUI() { document.getElementById('dial-display').innerText = dialString.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3'); }

        // --- 発信処理 ---
        async function startCall() {
            if(!dialString) return;
            switchView('view-talk');
            document.getElementById('talk-name').innerText = dialString;
            document.getElementById('calling-status').innerText = "呼び出し中（30秒で自動終了）...";
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: true});
                currentCall = peer.call(dialString, localStream, {
                    metadata: { name: localStorage.getItem('user-name'), icon: "👤" }
                });
                
                setupCallHandlers(currentCall);

                // 【30秒キャンセルロジック】発信側：30秒経って応答（callSeconds > 0）がなければ切断
                cancelTimer = setTimeout(() => {
                    if (callSeconds === 0) {
                        alert("相手が応答しませんでした");
                        endCall();
                    }
                }, 30000); 

            } catch(e) { alert("カメラ・マイクを許可してください"); endCall(); }
        }

        // --- 着信処理 ---
        peer.on('call', call => {
            currentCall = call;
            const meta = call.metadata || { name: "不明な相手" };
            document.getElementById('incoming-modal').classList.remove('hidden');
            document.getElementById('incoming-name').innerText = meta.name;
            document.getElementById('incoming-num').innerText = call.peer;
            
            // 【30秒キャンセルロジック】受信側：30秒間放置されたら自動で閉じる
            cancelTimer = setTimeout(() => {
                declineCall();
            }, 30000);
        });

        async function acceptCall() {
            clearTimeout(cancelTimer); // 操作されたので自動キャンセルを停止
            document.getElementById('incoming-modal').classList.add('hidden');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: true});
                currentCall.answer(localStream);
                switchView('view-talk');
                setupCallHandlers(currentCall);
                startTimer();
            } catch(e) { endCall(); }
        }

        function declineCall() {
            clearTimeout(cancelTimer);
            if(currentCall) currentCall.close();
            document.getElementById('incoming-modal').classList.add('hidden');
            switchView('view-home');
        }

        // --- 通話制御 ---
        function setupCallHandlers(call) {
            call.on('stream', stream => {
                clearTimeout(cancelTimer); // 繋がったので30秒タイマーを解除
                const remoteVideo = document.getElementById('remote-video');
                remoteVideo.srcObject = stream;
                remoteVideo.classList.remove('hidden');
                document.getElementById('remote-audio').srcObject = stream;
                document.getElementById('calling-status').innerText = "通話中";
                startTimer();
            });
            call.on('close', () => endCall());
            call.on('error', () => endCall());
        }

        function startTimer() {
            if(callTimerInterval) return;
            callSeconds = 0;
            callTimerInterval = setInterval(() => {
                callSeconds++;
                const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
                const s = (callSeconds % 60).toString().padStart(2, '0');
                document.getElementById('call-timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function endCall() {
            if(currentCall) currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            clearInterval(callTimerInterval);
            clearTimeout(cancelTimer);
            callTimerInterval = null;
            location.reload(); 
        }

        peer.on('open', id => {
            document.getElementById('my-number-display').innerText = id;
            document.getElementById('display-num-big').innerText = id;
        });
    </script>
</body>
</html>
