<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Advanced HTML Installer Creator (Final)</title>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; color: #1e293b; display: flex; justify-content: center; }
        .container { max-width: 650px; width: 100%; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        h2 { border-bottom: 3px solid var(--primary); padding-bottom: 10px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        
        /* 入力エリアのスタイル */
        .drop-zone { border: 2px dashed #3b82f6; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: #eff6ff; transition: 0.3s; margin: 15px 0; }
        .drop-zone:hover { background: #dbeafe; border-color: var(--primary); }
        .input-options { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
        .input-btn { background: white; border: 1px solid #cbd5e1; padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
        .input-btn:hover { background: #f8fafc; }
        .active-input { background: #3b82f6; color: white; border-color: #3b82f6; }
        
        #fileStatus { font-size: 0.9rem; font-weight: bold; color: #3b82f6; margin: 10px 0; text-align: center; }
        .btn-build { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-build:hover { background: #1d4ed8; transform: translateY(-2px); }
        .btn-build:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        
        #buildLog { font-size: 0.8rem; background: #1e293b; color: #f1f5f9; padding: 10px; border-radius: 8px; margin-top: 15px; max-height: 100px; overflow-y: auto; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ インストーラー作成 (最終版)</h2>
    
    <div class="form-group">
        <label>システム名</label>
        <input type="text" id="sysName" placeholder="例: Gutti App Portal">
    </div>
    
    <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;"><label>バージョン</label><input type="text" id="sysVer" placeholder="1.0.0"></div>
        <div style="flex: 1;"><label>作成者</label><input type="text" id="sysAuthor" placeholder="Gutti Presents"></div>
    </div>

    <div class="form-group">
        <label>詳細説明</label>
        <textarea id="sysDesc" placeholder="パッケージの説明を入力..."></textarea>
    </div>

    <div class="input-options">
        <button class="input-btn active-input" id="modeFile">📄 ファイル単体モード</button>
        <button class="input-btn" id="modeFolder">📂 フォルダモード</button>
    </div>

    <div class="drop-zone" id="dropZone">
        ここにファイルをドロップ<br>またはクリックして選択
        <input type="file" id="fileInput" multiple style="display: none;">
    </div>

    <div id="fileStatus">ファイルが選択されていません</div>
    <div id="buildLog"></div>

    <button id="buildBtn" class="btn-build" disabled>インストーラーを出力 (.html)</button>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileStatus = document.getElementById('fileStatus');
    const buildBtn = document.getElementById('buildBtn');
    const buildLog = document.getElementById('buildLog');
    
    const modeFileBtn = document.getElementById('modeFile');
    const modeFolderBtn = document.getElementById('modeFolder');
    
    let packedFiles = [];

    // --- 入力モード切り替えロジック (ファイル単体/フォルダ) ---
    modeFileBtn.onclick = () => {
        fileInput.removeAttribute('webkitdirectory');
        modeFileBtn.classList.add('active-input');
        modeFolderBtn.classList.remove('active-input');
        resetFiles();
    };
    modeFolderBtn.onclick = () => {
        fileInput.setAttribute('webkitdirectory', '');
        modeFolderBtn.classList.add('active-input');
        modeFileBtn.classList.remove('active-input');
        resetFiles();
    };

    function resetFiles() {
        packedFiles = [];
        fileStatus.innerText = "モードを切り替えました。ファイルを再選択してください。";
        buildBtn.disabled = true;
    }

    dropZone.onclick = () => fileInput.click();

    // --- 大量ファイルでもクラッシュしにくい読み込み処理 ---
    fileInput.onchange = async (e) => {
        const files = Array.from(e.target.files);
        packedFiles = [];
        fileStatus.innerText = `読み込み中... (0/${files.length})`;
        buildLog.style.display = 'block';
        buildLog.innerHTML = '';

        buildBtn.disabled = true;

        // 非同期処理を順番に実行する（メモリ負荷軽減）
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const logEntry = document.createElement('div');
            logEntry.innerText = `[${i+1}/${files.length}] ${file.name} を処理中...`;
            buildLog.appendChild(logEntry);
            buildLog.scrollTop = buildLog.scrollHeight; // 自動スクロール

            const data = await toBase64(file);
            packedFiles.push({
                path: file.webkitRelativePath || file.name, // フォルダ構造があれば維持
                type: file.type,
                data: data
            });
            
            fileStatus.innerText = `読み込み中... (${i+1}/${files.length})`;
            // ブラウザへのUI描画時間を確保するため、極小の遅延を入れる
            await new Promise(r => setTimeout(r, 0));
        }

        fileStatus.innerText = `完了！ ${packedFiles.length} 個のファイルを認識しました。`;
        buildLog.innerHTML += `<div><strong>全ての読み込みが完了しました。</strong></div>`;
        buildLog.scrollTop = buildLog.scrollHeight;
        buildBtn.disabled = packedFiles.length === 0;
    };

    // ファイルを1つずつ読み込むためのPromise
    const toBase64 = file => new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        // 大量ファイル処理時はerrorハンドリングも重要
        reader.onerror = () => {
            console.error(`ファイル読み込み失敗: ${file.name}`);
            resolve(null); // 失敗しても次へ行く
        };
    });

    // --- インストーラー出力処理 ---
    buildBtn.onclick = () => {
        const info = {
            name: document.getElementById('sysName').value || "Unnamed System",
            ver: document.getElementById('sysVer').value || "1.0.0",
            author: document.getElementById('sysAuthor').value || "Unknown",
            desc: document.getElementById('sysDesc').value || ""
        };

        // JSONエスケープ（これで${info.name}がそのまま出力される問題を修正）
        const finalHtml = generateInstaller(info, packedFiles);
        
        const blob = new Blob([finalHtml], {type: 'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${info.name}_Setup.html`;
        a.click();
    };

    // --- 出力されるインストーラーのHTMLテンプレート ---
    function generateInstaller(info, files) {
        // 大量のファイルデータが入ったJSONを文字列化
        const jsonFiles = JSON.stringify(files);
        
        // 以前のミス（テンプレートリテラルのエスケープ）を完全に修正。
        // バックトラック(`)の中で、変数を展開したい部分だけ \${...} とする。
        return `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>${info.name} Setup</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .window { background: white; width: 100%; max-width: 520px; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; }
        .header { background: #1f2937; color: white; padding: 18px 25px; font-weight: bold; display: flex; justify-content: space-between; font-size: 1.1rem; }
        .content { padding: 30px; }
        h3 { margin-top: 0; color: #111; }
        .info-table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.95rem; }
        .info-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .desc-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; font-size: 0.9rem; height: 100px; overflow-y: auto; white-space: pre-wrap; color: #64748b; border-radius: 8px; }
        .footer { padding: 20px 30px; background: #f8fafc; text-align: right; border-top: 1px solid #e2e8f0; }
        button { background: #2563eb; color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { font-size: 0.9rem; font-weight: bold; color: #2563eb; margin-top: 15px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="window">
        <div class="header">
            <span>${info.name} - セットアップ</span>
            <span>v${info.ver}</span>
        </div>
        <div class="content">
            <h3>インストール準備完了</h3>
            <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 25px;">以下の内容でシステムをインストールします。</p>
            <table class="info-table">
                <tr><td><strong>システム名</strong></td><td>${info.name}</td></tr>
                <tr><td><strong>バージョン</strong></td><td>${info.ver}</td></tr>
                <tr><td><strong>作成者</strong></td><td>${info.author}</td></tr>
            </table>
            <div class="desc-box">${info.desc}</div>
            <div id="status"></div>
        </div>
        <div class="footer">
            <button id="installBtn" onclick="startInstall()">インストール実行</button>
        </div>
    </div>
    <script>
        const files = ${jsonFiles};
        let isInstalling = false;

        async function startInstall() {
            if (isInstalling) return;
            isInstalling = true;
            
            const btn = document.getElementById('installBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            btn.innerText = "インストール中...";
            status.style.display = 'block';
            
            // --- 大量ファイルでもブラウザが死なない展開処理 ---
            for(let i = 0; i < files.length; i++) {
                const file = files[i];
                if(!file.data) continue; // 読み込み失敗ファイルは飛ばす

                status.innerText = \`ファイルを展開中... (\${i+1}/\${files.length})\`;
                
                // ダウンロードを実行
                const link = document.createElement('a');
                link.href = file.data;
                // フォルダ構造を維持するため、/ を _ に置換してフラットにする（SmartScreen対策）
                link.download = file.path.replace(/[\\/]/g, '_'); 
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // --- 重要: 負荷軽減のためのウェイト ---
                // ファイル数が多い場合、この遅延がブラウザのクラッシュを防ぎ、SmartScreenのブロックも回避しやすくします。
                // 5ファイルごとに少し長めの休憩を入れる
                const delay = (i % 5 === 0) ? 300 : 150; 
                await new Promise(r => setTimeout(r, delay)); 
            }
            
            status.innerText = "すべてのファイルを保存しました。ダウンロードフォルダを確認してください。";
            status.style.color = "#059669"; // 完了時は緑に
            btn.innerText = "完了";
        }
    <\/script>
</body>
</html>`;
    }
</script>

</body>
</html>
