<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Connect Tool - Fixed</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        video { width: 100%; border-radius: 8px; background: #000; margin-top: 15px; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input, select, button { padding: 12px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { cursor: pointer; background: #007bff; color: white; border: none; font-weight: bold; }
        button:disabled { background: #ccc; }
        .status { font-size: 0.9em; color: #666; text-align: center; font-weight: bold; padding: 10px; }
        .options { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>P2P 共有ツール (修正版)</h2>
    
    <div class="controls">
        <input type="text" id="room-id" placeholder="合言葉（例: my-secret-room）">
        
        <div class="options">
            <select id="media-type">
                <option value="camera">📷 カメラを使用</option>
                <option value="screen">💻 画面共有 (PC向き)</option>
            </select>
            <label><input type="checkbox" id="mic-on" checked> 🎤 マイクON</label>
        </div>

        <button id="start-broadcast">配信を開始する</button>
        <hr style="width:100%">
        <button id="join-stream" style="background: #28a745;">視聴する（合言葉を入力）</button>
    </div>

    <p id="status" class="status">待機中...</p>
    <video id="main-video" autoplay playsinline controls></video>
</div>

<script>
    const roomIdInput = document.getElementById('room-id');
    const mediaTypeSelect = document.getElementById('media-type');
    const micCheckbox = document.getElementById('mic-on');
    const statusText = document.getElementById('status');
    const videoElement = document.getElementById('main-video');
    
    let peer = null;
    let localStream = null;

    async function getMedia() {
        const useMic = micCheckbox.checked;
        const type = mediaTypeSelect.value;
        try {
            if (type === 'screen') {
                return await navigator.mediaDevices.getDisplayMedia({ video: true, audio: useMic });
            } else {
                return await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: useMic });
            }
        } catch (e) {
            alert("カメラ/画面共有の取得に失敗しました。");
            return null;
        }
    }

    // --- 配信者 (送信側) ---
    document.getElementById('start-broadcast').onclick = async () => {
        const id = roomIdInput.value;
        if (!id) return alert("合言葉を入力してください");

        localStream = await getMedia();
        if (!localStream) return;

        videoElement.srcObject = localStream;
        videoElement.muted = true; // 自分の声がループしないようにミュート

        peer = new Peer(id);

        peer.on('open', () => {
            statusText.innerText = `配信準備完了！ 合言葉: ${id}`;
            statusText.style.color = "#007bff";
        });

        // 相手からの「通話」を待ち受ける
        peer.on('call', (call) => {
            statusText.innerText = "接続されました！配信中...";
            call.answer(localStream);
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') alert("その合言葉は既に使用されています。");
            console.error(err);
        });
    };

    // --- 視聴者 (受信側) ---
    document.getElementById('join-stream').onclick = () => {
        const id = roomIdInput.value;
        if (!id) return alert("合言葉を入力してください");

        // 受信側はランダムなIDで開始
        peer = new Peer();
        
        peer.on('open', () => {
            statusText.innerText = `配信者「${id}」に接続を試みています...`;
            
            // 修正ポイント: 受信側から「通話」を開始する。
            // 相手に自分のメディアを送る必要はないが、PeerJSの仕様上、
            // 空のメディアを投げるよりは、受信用として明示的にcallする。
            const call = peer.call(id, new MediaStream());

            call.on('stream', (remoteStream) => {
                console.log("ストリームを受信しました");
                videoElement.srcObject = remoteStream;
                statusText.innerText = "受信中！";
                statusText.style.color = "#28a745";
                
                // ブラウザの自動再生制限対策
                videoElement.play().catch(e => {
                    statusText.innerText = "再生ボタンを押してください";
                });
            });

            call.on('error', (err) => {
                alert("通話エラーが発生しました。");
            });
        });

        peer.on('error', (err) => {
            alert("接続に失敗しました。合言葉が正しいか、配信が始まっているか確認してください。");
        });
    };
</script>
</body>
</html>
