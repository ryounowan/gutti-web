<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Remote Control v2</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: sans-serif; text-align: center; }
        #remote-video { max-width: 100%; max-height: 90vh; background: #000; cursor: crosshair; }
        .ui { padding: 20px; }
        input, button { padding: 10px; border-radius: 5px; border: none; margin: 5px; }
        button { background: #3b82f6; color: white; cursor: pointer; }
        #status { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div id="setup" class="ui">
        <input type="text" id="room" placeholder="ルーム名を入力" value="test1234">
        <button onclick="init()">接続開始</button>
    </div>
    <div id="main" style="display:none">
        <div id="status">状態: 待機中</div>
        <video id="remote-video" autoplay playsinline muted></video>
        <div class="ui">
            <button onclick="startScreenShare()" style="background:#10b981">画面共有を開始</button>
        </div>
    </div>

<script>
    let peer, conn, agentConn, roomCode;

    function init() {
        roomCode = document.getElementById('room').value.trim();
        peer = new Peer(`${roomCode}_${Math.random().toString(36).substring(2,7)}`);
        
        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            connectToHub();
        });

        peer.on('call', call => {
            call.answer();
            call.on('stream', stream => { document.getElementById('remote-video').srcObject = stream; });
        });

        peer.on('connection', c => {
            conn = c;
            setupAgent();
        });
    }

    function connectToHub() {
        const hubId = `${roomCode}_HUB`;
        const hubCheck = new Peer(hubId);
        hubCheck.on('open', () => {
            hubCheck.on('connection', c => { conn = c; setupAgent(); });
        });
        hubCheck.on('error', () => {
            conn = peer.connect(hubId);
            setupAgent();
        });
    }

    // ★重要: PCのNode.js(Agent)に接続する関数
    function setupAgent() {
        document.getElementById('status').innerText = "ブラウザ間接続完了。PCエージェントを探しています...";
        agentConn = peer.connect(`${roomCode}_AGENT`);
        
        agentConn.on('open', () => {
            document.getElementById('status').innerText = "PCエージェントと接続！操作可能です。";
        });

        const video = document.getElementById('remote-video');
        video.onmousedown = (e) => {
            if (!conn || !conn.open) return;
            const rect = video.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            const payload = { type: 'click', x: x, y: y };
            
            conn.send(payload); // 相手のブラウザへ
            if(agentConn && agentConn.open) agentConn.send(payload); // PCのNode.jsへ
        };
    }

    async function startScreenShare() {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        document.getElementById('remote-video').srcObject = stream;
        if (conn) peer.call(conn.peer, stream);
    }
</script>
</body>
</html>
