<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate P2P - Force Connect</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #020617; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .controls { display: flex; flex-direction: column; gap: 8px; }
        input, select, button { padding: 15px; border-radius: 10px; border: 1px solid #334155; font-size: 16px; outline: none; }
        input { background: #0f172a; color: white; border-color: #3b82f6; }
        button { cursor: pointer; border: none; font-weight: bold; }
        #host-btn { background: #3b82f6; color: white; }
        #guest-btn { background: #10b981; color: white; }
        #status { margin: 15px 0; padding: 15px; border-radius: 10px; background: rgba(0,0,0,0.4); text-align: center; font-weight: bold; line-height: 1.4; border: 2px solid #475569; }
        video { width: 100%; border-radius: 15px; background: #000; margin-top: 10px; }
        .flash { animation: flash-bg 0.5s; }
        @keyframes flash-bg { from { background: #3b82f6; } to { background: #1e293b; } }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <h2 style="text-align:center; margin-top:0;">🎥 リアルタイム共有</h2>
    <div class="controls">
        <input type="text" id="room-id" placeholder="合言葉 (例: test789)" value="">
        <select id="media-type">
            <option value="camera">📷 カメラ映像</option>
            <option value="screen">💻 画面共有 (PC)</option>
        </select>
        <button id="host-btn">【1】配信を開始（親）</button>
        <button id="guest-btn">【2】視聴を開始（子）</button>
    </div>

    <div id="status">合言葉を入力して、<br>まず【1】を押してください</div>
    
    <video id="v" autoplay playsinline controls muted></video>
</div>

<script>
    const status = document.getElementById('status');
    const v = document.getElementById('v');
    let peer = null;

    function log(msg, color="#3b82f6") {
        status.innerText = msg;
        status.style.borderColor = color;
        document.getElementById('main-card').classList.add('flash');
        setTimeout(()=>document.getElementById('main-card').classList.remove('flash'), 500);
    }

    // --- 配信者 (Host) ---
    document.getElementById('host-btn').onclick = async () => {
        const id = document.getElementById('room-id').value;
        if(!id) return alert("合言葉を入力してください");

        try {
            const stream = (document.getElementById('media-type').value === 'screen') ? 
                await navigator.mediaDevices.getDisplayMedia({video:true, audio:true}) :
                await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            
            v.srcObject = stream;
            v.muted = true;

            if(peer) peer.destroy();
            // 配信側は固定IDで起動
            peer = new Peer(id, { debug: 3 });

            peer.on('open', () => log(`配信準備完了！\n相手のスマホで「視聴」を押してください`, "#3b82f6"));
            
            peer.on('call', call => {
                log("視聴者が来ました！接続中...", "#10b981");
                call.answer(stream);
            });

            peer.on('error', e => {
                if(e.type === 'unavailable-id') {
                    alert("エラー：この合言葉は既に誰かが使っています。\n別の言葉に変えてください。");
                }
                log("エラー: " + e.type, "#ef4444");
            });

        } catch (e) { alert("カメラが使えません"); }
    };

    // --- 視聴者 (Guest) ---
    document.getElementById('guest-btn').onclick = () => {
        const id = document.getElementById('room-id').value;
        if(!id) return alert("合言葉を入力してください");

        if(peer) peer.destroy();
        peer = new Peer({ debug: 3 }); // ランダムIDで起動

        peer.on('open', (myId) => {
            log(`配信者「${id}」を呼び出し中...\n(自分のID: ${myId})`, "#f59e0b");
            
            // 接続試行（空のストリームを投げる）
            const call = peer.call(id, new MediaStream());

            // 映像が届いた
            call.on('stream', remoteStream => {
                log("✅ 映像受信に成功！", "#10b981");
                v.srcObject = remoteStream;
                v.muted = false;
                v.play().catch(() => log("再生ボタンを押してください", "#ef4444"));
            });

            // 5秒以内に反応がなければ再試行を促す
            setTimeout(() => {
                if(status.innerText.includes("呼び出し中")) {
                    log("× 応答がありません。\n配信側を先に開始しましたか？\n合言葉は合っていますか？", "#ef4444");
                }
            }, 7000);
        });

        peer.on('error', e => log("接続失敗。合言葉が違うか、配信者が不在です。", "#ef4444"));
    };
</script>
</body>
</html>
