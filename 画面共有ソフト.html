<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Share - High Connectivity</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        input, button { padding: 15px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; }
        input { background: #020617; color: white; border: 1px solid #3b82f6; }
        #host-btn { background: #3b82f6; color: white; }
        #guest-btn { background: #10b981; color: white; }
        #status { margin: 20px 0; padding: 15px; border-radius: 10px; background: rgba(0,0,0,0.3); font-size: 0.9rem; line-height: 1.5; border-left: 5px solid #64748b; }
        video { width: 100%; border-radius: 15px; background: #000; margin-top: 15px; }
        .err { border-color: #ef4444 !important; color: #fca5a5; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎥 P2Pライブ共有</h2>
    <div class="controls">
        <input type="text" id="room-id" placeholder="合言葉（例: rally777）" value="rally2026">
        <button id="host-btn">【1】配信スタート（親）</button>
        <button id="guest-btn">【2】視聴スタート（子）</button>
    </div>

    <div id="status">待機中...</div>
    <video id="v" autoplay playsinline controls muted></video>
</div>

<script>
    const statusText = document.getElementById('status');
    const v = document.getElementById('v');
    let peer = null;

    // 通信経路を確保するための設定 (Googleのサーバーを利用)
    const peerConfig = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        },
        debug: 3
    };

    function setStatus(msg, isError = false) {
        statusText.innerText = msg;
        statusText.className = isError ? 'err' : '';
        console.log(msg);
    }

    // --- 配信側 ---
    document.getElementById('host-btn').onclick = async () => {
        const id = document.getElementById('room-id').value;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            v.srcObject = stream;
            v.muted = true;

            if(peer) peer.destroy();
            peer = new Peer(id, peerConfig);

            peer.on('open', () => setStatus(`配信中...\n相手の「視聴」ボタンを待っています`));
            
            peer.on('call', call => {
                setStatus("視聴者から呼び出し！映像を送信します...");
                call.answer(stream);
                
                // 通信路が確立したか監視
                call.on('stream', () => setStatus("通信確立！映像送信中"));
            });

            peer.on('error', e => setStatus("エラー: " + e.type, true));

        } catch (e) { alert("カメラ許可が必要です"); }
    };

    // --- 視聴側 ---
    document.getElementById('guest-btn').onclick = () => {
        const id = document.getElementById('room-id').value;
        if(peer) peer.destroy();
        peer = new Peer(peerConfig);

        peer.on('open', (myId) => {
            setStatus(`サーバー接続完了。\n配信者「${id}」の映像経路を探しています...`);
            
            // 接続開始
            const call = peer.call(id, new MediaStream());

            // タイムアウト監視
            const timer = setTimeout(() => {
                setStatus("応答なし：通信経路がブロックされています。Wi-Fiを切って4G/5Gで試してください。", true);
            }, 10000);

            call.on('stream', remoteStream => {
                clearTimeout(timer);
                setStatus("受信成功！映像を表示します");
                v.srcObject = remoteStream;
                v.muted = false;
                v.play();
            });
        });

        peer.on('error', e => setStatus("接続エラー。合言葉が違うか配信者がいません。", true));
    };
</script>
</body>
</html>
