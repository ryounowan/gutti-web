<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video Live - Complete</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --bg: #0f172a; --card: #1e293b; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: var(--card); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        h2 { margin-top: 0; text-align: center; color: var(--primary); }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        input, select, button { padding: 14px; border-radius: 8px; border: 1px solid #334155; font-size: 16px; outline: none; }
        input { background: #0f172a; color: white; }
        button { cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
        #start-broadcast { background: var(--primary); color: white; }
        #join-stream { background: var(--success); color: white; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .status-box { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 0.9em; min-height: 1.2em; text-align: center; border-left: 4px solid #64748b; }
        video { width: 100%; border-radius: 12px; background: #000; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .options { display: flex; align-items: center; gap: 15px; font-size: 14px; padding: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>📡 P2P Live Share</h2>
    
    <div class="controls">
        <input type="text" id="room-id" placeholder="合言葉を決めて入力 (例: rally2026)" value="rally2026">
        
        <div class="options">
            <select id="media-type" style="flex: 1;">
                <option value="camera">📷 カメラ</option>
                <option value="screen">💻 画面共有</option>
            </select>
            <label style="cursor:pointer"><input type="checkbox" id="mic-on" checked> 🎤 マイク</label>
        </div>

        <button id="start-broadcast">配信を開始する</button>
        <button id="join-stream">視聴する</button>
    </div>

    <div id="status" class="status-box">待機中...</div>
    
    <video id="main-video" autoplay playsinline controls muted></video>
    <div id="tap-notice" class="hidden" style="text-align:center; color:var(--success); font-size:0.8em; margin-top:5px;">
        ※映像が出たら、動画をタップしてミュート解除してください
    </div>
</div>

<script>
    const roomIdInput = document.getElementById('room-id');
    const mediaTypeSelect = document.getElementById('media-type');
    const micCheckbox = document.getElementById('mic-on');
    const statusText = document.getElementById('status');
    const videoElement = document.getElementById('main-video');
    const tapNotice = document.getElementById('tap-notice');
    
    let peer = null;
    let localStream = null;

    // ログ表示
    function setStatus(msg, color = "#64748b") {
        statusText.innerText = msg;
        statusText.style.borderLeftColor = color;
    }

    // カメラ・画面の取得
    async function getMedia() {
        const useMic = micCheckbox.checked;
        const type = mediaTypeSelect.value;
        try {
            const constraints = { video: true, audio: useMic };
            if (type === 'screen') {
                return await navigator.mediaDevices.getDisplayMedia(constraints);
            } else {
                return await navigator.mediaDevices.getUserMedia(constraints);
            }
        } catch (e) {
            alert("権限エラー: カメラまたは画面共有が許可されませんでした。");
            return null;
        }
    }

    // --- 配信側 (Sender) ---
    document.getElementById('start-broadcast').onclick = async () => {
        const id = roomIdInput.value;
        if (!id) return alert("合言葉を入力してください");

        localStream = await getMedia();
        if (!localStream) return;

        videoElement.srcObject = localStream;
        videoElement.muted = true; // 配信者は自分の音を聞かない

        if(peer) peer.destroy();
        peer = new Peer(id);

        peer.on('open', () => {
            setStatus(`配信中... \n相手に「${id}」と伝えてください`, "#3b82f6");
        });

        peer.on('call', (call) => {
            setStatus("接続されました！配信中です", "#10b981");
            call.answer(localStream);
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') alert("その合言葉は既に使用されています。");
            console.error(err);
        });
    };

    // --- 視聴側 (Receiver) ---
    document.getElementById('join-stream').onclick = () => {
        const id = roomIdInput.value;
        if (!id) return alert("合言葉を入力してください");

        if(peer) peer.destroy();
        peer = new Peer(); // 受信側はランダムID
        
        peer.on('open', () => {
            setStatus(`配信者「${id}」に接続を試みています...`);
            
            // 相手を呼び出す
            const call = peer.call(id, new MediaStream());

            call.on('stream', (remoteStream) => {
                console.log("映像を受信しました");
                videoElement.srcObject = remoteStream;
                videoElement.muted = false; // 音声を聞けるようにする
                
                tapNotice.classList.remove('hidden');
                
                // 自動再生を試みる
                videoElement.play().then(() => {
                    setStatus("受信成功！", "#10b981");
                }).catch(() => {
                    setStatus("タップして再生してください", "#ef4444");
                });
            });
        });

        peer.on('error', (err) => {
            setStatus("接続失敗。合言葉が違うか、配信がまだ始まっていません。", "#ef4444");
        });
    };
</script>
</body>
</html>
