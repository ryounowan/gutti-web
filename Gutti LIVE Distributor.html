<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pro Video Streamer - Complete</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #ef4444; --bg: #020617; --panel: #1e293b; --active: #10b981; }
        body { font-family: sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .box { background: var(--panel); padding: 25px; border-radius: 24px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; box-sizing: border-box; font-size: 16px; }
        input { background: #0f172a; color: white; border: 1px solid #334155; }
        .btn-start { background: var(--accent); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start:hover { opacity: 0.8; }
        .btn-stop { background: #475569; color: white; cursor: pointer; }
        video { width: 100%; border-radius: 12px; background: #000; margin-top: 15px; border: 1px solid #334155; aspect-ratio: 16 / 9; object-fit: contain; }
        .stats { display: flex; justify-content: space-around; font-size: 14px; margin: 10px 0; color: #94a3b8; }
        .badge { background: #334155; padding: 4px 12px; border-radius: 20px; color: var(--active); font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">PRO MODE / HIGH-BITRATE</div>
        <h2 style="margin: 0 0 20px 0;">🎬 ビデオライブ配信</h2>
        
        <input type="text" id="room-id" value="live2026" placeholder="合言葉 (ルームID)">
        <input type="text" id="user-name" placeholder="配信者名">
        <div style="text-align: left; font-size: 13px; color: #94a3b8; margin-left: 5px;">動画ファイル(MP4)を選択:</div>
        <input type="file" id="video-file" accept="video/mp4,video/webm">
        
        <button class="btn-start" id="startBtn" onclick="startBroadcast()">ライブ配信開始</button>
        <button class="btn-stop" id="stopBtn" onclick="stopBroadcast()" style="display:none;">配信終了</button>

        <div class="stats">
            <div>状態: <span id="status">待機中</span></div>
            <div>視聴者: <span id="viewer-count" class="badge">0</span></div>
        </div>
        
        <video id="myVideo" controls playsinline muted></video>
    </div>

    <script>
        let peer = null;
        let myStream = null;
        let conns = {};

        async function startBroadcast() {
            const room = document.getElementById('room-id').value;
            const file = document.getElementById('video-file').files[0];
            const videoEl = document.getElementById('myVideo');

            if (!room || !file) return alert("合言葉と動画を選択してください");

            // 1. 高画質ストリームのキャプチャ (60fps固定)
            videoEl.src = URL.createObjectURL(file);
            await videoEl.play();
            myStream = videoEl.captureStream ? videoEl.captureStream(60) : videoEl.mozCaptureStream(60);

            // 2. Peer接続 (高品質設定を注入)
            if (peer) peer.destroy();
            peer = new Peer(`${room}-host`, {
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', () => {
                document.getElementById('status').innerText = "🔴 配信中";
                document.getElementById('startBtn').style.display = "none";
                document.getElementById('stopBtn').style.display = "block";
            });

            peer.on('connection', conn => {
                // 帯域制限を最大化するためのSDP調整
                const call = peer.call(conn.peer, myStream, {
                    sdpTransform: (sdp) => {
                        // ビットレートを最大8Mbps、最小2Mbpsに強制
                        return sdp.replace(/a=fmtp:(\d+) (.*)/g, 'a=fmtp:$1 $2;x-google-min-bitrate=2000;x-google-max-bitrate=8000');
                    }
                });

                conns[conn.peer] = { conn, call };
                updateCount();

                conn.on('close', () => {
                    delete conns[conn.peer];
                    updateCount();
                });
            });

            peer.on('error', err => {
                if(err.type === 'unavailable-id') alert("その合言葉は使用中です");
                console.error(err);
            });
        }

        function updateCount() { document.getElementById('viewer-count').innerText = Object.keys(conns).length; }

        function stopBroadcast() {
            if (!confirm("配信を終了しますか？")) return;
            Object.values(conns).forEach(c => c.conn.close());
            location.reload();
        }
    </script>
</body>
</html>
