<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutti App Portal</title>
    <style id="custom-theme">
        :root { --accent: #0969da; --text: #1f2328; --card-bg: rgba(255, 255, 255, 0.9); }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 0; min-height: 100vh; background: #f6f8fa; color: var(--text); }
    </style>
    <style>
        header { background: rgba(36, 41, 46, 0.9); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-icon { width: 35px; height: 35px; border-radius: 50%; background: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
        #admin-panel { display: none; background: white; border-bottom: 3px solid var(--accent); padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .folder-section { background: rgba(255, 255, 255, 0.8); border-radius: 15px; padding: 20px; margin-bottom: 30px; border: 1px solid #ddd; }
        .folder-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--accent); border-bottom: 2px solid var(--accent); display: inline-block; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
        .app-card { background: white; border-radius: 15px; padding: 15px; text-align: center; text-decoration: none; color: inherit; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.2s; border: 1px solid #eee; }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .icon-box { width: 60px; height: 60px; border-radius: 12px; background: #f0f0f0; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .app-name { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; background: var(--accent); color: white; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;">GUTTI PORTAL</div>
    <div class="user-icon" onclick="checkPassword()">👤</div>
</header>

<div id="admin-panel">
    <div style="max-width: 900px; margin: 0 auto; display: flex; gap: 10px;">
        <input type="password" id="sys-token" placeholder="New Token" style="padding:8px; flex:1;">
        <button class="btn" style="background:#6f42c1;" onclick="updateSystemToken()">⚙️ 自身のトークン更新</button>
        <button class="btn" onclick="location.reload()">閉じる</button>
    </div>
</div>

<div class="container" id="main-container">
    <div id="status">読込中...</div>
</div>

<script>
    // ★新しいトークン
    let TOKEN = "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";
    const REPO_NAME = "gutti-web";
    const CONFIG_FILE = "portal_config.json";

    let config = { folders: ["未分類"], mapping: {}, password: "" };
    let username = "";
    let fetchedFiles = [];

    async function init() {
        const container = document.getElementById('main-container');
        try {
            const headers = { 'Authorization': `Bearer ${TOKEN}` };
            
            // ユーザー名の取得
            const userRes = await fetch('https://api.github.com/user', { headers });
            if (!userRes.ok) throw new Error("Auth Failed");
            username = (await userRes.json()).login;

            // 設定ファイルの取得（失敗しても続行）
            try {
                const configRes = await fetch(`https://api.github.com/repos/${username}/${REPO_NAME}/contents/${CONFIG_FILE}`, { headers });
                if (configRes.ok) {
                    const cData = await configRes.json();
                    config = JSON.parse(decodeURIComponent(escape(atob(cData.content))));
                }
            } catch (e) { console.log("Config not found, using default."); }

            // ファイルリストの取得
            const filesRes = await fetch(`https://api.github.com/repos/${username}/${REPO_NAME}/contents/`, { headers });
            const allFiles = await filesRes.json();
            fetchedFiles = allFiles.filter(f => f.name.endsWith('.html') && f.name !== 'index.html' && f.name !== 'ホームページ.html');

            render();
        } catch (e) {
            container.innerHTML = `<div style="color:red; text-align:center;">エラー: トークンが無効か、リポジトリが見つかりません。<br>${e.message}</div>`;
        }
    }

    function checkPassword() {
        const input = prompt("管理用パスワードを入力してください:");
        if (!config.password || input === config.password) {
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            alert("パスワードが違います");
        }
    }

    function render() {
        const container = document.getElementById('main-container');
        container.innerHTML = "";

        if (fetchedFiles.length === 0) {
            container.innerHTML = "公開されているアプリはありません。";
            return;
        }

        // フォルダごとの仕分け
        const sections = {};
        // 設定にあるフォルダを初期化
        (config.folders || ["未分類"]).forEach(f => sections[f] = []);

        fetchedFiles.forEach(f => {
            const folderName = config.mapping && config.mapping[f.name] ? config.mapping[f.name] : "未分類";
            if (!sections[folderName]) sections[folderName] = [];
            sections[folderName].push(f);
        });

        // 画面生成
        for (const folder in sections) {
            if (sections[folder].length === 0) continue;

            const sec = document.createElement('div');
            sec.className = 'folder-section';
            sec.innerHTML = `<div class="folder-title">📁 ${folder}</div><div class="gallery" id="gal-${folder}"></div>`;
            container.appendChild(sec);
            
            sections[folder].forEach(f => {
                const card = document.createElement('a');
                card.className = 'app-card';
                card.href = `https://${username}.github.io/${REPO_NAME}/${f.name}`;
                card.target = "_blank";
                card.innerHTML = `
                    <div class="icon-box">📄</div>
                    <div class="app-name">${f.name.replace('.html','')}</div>
                `;
                document.getElementById(`gal-${folder}`).appendChild(card);
            });
        }
    }

    async function updateSystemToken() {
        const newToken = document.getElementById('sys-token').value.trim();
        if(!newToken) return alert("トークンを入力してください");
        try {
            const apiUrl = `https://api.github.com/repos/${username}/${REPO_NAME}/contents/ホームページ.html`;
            const res = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${newToken}` } });
            const data = await res.json();
            let raw = decodeURIComponent(escape(atob(data.content)));
            const updated = raw.replace(/github_pat_[a-zA-Z0-9_]+/, newToken);
            await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${newToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Update Token", content: btoa(unescape(encodeURIComponent(updated))), sha: data.sha })
            });
            alert("成功しました！ページを更新します。");
            location.reload();
        } catch (e) { alert("失敗しました: " + e); }
    }

    init();
</script>
</body>
</html>
