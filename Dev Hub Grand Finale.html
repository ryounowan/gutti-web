<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Dev Hub Grand Finale v5.2</title>
<style id="p2p-blocker">html { display: none !important; }</style>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script>
(function() {
    // デバッグ表示用の要素を作成
    const debug = document.createElement('div');
    debug.style = 'position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,0.8);color:#0f0;padding:10px;font-size:10px;z-index:2147483647;border-radius:5px;font-family:monospace;pointer-events:none;';
    debug.innerHTML = 'P2P Status: Initializing...';
    document.documentElement.appendChild(debug);

    const log = (msg) => { debug.innerHTML = 'P2P Status: ' + msg; console.log('[P2P-Debug] ' + msg); };

    // Gun.jsの初期化
    const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
    const appState = gun.get('gutti-app-portal-universal-lock');

    const injectOverlay = () => {
        if (document.getElementById('p2p-lock-overlay')) return;
        const div = document.createElement('div');
        div.id = 'p2p-lock-overlay';
        div.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:white;z-index:2147483646;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:sans-serif;color:#333;';
        div.innerHTML = '<div style=\"font-size:70px;\">🚧</div><h1 id=\"p2p-t\"></h1><div id=\"p2p-b\" style=\"padding:4px 12px;border-radius:15px;font-size:12px;font-weight:bold;color:#fff;\"></div><p id=\"p2p-d\" style=\"color:#666;margin:20px;line-height:1.6;\"></p>';
        document.body.prepend(div);
    };

    log('Connecting to Relay...');

    appState.on((data) => {
        log('Data Received: ' + (data ? data.active : 'null'));
        
        if (document.body) injectOverlay();
        const overlay = document.getElementById('p2p-lock-overlay');
        const blocker = document.getElementById('p2p-blocker');

        if (data && data.active === true) {
            log('MODE: LOCKED');
            if(blocker) blocker.remove(); // 物理ブロックを解除して
            if(overlay) {
                overlay.style.display = 'flex'; // ロック画面を出す
                document.getElementById('p2p-t').innerText = data.title || "点検中";
                document.getElementById('p2p-d').innerText = data.detail || "";
                const b = document.getElementById('p2p-b');
                b.innerText = data.type === 'maintenance' ? '定期点検中' : 'システム障害';
                b.style.background = data.type === 'maintenance' ? '#007aff' : '#ff3b30';
            }
        } else {
            log('MODE: UNLOCKED');
            if(blocker) blocker.remove(); // 物理ブロックを解除
            if(overlay) overlay.style.display = 'none'; // ロック画面を隠す
        }
    });

    // 【保険】5秒経っても応答がない場合は強制的に表示する
    setTimeout(() => {
        const blocker = document.getElementById('p2p-blocker');
        if(blocker) {
            log('Timeout: Forcing show');
            blocker.remove();
        }
    }, 5000);
})();
</script>
    <style>
        :root { --accent: #00ff99; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --code-bg: #020617; }
        
        /* なじむスクロールバー */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; border: 1px solid #334155; padding: 25px; border-radius: 16px; background: var(--card); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); position: relative; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: block; }
        .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input { padding-left: 40px; border-radius: 20px; background: #020617; }
        .search-icon { position: absolute; left: 15px; top: 12px; color: #444; }

        .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
        select { flex: 1; background: #0f172a; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; font-weight: bold; }
        
        .mode-btn { background: #334155; color: #888; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.75rem; white-space: nowrap; }
        .mode-btn.active { background: var(--accent); color: #000; }
        
        .tab-bar { display: flex; gap: 10px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .tab-btn { background: none; color: #888; border: none; padding: 10px 0; cursor: pointer; flex: 1; font-weight: bold; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* モード切替用 */
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        .admin-mode .flex-admin { display: flex !important; }

        .section-title { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin: 15px 0 5px; text-transform: uppercase; }
        input, textarea { background: var(--code-bg); border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 0.9rem; }
        
        .log-item { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 12px; margin-bottom: 15px; transition: 0.3s; }
        .log-item:hover { border-color: var(--accent); }

        .code-container { position: relative; }
        .copy-btn { position: absolute; right: 10px; top: 10px; background: var(--accent); color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }
        pre { background: #000; padding: 15px; border-radius: 8px; color: #d1d5db; overflow: auto; font-family: 'Consolas', monospace; font-size: 0.85rem; max-height: 500px; white-space: pre-wrap; }
        .highlight { color: var(--accent); font-weight: bold; }

        .footer-backup { margin-top: 30px; padding-top: 20px; border-top: 1px dashed #334155; gap: 10px; }
    </style>
</head>
<body id="bodyTag" class="view-mode">

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><span class="stat-val" id="stat-projects">0</span><span class="stat-label">Total Projects</span></div>
        <div class="stat-card"><span class="stat-val" id="stat-logs">0</span><span class="stat-label">Total Logs</span></div>
        <div class="stat-card"><span class="stat-val" id="stat-days">0</span><span class="stat-label">Active Days</span></div>
    </div>

    <div class="header-controls">
        <select id="projectSelect" onchange="changeProject()"></select>
        <button class="mode-btn" id="btn-admin" onclick="tryAdmin()">ADMIN</button>
        <button class="mode-btn active" id="btn-view" onclick="setMode('view')">VIEW</button>
    </div>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchBar" placeholder="ログを瞬時に検索..." oninput="renderLogs()">
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="showTab('log', this)">LOG</button>
        <button class="tab-btn" onclick="showTab('info', this)">INFO</button>
        <button class="tab-btn" onclick="showTab('code', this)">CODE</button>
    </div>

    <div id="content-log" class="tab-content">
        <div class="admin-only">
            <div class="section-title">Update Log Entry</div>
            <input type="hidden" id="editingId">
            <div style="display:flex; gap:10px;">
                <input type="text" id="verNum" placeholder="v1.0.0" style="flex:1">
                <input type="datetime-local" id="updateDate" style="flex:1.5; color-scheme:dark;">
            </div>
            <input type="text" id="verTitle" placeholder="タイトル">
            <textarea id="verDesc" rows="2" placeholder="詳細..."></textarea>
            <input type="file" id="mediaFile" accept="image/*,video/*">
            <button onclick="handleSaveLog()" style="background:var(--accent); color:#000; border:none; width:100%; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold; margin-bottom:20px;">保存</button>
        </div>
        <div id="logList"></div>
    </div>

    <div id="content-info" class="tab-content" style="display:none;">
        <div id="view-info-display"></div>
        <div class="admin-only">
            <div class="section-title">App Metadata</div>
            <input type="text" id="infoDescription" placeholder="概要" oninput="autoSaveInfo()">
            <input type="text" id="infoTech" placeholder="技術" oninput="autoSaveInfo()">
            <input type="text" id="infoUrl" placeholder="URL" oninput="autoSaveInfo()">
            <textarea id="infoNotes" rows="10" placeholder="自由メモ..." oninput="autoSaveInfo()"></textarea>
        </div>
    </div>

    <div id="content-code" class="tab-content" style="display:none;">
        <div class="code-container">
            <button class="copy-btn" onclick="copyCode()">Copy</button>
            <pre id="view-code-display"></pre>
        </div>
        <div class="admin-only">
            <div class="section-title">Source Code Editor</div>
            <textarea id="appCode" rows="20" oninput="autoSaveInfo()" style="font-family:monospace;"></textarea>
        </div>
    </div>

    <div class="admin-only footer-backup flex-admin">
        <button class="mode-btn" onclick="addProject()" style="background:#444; color:white;">+ Project</button>
        <button class="mode-btn" onclick="exportData()">📤 Export JSON</button>
        <button class="mode-btn" onclick="document.getElementById('importFile').click()">📥 Import JSON</button>
        <button class="mode-btn" onclick="deleteCurrentProject()" style="background:#f87171; color:white; margin-left:auto;">Delete App</button>
        <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importData(event)">
    </div>
</div>

<script>
    const storageKey = 'dev_hub_v52';
    const PASSWORD = "1234";
    let data = JSON.parse(localStorage.getItem(storageKey) || '{"projects": {"New App": {"info":{}, "code":"", "logs":[]}}, "current": "New App"}');

    function tryAdmin() {
        if (prompt("Password:") === PASSWORD) setMode('admin');
        else alert("Denied");
    }

    function setMode(mode) {
        document.getElementById('bodyTag').className = mode + '-mode';
        document.getElementById('btn-admin').classList.toggle('active', mode === 'admin');
        document.getElementById('btn-view').classList.toggle('active', mode === 'view');
        renderLogs();
        renderViewData();
    }

    function renderLogs() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const list = document.getElementById('logList');
        const isAdmin = document.getElementById('bodyTag').classList.contains('admin-mode');
        const p = data.projects[data.current] || {logs:[]};
        
        const filtered = p.logs.filter(l => 
            (l.title||"").toLowerCase().includes(query) || (l.desc||"").toLowerCase().includes(query)
        );

        list.innerHTML = filtered.map(log => `
            <div class="log-item">
                <div style="font-size:0.7rem; color:var(--accent); font-weight:bold;">${log.date}</div>
                <div style="font-weight:bold;">${log.version}: ${log.title}</div>
                <div style="font-size:0.85rem; color:#aaa; white-space:pre-wrap;">${log.desc}</div>
                ${log.media ? `<div style="margin-top:10px;"><img src="${log.media.data}" style="max-width:100%; border-radius:8px;"></div>` : ''}
                ${isAdmin ? `<div style="margin-top:10px;"><span style="color:#38bdf8;cursor:pointer" onclick="editLog(${log.id})">Edit</span> | <span style="color:#f87171;cursor:pointer" onclick="deleteLog(${log.id})">Del</span></div>` : ''}
            </div>
        `).join('');
    }

    function renderViewData() {
        const p = data.projects[data.current];
        document.getElementById('view-info-display').innerHTML = `
            <h2 style="color:var(--accent); margin-top:0;">${data.current}</h2>
            <p><b>Description:</b> ${p.info.desc || '-'}</p>
            <p><b>Tech Stack:</b> ${p.info.tech || '-'}</p>
            <p><b>Link:</b> <a href="${p.info.url}" target="_blank" style="color:var(--accent)">${p.info.url || '-'}</a></p>
            <div style="background:rgba(255,255,255,0.03); padding:15px; border-radius:8px; white-space:pre-wrap;">${p.info.notes || ''}</div>
        `;
        const code = p.code || "// No code yet.";
        document.getElementById('view-code-display').innerHTML = code.replace(/[<>]/g, m => ({'<':'&lt;','>':'&gt;'}[m]))
            .replace(/(\bfunction\b|\bconst\b|\blet\b|\breturn\b|\bif\b)/g, '<span class="highlight">$1</span>');
    }

    function showTab(type, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('content-' + type).style.display = 'block';
        btn.classList.add('active');
    }

    async function handleSaveLog() {
        const id = document.getElementById('editingId').value;
        const file = document.getElementById('mediaFile').files[0];
        let media = id ? data.projects[data.current].logs.find(l => l.id == id).media : null;
        if(file) media = { type: file.type, data: await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(file); }) };
        
        const log = { id: id ? parseInt(id) : Date.now(), version: document.getElementById('verNum').value, title: document.getElementById('verTitle').value, desc: document.getElementById('verDesc').value, date: document.getElementById('updateDate').value.replace('T',' '), media };
        
        if(id) { const idx = data.projects[data.current].logs.findIndex(l => l.id == id); data.projects[data.current].logs[idx] = log; }
        else data.projects[data.current].logs.unshift(log);
        
        saveAndRefresh(); resetForm();
    }

    function exportData() {
        const b = new Blob([JSON.stringify(data)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'devhub_backup.json'; a.click();
    }

    function importData(e) {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader(); r.onload = (ev) => { data = JSON.parse(ev.target.result); saveAndRefresh(); alert("Imported!"); }; r.readAsText(f);
    }

    function updateStats() {
        document.getElementById('stat-projects').innerText = Object.keys(data.projects).length;
        let c = 0; Object.values(data.projects).forEach(p => c += p.logs.length);
        document.getElementById('stat-logs').innerText = c;
    }

    function saveAndRefresh() { localStorage.setItem(storageKey, JSON.stringify(data)); init(); }
    function autoSaveInfo() { if(!document.getElementById('bodyTag').classList.contains('admin-mode')) return; const p=data.projects[data.current]; p.info={desc:document.getElementById('infoDescription').value, tech:document.getElementById('infoTech').value, url:document.getElementById('infoUrl').value, notes:document.getElementById('infoNotes').value}; p.code=document.getElementById('appCode').value; localStorage.setItem(storageKey, JSON.stringify(data)); }
    function addProject() { const n = prompt("App Name:"); if(n) { data.projects[n] = {info:{}, logs:[], code:""}; data.current = n; saveAndRefresh(); } }
    function deleteCurrentProject() { if(confirm("Delete App?")) { delete data.projects[data.current]; data.current = Object.keys(data.projects)[0]; saveAndRefresh(); } }
    function copyCode() { navigator.clipboard.writeText(data.projects[data.current].code); alert("Copied!"); }
    function resetForm() { document.getElementById('editingId').value = ''; document.getElementById('verNum').value=''; document.getElementById('verTitle').value=''; document.getElementById('verDesc').value=''; document.getElementById('mediaFile').value=''; setDefaultDate(); }
    function setDefaultDate() { const n=new Date(); n.setMinutes(n.getMinutes()-n.getTimezoneOffset()); document.getElementById('updateDate').value=n.toISOString().slice(0,16); }
    function changeProject() { data.current = document.getElementById('projectSelect').value; saveAndRefresh(); }
    function editLog(id) { const l=data.projects[data.current].logs.find(x=>x.id==id); document.getElementById('editingId').value=l.id; document.getElementById('verNum').value=l.version; document.getElementById('verTitle').value=l.title; document.getElementById('verDesc').value=l.desc; window.scrollTo(0,0); }
    function deleteLog(id) { if(confirm("Delete?")) { data.projects[data.current].logs=data.projects[data.current].logs.filter(x=>x.id!=id); saveAndRefresh(); } }

    function init() {
        const s = document.getElementById('projectSelect'); s.innerHTML = Object.keys(data.projects).map(p => `<option value="${p}" ${p===data.current?'selected':''}>${p}</option>`).join('');
        const p = data.projects[data.current];
        document.getElementById('infoDescription').value = p.info.desc || '';
        document.getElementById('infoTech').value = p.info.tech || '';
        document.getElementById('infoUrl').value = p.info.url || '';
        document.getElementById('infoNotes').value = p.info.notes || '';
        document.getElementById('appCode').value = p.code || '';
        updateStats(); setDefaultDate(); renderLogs(); renderViewData();
    }
    init();
</script>
</body>
</html>
