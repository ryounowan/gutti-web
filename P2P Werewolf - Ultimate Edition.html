<!DOCTYPE html>
<!-- saved from url=(0088)https://ryounowan.github.io/gutti-web/%E4%BA%BA%E7%8B%BC%E3%82%B2%E3%83%BC%E3%83%A0.html -->
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>P2P Werewolf - Ultimate Edition</title>
    <script src="./P2P Werewolf - Ultimate Edition_files/peerjs.min.js.ダウンロード"></script>
    <style>
        :root { 
            --wolf: #e53935; --villager: #4caf50; --seer: #9c27b0; --knight: #2196f3; 
            --teruteru: #ffeb3b; --vampire: #607d8b; --mad: #ff9800; --twins: #f06292; --hunter: #795548; --dead: #444; 
        }
        body { font-family: sans-serif; max-width: 650px; margin: 20px auto; padding: 20px; background: #121212; color: #eee; }
        #user-display { position: fixed; top: 10px; left: 10px; font-size: 12px; color: #888; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; }
        #survivor-list { position: fixed; top: 10px; right: 10px; font-size: 11px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; border: 1px solid #444; width: 110px; }
        .survivor-dead { color: #666; text-decoration: line-through; }
        .survivor-alive { color: #4caf50; }

        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #333; }
        .hidden { display: none !important; }
        
        .config-box { background: #252525; padding: 12px; border-radius: 10px; margin: 10px 0; border: 1px solid #444; }
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
        .config-item { display: flex; align-items: center; justify-content: space-between; }
        .config-item input { width: 35px; padding: 4px; text-align: center; background: #444; border: none; color: white; border-radius: 4px; }

        input[type="text"] { width: calc(100% - 24px); padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background: #333; color: white; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; color: white; background: #1a73e8; margin-top: 10px; font-weight: bold; }
        .skip-btn { background: #555 !important; }
        
        .status-badge { display: inline-block; padding: 10px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 15px; cursor: pointer; border: 2px solid transparent; }
        .role-VILLAGER { background: var(--villager); }
        .role-WOLF { background: var(--wolf); }
        .role-SEER { background: var(--seer); }
        .role-KNIGHT { background: var(--knight); }
        .role-TERUTERU { background: var(--teruteru); color: #333; }
        .role-VAMPIRE { background: var(--vampire); border-color: #fff; }
        .role-MADMAN { background: var(--mad); }
        .role-TWINS { background: var(--twins); }
        .role-HUNTER { background: var(--hunter); }
        .is-dead { background: var(--dead) !important; color: #aaa !important; cursor: default; }

        #game-log { background: #000; padding: 12px; border-radius: 8px; font-size: 13px; height: 180px; overflow-y: auto; margin: 15px 0; border: 1px solid #333; color: #bbb; line-height: 1.5; }
        .action-item { background: #333; padding: 10px 15px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .action-btn { width: auto; margin: 0; padding: 6px 18px; font-size: 13px; background: #1a73e8; }
    </style>
</head>
<body>

<div id="user-display" class="hidden"></div>
<div id="survivor-list" class="hidden">
    <div style="font-weight:bold; margin-bottom:5px; border-bottom:1px solid #444; font-size: 10px;">生存状況</div>
    <div id="survivor-container"></div>
</div>

<div class="card">
    <h2 style="text-align:center; color: #fff; letter-spacing: 3px;">P2P 人狼: 極</h2>

    <div id="setup-screen">
        <input type="text" id="user-name" placeholder="名前">
        <input type="text" id="room-id" placeholder="合言葉">
        <button onclick="initConn()">ゲームに参加 / 部屋を作る</button>
    </div>

    <div id="lobby-screen" class="hidden">
        <div id="player-list-container" class="config-box"></div>
        <div id="host-controls" class="hidden">
            <div class="config-box">
                <div class="config-grid">
                    <div class="config-item">🐺 人狼 <input type="number" id="cfg-WOLF" value="1"></div>
                    <div class="config-item">🔮 占い師 <input type="number" id="cfg-SEER" value="1"></div>
                    <div class="config-item">🛡️ 騎士 <input type="number" id="cfg-KNIGHT" value="1"></div>
                    <div class="config-item">🤡 狂人 <input type="number" id="cfg-MADMAN" value="0"></div>
                    <div class="config-item">🎈 てるてる <input type="number" id="cfg-TERUTERU" value="0"></div>
                    <div class="config-item">👯 双子 <input type="number" id="cfg-TWINS" value="0"></div>
                    <div class="config-item">🔫 狩人 <input type="number" id="cfg-HUNTER" value="0"></div>
                    <div class="config-item">🧛 吸血鬼 <input type="number" id="cfg-VAMPIRE" value="0"></div>
                </div>
            </div>
            <button onclick="startGame()" style="background:#4caf50;">この人数で開始</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="phase-display" style="text-align:center; font-weight:bold; font-size:24px;"></div>
        <div id="my-info" style="text-align:center; margin-top:10px;">
            <div id="my-role-badge" class="status-badge" onclick="showRoleDetail()"></div>
        </div>
        <div id="game-log"></div>
        <div id="action-area">
            <p id="action-msg" style="font-size:14px; font-weight:bold; color:#81d4fa;"></p>
            <div id="action-list"></div>
            <button id="skip-action-btn" class="skip-btn hidden" onclick="sendAction(&#39;SKIP&#39;)">スキップ / 棄権する</button>
        </div>
        <button onclick="location.reload()" style="background:#444; font-size:12px; margin-top:25px;">タイトルへ</button>
    </div>
</div>

<script>
    let peer, connections = [], myName, isHost = false, myRole = "", isAlive = true;
    let players = [], phase = "LOBBY", actions = {};
    const PREFIX = "wolf-ultimate-v1-";

    const roleData = {
        VILLAGER: { name: "👨‍🌾 村人", team: "村人陣営", win: "人狼を全滅させる", ability: "能力はありませんが、議論の主役です。" },
        WOLF: { name: "🐺 人狼", team: "人狼陣営", win: "村人を人狼以下にする", ability: "夜に一人を襲撃できます。" },
        SEER: { name: "🔮 占い師", team: "村人陣営", win: "人狼を全滅させる", ability: "夜に一人占えます。吸血鬼を占うと殺せます。" },
        KNIGHT: { name: "🛡️ 騎士", team: "村人陣営", win: "人狼を全滅させる", ability: "夜に自分以外の一人を守れます。" },
        MADMAN: { name: "🤡 狂人", team: "人狼陣営", win: "人狼が勝利する", ability: "人間ですが人狼の味方。占われても人狼判定されません。" },
        TERUTERU: { name: "🎈 てるてる坊主", team: "第三陣営", win: "自分が追放される", ability: "追放されると単独勝利。襲撃されると敗北です。" },
        TWINS: { name: "👯 双子", team: "村人陣営", win: "人狼を全滅させる", ability: "二人一組。片方が死ぬともう片方も後を追って死にます。" },
        HUNTER: { name: "🔫 狩人", team: "村人陣営", win: "人狼を全滅させる", ability: "自分が死んだとき、誰か一人を道連れにできます。" },
        VAMPIRE: { name: "🧛 吸血鬼", team: "第三陣営", win: "最後まで生き残る", ability: "襲撃で死にませんが、占われると死にます。勝利を奪います。" }
    };

    function showRoleDetail() {
        if(!isAlive) return;
        const info = roleData[myRole];
        alert(`【役職】${info.name}\n【陣営】${info.team}\n【勝利】${info.win}\n【解説】${info.ability}`);
    }

    window.onload = () => { document.getElementById('user-name').value = localStorage.getItem('gutti_name') || ""; };

    function initConn() {
        myName = document.getElementById('user-name').value || "名無し";
        const room = document.getElementById('room-id').value;
        if(!room) return alert("合言葉必須");
        localStorage.setItem('gutti_name', myName);
        document.getElementById('user-display').innerText = `Logged in as: ${myName}`;
        document.getElementById('user-display').classList.remove('hidden');

        peer = new Peer(PREFIX + room);
        peer.on('open', () => {
            isHost = true;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('host-controls').classList.remove('hidden');
            syncLobby();
            peer.on('connection', c => {
                c.on('open', () => {
                    c.on('data', d => {
                        if(d.type==='JOIN'){ c.userName = d.name; connections.push(c); syncLobby(); }
                        if(d.type==='ACTION') handleAction(c.userName, d.target);
                    });
                });
            });
        });
        peer.on('error', e => { if(e.type === 'unavailable-id') joinGuest(PREFIX + room); });
    }

    function joinGuest(id) {
        peer = new Peer();
        peer.on('open', () => {
            const c = peer.connect(id);
            c.on('open', () => {
                c.send({type:'JOIN', name:myName});
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('lobby-screen').classList.remove('hidden');
                c.on('data', d => {
                    if(d.type === 'LOBBY_UPDATE') { players = d.playerNames; updateLobbyUI(); }
                    if(d.type === 'SYNC') { 
                        const oldAlive = isAlive;
                        players = d.players; 
                        const me = players.find(p=>p.name===myName);
                        myRole = me.role; isAlive = me.isAlive; 
                        if(oldAlive && !isAlive) log(`<span style="color:#ff5252;">【死亡】${d.deathReason}</span>`);
                        updateUI(d.phase, d.msg, d.result); 
                    }
                });
            });
        });
    }

    function syncLobby() {
        players = [myName, ...connections.map(c => c.userName)];
        updateLobbyUI();
        connections.forEach(c => c.send({type: 'LOBBY_UPDATE', playerNames: players}));
    }

    function updateLobbyUI() {
        const container = document.getElementById('player-list-container');
        container.innerHTML = "<b>待機中:</b><br>" + players.join(", ");
    }

    function updateSurvivorList() {
        document.getElementById('survivor-list').classList.remove('hidden');
        const container = document.getElementById('survivor-container');
        container.innerHTML = "";
        players.forEach(p => {
            const div = document.createElement('div');
            div.className = p.isAlive ? 'survivor-alive' : 'survivor-dead';
            div.innerText = `${p.isAlive ? '●' : '×'} ${p.name}`;
            container.appendChild(div);
        });
    }

    function startGame() {
        const names = [myName, ...connections.map(c=>c.userName)].sort(()=>Math.random()-0.5);
        let roles = [];
        ['WOLF','SEER','KNIGHT','MADMAN','TERUTERU','TWINS','HUNTER','VAMPIRE'].forEach(k => {
            let n = parseInt(document.getElementById('cfg-'+k).value || 0);
            if(k === 'TWINS' && n > 0) n = 2; // 双子は必ず二人
            for(let i=0; i<n; i++) roles.push(k);
        });
        while(roles.length < names.length) roles.push("VILLAGER");
        players = names.map((n, i) => ({ name: n, role: roles[i], isAlive: true }));
        phase = "NIGHT";
        broadcastSync("ゲーム開始。あなたの役職を確認してください。");
    }

    function broadcastSync(msg, result = null, deathMap = {}) {
        updateUI(phase, msg, result);
        connections.forEach(c => {
            c.send({ type: 'SYNC', players, phase, msg, result, deathReason: deathMap[c.userName] || "脱落しました" });
        });
    }

    function updateUI(newPhase, msg, result) {
        phase = newPhase;
        const me = players.find(p=>p.name===myName);
        myRole = me.role; isAlive = me.isAlive;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        updateSurvivorList();
        
        const pd = document.getElementById('phase-display');
        pd.innerText = (phase==="NIGHT" ? "🌙 夜" : (phase==="HUNTER_TIME" ? "🔫 狩人の道連れ" : "☀️ 昼"));
        pd.style.color = (phase==="NIGHT" ? "#90caf9" : "#ffb74d");

        const badge = document.getElementById('my-role-badge');
        badge.innerText = `役職: ${roleData[myRole]?.name}`;
        badge.className = `status-badge role-${myRole}` + (!isAlive ? " is-dead" : "");
        
        if(msg) log(msg);
        if(result && myRole === "SEER") log(`<span style="color:#ba68c8;">【占い結果】${result}</span>`);

        const area = document.getElementById('action-list');
        area.innerHTML = "";
        const skipBtn = document.getElementById('skip-action-btn');
        skipBtn.classList.add('hidden');

        if(phase === "HUNTER_TIME") {
            if(actions['HUNTER_NAME'] === myName) {
                log("道連れにする相手を選んでください。");
                players.forEach(p => { if(p.isAlive && p.name !== myName) area.innerHTML += btnHtml(p.name); });
            } else { log("狩人が道連れを選んでいます..."); }
            return;
        }

        if(!isAlive || phase.includes("WIN")) return;

        if(phase === "NIGHT") {
            const hasAction = (myRole === "WOLF" || myRole === "SEER" || myRole === "KNIGHT");
            if(hasAction) {
                skipBtn.classList.remove('hidden');
                players.forEach(p => { if(p.isAlive && p.name !== myName) area.innerHTML += btnHtml(p.name); });
            } else { log("静かな夜です。朝を待ちましょう。"); }
        } else {
            skipBtn.classList.remove('hidden');
            players.forEach(p => { if(p.isAlive && p.name !== myName) area.innerHTML += btnHtml(p.name); });
        }
    }

    function btnHtml(name) { return `<div class="action-item"><span>${name}</span><button class="action-btn" onclick="sendAction('${name}')">選択</button></div>`; }

    function log(m) { 
        const l = document.getElementById('game-log'); 
        const d = document.createElement('div');
        d.innerHTML = m;
        l.appendChild(d);
        l.scrollTop = l.scrollHeight; 
    }

    function sendAction(t) {
        if(isHost) handleAction(myName, t);
        else peer.connections[Object.keys(peer.connections)[0]][0].send({type:'ACTION', target:t});
        document.getElementById('action-list').innerHTML = "送信完了。待機中...";
        document.getElementById('skip-action-btn').classList.add('hidden');
    }

    function handleAction(voter, target) {
        actions[voter] = target;
        if(phase === "HUNTER_TIME") { processHunter(target); return; }
        
        const actors = (phase === "NIGHT") ? players.filter(p=>p.isAlive && (p.role==="WOLF"||p.role==="SEER"||p.role==="KNIGHT")) : players.filter(p=>p.isAlive);
        if(Object.keys(actions).length >= actors.length) phase === "NIGHT" ? processNight() : processDay();
    }

    function kill(name, reason, deathMap) {
        const p = players.find(x => x.name === name);
        if(!p || !p.isAlive) return false;
        p.isAlive = false;
        deathMap[name] = reason;
        // 双子の連座
        if(p.role === 'TWINS') {
            const other = players.find(x => x.role === 'TWINS' && x.isAlive);
            if(other) { other.isAlive = false; deathMap[other.name] = "双子の片割れが死んだため、後を追いました。"; }
        }
        return true;
    }

    function processNight() {
        const wolfT = actions[players.find(p=>p.role==="WOLF" && p.isAlive)?.name];
        const knightT = actions[players.find(p=>p.role==="KNIGHT" && p.isAlive)?.name];
        const seerT = actions[players.find(p=>p.role==="SEER" && p.isAlive)?.name];
        let dMsg = "犠牲者はいませんでした。", res = null, deathMap = {};
        
        if(seerT && seerT !== 'SKIP') {
            const t = players.find(p=>p.name===seerT);
            res = `${t.name}は${t.role==='WOLF'?'人狼':'人狼以外'}`;
            if(t.role === 'VAMPIRE') { kill(t.name, "占い師に占われ、呪い死にました", deathMap); dMsg = "不吉な影が消えました。"; }
        }
        if(wolfT && wolfT !== 'SKIP' && wolfT !== knightT) {
            if(kill(wolfT, "人狼に襲撃されました", deathMap)) dMsg = `${wolfT}さんが無残な姿で見つかりました。`;
        }
        
        checkHunter(dMsg, res, deathMap, "DAY");
    }

    function processDay() {
        const counts = {};
        Object.values(actions).forEach(v => { if(v!=='SKIP') counts[v] = (counts[v]||0)+1; });
        const max = Math.max(0, ...Object.values(counts));
        const voted = Object.keys(counts).find(k => counts[k] === max);
        let dMsg = "誰も追放されませんでした。", deathMap = {};

        if(voted && max > 0) {
            const t = players.find(p=>p.name === voted);
            if(t.role === 'TERUTERU') { phase = "WIN"; broadcastSync("てるてる坊主が追放されました！てるてる坊主の単独勝利です！"); return; }
            kill(voted, "村の会議で追放されました", deathMap);
            dMsg = `${voted}さんが追放されました。`;
        }
        checkHunter(dMsg, null, deathMap, "NIGHT");
    }

    function checkHunter(msg, res, deathMap, nextPhase) {
        const deadHunter = Object.keys(deathMap).find(name => players.find(p=>p.name===name).role === 'HUNTER');
        if(deadHunter) {
            phase = "HUNTER_TIME";
            actions = { 'HUNTER_NAME': deadHunter, 'PENDING_MSG': msg, 'PENDING_RES': res, 'PENDING_DEATH': deathMap, 'NEXT': nextPhase };
            broadcastSync(`${deadHunter}さんは狩人でした！道連れを選んでいます。`);
        } else {
            phase = nextPhase;
            actions = {};
            if(!checkEnd()) broadcastSync(msg, res, deathMap);
        }
    }

    function processHunter(target) {
        const data = actions;
        let dMap = data['PENDING_DEATH'];
        if(target !== 'SKIP') kill(target, "狩人の道連れにされました", dMap);
        phase = data['NEXT'];
        actions = {};
        if(!checkEnd()) broadcastSync(data['PENDING_MSG'] + (target!=='SKIP' ? ` さらに${target}さんも道連れになりました。` : ""), data['PENDING_RES'], dMap);
    }

    function checkEnd() {
        const alives = players.filter(p=>p.isAlive);
        const w = alives.filter(p=>p.role==="WOLF").length;
        const v = alives.filter(p=>p.role!=="WOLF" && p.role!=="VAMPIRE" && p.role!=="TERUTERU").length;
        const vamp = alives.filter(p=>p.role==="VAMPIRE").length;
        let winner = null;
        if(w === 0) winner = "村人陣営";
        else if(w >= v) winner = "人狼陣営";
        if(winner) {
            phase = "WIN";
            broadcastSync(vamp > 0 ? `生き残った吸血鬼の単独勝利です！` : `${winner}の勝利！`);
            return true;
        }
        return false;
    }
</script>

</body></html>
