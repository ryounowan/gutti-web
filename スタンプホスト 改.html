<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Event Control</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #020617; --panel: #1e293b; --accent: #3b82f6; --green: #10b981; --orange: #f59e0b; --red: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 10px; box-sizing: border-box; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .box { background: var(--panel); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .full { grid-column: 1 / -1; }
        h2 { margin: 0 0 15px 0; font-size: 1.2rem; color: var(--accent); border-bottom: 1px solid #334155; padding-bottom: 8px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0f172a; color: white; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
        .ctrl-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        .status-badge { text-align: center; font-size: 1.2rem; font-weight: bold; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        #chat-win { height: 150px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 10px; border: 1px solid #334155; }
        .item { background: rgba(0,0,0,0.2); padding: 10px; margin-bottom: 8px; border-radius: 8px; }
        .server-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .status-off { background: #475569; } .status-on { background: var(--green); box-shadow: 0 0 10px var(--green); }
    </style>
</head>
<body>

<h1 style="text-align:center; font-size: 1.5rem; margin: 10px 0 20px;">🏰 大会運営本部コンソール</h1>

<div class="container">
    <div class="box">
        <h2>📡 サーバー管理</h2>
        <div id="server-badge" class="server-status status-off">OFFLINE (停止中)</div>
        <input type="text" id="room" value="rally2026" placeholder="合言葉">
        <input type="password" id="staff-key" value="staff123" placeholder="スタッフ認証キー">
        <button id="toggle-btn" onclick="toggleServer()" class="ctrl-btn" style="background:var(--accent);">サーバーを公開する</button>
        <p style="margin: 10px 0 0;">接続中: <span id="p-count" style="color:var(--accent); font-weight:bold;">0</span> デバイス</p>
    </div>

    <div class="box">
        <h2>🎮 進行管理</h2>
        <div id="st-badge" class="status-badge" style="background:rgba(239, 68, 68, 0.2); color:var(--red);">⏹ 待機中</div>
        <div style="display:flex; gap:5px;">
            <button onclick="setStatus('playing')" class="ctrl-btn" style="background:var(--green);">開始</button>
            <button onclick="setStatus('paused')" class="ctrl-btn" style="background:var(--orange);">停止</button>
            <button onclick="setStatus('waiting')" class="ctrl-btn" style="background:var(--red);">リセット</button>
        </div>
        <input type="text" id="ann-text" placeholder="全体への通知...">
        <button onclick="sendAnn()" class="ctrl-btn" style="background:var(--accent);">通知送信</button>
    </div>

    <div class="box full" id="rescue-area" style="display:none; border: 2px solid var(--orange);">
        <h3>🚨 救済リクエスト承認</h3>
        <div id="req-list"></div>
    </div>

    <div class="box">
        <h2>📍 スタンプ地点</h2>
        <div id="edit-list" style="max-height: 200px; overflow-y: auto; margin-bottom:10px;"></div>
        <button onclick="addPoint()" style="background:#475569; color:white; border:none; padding:8px; width:100%; border-radius:5px;">+ 地点を追加</button>
        <textarea id="goal-msg" rows="2">おめでとう！受付へお越しください。</textarea>
        <button onclick="sync()" class="ctrl-btn" style="background:var(--green);">全同期</button>
    </div>

    <div class="box">
        <h2>💬 チャット & 順位</h2>
        <div id="chat-win"></div>
        <div style="display:flex; gap:5px; margin-bottom:15px;">
            <input type="text" id="h-msg" placeholder="指示を入力..." style="margin:0;">
            <button onclick="sendChat()" style="background:var(--accent); color:white; border:none; border-radius:5px; padding:0 10px;">送信</button>
        </div>
        <div id="rank-mini" style="font-size:0.85rem; color:#94a3b8;"></div>
    </div>
</div>

<script>
    let peer=null, conns=[], cfg={s:[], goalMsg:""}, scores={}, gameStatus='waiting', pendingReqs=[];

    function toggleServer() {
        const btn=document.getElementById('toggle-btn'), badge=document.getElementById('server-badge'), r=document.getElementById('room').value;
        if (!peer || peer.destroyed) {
            peer = new Peer(`${r}-host`);
            peer.on('open', () => {
                btn.innerText="サーバーを閉じる"; btn.style.background="var(--red)";
                badge.innerText="ONLINE (公開中)"; badge.className="server-status status-on";
            });
            peer.on('connection', setupConn);
            peer.on('error', () => { alert("合言葉が既に使われています"); stopServer(); });
        } else { if(confirm("終了しますか？")) stopServer(); }
    }

    function stopServer() {
        if(peer) { conns.forEach(c => { if(c.open) c.close(); }); peer.destroy(); }
        const btn=document.getElementById('toggle-btn'), badge=document.getElementById('server-badge');
        btn.innerText="サーバーを公開する"; btn.style.background="var(--accent)";
        badge.innerText="OFFLINE (停止中)"; badge.className="server-status status-off";
        conns=[]; updateCount();
    }

    function setupConn(conn) {
        conn.on('open', () => {
            conns.push(conn);
            conn.send({ type: 'GAME_STATUS', status: gameStatus });
            conn.send({ type: 'SYNC', cfg: cfg });
        });
        conn.on('data', d => {
            // プレイヤー登録
            if(d.type==='IAM_PLAYER'){ 
                conn.isPlayer=true; 
                conn.metadata={uname:d.uname}; 
                updateCount(); 
            }
            
            // スタッフ登録（認証成功時に既存スコアをすべて送る）
            if(d.type==='IAM_STAFF' && d.authKey===document.getElementById('staff-key').value){
                conn.isStaff=true; 
                // 現在保持している全プレイヤーのスコアをスタッフへ送信
                Object.entries(scores).forEach(([u,v]) => {
                    conn.send({ type:'REPORT', user:u, score:v.score, time:v.time });
                });
            }
            
            // スコア報告の受信と転送
            if(d.type==='REPORT'){
                scores[d.user]={score:d.score, time:d.time}; 
                updateRank();
                // 修正ポイント：接続中の全員（ランキング・スタッフ含む）に即時転送
                conns.forEach(c => { if(c.open) c.send(d); });
            }
            
            // チャット
            if(d.type==='STAFF_CHAT'){ 
                logChat(d.u, d.m); 
                conns.forEach(c=>{if(c.open && c.isStaff && c!==conn) c.send(d);}); 
            }
            
            // 救済リクエスト
            if(d.type==='STAFF_RESCUE_REQ' && conn.isStaff){ 
                pendingReqs.push({user:d.targetUser, staff:conn}); 
                updateReqUI(); 
            }
        });
        conn.on('close', () => { conns=conns.filter(c=>c!==conn); updateCount(); });
    }

    function setStatus(s) {
        gameStatus=s; const b=document.getElementById('st-badge');
        b.innerText = s==='playing'?'▶ 進行中':s==='paused'?'⏸ 一時停止中':'⏹ 待機中';
        b.style.color = s==='playing'?'var(--green)':s==='paused'?'var(--orange)':'var(--red)';
        conns.forEach(c=>{if(c.open) c.send({type:'GAME_STATUS',status:s});});
        if(s==='waiting'){ 
            scores={}; 
            updateRank(); 
            conns.forEach(c=>{if(c.open)c.send({type:'FORCE_RESET'});});
        }
    }

    function sendAnn() { 
        const m=document.getElementById('ann-text').value; 
        conns.forEach(c=>{if(c.open && c.isPlayer) c.send({type:'ANNOUNCE',msg:m});}); 
        document.getElementById('ann-text').value=""; 
    }
    
    function addPoint() { 
        cfg.s.push({ n:'地点'+(cfg.s.length+1), c:Math.floor(1000+Math.random()*8999), d:'' }); 
        render(); 
    }
    
    function render() { 
        document.getElementById('edit-list').innerHTML = cfg.s.map((x,i)=>`<div class="item">名前:<input value="${x.n}" onchange="cfg.s[${i}].n=this.value" style="width:70px"> Key:<input value="${x.c}" onchange="cfg.s[${i}].c=this.value" style="width:50px"></div>`).join(''); 
    }
    
    function sync() { 
        cfg.goalMsg=document.getElementById('goal-msg').value; 
        conns.forEach(c=>{if(c.open)c.send({type:'SYNC',cfg:cfg});}); 
        alert("同期完了"); 
    }
    
    function updateReqUI() { 
        const a=document.getElementById('rescue-area'); 
        a.style.display=pendingReqs.length?'block':'none'; 
        document.getElementById('req-list').innerHTML=pendingReqs.map((r,i)=>`<div style="display:flex; justify-content:space-between; margin:5px 0;"><span>${r.user}さんの救済</span><div><button onclick="approve(${i},true)" style="background:var(--green); color:white; border:none; border-radius:4px; padding:4px 8px;">OK</button><button onclick="approve(${i},false)" style="background:var(--red); color:white; border:none; border-radius:4px; padding:4px 8px; margin-left:5px;">NG</button></div></div>`).join(''); 
    }
    
    function approve(idx, ok) { 
        const r=pendingReqs[idx]; 
        if(ok){ 
            const pc=conns.find(c=>c.isPlayer && c.metadata.uname===r.user); 
            if(pc) pc.send({type:'FORCE_STAMP'}); 
        } 
        r.staff.send({type:'RESCUE_DONE',user:r.user,status:ok?'approved':'denied'}); 
        pendingReqs.splice(idx,1); 
        updateReqUI(); 
    }
    
    function sendChat() { 
        const i=document.getElementById('h-msg'); 
        if(!i.value)return; 
        const d={type:'STAFF_CHAT',u:'本部(GM)',m:i.value,id:Math.random()}; 
        logChat("自分",i.value); 
        conns.forEach(c=>{if(c.open&&c.isStaff)c.send(d);}); 
        i.value=""; 
    }
    
    function logChat(u,m) { 
        const w=document.getElementById('chat-win'); 
        w.innerHTML+=`<div><b>${u}:</b> ${m}</div>`; 
        w.scrollTop=w.scrollHeight; 
    }
    
    function updateRank() { 
        const sorted=Object.entries(scores).sort((a,b)=>b[1].score-a[1].score || a[1].time-b[1].time).slice(0,5); 
        document.getElementById('rank-mini').innerHTML=sorted.map(([n,v])=>`<div>${n}: ${v.score}個</div>`).join(''); 
    }
    
    function updateCount() { 
        document.getElementById('p-count').innerText=conns.length; 
    }
</script>
</body>
</html>
