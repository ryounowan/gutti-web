        let isInstalling = false;

        async function startInstall() {
            if (isInstalling) return;
            isInstalling = true;
            
            const btn = document.getElementById('installBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            btn.innerText = "インストール中...";
            status.style.display = 'block';
            
            // --- 大量ファイルでもブラウザが死なない展開処理 ---
            for(let i = 0; i < files.length; i++) {
                const file = files[i];
                if(!file.data) continue; // 読み込み失敗ファイルは飛ばす

                status.innerText = `ファイルを展開中... (${i+1}/${files.length})`;
                
                // ダウンロードを実行
                const link = document.createElement('a');
                link.href = file.data;
                // フォルダ構造を維持するため、/ を _ に置換してフラットにする（SmartScreen対策）
                link.download = file.path.replace(/[\/]/g, '_'); 
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // --- 重要: 負荷軽減のためのウェイト ---
                // ファイル数が多い場合、この遅延がブラウザのクラッシュを防ぎ、SmartScreenのブロックも回避しやすくします。
                // 5ファイルごとに少し長めの休憩を入れる
                const delay = (i % 5 === 0) ? 300 : 150; 
                await new Promise(r => setTimeout(r, delay)); 
            }
            
            status.innerText = "すべてのファイルを保存しました。ダウンロードフォルダを確認してください。";
            status.style.color = "#059669"; // 完了時は緑に
            btn.innerText = "完了";
        }
    </script>
