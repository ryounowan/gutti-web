<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Mesh TRX - GTA Style</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: manipulation; }
        .lcd-glow { text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        #voice-bar { transition: width 0.05s ease-out; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 font-mono flex flex-col items-center justify-center min-h-screen p-4 select-none">

    <div class="w-full max-w-sm bg-zinc-900 border-x-8 border-zinc-800 rounded-[3rem] p-8 shadow-2xl border-b-[12px] border-zinc-950 relative">
        <div class="absolute -top-8 left-12 w-6 h-12 bg-zinc-800 rounded-t-lg shadow-lg"></div>

        <div class="text-center mb-6">
            <h1 class="text-xs font-bold text-zinc-500 tracking-[0.3em] mb-2 uppercase">Tactical Radio System</h1>
            <div class="bg-zinc-950 border-2 border-zinc-800 p-4 rounded-lg shadow-inner">
                <div id="status-text" class="text-[9px] text-zinc-600 mb-1 uppercase font-bold tracking-widest leading-none h-3">OFF-LINE</div>
                <div id="ch-display" class="text-3xl font-black text-zinc-800 tracking-widest mb-1">CH: -----</div>
                <div id="mode-display" class="text-[10px] text-zinc-700 font-bold bg-black/40 py-1 rounded italic uppercase">Ready</div>
            </div>
        </div>

        <div class="mb-6 bg-zinc-800/50 p-4 rounded-xl border border-zinc-700">
            <div class="flex flex-col gap-3">
                <input type="number" id="ch-code" placeholder="CH NO." oninput="if(value.length>5)value=value.slice(0,5)"
                    class="w-full bg-zinc-900 border border-zinc-700 p-3 rounded text-2xl text-center text-green-400 focus:outline-none appearance-none">
                <button onclick="togglePower()" id="power-btn" class="bg-zinc-700 text-white font-black py-3 rounded uppercase text-sm">Power ON</button>
            </div>
        </div>

        <div class="mb-8 px-2">
            <div id="conn-info" class="text-[8px] text-zinc-600 mb-1 font-bold">LINK: 0 DEVICES</div>
            <div class="w-full h-3 bg-zinc-950 rounded-sm overflow-hidden border border-zinc-800 p-0.5">
                <div id="voice-bar" class="h-full bg-green-500 w-0 shadow-[0_0_10px_#22c55e]"></div>
            </div>
        </div>

        <div class="flex flex-col items-center">
            <button id="ptt-btn" class="w-44 h-44 rounded-full bg-zinc-800 border-[10px] border-zinc-950 shadow-2xl flex items-center justify-center text-3xl font-black transition-all active:scale-90 active:bg-orange-900 active:text-orange-200 disabled:opacity-10 touch-none" disabled>PUSH</button>
        </div>
    </div>

    <script>
        let peer, audioCtx, localStream, gainNode, masterBusDestination;
        let isPowerOn = false;
        let mySlot = -1;
        let currentCh = "";
        let connections = new Map();

        const log = (msg) => document.getElementById('status-text').innerText = msg;
        const setModeDisp = (msg, colorClass) => {
            const el = document.getElementById('mode-display');
            el.innerText = msg;
            el.className = `text-[10px] font-bold bg-black/40 py-1 rounded ${colorClass}`;
        };

        async function setupAudio() {
            if (audioCtx) return;
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
            });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const micIn = audioCtx.createMediaStreamSource(stream);
            
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0;
            
            // 相手に送るための最終的なバス（出力先）
            masterBusDestination = audioCtx.createMediaStreamDestination();
            
            // マイク入力をgainNode（PTT制御）を通してマスターバスへ
            micIn.connect(gainNode).connect(masterBusDestination);
            
            localStream = masterBusDestination.stream;
        }

        async function togglePower() {
            if (!isPowerOn) {
                const rawCh = document.getElementById('ch-code').value;
                if (!rawCh) return alert("番号を入力してください");
                currentCh = rawCh.padStart(5, '0');
                
                setModeDisp("BOOTING...", "text-amber-500");
                await setupAudio().catch(() => alert("マイクを許可してください"));
                
                for (let i = 0; i < 5; i++) {
                    const testId = `gta-trx-${currentCh}-${i}`;
                    const tempPeer = new Peer(testId);
                    const isAvailable = await new Promise(res => {
                        tempPeer.on('open', () => res(true));
                        tempPeer.on('error', () => res(false));
                        setTimeout(() => res(false), 800);
                    });
                    if (isAvailable) { peer = tempPeer; mySlot = i; break; }
                    else { tempPeer.destroy(); }
                }

                if (!peer) return setModeDisp("CH BUSY", "text-red-500");
                initRadio();
            } else { location.reload(); }
        }

        function initRadio() {
            isPowerOn = true;
            document.getElementById('power-btn').innerText = "Power OFF";
            document.getElementById('power-btn').classList.replace('bg-zinc-700', 'bg-red-900');
            document.getElementById('ch-display').innerText = `CH: ${currentCh}`;
            document.getElementById('ch-display').classList.add('text-green-500', 'lcd-glow');
            document.getElementById('ptt-btn').disabled = false;
            document.getElementById('ch-code').disabled = true;

            peer.on('call', call => {
                call.answer(localStream);
                handleCall(call);
            });

            setInterval(() => {
                if(!isPowerOn) return;
                for (let i = 0; i < mySlot; i++) {
                    const targetId = `gta-trx-${currentCh}-${i}`;
                    if (!connections.has(targetId)) {
                        const call = peer.call(targetId, localStream);
                        if (call) handleCall(call);
                    }
                }
                document.getElementById('conn-info').innerText = `LINK: ${connections.size} DEVICES`;
            }, 1500);

            setModeDisp(`SLOT-${mySlot} ACTIVE`, "text-green-400");
            log("LISTENING");
            playSE(800, false); // 起動音は自分だけに
        }

        function handleCall(call) {
            if (connections.has(call.peer)) return;
            connections.set(call.peer, call);

            call.on('stream', remoteStream => {
                const audio = new Audio();
                audio.srcObject = remoteStream;
                audio.play().catch(e => console.error("Auto-play blocked"));

                const remoteSource = audioCtx.createMediaStreamSource(remoteStream);
                remoteSource.connect(audioCtx.destination);
                
                const remoteAnalyser = audioCtx.createAnalyser();
                remoteAnalyser.fftSize = 64;
                const remoteData = new Uint8Array(remoteAnalyser.frequencyBinCount);
                remoteSource.connect(remoteAnalyser);

                const updateBar = () => {
                    if(!isPowerOn || !connections.has(call.peer)) return;
                    requestAnimationFrame(updateBar);
                    remoteAnalyser.getByteFrequencyData(remoteData);
                    const avg = remoteData.reduce((a, b) => a + b) / remoteData.length;
                    document.getElementById('voice-bar').style.width = avg > 15 ? Math.min(100, avg * 2.5) + '%' : '0%';
                };
                updateBar();
                log("NODE CONNECTED");
            });

            call.on('close', () => connections.delete(call.peer));
            call.on('error', () => connections.delete(call.peer));
        }

        // 相手にも聞こえるSE再生関数
        function playSE(freq, sendToNetwork = true) {
            if(!audioCtx || !isPowerOn) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            
            osc.connect(g);
            g.connect(audioCtx.destination); // 自分の耳に届ける
            
            // 相手に送るストリームにも接続
            if (sendToNetwork && masterBusDestination) {
                g.connect(masterBusDestination);
            }

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            // GTA風に音量を少しハッキリさせる (0.15)
            g.gain.setValueAtTime(0.15, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            
            osc.start(); 
            osc.stop(audioCtx.currentTime + 0.15);
        }

        const talk = (on) => {
            if (!gainNode || !isPowerOn) return;
            
            if (on) {
                // 送信音量を上げる前にビープを鳴らす（相手に届く）
                playSE(1200, true); 
                gainNode.gain.setTargetAtTime(1, audioCtx.currentTime, 0.03);
                log("TRANSMITTING");
            } else {
                // 送信を止めた直後にビープを鳴らす（相手に届く）
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
                setTimeout(() => playSE(700, true), 50);
                log("LISTENING");
            }
        };

        const ptt = document.getElementById('ptt-btn');
        ptt.addEventListener('touchstart', (e) => { e.preventDefault(); talk(true); });
        ptt.addEventListener('touchend', () => talk(false));
        ptt.addEventListener('mousedown', () => talk(true));
        ptt.addEventListener('mouseup', () => talk(false));
    </script>
</body>
</html>
