<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Web Editor</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --accent-color: #007acc;
            --text-color: #d4d4d4;
            --border-color: #444;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh; /* スマホのアドレスバーを考慮した高さ */
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* ツールバー：スマホでは折り返しを許可 */
        .toolbar {
            background-color: #333;
            padding: 8px;
            display: flex;
            gap: 6px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap; /* ボタンが多い時に改行 */
        }

        button {
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px; /* タップしやすいサイズ */
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            touch-action: manipulation; /* タップの反応を改善 */
        }

        button:active {
            background-color: var(--accent-color);
        }

        .file-info {
            font-size: 12px;
            color: #aaa;
            flex-basis: 100%; /* スマホではファイル名を一行占有させる */
            margin-top: 4px;
        }

        /* 検索パネル：スマホ向けにスリム化 */
        #searchPanel {
            background-color: var(--panel-bg);
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-row {
            display: flex;
            gap: 5px;
        }

        #searchPanel input {
            background-color: #3c3c3c;
            border: 1px solid #555;
            color: white;
            padding: 6px;
            border-radius: 4px;
            flex-grow: 1;
            font-size: 14px;
        }

        /* エディタ：フォントサイズ16pxでズーム防止 */
        #editor {
            flex-grow: 1;
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px; 
            line-height: 1.5;
            border: none;
            outline: none;
            resize: none;
        }

        /* ステータスバー */
        .status-bar {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }

        /* デスクトップ向けの調整 */
        @media (min-width: 600px) {
            .file-info { flex-basis: auto; margin-top: 0; margin-left: auto; }
            #searchPanel { flex-direction: row; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="newFile()">新規</button>
        <button onclick="openFile()">開く</button>
        <button onclick="saveFile()">保存</button>
        <button onclick="toggleSearch()">検索/置換</button>
        <div class="file-info" id="fileNameDisplay">新規ファイル</div>
    </div>

    <div id="searchPanel">
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="検索...">
            <button onclick="findNext()">次へ</button>
        </div>
        <div class="search-row">
            <input type="text" id="replaceInput" placeholder="置換...">
            <button onclick="replaceText()">置換</button>
            <button onclick="replaceAll()">全置換</button>
            <button onclick="toggleSearch()">閉じる</button>
        </div>
    </div>

    <textarea id="editor" spellcheck="false" placeholder="ここに入力..."></textarea>

    <div class="status-bar">
        <div id="cursorPos">行 1, 列 1</div>
        <div id="charCount">0 文字</div>
        <div id="fileTypeDisplay">text/plain</div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const cursorPosDisplay = document.getElementById('cursorPos');
        const charCount = document.getElementById('charCount');
        const searchPanel = document.getElementById('searchPanel');

        let fileHandle;

        // 状態更新
        function updateStatus() {
            charCount.textContent = `${editor.value.length} 文字`;
            const textBefore = editor.value.substring(0, editor.selectionStart);
            const lines = textBefore.split('\n');
            cursorPosDisplay.textContent = `行 ${lines.length}, 列 ${lines[lines.length - 1].length + 1}`;
        }

        editor.addEventListener('input', updateStatus);
        editor.addEventListener('keyup', updateStatus);
        editor.addEventListener('click', updateStatus);

        // 検索パネル切り替え
        function toggleSearch() {
            const isVisible = searchPanel.style.display === 'flex';
            searchPanel.style.display = isVisible ? 'none' : 'flex';
            if (!isVisible) document.getElementById('searchInput').focus();
        }

        // 検索・置換ロジック（前回のものをスマホ向けに維持）
        function findNext() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            const content = editor.value;
            let nextPos = content.indexOf(query, editor.selectionEnd);
            if (nextPos === -1) nextPos = content.indexOf(query, 0);
            
            if (nextPos !== -1) {
                editor.focus();
                editor.setSelectionRange(nextPos, nextPos + query.length);
                // スマホで選択範囲が見えるようにスクロール
                const lineHeight = parseFloat(getComputedStyle(editor).lineHeight);
                const lines = content.substring(0, nextPos).split('\n').length;
                editor.scrollTop = (lines - 2) * lineHeight;
            }
        }

        function replaceText() {
            const query = document.getElementById('searchInput').value;
            const replacement = document.getElementById('replaceInput').value;
            if (editor.value.substring(editor.selectionStart, editor.selectionEnd) === query) {
                editor.setRangeText(replacement, editor.selectionStart, editor.selectionEnd, 'select');
            }
            findNext();
        }

        function replaceAll() {
            const query = document.getElementById('searchInput').value;
            const replacement = document.getElementById('replaceInput').value;
            if (!query) return;
            editor.value = editor.value.split(query).join(replacement);
            updateStatus();
        }

        // ファイル操作（※スマホのブラウザによっては一部制限があります）
        async function openFile() {
            try {
                [fileHandle] = await window.showOpenFilePicker();
                const file = await fileHandle.getFile();
                editor.value = await file.text();
                fileNameDisplay.textContent = file.name;
                updateStatus();
            } catch (err) { console.error(err); }
        }

        async function saveFile() {
            if (!fileHandle) {
                try {
                    fileHandle = await window.showSaveFilePicker({ suggestedName: 'memo.txt' });
                } catch (err) { return; }
            }
            try {
                const writable = await fileHandle.createWritable();
                await writable.write(editor.value);
                await writable.close();
                fileNameDisplay.textContent = (await fileHandle.getFile()).name;
            } catch (err) { alert('保存に失敗しました。'); }
        }

        function newFile() {
            if (confirm('新規作成しますか？')) {
                editor.value = '';
                fileHandle = null;
                fileNameDisplay.textContent = '新規ファイル';
                updateStatus();
            }
        }
    </script>
</body>
</html>
