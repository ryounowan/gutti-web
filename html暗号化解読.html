<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Source Decryptor</title>
    <style>
        :root { --accent: #f43f5e; --bg: #0f172a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 600px; border: 1px solid #334155; }
        h2 { color: var(--accent); text-align: center; margin-top: 0; }
        .drop-zone { border: 2px dashed var(--accent); padding: 30px; border-radius: 12px; text-align: center; cursor: pointer; background: rgba(244, 63, 94, 0.05); margin-bottom: 20px; }
        textarea { width: 100%; height: 300px; background: #0f172a; color: #10b981; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-family: monospace; box-sizing: border-box; resize: none; margin-top: 10px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .copy-btn { background: var(--accent); color: white; }
        .copy-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="card">
    <h2>HTML ソース解読ツール</h2>
    <p style="font-size: 12px; color: #94a3b8; text-align: center;">暗号化されたHTMLを読み込んで元のコードを復元します</p>
    
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        暗号化済みファイルを選択
        <input type="file" id="fileInput" accept=".html" style="display:none">
    </div>

    <div id="status" style="text-align:center; font-size:13px; color:#10b981; min-height:1.2em;"></div>

    <textarea id="resultCode" placeholder="ここに解読されたコードが表示されます..." readonly></textarea>

    <div class="btn-group">
        <button class="copy-btn" onclick="copyCode()">コードをコピー</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const resultCode = document.getElementById('resultCode');
    const status = document.getElementById('status');

    fileInput.onchange = async () => {
        const file = fileInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
            const rawHtml = e.target.result;
            
            try {
                // HTMLの中から暗号化データ(json)を抽出
                const match = rawHtml.match(/const d = ({.*?});/s);
                if (!match) throw new Error("暗号化データが見つかりません");

                const data = JSON.parse(match[1]);
                
                // 復号処理
                const dec = new TextDecoder();
                const key = await window.crypto.subtle.importKey(
                    "raw", 
                    new Uint8Array(atob(data.key).split("").map(c=>c.charCodeAt(0))), 
                    "AES-GCM", 
                    false, 
                    ["decrypt"]
                );

                const pt = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: new Uint8Array(atob(data.iv).split("").map(c=>c.charCodeAt(0))) },
                    key, 
                    new Uint8Array(atob(data.ct).split("").map(c=>c.charCodeAt(0)))
                );

                resultCode.value = dec.decode(pt);
                status.innerText = "✔ 解読に成功しました！";
            } catch (err) {
                console.error(err);
                status.style.color = "#f43f5e";
                status.innerText = "✘ このファイルは解読できない形式です";
                resultCode.value = "";
            }
        };
        reader.readAsText(file);
    };

    function copyCode() {
        if (!resultCode.value) return;
        resultCode.select();
        document.execCommand('copy');
        alert("コードをクリップボードにコピーしました！");
    }
</script>

</body>
</html>
