<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P2P Media Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { 
            --accent: #5865f2; --bg: #313338; --card: #2b2d31; 
            --danger: #ed4245; --text: #dbdee1; --speaking: #23a559;
            --input-bg: #1e1f22;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            height: 100dvh; margin: 0; background: var(--bg); color: var(--text); 
            font-family: -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Setup */
        #setup { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .setup-card { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon-p { width: 90px; height: 90px; border-radius: 50%; background: #4e5058; margin: 0 auto 20px; border: 4px solid var(--accent); cursor: pointer; overflow: hidden; }
        .icon-p img { width: 100%; height: 100%; object-fit: cover; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: var(--input-bg); color: white; font-size: 16px; }

        /* Main Layout */
        header { padding: 15px 20px; background: var(--card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.2); }
        #member-list { display: flex; gap: 15px; padding: 10px 20px; background: #2b2d31; overflow-x: auto; min-height: 80px; align-items: center; }
        #member-list::-webkit-scrollbar { display: none; }
        .member-item { display: flex; flex-direction: column; align-items: center; min-width: 55px; }
        .u-icon { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; transition: 0.2s; object-fit: cover; }
        .speaking .u-icon { border-color: var(--speaking); }
        .muted .u-icon { opacity: 0.4; }
        .u-name { font-size: 10px; margin-top: 5px; color: #b5bac1; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; gap: 10px; max-width: 90%; }
        .msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg img.avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
        .msg-body { display: flex; flex-direction: column; gap: 4px; }
        .msg.me .msg-body { align-items: flex-end; }
        .msg-bubble { background: #383a40; padding: 10px 14px; border-radius: 4px 16px 16px 16px; font-size: 15px; line-height: 1.4; color: #dbdee1; word-break: break-all; }
        .msg.me .msg-bubble { background: var(--accent); color: white; border-radius: 16px 4px 16px 16px; }
        
        /* Media in Chat */
        .msg-media { max-width: 100%; border-radius: 12px; margin-top: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .msg-media:hover { opacity: 0.9; }

        /* Footer */
        .footer { padding: 12px; background: var(--card); display: flex; gap: 10px; align-items: center; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        .mic-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #4e5058; color: white; cursor: pointer; font-size: 18px; flex-shrink: 0; }
        .mic-btn.off { background: var(--danger); }
        .input-area { flex: 1; background: #383a40; border-radius: 22px; padding: 0 8px 0 12px; display: flex; align-items: center; }
        .input-area input { background: transparent; border: none; padding: 10px 0; margin: 0; }
        
        .media-btn { background: none; border: none; color: #b5bac1; font-size: 24px; cursor: pointer; padding: 0 8px; }
        .send-btn { background: var(--accent); color: white; border: none; border-radius: 18px; padding: 8px 15px; font-weight: bold; cursor: pointer; }

        .btn-join { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="setup">
    <div class="setup-card">
        <h2 style="margin-top:0">Media P2P Chat</h2>
        <div class="icon-p" onclick="document.getElementById('fInput').click()">
            <img id="pImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
        </div>
        <input type="file" id="fInput" accept="image/*" style="display:none" onchange="loadIcon(this)">
        <input type="text" id="user" placeholder="名前">
        <input type="text" id="room" placeholder="ルーム名">
        <button class="btn-join" onclick="join()">開始</button>
    </div>
</div>

<header>
    <div id="room-id" style="font-weight:bold;"># Loading...</div>
    <button onclick="location.reload()" style="background:none; border:none; color:var(--danger); font-weight:bold;">退出</button>
</header>
<div id="member-list"></div>
<div id="chat"></div>
<div class="footer">
    <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎙️</button>
    <div class="input-area">
        <button class="media-btn" onclick="document.getElementById('mFileInput').click()">＋</button>
        <input type="file" id="mFileInput" style="display:none" accept="image/*,video/*" onchange="sendMedia(this)">
        <input type="text" id="mInput" placeholder="メッセージ..." autocomplete="off">
        <button class="send-btn" onclick="sendText()">送信</button>
    </div>
</div>

<script>
    let peer, myName, roomCode, myFullId, localStream;
    let conns = {}, memberData = {}, myIcon = "";
    let isMicOn = true, isSpeaking = false;

    window.onload = () => {
        document.getElementById('user').value = localStorage.getItem('p2p_name') || "";
        myIcon = localStorage.getItem('p2p_icon') || document.getElementById('pImg').src;
        document.getElementById('pImg').src = myIcon;
        document.getElementById('mInput').onkeypress = (e) => { if(e.key==='Enter') sendText(); };
    };

    function loadIcon(input) {
        if (input.files?.[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                myIcon = e.target.result;
                document.getElementById('pImg').src = myIcon;
                localStorage.setItem('p2p_icon', myIcon);
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function join() {
        roomCode = document.getElementById('room').value.trim();
        myName = document.getElementById('user').value.trim() || "Guest";
        if (!roomCode) return;
        localStorage.setItem('p2p_name', myName);

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
            startVoiceDetection();
        } catch (e) { alert("マイクが必要です"); return; }

        myFullId = `${roomCode}_${Math.random().toString(36).substr(2, 7)}`;
        peer = new Peer(myFullId);

        peer.on('open', () => {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('room-id').innerText = `# ${roomCode}`;
            broadcastStatus();
            initHub();
        });

        peer.on('call', call => {
            call.answer(localStream);
            call.on('stream', s => playAudio(s, call.peer));
        });

        peer.on('connection', setupConn);
    }

    function initHub() {
        const hubId = `${roomCode}_HUB`;
        const hub = new Peer(hubId);
        hub.on('open', () => hub.on('connection', setupConn));
        hub.on('error', () => connectTo(hubId));
    }

    function setupConn(conn) {
        if (conns[conn.peer]) return;
        conns[conn.peer] = conn;
        conn.on('open', () => {
            broadcastStatus();
            conn.on('data', data => {
                if (data.type === 'status') {
                    memberData[conn.peer] = data;
                    renderMembers();
                } else if (data.type === 'chat') {
                    addMessage(data.u, data.m, memberData[conn.peer]?.icon, false, data.file);
                }
            });
        });
        conn.on('close', () => { delete conns[conn.peer]; delete memberData[conn.peer]; renderMembers(); });
    }

    function connectTo(id) {
        if (conns[id] || id === myFullId) return;
        setupConn(peer.connect(id));
        if (localStream) peer.call(id, localStream).on('stream', s => playAudio(s, id));
    }

    function playAudio(stream, id) {
        let audio = document.getElementById(`audio-${id}`) || document.createElement('audio');
        audio.id = `audio-${id}`; audio.srcObject = stream; audio.autoplay = true;
        document.body.appendChild(audio);
    }

    function startVoiceDetection() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(localStream);
        const ans = ctx.createAnalyser();
        ans.fftSize = 256; src.connect(ans);
        const buffer = new Uint8Array(ans.frequencyBinCount);
        setInterval(() => {
            ans.getByteFrequencyData(buffer);
            let avg = buffer.reduce((a, b) => a + b) / buffer.length;
            let speaking = avg > 30 && isMicOn;
            if (speaking !== isSpeaking) { isSpeaking = speaking; broadcastStatus(); }
        }, 100);
    }

    function toggleMic() {
        isMicOn = !isMicOn;
        localStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('micBtn').innerText = isMicOn ? "🎙️" : "🔇";
        document.getElementById('micBtn').classList.toggle('off', !isMicOn);
        broadcastStatus();
    }

    function broadcastStatus() {
        const s = { type: 'status', u: myName, icon: myIcon, speaking: isSpeaking, muted: !isMicOn };
        memberData[myFullId] = s;
        renderMembers();
        Object.values(conns).forEach(c => { if (c.open) c.send(s); });
    }

    function renderMembers() {
        const list = document.getElementById('member-list');
        list.innerHTML = Object.keys(memberData).map(id => {
            const m = memberData[id];
            return `<div class="member-item ${m.speaking?'speaking':''} ${m.muted?'muted':''}">
                <img src="${m.icon}" class="u-icon">
                <div class="u-name">${m.u}</div>
            </div>`;
        }).join('');
    }

    // テキスト送信
    function sendText() {
        const input = document.getElementById('mInput');
        if (!input.value.trim()) return;
        const data = { type: 'chat', u: myName, m: input.value };
        addMessage(myName, input.value, myIcon, true);
        Object.values(conns).forEach(c => { if (c.open) c.send(data); });
        input.value = "";
    }

    // 画像・動画送信
    function sendMedia(input) {
        if (!input.files?.[0]) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const fileData = {
                data: e.target.result,
                name: file.name,
                type: file.type
            };
            const data = { type: 'chat', u: myName, m: "", file: fileData };
            addMessage(myName, "", myIcon, true, fileData);
            Object.values(conns).forEach(c => { if (c.open) c.send(data); });
        };
        reader.readAsDataURL(file);
        input.value = ""; // Clear input
    }

    function addMessage(u, m, icon, isMe, file = null) {
        const chat = document.getElementById('chat');
        let content = m ? `<div class="msg-bubble">${m}</div>` : "";
        
        if (file) {
            if (file.type.startsWith('image/')) {
                content += `<img src="${file.data}" class="msg-media" onclick="window.open(this.src)">`;
            } else if (file.type.startsWith('video/')) {
                content += `<video src="${file.data}" class="msg-media" controls></video>`;
            }
        }

        const html = `
            <div class="msg ${isMe ? 'me' : ''}">
                <img src="${icon}" class="avatar">
                <div class="msg-body">
                    <b style="font-size:12px; color:#94a3b8;">${u}</b>
                    ${content}
                </div>
            </div>`;
        chat.insertAdjacentHTML('beforeend', html);
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
