<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Disposable Cam</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg: #000; --accent: #ffae00; --ui-bg: rgba(20, 20, 20, 0.8); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; }
        .screen { display: none; height: 100vh; flex-direction: column; box-sizing: border-box; }
        .active { display: flex; }

        /* Setup Screen */
        #screen-main { padding: 40px 20px; background: #1a1a1a; justify-content: center; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; }
        input { width: 80%; padding: 12px; border-radius: 10px; border: none; background: #444; color: #fff; margin: 10px 0; }
        .btn { background: var(--accent); color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; }

        /* Camera UI */
        #screen-player { justify-content: space-between; padding-bottom: 40px; }
        .cam-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--ui-bg); z-index: 10; }
        #v-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #111; position: relative; }
        #v-preview { width: 100%; height: 100%; object-fit: cover; transition: aspect-ratio 0.3s; }
        
        .cam-controls { background: var(--ui-bg); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .shutter-row { display: flex; align-items: center; justify-content: space-around; width: 100%; }
        .shutter { width: 80px; height: 80px; background: #fff; border: 6px solid #444; border-radius: 50%; outline: none; transition: 0.1s; }
        .shutter:active { transform: scale(0.9); background: #ccc; }
        .mini-thumb { width: 50px; height: 50px; border-radius: 10px; border: 2px solid #fff; background: #333; overflow: hidden; }
        .mini-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* Filter & Ratio Effects */
        .f-retro { filter: contrast(1.2) saturate(1.4) sepia(0.3); }
        .f-mono { filter: grayscale(1); }
        .f-sepia { filter: sepia(1); }

        /* Host Panel */
        #screen-host { overflow-y: auto; padding: 20px; background: #1a1a1a; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; }

        /* Modal / Viewer */
        #viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
        #viewer img { width: 100%; height: auto; flex-grow: 1; object-fit: contain; }
        .v-tools { padding: 20px; display: flex; justify-content: space-around; background: rgba(30,30,30,0.9); }
    </style>
</head>
<body>

<div id="screen-main" class="screen active">
    <div class="card">
        <h1 style="color:var(--accent); margin-top:0;">Gutti Cam Pro</h1>
        <input type="text" id="in-host-id" placeholder="ルームID（空欄で自動）">
        <button class="btn" onclick="startHost()">ホストを開始</button>
    </div>
    <div class="card">
        <input type="text" id="in-join-id" placeholder="参加IDを入力">
        <button class="btn" onclick="startPlayer(document.getElementById('in-join-id').value)" style="background:#666; color:#fff;">参加する</button>
    </div>
</div>

<div id="screen-host" class="screen">
    <h2>Host Control</h2>
    <div class="card" style="text-align:left;">
        <p>ID: <strong id="host-id-display">--</strong></p>
        <div id="qrcode"></div>
        <hr>
        <label>枚数: <input type="number" id="h-max" value="10" style="width:50px"></label><br>
        <label>比率: 
            <select id="h-ratio">
                <option value="1/1">1:1 (正方形)</option>
                <option value="3/4" selected>3:4 (標準)</option>
                <option value="9/16">9:16 (縦長)</option>
            </select>
        </label><br>
        <label><input type="checkbox" id="h-date" checked> 日付刻印</label>
        <button class="btn" onclick="pushSettings()" style="width:100%; margin-top:10px;">設定を全カメラに適用</button>
        <button class="btn" onclick="downloadAll()" style="width:100%; margin-top:10px; background:#fff;">全画像をZip保存</button>
    </div>
    <div id="host-gallery" class="grid"></div>
</div>

<div id="screen-player" class="screen">
    <div class="cam-header">
        <span id="p-status">● DISCONNECTED</span>
        <span style="font-weight:bold;">LIMIT: <span id="p-remain">--</span></span>
    </div>
    <div id="v-container">
        <video id="v-preview" autoplay playsinline muted></video>
    </div>
    <div class="cam-controls">
        <div style="display:flex; gap:10px; overflow-x:auto; width:100%; padding-bottom:5px;">
            <button onclick="setFilter('none')">Normal</button>
            <button onclick="setFilter('retro')">Retro</button>
            <button onclick="setFilter('mono')">Mono</button>
            <button onclick="setFilter('sepia')">Sepia</button>
        </div>
        <div class="shutter-row">
            <div class="mini-thumb" onclick="openAlbum()"><img id="last-img" src=""></div>
            <button class="shutter" onclick="capture()"></button>
            <div style="width:50px; text-align:center;" onclick="location.reload()">🔄</div>
        </div>
    </div>
</div>

<div id="viewer">
    <div style="padding:15px; text-align:right;" onclick="closeViewer()">✕ 閉じる</div>
    <img id="viewer-img" src="">
    <div class="v-tools">
        <button class="btn" id="dl-link" onclick="downloadSingle()">保存する</button>
    </div>
</div>

<script>
let peer, conn;
let myPhotos = [];
let state = { id:'', max:10, remain:10, ratio:'3/4', useDate:true };

// --- ホスト処理 ---
async function startHost() {
    const cid = document.getElementById('in-host-id').value.trim();
    peer = cid ? new Peer(cid) : new Peer();
    peer.on('open', id => {
        state.id = id;
        document.getElementById('host-id-display').innerText = id;
        showScreen('screen-host');
        new QRCode(document.getElementById('qrcode'), window.location.href.split('?')[0]+'?join='+id);
    });
    peer.on('connection', c => {
        conn = c;
        conn.on('data', data => {
            if(data.type === 'photo') {
                myPhotos.push(data.data);
                const img = document.createElement('img');
                img.src = data.data;
                img.onclick = () => openViewer(data.data);
                document.getElementById('host-gallery').prepend(img);
            }
        });
        setTimeout(pushSettings, 1000);
    });
}

function pushSettings() {
    state.max = document.getElementById('h-max').value;
    state.ratio = document.getElementById('h-ratio').value;
    state.useDate = document.getElementById('h-date').checked;
    if(conn && conn.open) conn.send({ type:'config', ...state });
}

async function downloadAll() {
    if(myPhotos.length === 0) return alert("画像がありません");
    const zip = new JSZip();
    myPhotos.forEach((data, i) => {
        zip.file(`photo_${i+1}.jpg`, data.split(',')[1], {base64: true});
    });
    const content = await zip.generateAsync({type:"blob"});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = `gutti_cam_${state.id}.zip`;
    link.click();
}

// --- カメラ処理 ---
function startPlayer(hid) {
    if(!hid) return;
    state.id = hid;
    showScreen('screen-player');
    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect(hid);
        conn.on('open', () => {
            document.getElementById('p-status').innerText = "● ONLINE";
            document.getElementById('p-status').style.color = "#4caf50";
        });
        conn.on('data', data => {
            if(data.type === 'config') {
                state.max = data.max;
                state.remain = data.max;
                document.getElementById('p-remain').innerText = state.remain;
                document.getElementById('v-preview').style.aspectRatio = data.ratio;
            }
        });
    });
    navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment', width:1280 } })
    .then(s => document.getElementById('v-preview').srcObject = s);
}

function setFilter(f) {
    document.getElementById('v-preview').className = f === 'none' ? '' : 'f-'+f;
}

function capture() {
    if(state.remain <= 0) return alert("フィルム切れ");
    const video = document.getElementById('v-preview');
    const canvas = document.createElement('canvas');
    // 比率に合わせて描画サイズを調整
    const [rw, rh] = document.getElementById('v-preview').style.aspectRatio.split('/').map(Number);
    canvas.width = 1080; 
    canvas.height = 1080 * (rh/rw);
    
    const ctx = canvas.getContext('2d');
    // フィルター反映
    const cf = video.className;
    if(cf === 'f-retro') ctx.filter = 'contrast(1.2) saturate(1.4) sepia(0.3)';
    if(cf === 'f-mono') ctx.filter = 'grayscale(1)';
    if(cf === 'f-sepia') ctx.filter = 'sepia(1)';
    
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    if(state.useDate) {
        const d = new Date();
        const dstr = `'${d.getFullYear().toString().slice(-2)} ${d.getMonth()+1} ${d.getDate()}`;
        ctx.filter = 'none';
        ctx.font = "bold 40px sans-serif";
        ctx.fillStyle = "rgba(255,140,0,0.9)";
        ctx.fillText(dstr, canvas.width - 250, canvas.height - 50);
    }

    const data = canvas.toDataURL('image/jpeg', 0.8);
    state.remain--;
    document.getElementById('p-remain').innerText = state.remain;
    document.getElementById('last-img').src = data;
    myPhotos.push(data);
    if(conn && conn.open) conn.send({ type:'photo', data: data });
    
    // フラッシュ演出
    const v = document.getElementById('v-container');
    v.style.background = "#fff";
    setTimeout(()=> v.style.background="#111", 50);
}

// --- ビューアー/共通 ---
function openViewer(src) {
    document.getElementById('viewer-img').src = src;
    document.getElementById('viewer').style.display = 'flex';
}
function closeViewer() { document.getElementById('viewer').style.display = 'none'; }
function openAlbum() {
    if(myPhotos.length === 0) return;
    openViewer(myPhotos[myPhotos.length-1]);
}
function downloadSingle() {
    const link = document.createElement('a');
    link.href = document.getElementById('viewer-img').src;
    link.download = `photo_${Date.now()}.jpg`;
    link.click();
}
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// URLパラメータ確認
const params = new URLSearchParams(window.location.search);
if(params.get('join')) startPlayer(params.get('join'));

</script>
</body>
</html>
