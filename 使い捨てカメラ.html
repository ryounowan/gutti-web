<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disposable Cam P2P - Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #ff9800; --text: #e0e0e0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        .screen { display: none; min-height: 100vh; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }
        
        /* UI Elements */
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        input, select { background: #333; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; margin: 5px 0; }
        .card { background: var(--panel); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        
        /* Camera */
        #v-container { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; border-radius: 10px; overflow: hidden; }
        #v-preview { width: 100%; height: 100%; object-fit: cover; }
        .filter-mono { filter: grayscale(1); }
        .filter-sepia { filter: sepia(1); }
        .filter-retro { filter: contrast(1.2) saturate(1.5) sepia(0.2); }
        
        .shutter { width: 70px; height: 70px; background: #fff; border: 5px solid #ff5722; border-radius: 50%; align-self: center; margin: 20px 0; }
        .shutter:active { transform: scale(0.9); background: #ff5722; }

        /* Gallery */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; border: 1px solid #444; }
        
        #qrcode { background: #fff; padding: 10px; display: inline-block; margin: 10px 0; border-radius: 10px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #666; margin-right: 5px; }
        .online { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
    </style>
</head>
<body>

<div id="screen-main" class="screen active">
    <h1 style="text-align:center; color:var(--accent);">Gutti Disposable Cam</h1>
    <div class="card">
        <h3>ホスト(管理側)</h3>
        <input type="text" id="input-host-id" placeholder="ルームID(空欄で自動生成)" style="width: 100%; box-sizing: border-box;">
        <button class="btn" id="btn-host" onclick="startHost()" style="width: 100%;">ルームを作成する</button>
    </div>
    <div class="card">
        <h3>参加(カメラ側)</h3>
        <input type="text" id="input-join-id" placeholder="ホストIDを入力" style="width: 100%; box-sizing: border-box;">
        <button class="btn" onclick="startPlayer(document.getElementById('input-join-id').value)" style="width: 100%; background: #555; color: #fff;">参加する</button>
    </div>
</div>

<div id="screen-host" class="screen">
    <h2>HOST PANEL</h2>
    <div class="card">
        <p>ROOM ID: <strong id="display-id" style="color:var(--accent);">---</strong></p>
        <div id="qrcode"></div>
        <div>
            枚数: <input type="number" id="set-max" value="5" style="width:50px"> 
            日付: <input type="checkbox" id="set-date" checked>
            <button class="btn" onclick="updateSettings()" style="padding: 5px 15px;">設定反映</button>
        </div>
    </div>
    <h3>集計アルバム (<span id="host-count">0</span>枚)</h3>
    <div id="host-gallery" class="grid"></div>
</div>

<div id="screen-player" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div><span id="dot" class="status-dot"></span><span id="p-status">接続中...</span></div>
        <div style="font-weight:bold;">REMAINING: <span id="p-remain" style="color:var(--accent);">--</span></div>
    </div>
    <div id="v-container">
        <video id="v-preview" autoplay playsinline muted></video>
    </div>
    <div style="display:flex; justify-content:space-around; align-items:center; margin-top:10px;">
        <select id="p-filter" onchange="changeFilter()">
            <option value="none">Normal</option>
            <option value="retro">Retro</option>
            <option value="mono">Mono</option>
            <option value="sepia">Sepia</option>
        </select>
        <div class="shutter" onclick="capturePhoto()"></div>
        <button class="btn" onclick="toggleAlbum()" style="background:#444; color:#fff; border-radius:10px;">Album</button>
    </div>
</div>

<div id="screen-album" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>YOUR PHOTOS</h2>
        <button class="btn" onclick="toggleAlbum()" style="background:#fff; color:#000;">戻る</button>
    </div>
    <div id="p-gallery" class="grid"></div>
</div>

<script>
let peer, conn;
let state = {
    role: null,
    id: '',
    max: 5,
    remain: 5,
    useDate: true,
    photos: []
};

// 起動時チェック
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const joinId = params.get('join');
    if (joinId) startPlayer(joinId);
    else loadState();
};

function saveState() { localStorage.setItem('cam_p2p_state', JSON.stringify(state)); }
function loadState() {
    const saved = localStorage.getItem('cam_p2p_state');
    if (saved) {
        state = JSON.parse(saved);
        if (state.role === 'player' && state.id) {
            if(confirm(`前回のルーム「${state.id}」に戻りますか？`)) startPlayer(state.id);
            else state = { role: null, id: '', max: 5, remain: 5, useDate: true, photos: [] };
        }
    }
}

// --- ホスト処理 ---
function startHost() {
    const customId = document.getElementById('input-host-id').value.trim();
    document.getElementById('btn-host').disabled = true;
    
    peer = customId ? new Peer(customId) : new Peer();
    
    peer.on('open', id => {
        state.role = 'host';
        state.id = id;
        showScreen('screen-host');
        document.getElementById('display-id').innerText = id;
        const url = window.location.href.split('?')[0] + '?join=' + id;
        document.getElementById('qrcode').innerHTML = '';
        new QRCode(document.getElementById('qrcode'), url);
    });

    peer.on('connection', c => {
        conn = c;
        conn.on('open', () => {
            updateSettings(false);
            alert("カメラが接続されました！");
        });
        conn.on('data', data => {
            if (data.type === 'photo') {
                addGallery('host-gallery', data.data);
                document.getElementById('host-count').innerText = ++state.photos.length;
            }
        });
    });

    peer.on('error', err => {
        alert("エラー: " + err.type);
        document.getElementById('btn-host').disabled = false;
    });
}

function updateSettings(shout = true) {
    state.max = parseInt(document.getElementById('set-max').value);
    state.useDate = document.getElementById('set-date').checked;
    if (conn && conn.open) {
        conn.send({ type: 'settings', max: state.max, useDate: state.useDate });
        if(shout) alert("設定を送信しました。");
    }
}

// --- カメラ処理 ---
function startPlayer(hostId) {
    if (!hostId) return alert("IDを入力してください。");
    state.id = hostId;
    state.role = 'player';
    showScreen('screen-player');
    renderLocalPhotos();

    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect(hostId);
        conn.on('open', () => {
            document.getElementById('dot').classList.add('online');
            document.getElementById('p-status').innerText = "ONLINE";
        });
        conn.on('data', data => {
            if (data.type === 'settings') {
                state.max = data.max;
                state.useDate = data.useDate;
                // 初回接続またはホスト側でのリセット時のみ枚数を更新
                if(state.remain > state.max || state.remain === 5) {
                    state.remain = state.max;
                }
                document.getElementById('p-remain').innerText = state.remain;
                saveState();
            }
        });
    });

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => { document.getElementById('v-preview').srcObject = stream; })
    .catch(() => alert("カメラを許可してください。"));
}

function changeFilter() {
    const f = document.getElementById('p-filter').value;
    document.getElementById('v-preview').className = f === 'none' ? '' : 'filter-' + f;
}

function capturePhoto() {
    if (state.remain <= 0) return alert("フィルム切れです！");
    if (!conn || !conn.open) return alert("ホストと未接続です。");

    const video = document.getElementById('v-preview');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');

    // フィルター反映
    const f = document.getElementById('p-filter').value;
    if(f === 'retro') ctx.filter = 'contrast(1.2) saturate(1.5) sepia(0.2)';
    if(f === 'mono') ctx.filter = 'grayscale(1)';
    if(f === 'sepia') ctx.filter = 'sepia(1)';

    ctx.drawImage(video, 0, 0);
    ctx.filter = 'none';

    // 日付スタンプ
    if (state.useDate) {
        const now = new Date();
        const dateStr = `'${now.getFullYear().toString().slice(-2)} ${now.getMonth()+1} ${now.getDate()}`;
        ctx.font = `${canvas.width/15}px monospace`;
        ctx.fillStyle = "rgba(255,100,0,0.8)";
        ctx.fillText(dateStr, canvas.width*0.7, canvas.height*0.95);
    }

    const data = canvas.toDataURL('image/jpeg', 0.7);
    state.photos.push(data);
    state.remain--;
    document.getElementById('p-remain').innerText = state.remain;
    
    conn.send({ type: 'photo', data: data });
    addGallery('p-gallery', data);
    saveState();

    // 撮影エフェクト
    document.body.style.background = "#fff";
    setTimeout(() => document.body.style.background = var(--bg), 50);
}

// --- 共通UI ---
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function addGallery(id, src) {
    const g = document.getElementById(id);
    const img = document.createElement('img');
    img.src = src;
    g.prepend(img);
}

function renderLocalPhotos() {
    const g = document.getElementById('p-gallery');
    g.innerHTML = '';
    state.photos.forEach(p => addGallery('p-gallery', p));
}

function toggleAlbum() {
    const s = document.getElementById('screen-album');
    s.classList.toggle('active');
}
</script>
</body>
</html>
