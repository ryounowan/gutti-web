<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Camera</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; height: 100dvh; }

        /* 画面共通 */
        .screen { display: none; height: 100dvh; width: 100vw; flex-direction: column; position: fixed; inset: 0; z-index: 10; }
        .screen.active { display: flex !important; }

        /* --- iPhone風カメラUI --- */
        #v-container { position: absolute; top: 15%; height: 65%; width: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; z-index: 5; }
        #v-preview { width: 100%; height: 100%; object-fit: cover; }
        
        /* 上部ツールバー */
        .cam-top { position: absolute; top: 0; width: 100%; height: 15%; display: flex; justify-content: space-around; align-items: center; background: #000; z-index: 50; padding-top: env(safe-area-inset-top); }
        .icon-btn { font-size: 20px; color: #fff; }

        /* 下部操作領域 */
        .cam-bottom { position: absolute; bottom: 0; width: 100%; height: 20%; background: #000; z-index: 50; display: flex; flex-direction: column; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        
        /* モードセレクター */
        .mode-slider { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; font-weight: 600; letter-spacing: 1px; color: #fff; }
        .mode-item { transition: color 0.3s; }
        .mode-item.active { color: var(--accent); }

        /* シャッターエリア */
        .shutter-row { width: 100%; display: flex; justify-content: space-around; align-items: center; margin-top: 15px; }
        .shutter-outer { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; }
        .shutter-inner { width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: all 0.2s; }
        .shutter-inner.video-mode { background: #ff3b30; }
        .shutter-inner.is-recording { border-radius: 10px; transform: scale(0.6); }

        .thumb-box { width: 45px; height: 45px; border-radius: 8px; overflow: hidden; background: #222; }
        .flip-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 24px; }

        /* フィルターオーバーレイ */
        .f-retro { filter: contrast(1.1) sepia(0.3); }
        .f-mono { filter: grayscale(1); }
        .f-vivid { filter: saturate(1.8); }

        /* --- アルバム（Swiper） --- */
        #album-view { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
        .swiper { width: 100%; height: 100%; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .swiper-slide img, .swiper-slide video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .album-top { position: absolute; top: 0; width: 100%; padding: 40px 20px 20px; display: flex; justify-content: space-between; z-index: 1100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }

        /* --- ホスト管理 --- */
        #screen-host { background: #1a1a1a; overflow-y: auto; padding: 20px; z-index: 150; }
        .admin-card { background: #2a2a2a; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="screen-main" class="screen active">
    <div style="margin: auto; width: 85%; text-align: center;">
        <h1 style="font-weight: 200; letter-spacing: 5px;">CAMERA</h1>
        <div class="admin-card">
            <input type="text" id="in-host-id" placeholder="ID (Optional)" style="width:100%; padding:15px; border-radius:10px; border:none; background:#444; color:#fff; margin-bottom:10px;">
            <button onclick="startHost()" style="width:100%; padding:15px; border-radius:30px; border:none; background:#fff; color:#000; font-weight:bold;">Host Connection</button>
        </div>
        <div class="admin-card">
            <input type="text" id="in-join-id" placeholder="ID to Join" style="width:100%; padding:15px; border-radius:10px; border:none; background:#444; color:#fff; margin-bottom:10px;">
            <button onclick="startPlayer(document.getElementById('in-join-id').value)" style="width:100%; padding:15px; border-radius:30px; border:none; background:#333; color:#fff;">Join Camera</button>
        </div>
    </div>
</div>

<div id="screen-player" class="screen">
    <div class="cam-top">
        <span class="icon-btn">⚡️</span>
        <span id="p-status" style="font-size:12px; color:var(--accent);">● READY</span>
        <button id="admin-btn" style="display:none; background:none; border:1px solid #fff; color:#fff; border-radius:15px; font-size:10px; padding:2px 10px;" onclick="openHostPanel()">ADMIN</button>
        <span class="icon-btn" onclick="toggleFilters()">◎</span>
    </div>

    <div id="v-container">
        <video id="v-preview" autoplay playsinline muted></video>
        <div id="flash" style="position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition: opacity 0.1s;"></div>
    </div>

    <div class="cam-bottom">
        <div class="mode-slider">
            <span id="m-video" class="mode-item" onclick="setMode('video')">ビデオ</span>
            <span id="m-photo" class="mode-item active" onclick="setMode('photo')">写真</span>
            <span class="mode-item" style="opacity:0.3">ポートレート</span>
        </div>
        <div class="shutter-row">
            <div class="thumb-box" onclick="openAlbum()">
                <img id="last-img" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
            </div>
            <div class="shutter-outer" onclick="handleAction()">
                <div id="shutter-btn" class="shutter-inner"></div>
            </div>
            <div class="flip-btn" onclick="alert('背面に固定されています')">
                🔄
            </div>
        </div>
        <div style="font-size:10px; margin-top:10px; color:#888;">
            📷 <span id="p-rem-p">0</span> / 🎥 <span id="p-rem-v">0</span>
        </div>
    </div>
</div>

<div id="screen-host" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Admin Panel</h3>
        <button onclick="closeHostPanel()" style="background:#fff; border:none; border-radius:10px; padding:5px 15px;">Close</button>
    </div>
    <div class="admin-card" style="text-align:center;">
        <div id="qrcode" style="display:inline-block; padding:10px; background:#fff; border-radius:10px;"></div>
        <p style="font-size:12px; color:var(--accent); word-break:break-all;" id="host-url"></p>
        <div style="text-align:left; font-size:14px;">
            <div>Photo Limit: <input type="number" id="h-max" value="20" style="width:50px; background:#111; color:#fff; border:none;"></div>
            <div>Video Limit: <input type="number" id="h-vmax" value="5" style="width:50px; background:#111; color:#fff; border:none;"></div>
            <button onclick="pushSettings()" style="width:100%; margin-top:10px; padding:10px; background:var(--accent); border:none; border-radius:10px; font-weight:bold;">Apply to All</button>
        </div>
    </div>
    <div id="host-gallery" style="display:grid; grid-template-columns:repeat(3,1fr); gap:5px;"></div>
    <button onclick="downloadAll()" style="width:100%; padding:15px; background:#fff; border-radius:10px; border:none; margin-bottom:40px;">Download All as ZIP</button>
</div>

<div id="album-view">
    <div class="album-top">
        <span onclick="closeAlbum()">＜ 戻る</span>
        <span id="album-index">1 / 1</span>
        <span onclick="downloadCurrent()">保存</span>
    </div>
    <div class="swiper">
        <div class="swiper-wrapper" id="swiper-content">
            </div>
    </div>
</div>

<script>
let peer, conn, stream, recorder, chunks = [], myPhotos = [], state = { role:'', id:'', pRem:20, vRem:5, mode:'photo', isRec:false };
let swiperInstance = null;

// --- ユーティリティ ---
const showScreen = id => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
};

const goFull = () => {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
};

// --- カメラ起動 ---
async function initCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment', width:{ideal:1920} }, audio:true });
        document.getElementById('v-preview').srcObject = stream;
        goFull();
    } catch(e) { alert("Camera Error: " + e); }
}

// --- ホスト処理 ---
function startHost() {
    const id = document.getElementById('in-host-id').value.trim() || Math.random().toString(36).substring(2,7).toUpperCase();
    peer = new Peer(id);
    peer.on('open', resId => {
        state.id = resId; state.role = 'host';
        document.getElementById('host-id-display')?.remove();
        document.getElementById('admin-btn').style.display = 'block';
        const url = window.location.origin + window.location.pathname + '?j=' + resId;
        document.getElementById('host-url').innerText = url;
        new QRCode(document.getElementById('qrcode'), { text: url, width: 160, height: 160 });
        initCamera(); showScreen('screen-player');
    });
    peer.on('connection', c => {
        conn = c;
        conn.on('data', data => { if(data.type==='file') { myPhotos.push(data); updateThumb(data); addHostGallery(data); } });
        setTimeout(pushSettings, 1000);
    });
}

function pushSettings() {
    const pMax = document.getElementById('h-max').value;
    const vMax = document.getElementById('h-vmax').value;
    state.pRem = pMax; state.vRem = vMax;
    document.getElementById('p-rem-p').innerText = pMax;
    document.getElementById('p-rem-v').innerText = vMax;
    if(conn && conn.open) conn.send({ type:'config', pMax, vMax });
}

// --- プレイヤー処理 ---
function startPlayer(hid) {
    if(!hid) return;
    state.role = 'player';
    initCamera(); showScreen('screen-player');
    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect(hid);
        conn.on('open', () => { document.getElementById('p-status').innerText = '● ONLINE'; document.getElementById('p-status').style.color = '#4caf50'; });
        conn.on('data', data => {
            if(data.type==='config') {
                state.pRem = data.pMax; state.vRem = data.vMax;
                document.getElementById('p-rem-p').innerText = data.pMax;
                document.getElementById('p-rem-v').innerText = data.vMax;
            }
        });
    });
}

// --- カメラ操作 ---
function setMode(m) {
    state.mode = m;
    document.getElementById('m-photo').classList.toggle('active', m==='photo');
    document.getElementById('m-video').classList.toggle('active', m==='video');
    document.getElementById('shutter-btn').classList.toggle('video-mode', m==='video');
}

function handleAction() {
    if(state.mode === 'photo') capturePhoto();
    else handleVideo();
}

function capturePhoto() {
    if(state.pRem <= 0) return alert("枚数制限です");
    const v = document.getElementById('v-preview');
    const canvas = document.createElement('canvas');
    canvas.width = v.videoWidth; canvas.height = v.videoHeight;
    const ctx = canvas.getContext('2d');
    
    // フィルター反映
    if(v.className === 'f-retro') ctx.filter = 'contrast(1.1) sepia(0.3)';
    if(v.className === 'f-mono') ctx.filter = 'grayscale(1)';
    if(v.className === 'f-vivid') ctx.filter = 'saturate(1.8)';
    
    ctx.drawImage(v, 0, 0);
    
    // 日付
    const d = new Date();
    const dstr = `'${d.getFullYear().toString().slice(-2)} ${d.getMonth()+1} ${d.getDate()}`;
    ctx.filter = 'none'; ctx.font = "bold 80px monospace"; ctx.fillStyle = "rgba(255,140,0,0.8)";
    ctx.fillText(dstr, canvas.width * 0.7, canvas.height * 0.95);
    
    const data = canvas.toDataURL('image/jpeg', 0.8);
    sendFile({ type:'img', data });
    state.pRem--; document.getElementById('p-rem-p').innerText = state.pRem;
    
    // フラッシュ演出
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => flash.style.opacity = '0', 100);
}

function handleVideo() {
    if(state.isRec) recorder.stop();
    else {
        if(state.vRem <= 0) return alert("録画回数制限です");
        chunks = []; recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const reader = new FileReader();
            reader.onload = () => { sendFile({ type:'vid', data: reader.result }); state.vRem--; document.getElementById('p-rem-v').innerText = state.vRem; };
            reader.readAsDataURL(blob);
            state.isRec = false; document.getElementById('shutter-btn').classList.remove('is-recording');
        };
        recorder.start(); state.isRec = true; document.getElementById('shutter-btn').classList.add('is-recording');
        setTimeout(() => { if(state.isRec) recorder.stop(); }, 180000); // 3分制限
    }
}

function sendFile(obj) {
    myPhotos.push(obj);
    updateThumb(obj);
    if(conn && conn.open) conn.send({ type:'file', ...obj });
}

function updateThumb(obj) {
    const img = document.getElementById('last-img');
    if(obj.type === 'img') {
        img.src = obj.data; img.style.display = 'block';
    } else {
        img.src = "https://cdn-icons-png.flaticon.com/512/1179/1179069.png"; // ビデオアイコン
        img.style.display = 'block';
    }
}

// --- アルバム Swiper ---
function openAlbum() {
    if(myPhotos.length === 0) return;
    const wrapper = document.getElementById('swiper-content');
    wrapper.innerHTML = '';
    
    myPhotos.forEach(item => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        if(item.type === 'img') {
            const img = document.createElement('img');
            img.src = item.data;
            slide.appendChild(img);
        } else {
            const vid = document.createElement('video');
            vid.src = item.data; vid.controls = true;
            slide.appendChild(vid);
        }
        wrapper.appendChild(slide);
    });

    document.getElementById('album-view').style.display = 'flex';
    
    if(swiperInstance) swiperInstance.destroy();
    swiperInstance = new Swiper('.swiper', {
        initialSlide: myPhotos.length - 1,
        spaceBetween: 10,
        on: {
            slideChange: function() {
                document.getElementById('album-index').innerText = `${this.activeIndex + 1} / ${myPhotos.length}`;
            }
        }
    });
    document.getElementById('album-index').innerText = `${myPhotos.length} / ${myPhotos.length}`;
}

function closeAlbum() { document.getElementById('album-view').style.display = 'none'; }

function downloadCurrent() {
    const idx = swiperInstance.activeIndex;
    const item = myPhotos[idx];
    const a = document.createElement('a');
    a.href = item.data;
    a.download = `camera_${Date.now()}.${item.type==='img'?'jpg':'webm'}`;
    a.click();
}

// --- フィルター切り替え ---
let fIdx = 0;
const filters = ['none', 'f-retro', 'f-vivid', 'f-mono'];
function toggleFilters() {
    fIdx = (fIdx + 1) % filters.length;
    document.getElementById('v-preview').className = filters[fIdx] === 'none' ? '' : filters[fIdx];
}

// --- その他 ---
function openHostPanel() { document.getElementById('screen-host').classList.add('active'); }
function closeHostPanel() { document.getElementById('screen-host').classList.remove('active'); }
function addHostGallery(f) {
    const gallery = document.getElementById('host-gallery');
    const el = document.createElement(f.type === 'img' ? 'img' : 'video');
    el.src = f.data; el.style.width='100%'; el.style.aspectRatio='1'; el.style.objectFit='cover';
    gallery.prepend(el);
}
async function downloadAll() {
    const zip = new JSZip();
    myPhotos.forEach((d, i) => zip.file(`${d.type}_${i+1}.${d.type==='img'?'jpg':'webm'}`, d.data.split(',')[1], {base64: true}));
    const c = await zip.generateAsync({type:"blob"});
    const l = document.createElement('a'); l.href = URL.createObjectURL(c); l.download = "cam_party.zip"; l.click();
}

const params = new URLSearchParams(window.location.search);
const j = params.get('j'); if(j) startPlayer(j);
</script>
</body>
</html>
