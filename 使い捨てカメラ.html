<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gutti Cam Eternal Final</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; height: 100dvh; }
        .screen { display: none; height: 100dvh; width: 100vw; flex-direction: column; position: fixed; inset: 0; z-index: 10; }
        .screen.active { display: flex !important; }

        /* Camera UI */
        #v-container { position: absolute; top: 12%; height: 68%; width: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; z-index: 5; }
        #v-preview { width: 100%; height: 100%; object-fit: cover; transition: all 0.3s ease; }
        .cam-top { position: absolute; top: 0; width: 100%; height: 12%; display: flex; justify-content: space-around; align-items: center; background: #000; z-index: 50; padding-top: env(safe-area-inset-top); }
        .cam-bottom { position: absolute; bottom: 0; width: 100%; height: 20%; background: #000; z-index: 50; display: flex; flex-direction: column; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .mode-slider { display: flex; gap: 20px; margin-top: 5px; font-size: 13px; font-weight: 600; color: #888; }
        .mode-slider span.active { color: var(--accent); }
        .shutter-row { width: 100%; display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
        .shutter-outer { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; }
        .shutter-inner { width: 58px; height: 58px; border-radius: 50%; background: #fff; transition: 0.2s; }
        .shutter-inner.video-mode { background: #ff3b30; }
        .shutter-inner.is-recording { border-radius: 8px; transform: scale(0.6); }
        .thumb-box { width: 45px; height: 45px; border-radius: 8px; overflow: hidden; background: #222; border: 1px solid #444; }
        .flip-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* Admin & Album */
        #screen-host { background: #111; overflow-y: auto; padding: 20px; z-index: 150; }
        .card { background: #222; border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        #album-view { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
        .album-top { position: absolute; top: 0; width: 100%; padding: 40px 20px 20px; display: flex; justify-content: space-between; z-index: 1100; background: rgba(0,0,0,0.5); }
        .swiper { width: 100%; height: 100%; }
        .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .swiper-slide img, .swiper-slide video { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body onclick="goFull()">

<div id="screen-main" class="screen active">
    <div style="margin: auto; width: 85%; text-align: center;">
        <h1 style="font-weight: 200; letter-spacing: 5px; color:var(--accent);">GUTTI CAM</h1>
        <div class="card">
            <input type="text" id="in-host-id" placeholder="ホスト名" style="width:100%; padding:15px; border-radius:10px; border:none; background:#333; color:#fff; margin-bottom:10px;">
            <button onclick="startHost()" style="width:100%; padding:15px; border-radius:30px; border:none; background:#fff; font-weight:bold;">ホストを開始</button>
        </div>
        <div class="card">
            <input type="text" id="in-join-id" placeholder="参加IDを入力" style="width:100%; padding:15px; border-radius:10px; border:none; background:#333; color:#fff; margin-bottom:10px;">
            <button onclick="startPlayer(document.getElementById('in-join-id').value)" style="width:100%; padding:15px; border-radius:30px; border:none; background:#444; color:#fff;">カメラに参加</button>
        </div>
    </div>
</div>

<div id="screen-player" class="screen">
    <div class="cam-top">
        <span style="font-size:20px;">⚡️</span>
        <span id="p-status" style="font-size:11px; color:#ff3b30;">● OFFLINE</span>
        <button id="admin-btn" style="display:none; background:none; border:1px solid #fff; color:#fff; border-radius:15px; font-size:10px; padding:3px 12px;" onclick="openHostPanel()">ADMIN</button>
        <span id="filter-icon" style="font-size:20px;" onclick="toggleFilter()">◎</span>
    </div>
    <div id="v-container">
        <video id="v-preview" autoplay playsinline muted></video>
        <div id="flash" style="position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:0.1s; z-index:10;"></div>
    </div>
    <div class="cam-bottom">
        <div class="mode-slider">
            <span id="m-video" onclick="setMode('video')">ビデオ</span>
            <span id="m-photo" class="active" onclick="setMode('photo')">写真</span>
            <span style="opacity:0.2">SQUARE</span>
        </div>
        <div class="shutter-row">
            <div class="thumb-box" onclick="openAlbum()">
                <img id="last-img" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
            </div>
            <div class="shutter-outer" onclick="handleAction()">
                <div id="shutter-btn" class="shutter-inner"></div>
            </div>
            <div class="flip-btn" onclick="toggleCamera()">🔄</div>
        </div>
        <div style="font-size:10px; margin-top:8px; color:#666;">
            📷 <span id="p-rem-p">0</span> / 🎥 <span id="p-rem-v">0</span>
        </div>
    </div>
</div>

<div id="screen-host" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Settings</h3>
        <button onclick="closeHostPanel()" style="padding:6px 15px; border-radius:10px; border:none; background:#fff;">Close</button>
    </div>
    <div class="card">
        <div id="qrcode" style="text-align:center; padding:10px; background:#fff; border-radius:10px; margin-bottom:10px; width:100%;"></div>
        <div style="font-size:14px; display:grid; grid-template-columns:1fr; gap:12px;">
            <div style="display:flex; justify-content:space-between;">比率: 
                <select id="h-ratio" onchange="pushSettings()" style="background:#111; color:#fff; border:1px solid #444; border-radius:5px;">
                    <option value="9/16">9:16 (Full)</option>
                    <option value="3/4">3:4 (Standard)</option>
                    <option value="1/1">1:1 (Square)</option>
                </select>
            </div>
            <div style="display:flex; justify-content:space-between;">写真上限: <input type="number" id="h-max" value="30" onchange="pushSettings()" style="width:50px; background:#111; color:#fff; border:1px solid #444;"></div>
            <div style="display:flex; justify-content:space-between;">動画上限: <input type="number" id="h-vmax" value="5" onchange="pushSettings()" style="width:50px; background:#111; color:#fff; border:1px solid #444;"></div>
            <div style="display:flex; justify-content:space-between;">日付表示: <input type="checkbox" id="h-date" checked onchange="pushSettings()"></div>
            <button onclick="clearAllData()" style="color:#ff3b30; background:none; border:none; font-size:12px; text-decoration:underline;">全データを消去</button>
        </div>
    </div>
    <div id="host-gallery" style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:15px;"></div>
    <button onclick="downloadAll()" style="width:100%; padding:15px; background:#fff; color:#000; border-radius:10px; border:none; font-weight:bold;">ZIPで一括保存</button>
</div>

<div id="album-view">
    <div class="album-top">
        <span onclick="closeAlbum()">＜ 戻る</span>
        <span id="album-index">0 / 0</span>
        <span onclick="downloadCurrent()">保存</span>
    </div>
    <div class="swiper"><div class="swiper-wrapper" id="swiper-content"></div></div>
</div>

<script>
// --- Database ---
const db = new Dexie("GuttiCamFinalDB");
db.version(1).stores({ files: "++id, fType, data", config: "key, value" });

let peer, conn, stream, recorder, chunks = [], myPhotos = [], state = { role:'', id:'', pRem:30, vRem:5, mode:'photo', isRec:false, hostId:'', facingMode:'environment', useDate:true, ratio:'9/16' };
let swiperInst = null;

async function saveState() {
    await db.config.put({ key: 'pRem', value: state.pRem });
    await db.config.put({ key: 'vRem', value: state.vRem });
}

async function loadState() {
    const pRem = await db.config.get('pRem');
    const vRem = await db.config.get('vRem');
    if (pRem) state.pRem = pRem.value;
    if (vRem) state.vRem = vRem.value;
    myPhotos = await db.files.toArray();
    if (myPhotos.length > 0) {
        updateThumb(myPhotos[myPhotos.length-1]);
        myPhotos.forEach(f => addHostThumb(f));
    }
    updateUI();
}

function goFull() {
    const doc = window.document.documentElement;
    if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
}

async function clearAllData() {
    if(!confirm("全ての写真と動画を削除しますか？")) return;
    await db.files.clear(); await db.config.clear(); location.reload();
}

// --- カメラ & 撮影 ---
async function initCam() {
    if(stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: state.facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }, 
        audio: true 
    });
    document.getElementById('v-preview').srcObject = stream;
}

function capture() {
    if(state.pRem <= 0) return alert("枚数上限です");
    const v = document.getElementById('v-preview');
    const canvas = document.createElement('canvas');
    const [rw, rh] = state.ratio.split('/').map(Number);
    const targetAspect = rw / rh;
    const videoAspect = v.videoWidth / v.videoHeight;
    
    let sw, sh, sx, sy;
    if (videoAspect > targetAspect) {
        sh = v.videoHeight; sw = sh * targetAspect;
        sx = (v.videoWidth - sw) / 2; sy = 0;
    } else {
        sw = v.videoWidth; sh = sw / targetAspect;
        sx = 0; sy = (v.videoHeight - sh) / 2;
    }

    canvas.width = 1080; canvas.height = 1080 / targetAspect;
    const ctx = canvas.getContext('2d');
    if(v.style.filter && v.style.filter !== "none") ctx.filter = v.style.filter;
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    
    if(state.useDate) {
        const d = new Date();
        ctx.filter = 'none'; ctx.font = "bold 45px monospace"; ctx.fillStyle = "rgba(255,140,0,0.8)";
        ctx.fillText(`'${d.getFullYear().toString().slice(-2)} ${d.getMonth()+1} ${d.getDate()}`, canvas.width*0.6, canvas.height*0.95);
    }
    
    const data = canvas.toDataURL('image/jpeg', 0.8);
    saveFile({ fType:'img', data });
    state.pRem--; saveState(); updateUI();
    const flash = document.getElementById('flash'); flash.style.opacity='1'; setTimeout(()=>flash.style.opacity='0',100);
}

function record() {
    if(state.isRec) recorder.stop();
    else {
        if(state.vRem <= 0) return alert("動画の上限です");
        chunks = []; 
        // フィルターを録画に乗せるための暫定処理（Stream取得）
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const reader = new FileReader();
            reader.onload = () => { saveFile({ fType:'vid', data: reader.result }); state.vRem--; saveState(); updateUI(); };
            reader.readAsDataURL(blob);
            state.isRec = false; document.getElementById('shutter-btn').classList.remove('is-recording');
        };
        recorder.start(); state.isRec = true; document.getElementById('shutter-btn').classList.add('is-recording');
    }
}

async function saveFile(file) {
    const id = await db.files.add(file);
    const saved = { id, ...file };
    myPhotos.push(saved);
    updateThumb(saved);
    addHostThumb(saved);
    if(conn && conn.open) conn.send({ type:'file', ...saved });
}

// --- 通信 ---
function startHost() {
    const id = document.getElementById('in-host-id').value.trim() || Math.random().toString(36).substring(2,7).toUpperCase();
    peer = new Peer(id);
    peer.on('open', resId => {
        state.role = 'host';
        const url = window.location.origin + window.location.pathname + '?j=' + resId;
        new QRCode(document.getElementById('qrcode'), { text: url, width: 140, height: 140 });
        document.getElementById('admin-btn').style.display = 'block';
        initCam(); showScreen('screen-player');
    });
    peer.on('connection', c => {
        conn = c; document.getElementById('conn-count').innerText = "1";
        setTimeout(() => pushSettings(), 1000);
        conn.on('data', data => { if(data.type==='file') { db.files.add({fType:data.fType, data:data.data}); myPhotos.push(data); addHostThumb(data); } });
    });
}

function startPlayer(hid) {
    state.role = 'player'; state.hostId = hid;
    initCam(); showScreen('screen-player');
    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect(hid);
        conn.on('open', () => { 
            document.getElementById('p-status').innerText = '● ONLINE'; 
            document.getElementById('p-status').style.color = '#4caf50'; 
        });
        conn.on('data', data => { 
            if(data.type==='config') { 
                state.pRem = data.pMax; state.vRem = data.vMax; state.useDate = data.useDate; state.ratio = data.ratio; 
                updateUI(); 
            } 
        });
    });
}

function pushSettings() {
    state.ratio = document.getElementById('h-ratio').value;
    state.pRem = document.getElementById('h-max').value;
    state.vRem = document.getElementById('h-vmax').value;
    state.useDate = document.getElementById('h-date').checked;
    updateUI();
    if(conn && conn.open) conn.send({ type:'config', pMax: state.pRem, vMax: state.vRem, useDate: state.useDate, ratio: state.ratio });
}

function updateUI() {
    document.getElementById('p-rem-p').innerText = state.pRem;
    document.getElementById('p-rem-v').innerText = state.vRem;
    const v = document.getElementById('v-preview');
    v.style.aspectRatio = state.ratio;
    v.style.objectFit = "cover";
}

// --- UI その他 ---
function handleAction() { if(state.mode==='photo') capture(); else record(); }

function toggleFilter() {
    const filters = ['', 'contrast(1.2) sepia(0.3)', 'saturate(2)', 'grayscale(1)', 'hue-rotate(90deg)'];
    let v = document.getElementById('v-preview');
    let current = v.style.filter || '';
    let idx = filters.indexOf(current);
    v.style.filter = filters[(idx + 1) % filters.length];
    document.getElementById('filter-icon').style.color = v.style.filter ? var(--accent) : '#fff';
}

function updateThumb(f) {
    const img = document.getElementById('last-img');
    img.src = f.fType==='img' ? f.data : "https://cdn-icons-png.flaticon.com/512/1179/1179069.png";
    img.style.display = 'block';
}

function addHostThumb(f) {
    const g = document.getElementById('host-gallery');
    const el = document.createElement(f.fType==='img' ? 'img' : 'video');
    el.src = f.data; el.style.width='100%'; el.style.aspectRatio='1'; el.style.objectFit='cover';
    el.onclick = () => openAlbum();
    g.prepend(el);
}

function openAlbum() {
    if(!myPhotos.length) return;
    const wrapper = document.getElementById('swiper-content'); wrapper.innerHTML = '';
    myPhotos.forEach(item => {
        const slide = document.createElement('div'); slide.className = 'swiper-slide';
        const el = document.createElement(item.fType==='img' ? 'img' : 'video');
        el.src = item.data; if(item.fType==='vid') el.controls = true;
        slide.appendChild(el); wrapper.appendChild(slide);
    });
    document.getElementById('album-view').style.display = 'flex';
    if(swiperInst) swiperInst.destroy();
    swiperInst = new Swiper('.swiper', { initialSlide: myPhotos.length-1, on:{ slideChange: function(){ document.getElementById('album-index').innerText = `${this.activeIndex+1} / ${myPhotos.length}`; } } });
    document.getElementById('album-index').innerText = `${myPhotos.length} / ${myPhotos.length}`;
}

async function downloadAll() {
    const zip = new JSZip();
    myPhotos.forEach((d, i) => zip.file(`${d.fType}_${i+1}.${d.fType==='img'?'jpg':'webm'}`, d.data.split(',')[1], {base64: true}));
    const c = await zip.generateAsync({type:"blob"});
    const l = document.createElement('a'); l.href = URL.createObjectURL(c); l.download = "cam_archive.zip"; l.click();
}

function toggleCamera() { state.facingMode = state.facingMode==='user'?'environment':'user'; initCam(); }
function setMode(m) { state.mode = m; document.getElementById('m-photo').className = m==='photo'?'active':''; document.getElementById('m-video').className = m==='video'?'active':''; document.getElementById('shutter-btn').className = 'shutter-inner '+(m==='video'?'video-mode':''); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function closeAlbum() { document.getElementById('album-view').style.display = 'none'; }
function openHostPanel() { document.getElementById('screen-host').classList.add('active'); }
function closeHostPanel() { document.getElementById('screen-host').classList.remove('active'); }
function downloadCurrent() { const item = myPhotos[swiperInst.activeIndex]; const a = document.createElement('a'); a.href = item.data; a.download = `file_${Date.now()}.${item.fType==='img'?'jpg':'webm'}`; a.click(); }

window.onload = loadState;
const params = new URLSearchParams(window.location.search);
if(params.get('j')) startPlayer(params.get('j'));
</script>
</body>
</html>
