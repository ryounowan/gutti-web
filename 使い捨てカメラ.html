<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Camera Pro Max</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        :root { --accent: #ffcc00; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; overflow: hidden; height: 100dvh; }

        .screen { display: none; height: 100dvh; width: 100vw; flex-direction: column; position: fixed; inset: 0; z-index: 10; }
        .screen.active { display: flex !important; }

        /* iPhone UI Layout */
        #v-container { position: absolute; top: 12%; height: 68%; width: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; z-index: 5; }
        #v-preview { width: 100%; height: 100%; object-fit: cover; }
        
        .cam-top { position: absolute; top: 0; width: 100%; height: 12%; display: flex; justify-content: space-around; align-items: center; background: #000; z-index: 50; padding-top: env(safe-area-inset-top); }
        .cam-bottom { position: absolute; bottom: 0; width: 100%; height: 20%; background: #000; z-index: 50; display: flex; flex-direction: column; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        
        .mode-slider { display: flex; gap: 20px; margin-top: 5px; font-size: 13px; font-weight: 600; color: #888; }
        .mode-item.active { color: var(--accent); }

        .shutter-row { width: 100%; display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
        .shutter-outer { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; }
        .shutter-inner { width: 58px; height: 58px; border-radius: 50%; background: #fff; transition: 0.2s; }
        .shutter-inner.video-mode { background: #ff3b30; }
        .shutter-inner.is-recording { border-radius: 8px; transform: scale(0.6); }

        .thumb-box { width: 45px; height: 45px; border-radius: 8px; overflow: hidden; background: #222; border: 1px solid #444; }
        .flip-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* Album */
        #album-view { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
        .album-top { position: absolute; top: 0; width: 100%; padding: 40px 20px 20px; display: flex; justify-content: space-between; z-index: 1100; background: rgba(0,0,0,0.5); }
        .swiper { width: 100%; height: 100%; }

        /* Admin */
        #screen-host { background: #111; overflow-y: auto; padding: 20px; z-index: 150; }
        .card { background: #222; border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="screen-main" class="screen active">
    <div style="margin: auto; width: 80%; text-align: center;">
        <h2 style="font-weight: 200; letter-spacing: 4px; color:var(--accent);">GUTTI CAM</h2>
        <div class="card">
            <input type="text" id="in-host-id" placeholder="ホストID(空欄で生成)" style="width:100%; padding:12px; border-radius:8px; border:none; background:#333; color:#fff; margin-bottom:10px;">
            <button onclick="startHost()" style="width:100%; padding:12px; border-radius:20px; border:none; background:#fff; font-weight:bold;">ホストを開始</button>
        </div>
        <div class="card">
            <input type="text" id="in-join-id" placeholder="参加IDを入力" style="width:100%; padding:12px; border-radius:8px; border:none; background:#333; color:#fff; margin-bottom:10px;">
            <button onclick="startPlayer(document.getElementById('in-join-id').value)" style="width:100%; padding:12px; border-radius:20px; border:none; background:#444; color:#fff;">カメラに参加</button>
        </div>
    </div>
</div>

<div id="screen-player" class="screen">
    <div class="cam-top">
        <span style="font-size:18px;">⚡️</span>
        <span id="p-status" style="font-size:11px; color:#ff3b30;">● OFFLINE</span>
        <button id="admin-btn" style="display:none; background:none; border:1px solid #fff; color:#fff; border-radius:10px; font-size:10px; padding:2px 8px;" onclick="openHostPanel()">ADMIN</button>
        <span style="font-size:18px;" onclick="toggleFilter()">◎</span>
    </div>
    <div id="v-container">
        <video id="v-preview" autoplay playsinline muted></video>
        <div id="flash" style="position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;"></div>
    </div>
    <div class="cam-bottom">
        <div class="mode-slider">
            <span id="m-video" onclick="setMode('video')">ビデオ</span>
            <span id="m-photo" class="active" onclick="setMode('photo')">写真</span>
            <span style="opacity:0.2">スクエア</span>
        </div>
        <div class="shutter-row">
            <div class="thumb-box" onclick="openAlbum()">
                <img id="last-img" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
            </div>
            <div class="shutter-outer" onclick="handleAction()">
                <div id="shutter-btn" class="shutter-inner"></div>
            </div>
            <div class="flip-btn">🔄</div>
        </div>
        <div style="font-size:10px; margin-top:8px; color:#666;">
            📷 <span id="p-rem-p">0</span> / 🎥 <span id="p-rem-v">0</span>
        </div>
    </div>
</div>

<div id="screen-host" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Admin Panel</h3>
        <button onclick="closeHostPanel()" style="padding:5px 15px; border-radius:10px; border:none;">閉じる</button>
    </div>
    <div class="card" style="text-align:center;">
        <div id="qrcode" style="display:inline-block; padding:10px; background:#fff; border-radius:10px; margin-bottom:10px;"></div>
        <div id="host-url" style="font-size:10px; color:var(--accent); word-break:break-all; margin-bottom:10px;"></div>
        <div style="text-align:left; font-size:13px; border-top:1px solid #333; padding-top:10px;">
            接続数: <b id="conn-count">0</b> | 写真上限: <input type="number" id="h-max" value="30" style="width:40px; background:none; color:#fff; border:1px solid #444;">
        </div>
        <button onclick="pushSettings()" style="width:100%; margin-top:10px; padding:10px; background:var(--accent); border:none; border-radius:10px; font-weight:bold;">設定を同期</button>
    </div>
    <div id="host-gallery" style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:20px;"></div>
    <button onclick="downloadAll()" style="width:100%; padding:15px; background:#fff; color:#000; border-radius:10px; border:none; font-weight:bold;">ZIPで一括保存</button>
</div>

<div id="album-view">
    <div class="album-top">
        <span onclick="closeAlbum()">＜ 戻る</span>
        <span id="album-index">0 / 0</span>
        <span onclick="downloadCurrent()">保存</span>
    </div>
    <div class="swiper"><div class="swiper-wrapper" id="swiper-content"></div></div>
</div>

<script>
let peer, conn, stream, recorder, chunks = [], myPhotos = [], sendQueue = [], state = { role:'', id:'', pRem:30, vRem:5, mode:'photo', isRec:false, hostId:'' };
let swiperInst = null;

// --- 通信強化: 確実にデータを送るための関数 ---
function reliableSend(data) {
    if (conn && conn.open) {
        conn.send(data);
    } else {
        console.log("Queueing data...");
        sendQueue.push(data); // 接続が切れていたらキューに溜める
        reconnect();
    }
}

function reconnect() {
    if (state.role === 'player' && state.hostId) {
        console.log("Attempting to reconnect...");
        conn = peer.connect(state.hostId);
        conn.on('open', () => {
            console.log("Reconnected! Sending queue...");
            while(sendQueue.length > 0) conn.send(sendQueue.shift());
            document.getElementById('p-status').innerText = '● ONLINE';
            document.getElementById('p-status').style.color = '#4caf50';
        });
    }
}

// --- カメラ起動 ---
async function startCam() {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment', width:{ideal:1920} }, audio:true });
    document.getElementById('v-preview').srcObject = stream;
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}

// --- ホスト ---
function startHost() {
    const id = document.getElementById('in-host-id').value.trim() || Math.random().toString(36).substring(2,7).toUpperCase();
    peer = new Peer(id);
    peer.on('open', resId => {
        state.id = resId; state.role = 'host';
        const url = window.location.origin + window.location.pathname + '?j=' + resId;
        document.getElementById('host-url').innerText = url;
        new QRCode(document.getElementById('qrcode'), { text: url, width: 150, height: 150 });
        document.getElementById('admin-btn').style.display = 'block';
        startCam(); showScreen('screen-player');
    });
    peer.on('connection', c => {
        conn = c;
        let count = parseInt(document.getElementById('conn-count').innerText);
        document.getElementById('conn-count').innerText = count + 1;
        conn.on('data', data => {
            if(data.type === 'file') { myPhotos.push(data); addHostGallery(data); }
        });
    });
}

function pushSettings() {
    state.pRem = document.getElementById('h-max').value;
    document.getElementById('p-rem-p').innerText = state.pRem;
    if(conn && conn.open) conn.send({ type:'config', pMax: state.pRem });
}

// --- プレイヤー ---
function startPlayer(hid) {
    if(!hid) return;
    state.role = 'player'; state.hostId = hid;
    startCam(); showScreen('screen-player');
    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect(hid);
        conn.on('open', () => {
            document.getElementById('p-status').innerText = '● ONLINE';
            document.getElementById('p-status').style.color = '#4caf50';
            // 溜まっていたデータを送信
            while(sendQueue.length > 0) conn.send(sendQueue.shift());
        });
        conn.on('data', data => {
            if(data.type==='config') {
                state.pRem = data.pMax; document.getElementById('p-rem-p').innerText = data.pMax;
            }
        });
        conn.on('close', () => {
            document.getElementById('p-status').innerText = '● RECONNECTING';
            document.getElementById('p-status').style.color = '#ffcc00';
            reconnect();
        });
    });
}

// --- 撮影処理 ---
function setMode(m) {
    state.mode = m;
    document.getElementById('m-photo').className = m==='photo'?'active':'';
    document.getElementById('m-video').className = m==='video'?'active':'';
    document.getElementById('shutter-btn').className = 'shutter-inner ' + (m==='video'?'video-mode':'');
}

function handleAction() {
    if(state.mode==='photo') capture();
    else record();
}

function capture() {
    if(state.pRem <= 0) return alert("上限です");
    const v = document.getElementById('v-preview');
    const canvas = document.createElement('canvas');
    canvas.width = v.videoWidth; canvas.height = v.videoHeight;
    const ctx = canvas.getContext('2d');
    if(v.className) ctx.filter = getComputedStyle(v).filter;
    ctx.drawImage(v, 0, 0);
    
    // 日付スタンプ
    const d = new Date();
    ctx.filter = 'none'; ctx.font = "bold 60px monospace"; ctx.fillStyle = "rgba(255,140,0,0.8)";
    ctx.fillText(`'${d.getFullYear().toString().slice(-2)} ${d.getMonth()+1} ${d.getDate()}`, canvas.width*0.7, canvas.height*0.95);
    
    const data = canvas.toDataURL('image/jpeg', 0.7);
    const fileObj = { type:'file', fType:'img', data };
    myPhotos.push(fileObj);
    reliableSend(fileObj);
    
    state.pRem--; document.getElementById('p-rem-p').innerText = state.pRem;
    document.getElementById('last-img').src = data; document.getElementById('last-img').style.display='block';
    const flash = document.getElementById('flash'); flash.style.opacity='1'; setTimeout(()=>flash.style.opacity='0',100);
}

function record() {
    if(state.isRec) recorder.stop();
    else {
        chunks = []; recorder = new MediaRecorder(stream);
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const reader = new FileReader();
            reader.onload = () => {
                const fileObj = { type:'file', fType:'vid', data: reader.result };
                myPhotos.push(fileObj);
                reliableSend(fileObj);
                state.vRem--; document.getElementById('p-rem-v').innerText = state.vRem;
            };
            reader.readAsDataURL(blob);
            state.isRec = false; document.getElementById('shutter-btn').classList.remove('is-recording');
        };
        recorder.start(); state.isRec = true; document.getElementById('shutter-btn').classList.add('is-recording');
        setTimeout(() => { if(state.isRec) recorder.stop(); }, 180000);
    }
}

// --- アルバム Swiper ---
function openAlbum() {
    if(!myPhotos.length) return;
    const wrapper = document.getElementById('swiper-content'); wrapper.innerHTML = '';
    myPhotos.forEach(item => {
        const slide = document.createElement('div'); slide.className = 'swiper-slide';
        const el = document.createElement(item.fType==='img'?'img':'video');
        el.src = item.data; if(item.fType==='vid') el.controls = true;
        slide.appendChild(el); wrapper.appendChild(slide);
    });
    document.getElementById('album-view').style.display = 'flex';
    if(swiperInst) swiperInst.destroy();
    swiperInst = new Swiper('.swiper', { initialSlide: myPhotos.length-1, on:{ slideChange: function(){ document.getElementById('album-index').innerText = `${this.activeIndex+1} / ${myPhotos.length}`; } } });
    document.getElementById('album-index').innerText = `${myPhotos.length} / ${myPhotos.length}`;
}

function closeAlbum() { document.getElementById('album-view').style.display = 'none'; }
function downloadCurrent() {
    const item = myPhotos[swiperInst.activeIndex];
    const a = document.createElement('a'); a.href = item.data; a.download = `cam_${Date.now()}.${item.fType==='img'?'jpg':'webm'}`; a.click();
}

// --- フィルター ---
let fIdx = 0;
const filters = ['', 'contrast(1.2) sepia(0.3)', 'saturate(1.8)', 'grayscale(1)'];
function toggleFilter() {
    fIdx = (fIdx + 1) % filters.length;
    document.getElementById('v-preview').style.filter = filters[fIdx];
}

function openHostPanel() { document.getElementById('screen-host').classList.add('active'); }
function closeHostPanel() { document.getElementById('screen-host').classList.remove('active'); }
function addHostGallery(f) {
    const g = document.getElementById('host-gallery');
    const el = document.createElement(f.fType==='img'?'img':'video');
    el.src = f.data; el.style.width='100%'; el.style.aspectRatio='1'; el.style.objectFit='cover';
    g.prepend(el);
}
async function downloadAll() {
    const zip = new JSZip();
    myPhotos.forEach((d, i) => zip.file(`${d.fType}_${i+1}.${d.fType==='img'?'jpg':'webm'}`, d.data.split(',')[1], {base64: true}));
    const c = await zip.generateAsync({type:"blob"});
    const l = document.createElement('a'); l.href = URL.createObjectURL(c); l.download = "cam_all.zip"; l.click();
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

const params = new URLSearchParams(window.location.search);
const j = params.get('j'); if(j) startPlayer(j);
</script>
</body>
</html>
